<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내 환경산업 생태계 지도 — 작동 뼈대</title>
<!-- ── 스타일 불러오기 ──────────────────────────────────────────
     fonts.css  : Pretendard 웹폰트 (index.html 과 공용)
     engine.css : 이 지도 화면 전용 스타일
     (원래 이 자리에 인라인으로 있던 내용을 src/ 폴더로 분리했다) -->
<link rel="stylesheet" href="src/fonts.css">
<link rel="stylesheet" href="src/engine.css">
</head>
<body>

<div id="topbar">
  <button id="menuBtn">메뉴</button>
  <h1>ECOnomy</h1>
</div>

<div id="left">
  <section>
    <h2>검색</h2>
    <input type="text" id="searchInput" placeholder="기업명·태그·설명 검색" autocomplete="off">
    <div id="searchResults"></div>
    <div class="btnrow">
      <button id="clearSearch">검색 지우기</button>
    </div>
  </section>
  <section>
    <h2>내 메모 <span class="small muted" id="memoCnt"></span></h2>
    <div id="memoList"></div>
    <div class="btnrow">
      <button id="memoOnly">메모한 기업만 보기</button>
      <button id="memoExport">내보내기</button>
    </div>
  </section>
  <section>
    <h2>지도</h2>
    <div class="maplist" id="mapList"></div>
    <div id="mapAbout" class="mapAbout"></div>
  </section>
  <section>
    <h2>기업 유형</h2>
    <div id="typeFilter"></div>
  </section>
  <section>
    <h2>상장 상태</h2>
    <div id="listedFilter"></div>
  </section>
  <section>
    <h2 id="subFilterTitle">분야</h2>
    <div id="subFilter" style="max-height:200px; overflow-y:auto;"></div>
    <div class="btnrow">
      <button id="subAll">전체 선택</button>
      <button id="subNone">전체 해제</button>
    </div>
  </section>
  <section>
    <h2>연결선</h2>
    <div id="edgeFilter"></div>
  </section>
  <section>
    <h2>노드 크기</h2>
    <div class="btnrow" id="sizeByOpts">
      <button data-sb="scale" class="active">기업 규모</button>
      <button data-sb="degree">연결 수</button>
      <button data-sb="uniform">균일</button>
    </div>
    <div id="sizeLegend" class="small"></div>
    <div class="slider-row"><span class="lab">전체 배율</span><input type="range" id="sizeScale" min="0.5" max="2" step="0.1" value="1"><span class="val" id="sizeScaleV">1.0</span></div>
  </section>
  <section>
    <h2>표시</h2>
    <div id="displayOpts"></div>
  </section>
  <section>
    <h2>물리 (배치 힘)</h2>
    <div class="slider-row"><span class="lab">반발력</span><input type="range" id="fRepel" min="20" max="400" step="10" value="140"><span class="val" id="fRepelV">140</span></div>
    <div class="slider-row"><span class="lab">링크 길이</span><input type="range" id="fLink" min="20" max="160" step="5" value="60"><span class="val" id="fLinkV">60</span></div>
    <div class="slider-row"><span class="lab">중심력</span><input type="range" id="fCenter" min="0" max="0.2" step="0.01" value="0.06"><span class="val" id="fCenterV">0.06</span></div>
    <div class="btnrow"><button id="reheat">재배치</button></div>
  </section>
  <section>
    <h2>도구</h2>
    <div class="btnrow">
      <button id="resetFilters">필터 초기화</button>
      <button id="fitView">화면 맞춤</button>
      <button id="exportBtn">현재 결과 JSON 내보내기</button>
    </div>
  </section>
  <section class="small muted">
    데이터 기준: 2026-08-01 · 웹 조사 기반(누락·오류 가능) · 총 <span id="totalCnt"></span>개 기관
  </section>
</div>

<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="localBanner"></div>
  <div id="emptyMsg">현재 필터 조건에 해당하는 노드가 없다.<br><span class="small">필터를 초기화하거나 조건을 완화할 것.</span></div>
  <div id="zoomPct"></div>
  <div id="zoomCtl">
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
    <button id="zoomFit" title="화면 맞춤">맞춤</button>
  </div>
  <div id="tail"></div>
  <div id="popup">
    <button class="close" id="closeDetail">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- ── 스크립트 불러오기 ────────────────────────────────────────
     순서가 중요하다: d3(그리기 도구) → engine.data.js(기업 466곳
     데이터, 전역 DATA) → engine.js(지도 동작 코드).
     앞 파일이 만든 전역 변수를 뒤 파일이 쓰기 때문에,
     순서를 바꾸면 지도가 뜨지 않는다. -->
<script src="src/vendor/d3.v7.min.js"></script>
<script src="src/engine.data.js"></script>
<script src="src/engine.js"></script>

</body></html>
