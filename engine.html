rounded":true,"src":["https://www.veolia.kr/ko/beollia-kolia-saeob-sogae","https://www.veolia.co.kr/ko/seobiseu/saeob-bunya/pyegimul-gwanri/jonghab-pyegimul-ceori-seobiseu-yunikeun-insu"]},{"id":"c100","name":"부산환경공단","sector":"폐기물 처리","subsector":"소각·에너지화","type":"공공·연구","scale":3,"founded":null,"hq":"부산","listed":null,"desc":"부산광역시 산하 지방공기업으로 공공하수처리시설과 폐기물 처리시설 등 지역의 환경기초시설을 운영한다. 하수를 처리하고 남는 찌꺼기(슬러지)를 건조 처리하는 하수자원사업소를 비롯해 여러 사업단·사업소를 두고 시설을 관리한다. 시설 운영과 함께 폐기물에서 쓸 수 있는 자원을 회수하고 신재생에너지 생산을 늘리는 사업도 추진하고 있다.","tags":["소각","자원회수시설","공공"],"conf":"추정","global":false,"url":"https://www.beco.or.kr","ext":[],"grounded":true,"src":["https://www.beco.or.kr/cyber/CMS/Contents/Contents.do?mCode=MN0005","https://www.beco.or.kr/branch12/CMS/Contents/Contents.do?mCode=MN0004","https://www.fnnews.com/news/202507171248467503"]},{"id":"c101","name":"비노텍","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"에코매니지먼트코리아(EMK) 계열의 폐기물 소각 처리 기업이다. 경기 안산에 소각시설을 두고 일반폐기물과 지정폐기물(유해성이 있어 별도 관리가 필요한 폐기물)을 태워 처리한다. 소각 과정에서 나오는 열로 전력을 생산하고 인근에 온수를 공급한다. 모회사 EMK는 2010년 설립된 폐기물 처리·재활용 기업으로, 사모펀드 IMM인베스트먼트를 거쳐 싱가포르 케펠인프라스트럭처트러스트에 매각됐다.","tags":["SRF","고형연료","EMK계열"],"conf":"추정","global":false,"url":null,"ext":[],"grounded":true,"src":["http://www.investchosun.com/m/article.html?contid=2022010580206","https://www.sedaily.com/NewsVIew/1Z2WFCCOM5","http://worknworld.kctu.org/news/articleView.html?idxno=507518","https://v.daum.net/v/20250924200539025"]},{"id":"c102","name":"새한환경","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"사업장에서 나오는 폐기물을 처리하는 기업이다. 맥쿼리코리아오퍼튜니티즈 사모펀드가 지분 100%를 보유하고 있었으며, 2020년 코엔텍 지분과 함께 아이에스동서·이앤에프(E&F) PE 컨소시엄에 매각됐다. 이를 계기로 건설·제조 기업이던 아이에스동서의 환경사업 부문에 편입됐다.","tags":["소각","사업장폐기물"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.hankyung.com/economy/article/202006043047Y","https://www.econovill.com/news/articleView.html?idxno=399654","https://www.mt.co.kr/future/2020/06/04/2020060418461722497"]},{"id":"c103","name":"쌍용씨앤이","sector":"폐기물 처리","subsector":"소각·에너지화","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"비상장","desc":"시멘트를 만드는 기업으로, 폐합성수지·폐타이어·재생연료유 등을 시멘트 가마의 연료로 써서 유연탄 같은 화석연료 사용을 줄인다. 석탄재와 탈황석고 같은 순환자원은 점토·천연석고를 대신하는 원료로 쓴다. 순환자원 처리와 폐기물 운반을 맡는 자회사들은 중간지주사 그린에코솔루션이 관리한다. 사모펀드 한앤컴퍼니가 최대주주이며 2024년 상장폐지했다.","tags":["시멘트","폐합성수지","연료대체","순환자원"],"conf":"추정","global":false,"url":"https://www.ssangyongcne.co.kr","ext":[],"grounded":true,"src":["https://www.ssangyongcne.co.kr/business/environment/substitute.do","https://www.ssangyongcne.co.kr/management/environment/economy.do","https://dealsite.co.kr/articles/125561","https://kind.krx.co.kr/common/disclsviewer.do?method=searchInitInfo&acptNo=20240702000332&docno="]},{"id":"c104","name":"에코비트에너지","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"에코비트 그룹에서 소각·에너지 사업을 맡은 계열사군이다. 사업장에서 나오는 지정폐기물과 일반폐기물을 태워 처리하고, 그 과정에서 나오는 열을 스팀 형태의 에너지로 만들어 인근 공장에 공급한다. 진천·세종 등 지역별 법인으로 나뉘어 운영되며, 2021년 명성환경의 소각사업을 인수하는 등 처리 설비를 늘려 왔다.","tags":["소각","스팀","폐기물에너지화"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["http://www.ecorbit.com/kr/about/subsidiary","http://www.ecorbit.com/assets/file/%5B%EC%97%90%EC%BD%94%EB%B9%84%ED%8A%B8%5D%EC%82%AC%EC%97%85%EB%B3%B4%EA%B3%A0%EC%84%9C(2023.03.31).pdf","https://thevc.kr/ecorbit"]},{"id":"c105","name":"영흥산업환경","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"건설폐기물을 수집·운반하고 중간처리와 소각까지 맡는 폐기물 처리 기업이다. 소각할 때 나오는 열을 회수해 스팀(증기) 에너지로 만들어 파는 사업도 함께 한다. 2020년 인선이엔티가 지분 100%를 인수하면서 인선이엔티가 7년 만에 소각 사업에 다시 진출하는 발판이 됐고, 이후 소각 처리 용량 증설을 추진했다.","tags":["소각","인선이엔티계열"],"conf":"확인","global":false,"url":"https://www.yhie.co.kr","ext":[],"grounded":true,"src":["https://www.asiae.co.kr/article/2020122111195184899","https://news.mt.co.kr/mtview.php?no=2021060815370575481","https://m.businesspost.co.kr/BP?command=mobile_view&num=196812","https://www.ferrotimes.com/news/articleView.html?idxno=7982"]},{"id":"c106","name":"유니큰","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":"울산","listed":"비상장","desc":"울산 온산·용잠에서 고상·액상 폐기물 처리시설을 운영하는 기업이다. 산업폐기물 소각로와 매립시설을 갖췄고, 액상 지정폐기물과 고농도 산업폐수를 증발시켜 처리하며, 소각열로 스팀을 생산하고 가연성 폐기물을 고형연료(SRF)로도 만든다. 1994년 설립됐으며 2017년 프랑스 환경기업 베올리아 그룹에 인수됐다.","tags":["소각","SRF","지정폐기물","울산"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.thebell.co.kr/front/newsview.asp?key=202602231531010760108012","https://www.veolia.co.kr/ko/seobiseu/saeob-bunya/pyegimul-gwanri/jonghab-pyegimul-ceori-seobiseu-yunikeun-insu","http://www.investchosun.com/2016/11/14/3204740"]},{"id":"c107","name":"인천환경공단","sector":"폐기물 처리","subsector":"소각·에너지화","type":"공공·연구","scale":3,"founded":null,"hq":"인천","listed":null,"desc":"인천광역시 산하 지방공기업으로 지역의 환경기초시설을 운영한다. 하수처리시설과 폐기물 소각시설, 음식물류 폐기물 자원화시설, 가축분뇨 공공처리시설 등을 맡아 관리한다. 가좌·승기·청라·송도 등 여러 사업소 체제로 운영되며, 송도자원환경센터와 송도자원순환센터도 인수해 운영하고 있다.","tags":["소각","자원회수시설","공공"],"conf":"추정","global":false,"url":"https://www.eco-i.or.kr","ext":[],"grounded":true,"src":["https://www.eco-i.or.kr/","https://www.eco-i.or.kr/ecoi/introduce_seunggi.asp","https://ko.wikipedia.org/wiki/인천환경공단"]},{"id":"c108","name":"케이디환경","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"경기 화성에 있는 폐기물 소각 처리 기업이다. 국내 폐기물 소각 시장 2위 사업자인 에코매니지먼트코리아(EMK)가 인수해 계열사로 두고 있다. EMK는 사모펀드 IMM인베스트먼트가 소유하다가 2022년 싱가포르 케펠 인프라스트럭처 트러스트 측에 매각됐고, 케이디환경도 그 지배구조 아래 함께 넘어갔다.","tags":["소각","화성","EMK계열"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.ajunews.com/view/20220106145511197","https://www.hankyung.com/article/2022071239411","https://www.fnnews.com/news/202208080943148717"]},{"id":"c109","name":"코어엔텍","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중견기업","scale":3,"founded":null,"hq":"경기","listed":"비상장","desc":"KG ETS가 환경·에너지 사업부문을 떼어내 세운 회사로, 2022년 E&F PE 측(이앤에프다이아몬드홀딩스)이 지분 100%를 약 4958억원에 사들였다. 사업장에서 나온 폐기물을 소각하고, 그때 발생하는 증기로 스팀과 전기를 만들어 인근 기업과 전력시장에 판다. 경기 시흥의 그린센터가 소각·에너지화 거점이다.","tags":["소각","스팀","KG ETS","E&F PE"],"conf":"확인","global":false,"url":"https://www.coreentech.co.kr","ext":[],"grounded":true,"src":["https://m.etnews.com/20220622000032?SNS=00004","https://dealsite.co.kr/articles/78753","https://www.e2news.com/news/articleView.html?idxno=236416"]},{"id":"c110","name":"한국환경개발","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"경기 안산에 있는 폐기물 소각 처리 기업이다. 국내 폐기물 소각 시장 2위 사업자인 에코매니지먼트코리아(EMK)의 계열사로, EMK는 전국에 흩어져 있던 폐기물 처리업체들을 사들여 묶기 위해 2010년 세워진 회사다. EMK 지분은 2017년 JP모간자산운용에서 사모펀드 IMM인베스트먼트로 넘어갔다.","tags":["소각","EMK계열"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.thebell.co.kr/free/content/ArticleView.asp?key=202002191643544040107970&lcode=00","https://www.thebell.co.kr/free/content/ArticleView.asp?key=201807160100028660001831&lcode=00","https://www.sedaily.com/NewsVIew/22RG7DJOD0"]},{"id":"c111","name":"환경에너지솔루션","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"폐기물을 태우거나 말려 처리하고 자원으로 되돌리는 설비를 설계·시공하는 환경 엔지니어링 기업이다. 생활폐기물 소각시설, 하수 슬러지 건조시설, 음식물류폐기물 자원화 설비 등을 다루며 산업환경설비공사업을 등록해 두고 있다. 코오롱그룹 계열의 코오롱환경에너지가 전신이며 2020년 아이에스동서 그룹에 편입됐다.","tags":["소각","스팀","코오롱환경에너지"],"conf":"확인","global":false,"url":"https://www.ene-sol.com","ext":[],"grounded":true,"src":["https://m.businesspost.co.kr/BP?command=mobile_view&num=196812","https://m.ceoscoredaily.com/page/view/2023040415375022511","https://biz.newdaily.co.kr/site/data/html/2023/04/07/2023040700076.html"]},{"id":"c112","name":"Waste Management","sector":"폐기물 처리","subsector":"수집·운반","type":"해외 대표","scale":4,"founded":1968,"hq":"미국","listed":null,"desc":"미국 휴스턴에 본사를 둔 환경 서비스 기업으로, 미국과 캐나다에서 가정·상업·산업·의료·지자체 폐기물의 수집과 재활용, 매립 처리를 맡는다. 매립지에서 나오는 가스를 포집해 재생천연가스와 전력으로 바꾸는 설비를 운영하며, 이 가스를 연료로 쓰는 천연가스 수거 차량도 함께 굴린다. 사명은 현재 WM으로 쓴다.","tags":["글로벌","수집운반","매립","WM"],"conf":"확인","global":true,"url":"https://www.wm.com","ext":[],"grounded":true,"src":["https://www.wm.com/us/en/inside-wm/sustainable-technology/renewable-energy","https://sustainability.wm.com/energy-is-renewable/","https://mediaroom.wm.com/2022-04-28-WMS-RENEWABLE-ENERGY-INVESTMENTS-EXPECTED-TO-POWER-OVER-1-MILLION-HOMES-BY-2026"]},{"id":"c113","name":"부산동부환경","sector":"폐기물 처리","subsector":"수집·운반","type":"중소기업","scale":2,"founded":null,"hq":"부산","listed":"비상장","desc":"부산 지역 생활·사업장폐기물 수집·운반 업체다.","tags":["수집운반","생활폐기물","부산"],"conf":"확인","global":false,"url":null,"ext":[]},{"id":"c114","name":"신아환경","sector":"폐기물 처리","subsector":"수집·운반","type":"중소기업","scale":2,"founded":null,"hq":"부산","listed":"비상장","desc":"부산 지역 생활·사업장폐기물 수집·운반 업체다.","tags":["수집운반","생활폐기물","부산"],"conf":"확인","global":false,"url":null,"ext":[]},{"id":"c115","name":"어글리랩","sector":"폐기물 처리","subsector":"수집·운반","type":"스타트업","scale":1,"founded":2021,"hq":null,"listed":"비상장","desc":"가정·사무실 문 앞에 내놓은 쓰레기를 분리배출 없이 그대로 수거하는 문전수거 서비스 '오늘수거'를 운영한다. 전용 봉투에 담아 앱으로 신청하면 야간에 수거해 가고, 모인 혼합폐기물은 자체 선별 시설에서 종류별로 분리·세척해 재생원료로 만든다. 이용자가 분리배출에 들이는 수고를 줄이면서 재활용률을 높이는 방식이다.","tags":["오늘수거","구독수거","생활폐기물","분리배출대행"],"conf":"확인","global":false,"url":"https://www.sugeo.onl","ext":[],"grounded":true,"src":["https://www.startuptoday.kr/news/articleView.html?idxno=44557","https://futurechosun.com/archives/65733","https://www.venturesquare.net/838073","https://www.innoforest.co.kr/company/CP00010794/어글리랩"]},{"id":"c116","name":"창광실업","sector":"폐기물 처리","subsector":"수집·운반","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"수도권 대형병원의 의료폐기물 수집·운반을 수행하는 업체다.","tags":["의료폐기물","수집운반"],"conf":"추정","global":false,"url":null,"ext":[]},{"id":"c117","name":"커버링","sector":"폐기물 처리","subsector":"수집·운반","type":"스타트업","scale":1,"founded":2020,"hq":null,"listed":"비상장","desc":"음식물·일반·재활용 쓰레기를 나누지 않고 한 번에 내놓으면 방문 수거해 자체적으로 선별한 뒤 재활용 업체로 넘기는 구독형 수거 서비스다. 가정용 '커버링 홈', 사무실용 '커버링 오피스', 건물 단위 '커버링 빌딩', 도시락 용기를 회수하는 '커버링 런치' 등 이용 환경에 따라 나눠 운영한다.","tags":["혼합폐기물","수거","분류"],"conf":"확인","global":false,"url":"https://www.covering.app","ext":[],"grounded":true,"src":["https://www.venturesquare.net/1042786","https://news.sktelecom.com/205986","https://www.covering.app/","https://thevc.kr/covering"]},{"id":"c118","name":"도시환경","sector":"폐기물 처리","subsector":"의료폐기물","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"경기 연천에서 병원 등에서 나오는 의료폐기물을 태워 처리하는 기업이다. 소각로 2기를 갖춰 하루 44톤을 처리하며, 태울 때 나오는 폐열을 회수해 스팀으로 공급한다. 2021년 SK에코플랜트가 한국투자프라이빗에쿼티로부터 이메디원·그린환경기술과 함께 지분 100%를 인수했다.","tags":["의료폐기물","소각","연천"],"conf":"추정","global":false,"url":null,"ext":[],"grounded":true,"src":["https://news.skecoplant.com/sk-ecoplant/790/","https://www.asiae.co.kr/article/2021080109402806217","https://www.meconomynews.com/news/articleView.html?idxno=56347"]},{"id":"c119","name":"신진그린","sector":"폐기물 처리","subsector":"의료폐기물","type":"중소기업","scale":2,"founded":null,"hq":"부산","listed":"비상장","desc":"부산 지역 의료폐기물을 취급하는 처리 업체다.","tags":["의료폐기물","부산"],"conf":"추정","global":false,"url":null,"ext":[]},{"id":"c120","name":"아림환경","sector":"폐기물 처리","subsector":"의료폐기물","type":"중소기업","scale":2,"founded":null,"hq":"대구","listed":"비상장","desc":"대구·경북 지역 병·의원에서 나온 의료폐기물을 수거해 태워 없애는 소각 처리 업체다. 소각시설은 경북 고령군에 있으며 수도권 등 다른 지역에서 나온 의료폐기물도 반입해 처리해 왔다. 2024년 대구지방환경청은 의료폐기물을 소각하지 않고 창고 등에 불법 보관한 사실을 적발해 10개월 영업정지 처분을 내렸다.","tags":["의료폐기물","소각","대구"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.imaeil.com/page/view/2024011616063042759","https://www.hankyung.com/society/article/201909278570Y","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0002993909","http://www.newsmin.co.kr/news/42217/"]},{"id":"c121","name":"원크린","sector":"폐기물 처리","subsector":"의료폐기물","type":"중소기업","scale":2,"founded":null,"hq":"부산","listed":"비상장","desc":"부산 지역 의료폐기물을 취급하는 처리 업체다.","tags":["의료폐기물","부산"],"conf":"추정","global":false, :2020,"hq":null,"listed":"비상장","desc":"재활용 선별장에서 사람이 손으로 하던 폐기물 분류 작업을 대신하는 AI 로봇 '에이트론'을 개발한다. 학습한 이미지를 바탕으로 인공지능이 페트·PE·PS·유리·캔 등 재질을 구분하면 로봇이 해당 품목을 집어내는 방식이다. 국내 지자체 재활용 선별장에 납품돼 가동 중이며, 사람 없이 로봇이 운영하는 자원회수센터 구축도 추진한다.","tags":["AI선별로봇","에이트론","자원순환"],"conf":"확인","global":false,"url":"https://www.aetech.co.kr","ext":[],"grounded":true,"src":["https://kr.aving.net/news/articleView.html?idxno=1793809","https://www.etnews.com/20241107000113","https://www.newspim.com/news/view/20240425001244","https://www.aetech.co.kr/백업/backup_atron"]},{"id":"c129","name":"오이스터에이블","sector":"재활용·순환경제","subsector":"AI 분류·회수 로봇","type":"스타트업","scale":1,"founded":2016,"hq":"서울","listed":"비상장","desc":"페트병·우유팩 같은 재활용품을 넣으면 AI가 종류를 알아보고 앱 '오늘의분리수거'를 통해 포인트 등 보상을 주는 IoT 분리배출함을 운영한다. 배출함에 쌓인 품목과 적재량을 데이터로 모아 회수업체와 관리자에게 언제 수거해야 하는지를 알려준다. 모인 재활용품은 회수·재사용 경로로 연결해 순환 구조를 만든다.","tags":["IoT수거함","오늘의분리수거","데이터"],"conf":"확인","global":false,"url":"https://oysterable.com","ext":[],"grounded":true,"src":["https://www.rocketpunch.com/companies/oysterable","https://www.nextunicorn.kr/company/08bd63e178136913/service/6218dbe7f11d5329","https://www.kyeonggi.com/article/20221110580019","https://www.sisajournal-e.com/news/articleView.html?idxno=305561"]},{"id":"c130","name":"이노버스","sector":"재활용·순환경제","subsector":"AI 분류·회수 로봇","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"AI가 이미지를 인식해 투명 페트병만 골라 받는 무인 회수기 '쓰샘'을 만든다. 이용자가 페트병을 넣으면 1개당 10원을 돌려주며, 이물질이 덜 섞인 페트만 따로 모아 재활용 원료의 품질을 높이는 방식이다. 아파트 단지와 지자체 공공시설을 중심으로 설치되고 있다.","tags":["회수로봇","쓰샘","페트병"],"conf":"확인","global":false,"url":"https://www.inobus.co.kr","ext":[],"grounded":true,"src":["https://www.inobus.co.kr/repet","https://www.unicornfactory.co.kr/article/2025052612551536345","https://kr.aving.net/news/articleView.html?idxno=1799254","https://wowtale.net/2026/07/20/261678/"]},{"id":"c131","name":"E-순환거버넌스","sector":"재활용·순환경제","subsector":"금속·전자폐기물","type":"공공·연구","scale":3,"founded":null,"hq":"서울","listed":null,"desc":"환경부가 지정한 전기·전자제품 재활용 공제조합으로, 생산자가 자기 제품의 회수·재활용까지 책임지는 생산자책임재활용제도(EPR)를 제조·유통사를 대신해 이행한다. 가정에서 쓰지 않는 폐가전은 인터넷·모바일·콜센터로 신청하면 수거 담당자가 직접 방문해 무상으로 가져가며, 지방자치단체와 위수탁 계약을 맺어 수거·운반 체계를 갖추고 있다. 회수한 가전에서는 금속 등 쓸 수 있는 자원을 뽑아 산업 원료로 되돌린다.","tags":["폐가전","공제조합","EPR","무상수거"],"conf":"확인","global":false,"url":"https://www.e-cycle.or.kr","ext":[],"grounded":true,"src":["https://15990903.or.kr/portal/cnts/selectContents.do?cntnts_id=A1000002","https://www.15990903.or.kr/portal/main/main.do","https://www.y-cnews.com/news/articleView.html?idxno=21593"]},{"id":"c132","name":"LS MnM","sector":"재활용·순환경제","subsector":"금속·전자폐기물","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"비상장","desc":"LS그룹 계열의 동(구리) 제련 기업으로, 울산 온산제련소에서 수입한 동광석을 녹여 순도 99.99% 이상의 전기동을 만든다. 제련 과정에서 나오는 부산물을 가열·전기분해해 금·은·백금·팔라듐 같은 값나가는 금속을 회수하고, 아황산가스로는 반도체용 황산을 만든다. 1999년 LG니꼬동제련으로 출발해 2005년 LS그룹에 편입됐고 2022년 지금의 이름이 됐다.","tags":["동제련","도시광산","유가금속"],"conf":"확인","global":false,"url":"https://www.lsmnm.com","ext":[{"n":"LS","rel":"계열"}],"grounded":true,"src":["https://ko.wikipedia.org/wiki/LS_MnM","https://www.snmnews.com/news/articleView.html?idxno=553773","https://www.lsmnm.com/"]},{"id":"c133","name":"리셋컴퍼니","sector":"재활용·순환경제","subsector":"금속·전자폐기물","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"태양광 발전소 패널을 사람이 올라가지 않고 닦는 무인 청소로봇과 원격 관리 시스템을 개발한다. 먼지나 눈이 쌓여 발전량이 떨어지는 문제를 줄이기 위한 장비다. 수명이 다한 폐패널을 프레임·유리·셀로 분리해 소재를 회수하는 재활용 설비도 함께 만들며, 경기 평택에 태양광 자원순환 팩토리를 세워 운영 중이다.","tags":["폐태양광패널","청소로봇","자원순환"],"conf":"확인","global":false,"url":"https://www.resetsnow.com","ext":[],"grounded":true,"src":["https://www.industrynews.co.kr/news/articleView.html?idxno=73346","https://www.mt.co.kr/future/2022/08/08/2022080808304154101","https://platum.kr/archives/214706","https://wowtale.net/2025/07/07/243596/"]},{"id":"c134","name":"민팃","sector":"재활용·순환경제","subsector":"금속·전자폐기물","type":"중소기업","scale":2,"founded":2021,"hq":"서울","listed":"비상장","desc":"중고 스마트폰을 무인으로 사들이는 기기 '민팃 ATM'을 운영하는 ICT 리사이클 기업이다. 전국 대형마트와 공공기관, 통신 대리점 등 생활 거점에 놓인 기기에 쓰지 않는 휴대폰을 넣으면 값을 매겨 매입하는 방식으로, 회수한 기기를 재사용·재유통으로 연결한다. 2021년 SK네트웍스에서 분사했으나 이후 SK네트웍스가 지분 90%를 사모펀드 티앤케이프라이빗에쿼티에 450억원에 양도하는 계약을 체결했다.","tags":["중고폰ATM","IT순환","리커머스"],"conf":"확인","global":false,"url":"https://www.mintit.co.kr","ext":[{"n":"SK네트웍스","rel":"계열"}],"grounded":true,"src":["https://www.pointe.co.kr/news/articleView.html?idxno=75303","https://www.seoulfn.com/news/articleView.html?idxno=623744","https://www.m-i.kr/news/articleView.html?idxno=1351359","https://biz.newdaily.co.kr/site/data/html/2021/11/03/2021110300199.html"]},{"id":"c135","name":"베스트알","sector":"재활용·순환경제","subsector":"금속·전자폐기물","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"텅스텐이 들어간 폐기물에서 텅스텐을 다시 뽑아내 원료로 되돌리는 스타트업이다. 드릴 비트처럼 버려지는 초경합금 스크랩이 주된 원료이며, 암모니아를 쓰지 않는 정련·재활용 공정 기술을 개발했다. 텅스텐은 반도체·전기차·절삭공구 등에 쓰이면서 수입 의존도가 높은 핵심 광물이다. 미래에셋벤처투자·포스코기술투자 등이 참여한 프리시리즈A 투자를 유치했다.","tags":["텅스텐","희소금속","스크랩"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://woodplanet.co.kr/news/view/1065579254267323","https://www.unicornfactory.co.kr/article/2023070615562665809","https://www.nextunicorn.kr/company/cbb02cdf8af70937"]},{"id":"c136","name":"더그리트","sector":"재활용·순환경제","subsector":"다회용기·리필","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"다회용컵과 다회용기를 만들어 납품한 뒤 수거·세척해 다시 공급하는 순환 서비스를 운영한다. 용기마다 QR코드를 붙여 사용 횟수와 상태, 위치 같은 이력을 관리한다. 서울시 다회용기·다회용컵 지원 사업자와 장례식장 다회용기 서비스 보조사업자로 선정됐고, 과천시 다회용컵 공유 서비스 사업자로도 뽑혔다.","tags":["다회용컵","반납기","세척인프라"],"conf":"확인","global":false,"url":"https://thegreet.co.kr","ext":[{"n":"SK텔레콤","rel":"협력"}],"grounded":true,"src":["https://news.nate.com/view/20250423n21959","https://news.nate.com/view/20250304n05727","https://www.asiae.co.kr/article/2024080615114435247","https://thevc.kr/thegreet"]},{"id":"c137","name":"보틀팩토리","sector":"재활용·순환경제","subsector":"다회용기·리필","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"서울 연희동에서 일회용품을 쓰지 않는 카페 보틀라운지를 운영하며 출발한 곳이다. 카페나 행사장에서 빌려 쓰고 어느 제휴 매장에나 반납할 수 있는 공유컵 리턴미를 만들었고, 일회용품을 쓰지 않으면 점수가 쌓이는 앱 보틀클럽도 운영한다. 유어보틀위크 캠페인을 이어오고 있다.","tags":["공유컵","리턴미","제로웨이스트카페"],"conf":"확인","global":false,"url":"https://www.bottlefactory.co.kr","ext":[],"grounded":true,"src":["https://www.futurechosun.com/archives/46417","https://mediahub.seoul.go.kr/archives/2000788","https://www.bottlefactory.co.kr/bottleclub"]},{"id":"c138","name":"뽀득","sector":"재활용·순환경제","subsector":"다회용기·리필","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"급식소·식당 같은 사업장에 식기를 빌려주고, 쓴 그릇을 수거해 세척한 뒤 매일 깨끗한 식기로 바꿔주는 B2B 렌탈·세척 서비스를 한다. 주방에서 설거지 공정을 통째로 덜어내는 방식이다. 2021년 35억원 규모 시리즈A에 이어 2022년 산업은행이 주도한 330억원 규모 시리즈B 투자를 유치했다.","tags":["식기렌탈","세척","B2B"],"conf":"확인","global":false,"url":"https://www.bbodek.com","ext":[],"grounded":true,"src":["https://platum.kr/archives/156130","https://platum.kr/archives/187903","https://zdnet.co.kr/view/?no=20230908013534"]},{"id":"c139","name":"알맹상점","sector":"재활용·순환경제","subsector":"다회용기·리필","type":"스타트업","scale":1,"founded":2020,"hq":"서울","listed":"비상장","desc":"서울 마포구 망원동에서 시작한 국내 초기 리필스테이션이다. 화장품·세제는 물론 차와 원두, 향신료까지 포장 없이 손님이 가져온 빈 용기에 필요한 만큼만 담아 파는 방식으로 운영한다. 매장에서 병뚜껑 같은 플라스틱을 모아 다시 쓰는 자원 회수 거점과 워크숍도 함께 운영한다.","tags":["리필스테이션","제로웨이스트","소분판매"],"conf":"확인","global":false,"url":"https://almang.net","ext":[],"grounded":true,"src":["https://mediahub.seoul.go.kr/archives/2007760","https://almang.net/","https://v.daum.net/v/KbR5ztkPdv"]},{"id":"c140","name":"잇그린","sector":"재활용·순환경제","subsector":"다회용기·리필","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"배달 음식에 쓰는 일회용기를 다회용기로 바꾸는 서비스 리턴잇을 운영한다. 소비자가 배달앱에서 다회용기를 고르면 그 용기에 음식이 배달되고, 다 먹은 뒤 문 앞에 내놓고 QR코드로 수거를 신청하면 회수해 자체 세척 공정을 거쳐 다시 쓴다. 배달앱 외에 축제와 스포츠 경기장, 사무실 도시락으로도 서비스를 넓혔다.","tags":["리턴잇","다회용기","배달용기"],"conf":"확인","global":false,"url":"https://www.returnit.kr","ext":[],"grounded":true,"src":["https://magazine.hankyung.com/job-joy/article/202212196603d","https://www.sisajournal-e.com/news/articleView.html?idxno=304451","https://www.returnit.kr/"]},{"id":"c141","name":"트래쉬버스터즈","sector":"재활용·순환경제","subsector":"다회용기·리필","type":"스타트업","scale":1,"founded":2019,"hq":"서울","listed":"비상장","desc":"축제장에서 쏟아지는 일회용품을 줄이자는 문제의식에서 2019년 시작한 다회용기 대여 서비스다. 행사·영화관·야구장·장례식장 등에 다회용컵과 그릇을 빌려주고, 쓴 용기를 직접 수거해 초음파 세척과 고온·고압 세척, 열풍 건조, 자외선 살균까지 여러 단계를 거쳐 다시 공급한다.","tags":["다회용기","대여세척","일회용품대체"],"conf":"확인","global":false,"url":"https://trashbusters.kr","ext":[],"grounded":true,"src":["https://www.khan.co.kr/article/202304150600011","https://trashbusters.kr/faq","https://www.opinionnews.co.kr/news/articleView.html?idxno=66218"]},{"id":"c142","name":"DS단석","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중견기업","scale":3,"founded":1965,"hq":"경기","listed":"코스피","desc":"1965년 노벨화학공업사로 출발해 단석산업을 거쳐 2023년 12월 코스피에 상장한 자원순환 기업이다. 바이오디젤·바이오중유 등 바이오에너지, 폐배터리에서 납을 다시 뽑아내는 재생연과 리튬이온배터리 재활용, 폐플라스틱을 되살린 PCR 플라스틱과 PVC 안정제를 세 축으로 삼는다. 수소를 넣어 만드는 차세대 바이오디젤(HVO)과 항공유용 SAF에도 투자하고 있다.","tags":["바이오디젤","납재활용","SAF","자원순환"],"conf":"확인","global":false,"url":"https://dsdansuk.com","ext":[],"grounded":true,"src":["https://www.energy-news.co.kr/news/articleView.html?idxno=201740","https://www.etnews.com/20231208000198","https://www.thelec.kr/news/articleView.html?idxno=24624","https://kr.investing.com/news/markets/article-976400"]},{"id":"c143","name":"SK이노베이션","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"SK그룹의 에너지·화학 계열사로, 2017년부터 수명이 다한 리튬이온배터리에서 리튬을 수산화리튬 형태로 뽑아내는 재활용 기술을 개발해 왔다. 2022년에는 배터리 재활용 전문기업 성일하이텍과 리튬·니켈·코발트·망간을 회수하는 합작법인을 세우기로 업무협약을 맺었으나, 이 합작공장 설립은 2024년 무산됐다.","tags":["리튬회수","폐배터리","에너지"],"conf":"확인","global":false,"url":"https://www.skinnovation.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/202212132173Y","https://www.businesspost.co.kr/BP?command=article_view&num=300566","https://news.mtn.co.kr/news-detail/2024061008563357742"]},{"id":"c144","name":"고려아연","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"대기업","scale":4,"founded":1974,"hq":"서울","listed":"코스피","desc":"울산 온산제련소에서 아연과 연(납)을 제련하는 비철금속 기업으로, 인듐·게르마늄·안티모니 등 산업에 꼭 필요한 희소금속도 함께 생산한다. 제철소에서 나오는 제강분진 같은 산업폐기물에서 금속을 뽑아 다시 쓰는 자원순환 사업을 하고, 폐전자제품 재활용으로도 영역을 넓히고 있다. 신재생에너지·그린수소, 자원순환, 이차전지 소재를 3대 신사업으로 삼고 있다.","tags":["비철금속","제련","도시광산","폐배터리"],"conf":"확인","global":false,"url":"https://www.koreazinc.co.kr","ext":[],"grounded":true,"src":["https://www.koreazinc.co.kr/wp-content/uploads/2025/07/2025-KoreaZinc-Brochure_KOR.pdf","https://campaign.koreazinc.co.kr/newsroom/","https://www.snmnews.com/news/articleView.html?idxno=500940"]},{"id":"c145","name":"두산리사이클솔루션","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"대기업","scale":4,"founded":null,"hq":null,"listed":"비상장","desc":"두산에너빌리티가 2023년 지분 100%를 갖는 자회사로 세운 배터리 재활용 기업이다. 다 쓴 배터리 내부 물질을 열처리한 뒤 증류수로 리튬을 분리하고 결정화해 탄산리튬을 뽑아내는 방식으로, 화학약품을 쓰지 않고 공정이 단순한 것이 특징이다. 대구광역시와 배터리 재활용 제조시설 투자협약을 맺고 상용 생산설비 구축을 추진해 왔다.","tags":["리튬회수","폐배터리","두산"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2023072893285","https://zdnet.co.kr/view/?no=20230728134741","https://www.doosannewsroom.com/?p=47965","https://biz.newdaily.co.kr/site/data/html/2023/12/12/2023121200118.html"]},{"id":"c146","name":"레드우드머티리얼즈","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"해외 대표","scale":4,"founded":2017,"hq":"미국","listed":null,"desc":"테슬라 공동창업자 JB 스트라우벨이 세운 배터리 재활용·소재 기업이다. 다 쓴 리튬이온 배터리와 배터리 공장에서 나온 자투리 소재를 고온 용융과 습식 화학 공정으로 처리해 니켈·코발트·구리·알루미늄 등을 회수한다. 회수한 금속으로 배터리 핵심 부품인 양극재와 음극 동박을 직접 만들며, 네바다와 사우스캐롤라이나에 소재 생산 단지를 두고 있다.","tags":["배터리재활용","미국","순환소재"],"conf":"확인","global":true,"url":"https://www.redwoodmaterials.com","ext":[],"grounded":true,"src":["https://www.redwoodmaterials.com/news/sustainable-battery-materials-process/","https://www.redwoodmaterials.com/news/anode-copper-foil-product-update/","https://www.redwoodmaterials.com/news/toyota-redwood-cathode-anode/"]},{"id":"c147","name":"민테크","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중소기업","scale":2,"founded":2015,"hq":"대전","listed":"코스닥","desc":"전기화학 임피던스 분광법(EIS), 즉 배터리에 미세한 교류 전류를 흘려 내부 상태를 읽어내는 방식으로 배터리를 진단하는 기업이다. 전기차와 에너지저장장치(ESS)에 쓰이는 배터리의 성능을 판정하는 진단 솔루션과 충방전 검사장비, 사용후 배터리를 재사용한 ESS 등을 공급한다. 2015년 설립돼 2024년 5월 코스닥에 상장했다.","tags":["배터리진단","EIS","사용후배터리"],"conf":"확인","global":false,"url":"https://www.g-mintech.co.kr","ext":[],"grounded":true,"src":["https://www.thelec.kr/news/articleView.html?idxno=25990","https://www.venturesquare.net/920994","https://www.newspim.com/news/view/20251205000072"]},{"id":"c148","name":"새빗켐","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중소기업","scale":2,"founded":null,"hq":"경북","listed":"코스닥","desc":"경북 김천에 자리한 폐배터리 재활용 기업으로, 수명이 다한 리튬이온배터리를 파쇄하고 약품으로 녹여 니켈·코발트·리튬 같은 유가금속을 뽑아낸다. 회수한 금속은 배터리 양극재의 원료가 되는 전구체 복합액 형태로 만들어 공급한다. 2001년 설립돼 2022년 8월 코스닥에 상장했다.","tags":["폐배터리","전구체복합액","유가금속"],"conf":"확인","global":false,"url":"http://www.sebitchem.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%EC%83%88%EB%B9%97%EC%BC%90","https://www.digitaltoday.co.kr/news/articleView.html?idxno=454187","https://www.thebell.co.kr/front/newsview.asp?key=202504231727562280102524"]},{"id":"c149","name":"성일하이텍","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중견기업","scale":3,"founded":2000,"hq":"전북","listed":"코스닥","desc":"다 쓴 리튬이온 배터리를 재활용해 배터리 원료를 되찾는 기업이다. 리사이클링파크라 부르는 전처리 공장에서 폐배터리를 해체·파쇄해 '블랙파우더'라는 가루로 만들고, 하이드로센터라 부르는 후처리 공장에서 이를 용액에 녹이는 습식 공정으로 니켈·코발트·리튬·망간 등을 뽑아낸다. 전북 군산 새만금 배터리 특화단지에 제3하이드로센터를 세우는 등 처리 능력을 키우고 있다.","tags":["폐배터리","유가금속","습식제련","리사이클링파크"],"conf":"확인","global":false,"url":"https://www.sungeelht.com","ext":[{"n":"삼성SDI","rel":"협력"}],"grounded":true,"src":["https://www.asiae.co.kr/article/2024070211112313410","https://www.thelec.kr/news/articleView.html?idxno=28326","https://www.thelec.kr/news/articleView.html?idxno=26855"]},{"id":"c150","name":"에코프로씨엔지","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중견기업","scale":3,"founded":null,"hq":"경북","listed":"비상장","desc":"에코프로그룹의 배터리 재활용 계열사로, 폐배터리에서 니켈·리튬 같은 금속을 뽑아내 배터리 소재 원료로 되돌려 공급한다. 경북 포항 영일만일반산업단지 안 캠퍼스에서 공장을 운영한다. 양극재를 만드는 에코프로비엠, 전구체의 에코프로머티리얼즈, 리튬의 에코프로이노베이션 등과 함께 원료 회수부터 소재 생산까지 한곳에서 잇는 '클로즈드 루프' 체계를 이룬다.","tags":["폐배터리","에코프로","포항","리사이클링"],"conf":"확인","global":false,"url":null,"ext":[{"n":"에코프로","rel":"계열"}],"grounded":true,"src":["https://zdnet.co.kr/view/?no=20240902144523","http://news.bizwatch.co.kr/article/industry/2022/11/25/0023","https://news.mtn.co.kr/news-detail/2022050912074976982","https://www.sedaily.com/article/20039739"]},{"id":"c151","name":"영풍","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"대기업","scale":4,"founded":1949,"hq":"서울","listed":"코스피","desc":"경북 봉화의 석포제련소에서 아연을 제련하는 비철금속 기업이다. 제련 과정에서 쌓은 금속 회수 기술을 폐배터리 재활용으로 넓혀, 다 쓴 배터리를 잘게 부순 뒤 고온에서 녹이는 건식용융 방식을 개발했다. 2022년 석포제련소에 연 2천톤 규모의 시험 공장을 가동해 리튬을 90% 이상 회수하는 데 성공했다.","tags":["제련","건식재활용","폐배터리"],"conf":"확인","global":false,"url":"https://www.ypzinc.co.kr","ext":[],"grounded":true,"src":["https://www.thelec.kr/news/articleView.html?idxno=18663","https://www.sedaily.com/NewsView/26DJP5WPDP","https://www.ypzinc.co.kr/site/main/content/intro_rnd/"]},{"id":"c152","name":"영화테크","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중소기업","scale":2,"founded":null,"hq":"세종","listed":"코스닥","desc":"자동차 전장부품 기업으로 전기차·하이브리드차의 전력을 분배하고 제어하는 정션박스 등을 개발·제조한다. 여기에 더해 전기차에서 떼어낸 사용후 배터리를 셀 단위로 해체하지 않고 팩 그대로 활용해 에너지저장장치(ESS)로 다시 쓰는 재사용 기술을 개발했다. 이 기술은 지방자치단체와 테크노파크가 지원한 전기차 폐배터리 재사용 국책 개발사업의 주관 과제로 진행됐다.","tags":["전장부품","폐배터리재사용","ESS"],"conf":"확인","global":false,"url":"https://www.yhtech.co.kr","ext":[],"grounded":true,"src":["https://www.etoday.co.kr/news/view/2307209","https://www.newspim.com/news/view/20201104000972","https://www.ekn.kr/web/view.php?key=20201223010005869"]},{"id":"c153","name":"유미코아","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"해외 대표","scale":4,"founded":null,"hq":"벨기에","listed":null,"desc":"벨기에에 본사를 둔 소재·재활용 기업으로, 오랜 기간 귀금속을 정련하고 재활용해 왔다. 다 쓴 전기차 배터리와 배터리 공장에서 나온 불량·자투리 소재를 처리해 리튬·니켈·코발트·구리를 배터리에 다시 쓸 수 있는 순도로 회수한다. 고온 용융과 습식 화학 공정을 결합한 자체 특허 기술을 쓰며, 배터리 소재 생산 사업도 함께 한다.","tags":["배터리재활용","귀금속","글로벌"],"conf":"확인","global":true,"url":"https://www.umicore.com","ext":[],"grounded":true,"src":["https://www.umicore.com/en/about/recycling/","https://www.umicore.com/en/about/battery-materials-solutions/battery-recycling-solutions/start/","https://www.umicore.com/en/about/battery-materials-solutions/battery-recycling-solutions/pyro-hydro-technology/"]},{"id":"c154","name":"재영텍","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중소기업","scale":2,"founded":null,"hq":"경북","listed":"비상장","desc":"폐배터리 재활용을 기반으로 리튬을 회수하는 기업이다. 폐배터리에서 뽑아낸 리튬을 배터리 소재로 쓰이는 탄산리튬으로 정제하며, 순도 99.5% 수준의 리튬을 추출하는 기술을 내세운다. 국내를 넘어 미국과 유럽에 배터리 재활용 거점을 두는 방안을 검토하고 있다.","tags":["리튬회수","폐배터리","탄산리튬"],"conf":"확인","global":false,"url":"http://www.jaeyoungtech.co.kr","ext":[],"grounded":true,"src":["https://sedaily.com/NewsView/2D6O8BI04U","https://thevc.kr/jaeyoungtech"]},{"id":"c155","name":"코스모화학","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"중견기업","scale":3,"founded":1968,"hq":"울산","listed":"코스피","desc":"이산화티타늄을 습식 제련 방식으로 생산해 온 화학 소재 기업이다. 울산에 폐배터리 리사이클 공장을 두고, 폐배터리를 분쇄한 검은 가루(블랙파우더)에서 리튬을 먼저 뽑아낸 뒤 남은 용액에서 니켈과 코발트를 분리해 회수한다. 회수한 금속은 이차전지 양극재와 전구체의 원료로 다시 쓰인다.","tags":["폐배터리","유가금속","이차전지소재"],"conf":"확인","global":false,"url":"https://www.cosmochem.co.kr","ext":[],"grounded":true,"src":["http://www.todayenergy.kr/news/articleView.html?idxno=264111","https://www.etnews.com/20231012000231","https://zdnet.co.kr/view/?no=20210826172313"]},{"id":"c156","name":"포스코HY클린메탈","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"대기업","scale":4,"founded":2021,"hq":"전남","listed":"비상장","desc":"포스코홀딩스와 중국 화유코발트, GS에너지가 함께 세운 폐배터리 재활용 회사다. 전남 광양 율촌산업단지 공장에서 수명이 다한 이차전지를 분쇄·열처리해 만든 중간원료(블랙파우더)를 처리한다. 여기서 니켈·코발트·탄산리튬 등 금속을 회수해 배터리 소재로 되돌리는 것이 핵심 사업이다.","tags":["폐배터리","합작법인","리튬","광양"],"conf":"확인","global":false,"url":"https://www.poscohycm.co.kr","ext":[{"n":"포스코홀딩스","rel":"합작"},{"n":"GS에너지","rel":"합작"},{"n":"화유코발트","rel":"합작"}],"grounded":true,"src":["https://www.snmnews.com/news/articleView.html?idxno=519827","https://www.thelec.kr/news/articleView.html?idxno=21948","https://www.gynet.co.kr/news/articleView.html?idxno=47349"]},{"id":"c157","name":"피엠그로우","sector":"재활용·순환경제","subsector":"배터리·도시광산","type":"스타트업","scale":1,"founded":2010,"hq":"경기","listed":"비상장","desc":"전기차·전기버스용 배터리팩을 만들고, 차량 대신 배터리만 빌려 쓰는 구독 방식과 배터리 데이터 기반 성능·잔존수명 진단 서비스를 제공한다. 전기차에서 수명이 다한 사용후 배터리를 에너지저장장치(ESS) 등으로 다시 쓰는 제품 개발도 함께 한다. 재사용 배터리 안전성검사기관으로도 지정됐다.","tags":["사용후배터리","재사용","BaaS","ESS","전기버스","배터리 구독"],"conf":"확인","global":false,"url":"https://pmgrow.co.kr","ext":[],"grounded":true,"src":["https://pmgrow.co.kr/about-us/introduction","https://www.industrynews.co.kr/news/articleView.html?idxno=51922","https://www.electimes.com/news/articleView.html?idxno=309082","https://www.newswire.co.kr/newsRead.php?no=997608"]},{"id":"c158","name":"넷스파","sector":"재활용·순환경제","subsector":"섬유·기타 재활용","type":"스타트업","scale":1,"founded":2020,"hq":"부산","listed":"비상장","desc":"바다에 버려진 폐어망에서 나일론만 골라내 재생 원료로 만드는 부산의 해양폐기물 스타트업이다. 사람이 손으로 분리하던 방식 대신 자체 개발한 전처리 기술과 자동화 설비로 나일론을 단일 소재로 대량 추출한다. 이렇게 만든 재생 나일론은 의류용 섬유와 자동차 부품, 전자기기 부품 원료로 쓰인다.","tags":["폐어망","나일론","해양폐기물","재활용","해양쓰레기"],"conf":"확인","global":false,"url":"https://www.netspa.co.kr","ext":[],"grounded":true,"src":["https://www.newsis.com/view/NISX20230128_0002172645","https://www.busan.com/view/busan/view.php?code=2021011702372278805","https://thevc.kr/netspa"]},{"id":"c159","name":"리클","sector":"재활용·순환경제","subsector":"섬유·기타 재활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"앱으로 헌옷 수거를 신청하면 문 앞에 내놓은 옷을 비대면으로 가져가고 무게에 따라 보상을 주는 서비스를 운영한다. 수거한 옷은 검수를 거쳐 다시 팔 수 있는 것은 세컨핸드로 유통한다. 서울은 직접 방문 수거하고, 경기·인천 등은 수거 키트를 보내 택배로 받는 방식으로 운영한다.","tags":["헌옷수거","세컨핸드","의류순환"],"conf":"확인","global":false,"url":"https://www.recl.co.kr","ext":[],"grounded":true,"src":["https://www.econovill.com/news/articleView.html?idxno=561681","https://www.sisajournal-e.com/news/articleView.html?idxno=299904","https://futurechosun.com/archives/75605","https://recl.co.kr/landing"]},{"id":"c160","name":"세진플러스","sector":"재활용·순환경제","subsector":"섬유·기타 재활용","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"버려지는 섬유 폐기물을 재활용해 건축용 패널을 만드는 사회적기업이다. 폐섬유를 수거·분류한 뒤 잘게 풀어 다시 섬유 형태로 만들고 압축해 판으로 굳히는데, 2018년 선보인 브랜드 '플러스넬'이 이 제품이다. 유해한 접착 성분을 쓰지 않고, 목재나 징크 같은 기존 건축 마감재를 대신하는 내·외장재로 쓰인다.","tags":["폐섬유","섬유패널","플러스넬","사회적기업"],"conf":"확인","global":false,"url":"https://sejinplus.co.kr","ext":[{"n":"코오롱이앤씨","rel":"협력"}],"grounded":true,"src":["https://sejinplus.modoo.at/?link=1xb5neyv","http://kangso.co.kr/View.aspx?No=3020539","https://www.sejinplus.kr/%EC%A0%9C%ED%92%88-%EA%B0%9C%EC%9A%94"]},{"id":"c161","name":"엘디카본","sector":"재활용·순환경제","subsector":"섬유·기타 재활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"폐타이어를 산소가 없는 상태에서 간접 가열해 분해하는 열분해 방식으로 재생 카본블랙과 열분해유를 생산한다. 카본블랙은 타이어를 단단하게 만드는 검은 분말 원료로, 이를 재생해 다시 타이어 업계에 공급하고 열분해유는 정유업계로 보낸다. 2025년 4월 충남 당진에 대규모 폐타이어 재활용 공장을 준공했다.","tags":["폐타이어","재생카본블랙","열분해"],"conf":"확인","global":false,"url":"https://ldcarbon.co.kr","ext":[{"n":"SK인천석유화학","rel":"투자"}],"grounded":true,"src":["https://www.news1.kr/industry/sb-founded/5764179","https://www.sisajournal-e.com/news/articleView.html?idxno=405344","https://ldcarbon.co.kr/gwbbs/gw_page1.php?ti=page1&me_co=1010"]},{"id":"c162","name":"티케이케미칼","sector":"재활용·순환경제","subsector":"섬유·기타 재활용","type":"중견기업","scale":3,"founded":null,"hq":"대구","listed":"코스닥","desc":"SM그룹 계열의 화학섬유 기업으로 폴리에스터 원사와 PET 수지를 생산한다. 국내에서 회수한 폐페트병을 원료로 만든 재생 원사 'K-rPET 에코론'을 내놓았고, 항균사와 인조 스웨이드사 등 재생 소재를 넓혀 왔다. 지자체·기업과 협약을 맺어 수거부터 제품화까지 이어지는 국산 페트병 순환 체계를 구축했다.","tags":["리사이클PET","화섬","재생원사"],"conf":"확인","global":false,"url":"https://www.tkchemi.co.kr","ext":[],"grounded":true,"src":["http://www.tinnews.co.kr/21120","https://www.consumernews.co.kr/news/articleView.html?idxno=624533","https://www.tkchemi.co.kr/kr/product/polyester/ecolon.do"]},{"id":"c163","name":"효성티앤씨","sector":"재활용·순환경제","subsector":"섬유·기타 재활용","type":"대기업","scale":4,"founded":2018,"hq":"서울","listed":"코스피","desc":"섬유·무역 사업을 하는 효성그룹 계열 상장사로, 버려진 페트병을 재활용해 만든 폴리에스터 원사 브랜드 리젠(regen)을 운영한다. 페트병을 세척·분쇄하고 칩으로 녹인 뒤 실을 뽑는 방식이며, 리젠은 2008년 처음 선보였다. 이 원사는 스포츠·아웃도어 의류와 가방 등에 쓰이고, 바다에서 수거한 페트병을 원료로 쓰는 제품군도 있다.","tags":["리젠","재생섬유","페트병원사"],"conf":"확인","global":false,"url":"https://www.hyosungtnc.com","ext":[],"grounded":true,"src":["https://www.hyosung.com/kr/newsroom/view/15368","https://www.hyosungtextile.com/kr/regen/polyester","https://magazine.hankyung.com/business/article/202104304422b"]},{"id":"c164","name":"119레오","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"소방관이 쓰다 버린 방화복과 소방호스를 재활용해 가방·팔찌·키링 등을 만드는 소셜벤처다. 브랜드명 레오(REO)는 '서로가 서로를 구한다(Rescue Each Other)'는 뜻으로, 건국대 창업 동아리에서 출발했다. 자체 디자인 제품과 협업 제품을 온라인과 팝업스토어에서 팔고, 수익 일부를 암 투병 소방관 등 소방 관련 단체에 기부한다.","tags":["폐방화복","소방관","소셜벤처"],"conf":"확인","global":false,"url":"https://www.119reo.com","ext":[],"grounded":true,"src":["https://fashionbiz.co.kr/article/220299","http://m.dhnews.co.kr/news/articleView.html?idxno=117063","https://www.newstree.kr/newsView/ntr202407150010","https://www.119reo.com/"]},{"id":"c165","name":"노플라스틱선데이","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"버려진 플라스틱을 잘게 부수고 녹여 새 소재로 되살린 뒤 생활용품과 굿즈를 만드는 업사이클 브랜드다. 특히 병뚜껑처럼 크기가 작아 선별이 어려워 재활용에서 빠지기 쉬운 PP·PE 플라스틱을 시민과 함께 수거해 원료로 쓴다. 소재의 품질을 높이기 위해 인공지능과 로봇팔로 플라스틱을 색상별로 자동 분류한다.","tags":["폐플라스틱","업사이클굿즈","소재화"],"conf":"추정","global":false,"url":"https://noplasticsunday.com","ext":[],"grounded":true,"src":["https://www.campaigninsight.co.kr/news/articleView.html?idxno=901","https://noplasticsunday.com/about","https://www.newstree.kr/newsView/ntr202204120008"]},{"id":"c166","name":"라잇루트","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"전기차 배터리에 들어가는 분리막 가운데 미세 스크래치나 재고 때문에 버려지는 원단을 옷 소재로 되살리는 기업이다. 분리막을 양모(울)와 친환경 접착제로 붙여 습기를 배출하고 바람을 막는 기능성 신소재를 개발했다. SK이노베이션이 육성해 온 친환경 사회적기업이다.","tags":["배터리분리막","기능성원단","업사이클"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["http://www.epnc.co.kr/news/articleView.html?idxno=109950","https://www.hankookilbo.com/News/Read/A2024032414340001243","https://www.kecowebzine.kr/data/vol57/sub/together01.html"]},{"id":"c167","name":"마린이노베이션","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"우뭇가사리·모자반·미역귀 등 펄프 성분이 많은 해조류 부산물에서 소재를 뽑아 종이컵·접시·계란판·도시락 용기 같은 플라스틱 대체 제품을 만드는 회사다. 나무 펄프와 달리 염소 등 화학 표백제를 쓰지 않는 공정을 적용하며, 만들어진 포장재는 60일가량이면 흙에서 분해된다. 울산에 기반을 두고 있다.","tags":["해조류부산물","플라스틱대체","생분해"],"conf":"확인","global":false,"url":"https://www.marineinv.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2021112897421","https://www.busan.com/view/busan/view.php?code=2024031418090677486","https://skinnonews.com/archives/59442"]},{"id":"c168","name":"모어댄","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":2015,"hq":"경기","listed":"비상장","desc":"폐차에서 나오는 가죽시트·안전벨트·에어백을 재활용해 가방과 신발, 액세서리를 만드는 소셜벤처로 브랜드 이름은 컨티뉴(CONTINEW)다. 자동차 가죽은 썩지 않도록 화학 처리돼 있어 버려지면 대부분 매립되는데, 이를 수거·세척해 제품 소재로 되살린다. 공장에서는 빗물을 모아 세척수로 쓰고 폐수를 걸러 재사용하며, 지붕의 태양광 설비로 공정 전기를 조달한다.","tags":["컨티뉴","자동차폐가죽","소셜벤처"],"conf":"확인","global":false,"url":"https://continew.co.kr","ext":[],"grounded":true,"src":["https://www.businesspost.co.kr/BP?command=article_view&num=274901","https://www.etoday.co.kr/news/view/1774158","http://www.danbinews.com/news/articleView.html?idxno=21711","https://www.upcycleus.kr/main/upcycle/upcycle_product_view.do?mptIdx=18"]},{"id":"c169","name":"스타스테크","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":2017,"hq":"서울","listed":"비상장","desc":"양식장 어패류를 잡아먹어 어민에게 골칫거리인 불가사리에서 성분을 추출해 친환경 제설제 '에코스트'를 만드는 회사다. 도로 시설물과 차량을 부식시키는 정도가 일반 소금 제설제보다 크게 낮으면서 가격 부담은 줄인 것이 특징이다. 제설제 생산에 해마다 수백 톤 규모의 불가사리가 쓰인다.","tags":["불가사리","친환경제설제","해양폐기물"],"conf":"확인","global":false,"url":"https://www.starstech.co.kr","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2023111331211","https://www.asiae.co.kr/article/2021070609174560088","https://www.sbiz.news/news/articleView.html?idxno=21225"]},{"id":"c170","name":"코끼리공장","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"중소기업","scale":2,"founded":null,"hq":"울산","listed":"비상장","desc":"2014년 울산에서 시작한 사회적기업으로, 버려지는 장난감을 모아 수리하고 소독한 뒤 취약계층 어린이 등에게 무상으로 기부한다. 고쳐 쓸 수 없는 장난감은 분해해 소재별로 재활용한다. 수리와 분해 작업에 고령자·장애인 등을 고용해 일자리를 함께 만들고 있으며, 울산 외에 부산 등지로도 사업장을 넓혔다.","tags":["장난감재활용","사회적기업","울산"],"conf":"확인","global":false,"url":"https://kogongjang.com","ext":[],"grounded":true,"src":["https://www.fortunekorea.co.kr/news/articleView.html?idxno=32878","https://www.ytn.co.kr/_ln/0115_202510090323030131","https://www.newstree.kr/newsView/ntr202406200019"]},{"id":"c171","name":"코오롱인더스트리 FnC부문","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"비상장","desc":"코오롱인더스트리의 패션 사업 부문으로, 2012년 업사이클링 브랜드 래코드(RE;CODE)를 선보였다. 팔리지 않고 남은 재고 의류를 선별해 수작업으로 해체한 뒤 다시 조합하는 방식으로 새 옷을 만든다. 폐기될 옷을 제품으로 되살리는 지속가능 패션 사업을 10년 넘게 이어오고 있다.","tags":["래코드","업사이클패션","재고의류"],"conf":"확인","global":false,"url":"https://www.kolonfnc.com","ext":[],"grounded":true,"src":["https://www.kolonfnc.com/press/1118?page=1","https://www.ajunews.com/view/20220218141704791","https://www.pointdaily.co.kr/news/articleView.html?idxno=144747"]},{"id":"c172","name":"큐클리프","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"버려진 우산 원단 등 못 쓰게 된 소재를 재단해 지갑·파우치·가방으로 만드는 업사이클 브랜드다. 이름은 영어 '업사이클(upcycle)'의 철자를 재배열해 만든 것으로, 소각 대신 두 번째 쓸모를 찾자는 뜻을 담았다. 폐우산을 수거한 뒤 상태가 쓸 만한 원단만 골라 제품에 사용하며, 주력 제품은 폐우산 천으로 만든 지갑이다.","tags":["폐우산","현수막","업사이클제품"],"conf":"확인","global":false,"url":"https://www.cueclyp.com","ext":[],"grounded":true,"src":["https://www.eroun.net/news/articleView.html?idxno=2695","https://ktnews.com/news/articleView.html?idxno=107828","https://futurechosun.com/archives/19002","https://www.cueclyp.com/collaboration"]},{"id":"c173","name":"터치포굿","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"중소기업","scale":2,"founded":2008,"hq":"서울","listed":"비상장","desc":"선거·행사에서 쓰고 버려지는 현수막과 폐플라스틱 등 도시 폐기물을 가방 같은 생활용품으로 다시 만드는 업사이클링 사회적기업이다. 제품 제작·판매에 그치지 않고, 폐기물을 배출하는 기업·공공기관과 함께 자원순환 방법을 찾는 컨설팅과 시민 대상 환경교육도 한다. 지방자치단체와 함께 지역에서 나온 폐현수막을 수거해 제품으로 되돌리는 프로젝트를 여러 차례 진행했다.","tags":["폐현수막","사회적기업","업사이클교육"],"conf":"확인","global":false,"url":"https://www.touch4good.com","ext":[],"grounded":true,"src":["https://www.hankookilbo.com/News/Read/202002280981039873","http://www.emozak.co.kr/news/articleView.html?idxno=4151","https://www.hantoday.net/news/articleView.html?idxno=42901"]},{"id":"c174","name":"플리츠마마","sector":"재활용·순환경제","subsector":"업사이클·새활용","type":"스타트업","scale":1,"founded":2017,"hq":"서울","listed":"비상장","desc":"버려진 페트병에서 뽑아낸 재생 원사로 주름진 니트 가방을 만드는 브랜드다. 효성티앤씨가 폐페트병을 재활용해 만드는 원사 '리젠'을 사용하며, 고온 열처리나 화학 처리 없이 원단을 짜는 방식으로 주름을 내 세탁 후에도 형태가 유지된다. 제주에서 모은 폐페트병으로 만든 리젠 원사를 적용한 제품도 선보였다.","tags":["재생원사","니트백","페트병"],"conf":"확인","global":false,"url":"https://pleatsmama.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2025101635441","https://mediahub.seoul.go.kr/archives/2000902","https://pleatsmama.com/shop-tote/?idx=107","https://brunch.co.kr/@koopost/300"]},{"id":"c175","name":"뉴트리인더스트리","sector":"재활용·순환경제","subsector":"유기성 자원·바이오가스","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"음식물 쓰레기를 동애등에라는 곤충의 유충에게 먹여 처리하고, 자란 유충은 사료용 단백질로, 남은 부산물은 비료로 자원화하는 소셜벤처다. 화학물질을 쓰지 않고 곤충학·동물영양학 데이터를 바탕으로 유충을 사육하며, 수산·양계·양돈 등 용도에 맞춘 사료를 생산한다. 2017년 곤충을 활용한 음식물류 폐기물 재활용업 허가를 받았다.","tags":["동애등에","음식물쓰레기","곤충단백질"],"conf":"확인","global":false,"url":"https://nutri.kr","ext":[],"grounded":true,"src":["https://www.impactsquare.com/portfolio/nutri","https://m.etnews.com/20210723000063","https://www.nextunicorn.kr/company/f80fe79c9f10e3f9?tab=service"]},{"id":"c176","name":"리하베스트","sector":"재활용·순환경제","subsector":"유기성 자원·바이오가스","type":"스타트업","scale":1,"founded":2019,"hq":"서울","listed":"비상장","desc":"맥주와 식혜를 만들고 남은 보리·밀 부산물을 가공해 밀가루 대체 원료 '리너지 가루'로 만드는 푸드 업사이클링 기업이다. 리너지 가루는 일반 밀가루보다 단백질과 식이섬유가 많아 시리얼·과자·제빵·피자 등에서 밀가루를 대신해 쓰인다. 기업에 공급하는 원료형 제품과 소비자용 간편대체식을 함께 개발·생산한다.","tags":["푸드업사이클","맥주부산물","리너지가루"],"conf":"확인","global":false,"url":"https://www.reharvest.net","ext":[],"grounded":true,"src":["https://www.venturesquare.net/1001338","https://www.sisajournal-e.com/news/articleView.html?idxno=293765","https://www.asiae.co.kr/article/2022021116242210983","http://www.casenews.co.kr/news/articleView.html?idxno=11037"]},{"id":"c177","name":"에코바이오홀딩스","sector":"재활용·순환경제","subsector":"유기성 자원·바이오가스","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"코스닥","desc":"쓰레기 매립장과 하수·유기성 폐기물 처리시설에서 나오는 메탄가스(바이오가스)를 모아 전기·가스·수소 같은 에너지로 바꾸는 환경에너지 기업이다. 전국 여러 곳에서 매립가스 자원화와 바이오가스 발전 사업장을 운영하며, 가스에 섞인 황화수소를 미생물 공정으로 걸러 '바이오황'으로 만드는 기술도 2016년 개발했다. 1997년 설립돼 2001년 코스닥에 상장했다.","tags":["매립가스","바이오가스발전","바이오황"],"conf":"확인","global":false,"url":"https://ecobio.co.kr","ext":[],"grounded":true,"src":["https://www.gasnews.com/news/articleView.html?idxno=112282","https://www.asiae.co.kr/article/2024030609414040237","https://thebell.co.kr/free/Content/ArticleView.asp?key=202009241446007640108631&svccode=04"]},{"id":"c178","name":"이앤켐솔루션","sector":"재활용·순환경제","subsector":"유기성 자원·바이오가스","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"2007년 설립된 환경·화학 소재 기업으로, 바이오가스에 섞인 황화수소와 수분·암모니아·실록산 등 불순물을 걸러내는 탈황제와 건식 전처리 설비를 만든다. 이 설비는 매립지나 음식물·하수 처리시설에서 나온 가스를 발전 연료로 쓸 수 있게 다듬는 데 사용되며, 건식 제습탈황시스템이 혁신제품으로 인증받았다. 수처리용 흡착제도 생산하고, 다 쓴 탈황제를 재가공해 하수 질소 제거에 쓰는 사업도 추진한다.","tags":["바이오가스","환경플랜트"],"conf":"추정","global":false,"url":"https://enchem.co.kr","ext":[],"grounded":true,"src":["http://enchem.co.kr/page/news.php","https://renewableenergyfollowers.org/4530","https://www.gasnews.com/news/articleView.html?idxno=112431"]},{"id":"c179","name":"지엔씨에너지","sector":"재활용·순환경제","subsector":"유기성 자원·바이오가스","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"코스닥","desc":"1989년 창업해 2013년 코스닥에 상장한 발전설비 기업이다. 정전에 대비하는 비상발전기와 상용 발전기를 제작·설치하는 것이 주력으로, 전력이 끊기면 안 되는 인터넷데이터센터(IDC) 등에 공급한다. 여기에 더해 유기성 폐기물에서 나오는 바이오가스를 연료로 쓰는 발전 사업과 가스 전처리 설비, 열병합·연료전지 발전으로 사업을 넓히고 있다.","tags":["바이오가스발전","비상발전기","신재생","매립가스","바이오가스","발전"],"conf":"확인","global":false,"url":"https://www.gncenergy.co.kr","ext":[],"grounded":true,"src":["https://www.electimes.com/news/articleView.html?idxno=319437","https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01476006625798112","http://www.dailyinvest.kr/news/articleView.html?idxno=55573"]},{"id":"c180","name":"포이엔","sector":"재활용·순환경제","subsector":"유기성 자원·바이오가스","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"커피를 내리고 남은 찌꺼기인 커피박 등 유기성 부산물을 모아 바이오차와 고형연료, 바이오플라스틱으로 바꾸는 회사다. 바이오차는 산소를 차단한 채 열분해해 만든 숯 형태 물질로, 탄소를 오랫동안 가둬 두는 효과가 있다. 커피박 바이오차와 고형연료의 온실가스 감축 방법론을 대한상공회의소 자발적 탄소배출권 제도에 등록해 배출권 사업을 병행하며, 해외에서는 농업 부산물을 원료로 하는 설비를 공급한다.","tags":["커피박","바이오차","탄소배출권"],"conf":"확인","global":false,"url":"https://4en.co.kr","ext":[{"n":"스타벅스코리아","rel":"협력"}],"grounded":true,"src":["https://www.hankyung.com/article/202312290321i","https://magazine.hankyung.com/business/article/202401298650b","https://futurechosun.com/archives/77857"]},{"id":"c181","name":"LG화학","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"대기업","scale":4,"founded":1947,"hq":"서울","listed":"코스피","desc":"석유화학과 첨단소재 등을 다루는 국내 대표 종합화학 기업이다. 순환경제 사업으로 충남 당진 석문산업단지에 폐플라스틱 열분해유 생산시설을 건설했다. 과자봉지처럼 여러 재질이 섞여 재활용이 어려운 비닐을 고온·고압의 초임계 수증기로 분해해 석유화학의 기초 원료인 납사를 뽑아내고, 이를 다시 공정에 투입하는 화학적 재활용 방식이다.","tags":["화학적재활용","열분해유","순환경제"],"conf":"확인","global":false,"url":"https://www.lgchem.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/economy/article/2022011872051","https://www.khan.co.kr/article/202303301540001","https://blog.lgchem.com/2023/04/13_dangjing_plant/"]},{"id":"c182","name":"SK지오센트릭","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"비상장","desc":"SK이노베이션의 화학 계열사로 폐플라스틱을 원료 상태로 되돌리는 화학적 재활용 사업을 한다. 울산 SK이노베이션 콤플렉스 안에 재활용 단지인 울산 ARC(Advanced Recycling Cluster)를 조성하고 있다. 플라스틱을 열로 분해하는 열분해, 페트를 원료 단위로 되돌리는 해중합, 고순도 폴리프로필렌 추출 세 가지 기술을 한 곳에 모은 것이 특징이다.","tags":["화학적재활용","열분해","해중합","울산ARC"],"conf":"확인","global":false,"url":"https://www.skgeocentric.com","ext":[],"grounded":true,"src":["https://www.etnews.com/20231115000122","https://zdnet.co.kr/view/?no=20231115160812","https://www.ksilbo.co.kr/news/articleView.html?idxno=984883"]},{"id":"c183","name":"도시유전","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"폐플라스틱과 폐비닐을 태우지 않고 300도 미만의 낮은 온도에서 촉매로 분해해 나프타급 재생원료유를 만드는 기술 기업이다. 선별되지 않은 혼합 폐기물에서도 비닐·플라스틱만 골라내 처리할 수 있다. 전북 정읍에 상용 공장을 두고 영농 폐비닐 등을 처리하며, 생산한 재생원료를 글로벌 원자재 트레이딩 기업에 수출하고 있다.","tags":["저온분해","재생유","나프타","폐비닐"],"conf":"확인","global":false,"url":"https://cityoil.co.kr","ext":[],"grounded":true,"src":["https://www.asiae.co.kr/article/2025111813543916454","https://www.hankookilbo.com/News/Read/A2025111816350001218","https://biz.heraldcorp.com/article/10830060","https://www.fnnews.com/news/202605270748400528"]},{"id":"c184","name":"롯데케미칼","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"대기업","scale":4,"founded":1976,"hq":"서울","listed":"코스피","desc":"국내 석유화학 대기업으로 폐플라스틱을 다시 원료로 쓰는 화학적 재활용 사업을 하고 있다. 폐플라스틱을 열로 분해해 얻은 기름을 정제한 납사를 석유화학 공정에 투입해 폴리카보네이트 등 합성수지 제품을 만들고, 해당 제품군에 국제 친환경 인증인 ISCC PLUS를 받았다. 울산공장에서는 화학적 재활용 페트(C-rPET) 생산으로의 전환도 추진하고 있다.","tags":["석유화학","열분해납사","화학적재활용"],"conf":"확인","global":false,"url":"https://www.lottechem.com","ext":[],"grounded":true,"src":["https://www.lottechem.com/ko/media/news/619/view.do","https://www.industrynews.co.kr/news/articleView.html?idxno=47261","https://www.khan.co.kr/economy/economy-general/article/202311151713001"]},{"id":"c185","name":"리보테크","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"폐비닐과 폐플라스틱을 태우지 않고 열로 분해해 기름과 가스로 되돌리는 연속식 열분해 기술을 보유한 기업이다. 24시간 연속 운전이 가능한 설비에서 열분해유(라이트 나프타·헤비오일)와 합성가스를 생산한다. 경북 문경에 사업장을 두고 있으며, 열분해 가스를 정제해 수소를 만드는 사업도 함께 추진한다.","tags":["연속식열분해","열분해유","폐합성수지"],"conf":"확인","global":false,"url":"https://www.revogreenpia.kr","ext":[],"grounded":true,"src":["https://www.hankookilbo.com/News/Read/A2024021411080001292","http://www.gasnews.com/news/articleView.html?idxno=108571","https://www.imaeil.com/page/view/2024082511093201782","https://dealsitetv.com/articles/80425"]},{"id":"c186","name":"리플라","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"미생물을 이용해 폐플라스틱을 재활용하는 스타트업으로 2019년 설립됐다. 여러 재질이 섞인 폐플라스틱에서 미생물이 특정 재질만 분해하도록 하는 '바이오탱크' 설비로 남은 재활용 원료의 순도를 높인다. 플라스틱 재질을 가려내는 판별 기기 '플라스캔(plaSCAN)'도 개발했다.","tags":["미생물","플라스틱순도","바이오"],"conf":"확인","global":false,"url":"https://www.repla.co.kr","ext":[],"grounded":true,"src":["https://platum.kr/archives/146457","http://www.repla.co.kr/company","https://wowtale.net/2020/08/07/repla-raised-seed-funding/","https://thevc.kr/repla"]},{"id":"c187","name":"삼양패키징","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"중견기업","scale":3,"founded":2014,"hq":"서울","listed":"코스피","desc":"삼양그룹 계열로 음료를 무균 상태로 채워 넣는 아셉틱 충전 방식의 PET 용기를 만드는 기업이다. 여기에 더해 폐페트병을 잘게 부순 페트 플레이크와 이를 다시 알갱이 형태로 가공한 재생 페트칩(R-Chip)을 생산하는 재활용 사업을 키우고 있다. 재생 원료는 페트병이나 의류용 원사 등으로 다시 쓰인다.","tags":["PET","보틀투보틀","아셉틱"],"conf":"확인","global":false,"url":"https://www.samyangpackaging.co.kr","ext":[{"n":"삼양홀딩스","rel":"계열"}],"grounded":true,"src":["https://samyangpackaging.co.kr/kr/business/pet-recycling","https://www.bloter.net/news/articleView.html?idxno=46261","https://thebell.co.kr/free/Content/ArticleView.asp?key=202210181629344720107552&svccode=04"]},{"id":"c188","name":"에코크레이션","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"중소기업","scale":2,"founded":null,"hq":"인천","listed":"비상장","desc":"폐플라스틱을 산소가 없는 상태에서 가열해 기름으로 바꾸는 열분해 설비를 직접 제작해 공급하는 인천 소재 기업이다. 설비 공급뿐 아니라 나온 기름을 정제하는 기술도 갖추고 있다. 인천 청라에 열분해 플랜트 제조공장을 두고 있으며, 최근에는 플랜트 자동화와 열분해유를 연료로 쓰는 발전 등으로 사업을 넓히고 있다.","tags":["열분해","유화플랜트","폐플라스틱"],"conf":"확인","global":false,"url":"https://www.ecocreation-in.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/202601063961i","https://www.incheonnews.com/news/articleView.html?idxno=422069","https://www.kyeongin.com/article/1762604","https://www.newspim.com/news/view/20230531000124"]},{"id":"c189","name":"테라사이클","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"해외 대표","scale":4,"founded":2001,"hq":"미국","listed":null,"desc":"동네 분리배출 체계로는 처리되지 않는 폐기물의 재활용 방법을 개발하는 미국 기업이다. 기업과 소비자가 참여하는 수거 프로그램을 운영해 모은 폐기물을 선별·가공한 뒤 새 제품의 원료로 되돌린다. 또 다른 축인 루프(Loop)는 제품을 다회용 용기에 담아 팔고 빈 용기를 회수·세척해 다시 채워 쓰는 플랫폼이다.","tags":["난재활용폐기물","수거프로그램","글로벌"],"conf":"확인","global":true,"url":"https://www.terracycle.com","ext":[],"grounded":true,"src":["https://www.terracycle.com/ko-KR/about-terracycle/our_recycling_process","https://www.terracycle.com/ko-KR/pages/closed-loop-solution","https://www.terracycle.com/ko-KR/pages/how-terracycle"]},{"id":"c190","name":"테라클","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"폐페트병과 폴리에스터 의류처럼 버려진 플라스틱을 화학적으로 분해해 원래 원료로 되돌리는 해중합 기술을 개발하는 스타트업이다. 촉매를 써서 60도 미만 상압에서 PET를 분해해 재생 원료인 테레프탈산(TPA)과 에틸렌글리콜(EG)을 만든다. 2021년 테라블록이라는 이름으로 창업한 뒤 사명을 테라클로 바꿨고, 105억원 규모 시리즈A 투자를 유치했다.","tags":["해중합","화학적재활용","PET","사명변경"],"conf":"확인","global":false,"url":"https://www.terracle.im","ext":[],"grounded":true,"src":["https://thevc.kr/terracle","https://platum.kr/archives/224375","https://www.segye.com/newsView/20241031516046","https://greenium.kr/news/60808/"]},{"id":"c191","name":"홀트에너지","sector":"재활용·순환경제","subsector":"플라스틱 재활용","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"폐플라스틱을 열로 분해할 때 나오는 기름과 가스에서 수소를 뽑아내는 수소추출기를 개발하는 스타트업이다. 수소를 쓰는 곳 가까이에서 직접 만들어 운송·저장 비용을 줄이는 방식을 지향하며, 열분해 후 남는 잔재물을 다시 자원으로 활용하는 사업도 함께 한다. 한국투자액셀러레이터로부터 시드 투자를 받았고 순환경제 분야 정부 규제특례 사업자로 선정됐다.","tags":["열분해","수소","폐플라스틱"],"conf":"확인","global":false,"url":"https://www.haltenergy.com","ext":[],"grounded":true,"src":["https://www.startuptoday.kr/news/articleView.html?idxno=49058","https://thevc.kr/haltenergy","https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04195126645447936","http://www.ulkyung.kr/news/articleView.html?idxno=53075"]},{"id":"c192","name":"지오그린21","sector":"토양·지하수","subsector":"오염 조사·컨설팅","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"2000년 설립된 지하수·지질 분야 엔지니어링 기업이다. 지하수와 토양의 오염 상태를 조사하고 정화를 컨설팅하며, 수자원 개발과 수리지질 조사평가를 수행한다. 굴착 공사로 땅이 꺼지거나 주변 지반이 흔들리지 않는지 미리 따지는 지하안전영향평가, 터널·지하저장시설 설계도 사업 영역이다.","tags":["지하수조사","토양조사","컨설팅","지하안전"],"conf":"확인","global":false,"url":"https://www.geogreen21.com","ext":[],"grounded":true,"src":["https://www.geogreen21.com/","https://www.ikld.kr/news/articleView.html?idxno=264223"]},{"id":"c193","name":"한국농어촌공사","sector":"토양·지하수","subsector":"오염 조사·컨설팅","type":"공공·연구","scale":3,"founded":null,"hq":"전남","listed":null,"desc":"농어촌 지역의 용수 공급과 농업기반시설을 관리하는 공공기관이다. 2002년부터 전국 시·군·구에 농촌지하수관측망을 두고 지하수의 수위·수질·수온을 실시간으로 관측하며, 도서·해안 지역에서는 바닷물이 지하수로 스며드는 해수침투 현상도 함께 감시한다. 전국 농촌용수구역별 지하수 현황을 조사·분석해 이용·관리 대책을 세우고, 주요 저수지와 담수호의 농업용수 수질도 정기적으로 조사한다.","tags":["지하수관측","농어촌용수","공공기관"],"conf":"확인","global":false,"url":"https://www.ekr.or.kr","ext":[],"grounded":true,"src":["https://www.ekr.or.kr/Kkrpub/webzine/2023/04/subpage-101.html","https://rawris.ekr.or.kr/farmwater.do?page=farmwater_waterquality_survey","https://www.data.go.kr/data/15037804/fileData.do"]},{"id":"c194","name":"한국지질자원연구원","sector":"토양·지하수","subsector":"오염 조사·컨설팅","type":"공공·연구","scale":3,"founded":null,"hq":"대전","listed":null,"desc":"육상·해저 지질조사를 바탕으로 지하자원 탐사·개발과 지질재해·지구환경변화 대응을 연구하는 정부출연연구기관이다. 2001년 한국자원연구소에서 지금의 이름으로 바뀌었다. 산하 지하수자원연구센터가 지하수 자원과 지열 에너지의 조사·평가·활용 기술, 물 공급이 어려운 지역의 지하수 개발 유망지를 찾는 기술 등을 개발한다.","tags":["정부출연연","지하수연구","지질"],"conf":"확인","global":false,"url":"https://www.kigam.re.kr","ext":[],"grounded":true,"src":["https://www.kigam.re.kr/menu.es?mid=a10202000000","https://www.kigam.re.kr/menu.es?mid=a10403060000","https://www.kigam.re.kr/"]},{"id":"c195","name":"한서엔지니어링","sector":"토양·지하수","subsector":"오염 조사·컨설팅","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"지하수 분야를 주력으로 하는 엔지니어링 기업이다. 지하수의 양과 수질을 조사·평가하고 관정을 개발·시공하며 이후 상태를 계속 관측하는 일을 한다. 지하수·토양 오염 조사와 정화, 폐광산이 주변에 끼치는 피해를 막는 광해방지 사업도 수행하고, 지질·지반 조사와 지반 보강 공사까지 영역이 걸쳐 있다.","tags":["지하수개발","토양조사","용역"],"conf":"확인","global":false,"url":"https://www.hanseoeng.kr","ext":[],"grounded":true,"src":["http://hanseoeng.kr/bbs/board.php?bo_table=HSdata","http://geohans.host.whoisweb.net/?z=contents.business","https://www.bigdata-environment.kr/user/data_market/detail.do?id=c7404820-38bb-11ea-be28-4fa0eb812a46"]},{"id":"c196","name":"동명엔터프라이즈","sector":"토양·지하수","subsector":"토양·지하수 정화","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"기름 등으로 오염된 흙을 걷어내 되살리는 토양정화를 주력으로 하는 환경기업이다. 토양·지하수뿐 아니라 대기, 수질, 폐기물 등 환경 전반의 오염방지 시스템을 개발·구축하며, 개발 부지의 오염토양 정화 사업에 참여한다.","tags":["토양정화","유류오염","주유소"],"conf":"확인","global":false,"url":"https://www.dm-ent.co.kr","ext":[],"grounded":true,"src":["https://www.ikld.kr/news/articleView.html?idxno=212741","https://www.dnews.co.kr/uhtml/view.jsp?idxno=202601121317021000271"]},{"id":"c197","name":"아름다운환경건설","sector":"토양·지하수","subsector":"토양·지하수 정화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"오염된 토양과 지하수를 조사하고 정화하는 환경 기업으로 경기 성남에 본사를 두고 있다. 오염토를 파내 처리하는 굴착정화와 땅에 묻힌 상태 그대로 처리하는 원위치정화를 모두 수행하고, 오염토를 실어 와 처리하는 반입정화시설도 운영한다. 열탈착·토양세척 설비를 갖췄으며 폐광산 복원, 석면 조사·해체 사업도 한다.","tags":["토양정화","반입정화시설","지하수"],"conf":"확인","global":false,"url":"https://esakorea.com","ext":[],"grounded":true,"src":["http://esakorea.com/","http://esakorea.com/%ED%86%A0%EC%96%91-%EC%A7%80%ED%95%98%EC%88%98/%EB%B0%98%EC%9E%85%EC%A0%95%ED%99%94%EC%8B%9C%EC%84%A4/","http://esakorea.com/%ED%86%A0%EC%96%91-%EC%A7%80%ED%95%98%EC%88%98/%EC%A0%95%ED%99%94/%ED%86%A0%EC%96%91%EC%A0%95%ED%99%94-in-situ/","https://keia.kr/main/partner/partnerc_view.do?ptIdx=348"]},{"id":"c198","name":"아이케이","sector":"토양·지하수","subsector":"토양·지하수 정화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"건설폐기물을 중간처리해 순환골재를 만드는 것이 주력인 환경 기업이다. 폐기물 수집·운반, 철골·석면 해체, 흙을 굳히는 고화재 제조, 보강토 블록 생산도 함께 한다. 토양정화 부문에서는 오염토를 씻어내는 세척과 흙을 뒤집어 오염물질을 분해시키는 경작 방식의 정화, 정화 컨설팅을 수행한다.","tags":["토양정화","환경사업"],"conf":"추정","global":false,"url":"https://www.ik.co.kr","ext":[],"grounded":true,"src":["http://www.ik.co.kr/","http://www.ik.co.kr/bbs/content.php?co_id=intro"]},{"id":"c199","name":"에이치플러스에코","sector":"토양·지하수","subsector":"토양·지하수 정화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"서울에 본사를 둔 환경 기업으로 오염된 토양과 지하수를 정화하는 공사를 주력으로 한다. 발전·산업 플랜트 시공 경험을 바탕으로 대기·수질 환경플랜트와 신재생에너지, 폐기물 에너지화 사업도 수행한다. 경유차 배기가스 저감에 쓰는 요소수 등 화학소재와 플라스틱 파레트 사업도 함께 하며, 토양환경 복원 기술을 개발하는 연구소를 운영한다.","tags":["토양정화","환경플랜트"],"conf":"확인","global":false,"url":"https://www.hpluseco.co.kr","ext":[],"grounded":true,"src":["https://www.hpluseco.co.kr/","https://www.hpluseco.co.kr/page/business1.php","https://www.hpluseco.co.kr/page/business2.php","https://www.hpluseco.co.kr/page/business6.php"]},{"id":"c200","name":"에코필","sector":"토양·지하수","subsector":"토양·지하수 정화","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"오염된 토양을 정화하는 전문기업이다. 오염토를 가열해 오염물질을 떼어내는 열탈착, 물로 씻어내는 토양세척, 미생물을 쓰는 생물학적 정화, 전기를 흘려 오염물질을 모으는 전기역학적 정화 기술을 갖추고 기름·중금속·불소로 오염된 부지를 처리한다. 쿠웨이트석유공사의 유전지역 정화사업 참여 자격을 얻어 현지에 토양세척 플랜트를 수출한 이력이 있다.","tags":["토양정화","기술수출"],"conf":"확인","global":false,"url":"https://kor.ecophile.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2012122779781","https://www.ustockplus.com/stock/ecophile-145860","https://yangju.grandculture.net/yangju/toc/GC04330031"]},{"id":"c201","name":"오이코스","sector":"토양·지하수","subsector":"토양·지하수 정화","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"기름이나 중금속에 오염된 토양과 지하수를 되살리는 환경복원 전문 기업이다. 오염된 땅을 조사하고 정화 방법을 설계하는 컨설팅부터 실제 정화 공사까지 맡는다. 강·항만 바닥에서 퍼올린 준설토 정화, 매립지 정비, 하천 생태 복원 사업도 함께 수행한다.","tags":["토양정화","지하수정화","오염부지"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.incruit.com/company/2281532/","https://www.saramin.co.kr/zf_user/company-info/view/csn/MWtnY2ZIOUVKWS8yZFpRL2MvV2xCQT09/company_nm/(%EC%A3%BC)%EC%98%A4%EC%9D%B4%EC%BD%94%EC%8A%A4"]},{"id":"c202","name":"현대건설","sector":"토양·지하수","subsector":"토양·지하수 정화","type":"대기업","scale":4,"founded":1947,"hq":"서울","listed":"코스피","desc":"건설 대기업으로 오염된 토양과 지하수를 되살리는 정화 사업을 수행한다. 오염토를 가열해 다이옥신을 증기로 뽑아낸 뒤 고온에서 태워 없애는 기술, 물과 약품 대신 강한 바람으로 오염된 미세 토양입자만 골라 제거하는 기술 등을 개발해 환경부 환경신기술 인증을 받았다. 인천 부평의 미군 반환기지 캠프마켓 부지 정화 사업에 참여했다.","tags":["토양정화","건설","환경기술"],"conf":"확인","global":false,"url":"https://www.hdec.kr","ext":[],"grounded":true,"src":["https://www.hdec.kr/kr/newsroom/news_view.aspx?NewsSeq=566&NewsType=LATEST&NewsListType=news_clist","http://www.ikld.kr/news/articleView.html?idxno=64175","https://www.asiae.co.kr/article/2013111410362094502"]},{"id":"c203","name":"나라스페이스테크놀로지","sector":"측정·분석·모니터링","subsector":"위성·드론·원격 모니터링","type":"스타트업","scale":1,"founded":2015,"hq":"부산","listed":"비상장","desc":"소형 인공위성을 직접 만들고 운용하는 우주 스타트업이다. 서울대 연구팀·한국천문연구원과 함께 대기 중 메탄 농도를 관측하는 초소형 위성을 개발하고 있으며, 위성에 실린 초분광 카메라와 온보드 AI로 발전소·매립지 등 온실가스가 새는 지점과 농도 변화를 찾아낸다. 지자체와 협력해 기후 관측용 위성을 운용하는 사업도 추진한다.","tags":["초소형위성","메탄모니터링","온실가스","큐브위성"],"conf":"확인","global":false,"url":"https://www.naraspace.com","ext":[],"grounded":true,"src":["https://news.mt.co.kr/mtview.php?no=2023091809495325989","https://zdnet.co.kr/view/?no=20230918131401","https://www.asiae.co.kr/article/2023091814533731406","https://www.kyeonggi.com/article/20250715580465"]},{"id":"c204","name":"쎄트렉아이","sector":"측정·분석·모니터링","subsector":"위성·드론·원격 모니터링","type":"중견기업","scale":3,"founded":1999,"hq":"대전","listed":"코스닥","desc":"대전에 본사와 연구소를 둔 코스닥 상장사로, 지구를 내려다보며 촬영하는 관측 위성의 시스템을 직접 설계하고 제작한다. 2021년 한화에어로스페이스가 지분 약 30%를 인수해 최대주주가 됐다. 자회사 SIIS는 위성영상을 판매하고 SIA는 영상 분석 서비스를 맡으며, 25cm급 고해상도 관측 위성 스페이스아이-T를 개발해 발사했다.","tags":["지구관측위성","위성시스템","원격탐사"],"conf":"확인","global":false,"url":"https://www.satreci.com","ext":[{"n":"한화에어로스페이스","rel":"계열"}],"grounded":true,"src":["https://www.goodmorningcc.com/news/articleView.html?idxno=304657","https://www.etnews.com/20260310000032","https://v.daum.net/v/20210818104919893"]},{"id":"c205","name":"에스아이에이","sector":"측정·분석·모니터링","subsector":"위성·드론·원격 모니터링","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"위성·항공 영상을 인공지능으로 분석하는 지구관측 데이터 기업으로, 위성 제조사 쎄트렉아이의 자회사로 2018년 설립됐다. 딥러닝을 활용해 영상 속 지형·시설물과 변화를 자동으로 찾아내는 분석 플랫폼을 제공하며, 흐릿한 위성 영상의 해상도를 높이는 기술도 자체 개발했다. 국방·감시정찰 분야 영상 분석에 특히 강점을 두고 있다.","tags":["위성영상AI","원격탐사","데이터분석"],"conf":"확인","global":false,"url":"https://www.si-analytics.ai","ext":[],"grounded":true,"src":["https://si-analytics.ai/en/","https://www.forbeskorea.co.kr/news/articleView.html?idxno=401403","https://www.aitimes.kr/news/articleView.html?idxno=20556","https://thevc.kr/sianalytics"]},{"id":"c206","name":"유시스","sector":"측정·분석·모니터링","subsector":"위성·드론·원격 모니터링","type":"중소기업","scale":2,"founded":null,"hq":"울산","listed":"비상장","desc":"울산에 있는 드론·사물인터넷(IoT) 솔루션 기업이다. 자체 개발한 드론 자율비행 소프트웨어 '마이다스(MIDAS)'와 산업용 IoT 플랫폼 '유니바(UNIBA)'를 기반으로 공장·플랜트 현장의 공정과 안전 상태를 원격으로 감시하는 시스템을 공급한다. 인공지능을 결합한 실종자 수색용 드론 등으로도 활용 범위를 넓히고 있다.","tags":["드론","플랜트모니터링","환경점검"],"conf":"확인","global":false,"url":"https://www.usis.kr","ext":[],"grounded":true,"src":["http://www.usis.kr/","http://usis.kr/index_en.html","http://www.usis.kr/bbs/board.php?bo_table=usis_gallery&wr_id=52&page=1","https://www.rocketpunch.com/en/companies/usis-co-ltd"]},{"id":"c207","name":"텔레픽스","sector":"측정·분석·모니터링","subsector":"위성·드론·원격 모니터링","type":"스타트업","scale":1,"founded":2019,"hq":null,"listed":"비상장","desc":"AI를 탑재한 초소형 큐브위성 '블루본'을 운용하는 위성 데이터 기업이다. 블루본에는 초점 조절 특허 기술을 적용한 분광카메라가 실려 4.8m급 영상을 촬영하며, 바다 생태계가 흡수·저장한 탄소인 블루카본을 현장에 가지 않고 위성으로 확인하는 데 쓰인다. 위성 안에서 곧바로 영상을 분석하는 GPU 엣지컴퓨팅 장치 '테트라플렉스'도 개발했고, 촬영 영상을 유럽에 수출했다.","tags":["위성영상분석","블루카본","AI","큐브위성"],"conf":"확인","global":false,"url":"https://www.telepix.ai","ext":[],"grounded":true,"src":["https://www.aitimes.com/news/articleView.html?idxno=170858","https://platum.kr/archives/267901","https://www.aitimes.com/news/articleView.html?idxno=201211","https://thevc.kr/telepix"]},{"id":"c208","name":"센코","sector":"측정·분석·모니터링","subsector":"환경 IoT·센서","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"코스닥","desc":"전기화학 반응으로 가스를 감지하는 센서를 국내에서 처음 자체 개발·양산한 가스센서 전문기업이다. 센서와 이를 넣은 가스 감지기, 환경측정기 및 측정 시스템을 만들며, 산업현장의 유해가스 경보와 대기환경 측정에 쓰인다. 2004년 설립됐고 2020년 10월 코스닥에 상장했다.","tags":["가스센서","전기화학식","유해가스감지"],"conf":"확인","global":false,"url":"https://senko.co.kr","ext":[],"grounded":true,"src":["https://www.datanet.co.kr/news/articleView.html?idxno=152188","https://www.infostockdaily.co.kr/news/articleView.html?idxno=111402","https://www.viva100.com/20201029010006108?site_preference=normal","https://www.gasnews.com/news/articleView.html?idxno=93140"]},{"id":"c209","name":"에어콕","sector":"측정·분석·모니터링","subsector":"환경 IoT·센서","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"사물인터넷(IoT) 기술을 적용한 실내외 공기질 측정기 '스마트에어콕'을 개발·공급하는 기업이다. 미세먼지와 초미세먼지, 이산화탄소, 포름알데히드, 휘발성유기화합물, 소음 등 9가지 항목을 실시간으로 측정하며, LTE·와이파이·이더넷으로 데이터를 클라우드에 보내 원격 관리와 공기질 분석 보고서를 제공한다. 2018년 설립됐다.","tags":["공기질측정기","IoT","미세먼지"],"conf":"확인","global":false,"url":"https://smartaircok.com","ext":[],"grounded":true,"src":["https://www.energydaily.co.kr/news/articleView.html?idxno=110692","https://theleader.mt.co.kr/articleView.html?no=2020082519037887051","https://www.hkbs.co.kr/news/articleView.html?idxno=710269","https://thevc.kr/aircok"]},{"id":"c210","name":"에프티랩","sector":"측정·분석·모니터링","subsector":"환경 IoT·센서","type":"스타트업","scale":1,"founded":null,"hq":"경기","listed":"비상장","desc":"실내 공기 중 방사성 기체인 라돈을 실시간으로 재는 센서와 측정기를 만드는 기업이다. 2016년 고감도 실시간 라돈 센서 'RD200M'과 가정용 측정기 '라돈아이'를 내놓은 뒤 라돈아이 플러스, 라돈아이 알파 등으로 제품군을 넓혔다. 라돈아이 알파는 환경부 성능인증 1등급을 받았고, 라돈아이는 미국 라돈 전문가 프로그램(NRPP) 등록 장비 승인을 받았다.","tags":["라돈측정기","라돈센서","실내공기질"],"conf":"확인","global":false,"url":"https://ftlab.co.kr","ext":[],"grounded":true,"src":["https://zdnet.co.kr/view/?no=20170921100817","https://zdnet.co.kr/view/?no=20181118213205","https://zdnet.co.kr/view/?no=20190625084636","https://www.etnews.com/20230206000046"]},{"id":"c211","name":"케이웨더","sector":"측정·분석·모니터링","subsector":"환경 IoT·센서","type":"중소기업","scale":2,"founded":1997,"hq":"서울","listed":"코스닥","desc":"국내 최초의 민간 기상사업자로, 기상청이 보유한 기상데이터와 전국 실내외에 직접 설치한 3만여 개 IoT 공기측정기에서 모이는 실시간 데이터를 함께 분석해 위치별 날씨·공기질 정보를 제공한다. 국가 관측망이 약 530곳인 것과 달리 사람이 실제로 생활하는 공간을 촘촘히 관측하는 것이 특징이다. 공기질 측정기와 이를 연동한 실내 공기 관리 서비스를 아파트 등 신축 건물에 공급하며, 2024년 코스닥에 상장했다.","tags":["공기질측정","IoT","기상데이터","미세먼지"],"conf":"확인","global":false,"url":"https://www.kweather.co.kr","ext":[{"n":"LG유플러스","rel":"협력"}],"grounded":true,"src":["https://www.kweather.co.kr/sub/news/view.php?id=227&tp=3&c=3","https://magazine.hankyung.com/business/article/202402016324b","https://ceoscoredaily.com/page/view/2024020515570878055","https://www.kweather.co.kr/sub/news/view.php?id=224&page=5&tp=3&c=3"]},{"id":"c212","name":"APM엔지니어링","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"대기오염 물질의 농도를 자동으로 재는 측정장비를 공급하는 기업이다. PM10·PM2.5 미세먼지 질량농도 측정기와 입자 크기 분포 측정기, 입자계수기 등 입자상물질 분석기를 비롯해 대기가스분석기(AQMS), 가스상물질 분석기, VOCs(휘발성유기화합물) 온라인 분석기, 스마트 간이측정기까지 갖추고 있다. 도로와 공사현장의 비산먼지 감시, 미세먼지 배출사업장 부지경계 측정, 스마트시티 실시간 미세먼지 관측 등에 쓰인다.","tags":["AQMS","미세먼지측정기","대기측정장비"],"conf":"확인","global":false,"url":"https://www.apm.co.kr","ext":[],"grounded":true,"src":["https://www.apm.co.kr/sub2/sub1.php?ca_id=3010","https://www.apm.co.kr/sub2/sub1.php?ca_id=1020","https://www.apm.co.kr/sub2/sub1.php?ca_id=1010","https://www.apm.co.kr/sub2/sub1.php?ca_id=3020"]},{"id":"c213","name":"그린시스템","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"하수·폐수 처리시설과 정수장에서 내보내는 물의 오염도를 자동으로 재서 관제센터로 실시간 전송하는 수질 TMS(수질원격감시체계)를 전문으로 하는 기업이다. TOC(총유기탄소), 총질소(TN), 총인(TP), pH, 부유물질(SS) 측정기와 자동채수기, 자료수집기 같은 계측 장비를 공급한다. 시스템 제안과 설계, 시공, 시운전, 정도검사, 유지관리까지 전 과정을 맡는다.","tags":["수질TMS","수질계측"],"conf":"확인","global":false,"url":"https://www.g-system.co.kr","ext":[],"grounded":true,"src":["http://www.g-system.co.kr/bbs/content.php?co_id=business03","http://g-system.co.kr/bbs/content.php?co_id=product01","http://www.dreamforone.com/~gsystem4/bbs/content.php?co_id=business04","http://www.g-system.co.kr/"]},{"id":"c214","name":"동우옵트론","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"1989년 광학기기 사업으로 출발해 발전소와 소각로, 시멘트 공장, 선박 등 각종 플랜트 설비의 배기가스를 재는 가스분석기와 측정시스템을 개발·제조해 온 기업이다. 굴뚝이나 덕트에 센서를 직접 넣는 인시츄(In-Situ) 방식, 시료를 뽑아 분석하는 방식, 자외선 흡광차분광법(UV DOAS)을 써서 질소산화물(NOx)과 황산화물(SO2), 암모니아(NH3) 농도를 측정한다. 2007년에는 국내 기술로 배출가스 분석기(Flue Gas Analyzer) 개발에 성공했다.","tags":["가스분석기","광학계측","굴뚝측정"],"conf":"추정","global":false,"url":"https://www.optron.co.kr","ext":[],"grounded":true,"src":["https://www.todayenergy.kr/news/articleView.html?idxno=116891","https://www.electimes.com/news/articleView.html?idxno=219341","https://exhi.daara.co.kr/2015_komaf/bbs/sub31_view.html?idx=16524"]},{"id":"c215","name":"동일그린시스","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"환경 측정기기를 제조하고 환경 TMS(원격감시체계) 프로그램을 개발하는 서울 구로구 소재 기업이다. 공공기관과 사업장을 대상으로 대기·수질·굴뚝 TMS의 설치와 유지보수를 전문적으로 수행한다. 수질 TMS는 COD(화학적산소요구량), 총질소, 총인, pH, 부유물질 측정기와 자동채수기, 자료수집기로 구성되며, 회사는 측정기 제조부터 관제센터 구축과 통합 시스템 운영까지 함께 다룬다.","tags":["수질TMS","수질측정기","계측기"],"conf":"확인","global":false,"url":"http://edigs.co.kr","ext":[],"grounded":true,"src":["http://edigs.co.kr/new/korean/work/work02_3.htm","https://exhi.daara.co.kr/2015_komaf/bbs/sub31_view.html?idx=16557"]},{"id":"c216","name":"삼영에스앤씨","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"코스닥","desc":"경기 성남에 자리한 센서 전문 기업으로, 1993년 저항형 습도센서 개발을 시작으로 정전용량식 온습도센서와 먼지센서 등 실내공기질(IAQ) 관련 센서의 원천기술과 양산기술을 쌓아 왔다. 주력 제품은 칩 형태의 온습도센서와 상대습도센서, 미세먼지센서, 여러 항목을 한 번에 재는 공기질 통합 센서 노드와 트랜스미터다. 2021년 5월 코스닥 시장에 상장했다.","tags":["온습도센서","미세먼지센서","센서모듈"],"conf":"확인","global":false,"url":"https://www.samyoungsnc.com","ext":[],"grounded":true,"src":["http://www.mediasr.co.kr/news/articleView.html?idxno=68973","http://www.inews24.com/view/1368259","https://cache-www.inews24.com/view/wrlted/1364267","http://www.samyoungsnc.com/kr/sub/tech/tech.asp"]},{"id":"c217","name":"우리환경기술","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"환경 측정기 국산화를 목표로 30년 넘게 측정장비를 개발·생산해 온 기술 중심 기업이다. 굴뚝 배출가스의 오염물질 농도를 24시간 자동으로 재서 관제센터로 전송하는 대기 TMS(CEMS)와 수질 TMS 장비를 공급한다. 습기가 많고 부식성이 강한 배기가스 환경에서도 배관·덕트 속 유속과 유량을 재는 초음파 측정 시스템을 갖췄고, 전자기 유량계와 초음파·플로트식 유량계 같은 유량 계측기도 다룬다.","tags":["굴뚝TMS","측정장비"],"conf":"확인","global":false,"url":"https://www.wooritms.co.kr","ext":[],"grounded":true,"src":["http://www.wooritms.co.kr/products/?lang=en","http://www.wooritms.co.kr/products/cleansystms-cems/?lang=en","http://www.wooritms.co.kr/products/water-purity-tms/?lang=en","http://www.wooritms.co.kr/greeting/?lang=en"]},{"id":"c218","name":"정안하이테크","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"굴뚝 연속자동측정기기(TMS) 등 대기 배출가스 측정 시스템을 공급하는 계측 전문 업체다.","tags":["굴뚝TMS","배출가스측정","계측기"],"conf":"확인","global":false,"url":null,"ext":[]},{"id":"c219","name":"켄텍","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":"대전","listed":"비상장","desc":"대전 유성구에 자리한 환경 계측기 전문 기업으로, 20여 년간 쌓은 연구 기술을 바탕으로 대기오염과 실내공기질, 악취, 굴뚝 배출가스를 연속 자동으로 측정하는 기기와 부속품을 제조·판매한다. 초미세먼지 측정기, 대기·실내공기 자동측정기, 굴뚝 배출가스 및 악취 자동측정기를 국산화했고 다양한 가스분석기도 개발한다. 측정기기 제조와 함께 관련 소프트웨어·하드웨어 개발과 수출도 하고 있다.","tags":["굴뚝측정기","먼지측정기","대기계측"],"conf":"확인","global":false,"url":"https://www.kentek.co.kr","ext":[],"grounded":true,"src":["http://www.kentek.co.kr/contents/kr/company/overview.php","http://www.kentek.co.kr/bbs/content.php?co_id=company","https://renewableenergyfollowers.org/3752","http://kentek.co.kr/bbs/board.php?bo_table=product&wr_id=30&sca=%ED%9C%B4%EB%8C%80%EC%9A%A9"]},{"id":"c220","name":"파인텍(환경TMS)","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"사업장의 대기 TMS와 굴뚝 TMS를 설치·시공하고 유지보수하는 기업이다. 굴뚝 배출구에서 나오는 오염물질 농도를 연속 자동으로 측정해 한국환경공단 관제시스템(클린시스)으로 실시간 전송하는 굴뚝자동측정기기를 다룬다. 본사는 경기 수원 영통구에 있으며, 이름이 같은 코스닥 상장 디스플레이 장비사 파인텍과는 다른 회사다.","tags":["굴뚝TMS","대기측정"],"conf":"추정","global":false,"url":"https://finetechtms.co.kr","ext":[],"grounded":true,"src":["http://finetechtms.co.kr/","http://finetechtms.co.kr/bbs/board.php?bo_table=a2","https://cleansys.or.kr/"]},{"id":"c221","name":"호리바","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"해외 대표","scale":4,"founded":1945,"hq":"일본","listed":null,"desc":"일본 교토에서 유리전극식 pH 측정기로 출발한 계측·분석 장비 기업이다. 자동차 배기가스 측정 장비를 주력으로 대기·수질 측정기와 반도체·의료·과학용 분석 장비를 만들며, 차량에 직접 싣고 실제 주행 중 배출가스를 재는 장비도 공급한다. 국내에서는 호리바코리아가 배기가스·수질·반도체 계측 장비를 제조·판매한다.","tags":["가스분석기","배출가스","계측기","글로벌"],"conf":"확인","global":true,"url":"https://www.horiba.com","ext":[],"grounded":true,"src":["https://www.horiba.com/kr/automotive-test-systems/products/emission-measurement-systems/on-board-systems/","https://www.horiba.com/usa/process-and-environmental/parameters/gas-analyzers/","https://www.h2news.kr/news/articleView.html?idxno=12308"]},{"id":"c222","name":"휴마스","sector":"측정·분석·모니터링","subsector":"환경 계측기 제조","type":"중소기업","scale":2,"founded":null,"hq":"대전","listed":"비상장","desc":"대전 대덕연구단지에 자리한 수질 분석 전문 기업으로, 신소재·환경기술 분야 연구원과 전문가들이 2000년에 설립한 벤처기업이다. 약 80종의 수질분석키트를 비롯해 휴대용 탁도계, 총대장균군 검사키트, 현장용 탁도센서, 총질소·총인 및 TOC(총유기탄소) 온라인 측정기 등 수질 분석 장비를 개발해 왔다. 대표 제품인 휴대용 수질분석기 HS1500은 현장에서 이온과 영양염류, 중금속 등 최대 54개 항목을 잴 수 있다.","tags":["수질분석기","분석키트","국산화"],"conf":"확인","global":false,"url":"https://www.humas.co.kr","ext":[],"grounded":true,"src":["https://www.humas.co.kr/bbs/board.php?bo_table=kit","https://news.nate.com/view/20240607n22014","https://blog.yeogie.com/humas/infor?dv=pc","https://www.humas.co.kr/bbs/board.php?bo_table=lab_tms"]},{"id":"c223","name":"FITI시험연구원","sector":"측정·분석·모니터링","subsector":"환경 측정대행·분석","type":"공공·연구","scale":3,"founded":null,"hq":"서울","listed":null,"desc":"시험·검사·인증·검증 등 적합성평가를 수행하는 시험인증기관이다. 섬유·의류, 어린이제품, 신발 같은 소비재 분야와 함께 환경 분야 시험을 맡는다. 환경 분야에서는 대기·소음, 수질·먹는물, 토양·자원순환, 실내공기질, 환경측정기기 시험을 다루며, 대기·수질·악취 측정대행과 어린이활동공간·건축자재 시험인증 서비스도 제공한다.","tags":["측정대행","시험인증","수질분석","시험분석","토양오염조사","인증기관"],"conf":"확인","global":false,"url":"https://www.fiti.re.kr","ext":[],"grounded":true,"src":["https://www.fiti.re.kr/","https://www.fiti.re.kr/web/contents/FT0700000000.do?realQuery=%EC%8B%9C%ED%97%98%EC%9D%B8%EC%A6%9D"]},{"id":"c224","name":"에이치시티","sector":"측정·분석·모니터링","subsector":"환경 측정대행·분석","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"코스닥","desc":"전기·전자 제품이 각국 규제 기준을 충족하는지 확인하는 시험인증과, 계측기가 정확한 값을 내는지 검증하는 교정 서비스를 함께 제공한다. KC·FCC·CE 등 국내외 인증 시험을 수행하며 이동통신 기기 시험 분야에서 실적을 쌓아왔다. 2000년 현대전자에서 분사한 현대교정인증기술원으로 출발해 2007년 지금의 사명으로 바꿨고, 코스닥에 상장돼 있다.","tags":["시험인증","교정","측정서비스"],"conf":"확인","global":false,"url":"https://www.hct.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/에이치시티","https://www.hankyung.com/article/2024102718501","https://www.hct.co.kr/"]},{"id":"c225","name":"이엔아이","sector":"측정·분석·모니터링","subsector":"환경 측정대행·분석","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"사업장에서 나오는 대기·수질 등 환경오염물질을 채취해 분석하는 측정대행 업체다. 측정한 데이터를 모아 배출 허용 기준을 지키고 있는지 평가하고 관련 보고를 대행하며, 이를 바탕으로 한 환경 컨설팅과 기술 지원도 함께 맡는다. 충남 천안에 자리하고 있다.","tags":["측정대행","환경분석"],"conf":"추정","global":false,"url":"https://www.enikor.com","ext":[],"grounded":true,"src":["https://enikor.com/","https://enikor.com/sub/sub03_02.php","https://www.incruit.com/company/8050502/"]},{"id":"c226","name":"태성환경연구소","sector":"측정·분석·모니터링","subsector":"환경 측정대행·분석","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"생활 주변과 산업시설에서 발생하는 악취를 측정·분석하는 환경 분석 기업이다. 냄새의 종류와 세기를 실시간으로 감지하고 시료를 포집하는 모니터링 장비를 공단, 하수·폐기물 처리시설, 축산 농가 등에 설치해 웹·앱으로 악취 정보를 확인하도록 한다. 악취 원인 분석과 배출시설 저감 컨설팅, 탈취 제품 개발도 수행하며 악취 분야 국제공인시험기관(KOLAS)으로 인정받았다.","tags":["악취측정","악취모니터링","측정대행"],"conf":"확인","global":false,"url":"https://www.ts-ei.com","ext":[],"grounded":true,"src":["http://www.ts-ei.com/index.php?mid=m_odor_monitoring&m=0","http://www.ts-ei.com/odor_sampling","https://www.hankookilbo.com/News/Read/A2023090806390003533"]},{"id":"c227","name":"한국건설생활환경시험연구원","sector":"측정·분석·모니터링","subsector":"환경 측정대행·분석","type":"공공·연구","scale":3,"founded":null,"hq":"서울","listed":null,"desc":"2010년 한국건자재시험연구원과 한국생활환경시험연구원이 통합해 출범한 공인시험인증기관으로, 약칭은 KCL이다. 건설재료, 배터리, 모빌리티, 의료기기 등 폭넓은 분야를 다루며 환경 분야에서는 공기질, 물산업 및 수질, 토양오염도, 환경안전 관련 유해물질을 분석한다. 인천에 플라스틱 대체물질 지원센터를 두고 생분해도와 생태독성 평가, 생분해성 바이오플라스틱 인증도 수행한다.","tags":["시험인증","환경분석","KCL"],"conf":"확인","global":false,"url":"https://www.kcl.re.kr","ext":[],"grounded":true,"src":["https://www.kcl.re.kr/","https://ko.wikipedia.org/wiki/%ED%95%9C%EA%B5%AD%EA%B1%B4%EC%84%A4%EC%83%9D%ED%99%9C%ED%99%98%EA%B2%BD%EC%8B%9C%ED%97%98%EC%97%B0%EA%B5%AC%EC%9B%90"]},{"id":"c228","name":"로우카본","sector":"기후·에너지","subsector":"CCUS","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"이산화탄소를 붙잡아 두는 흡수제 KLC를 자체 개발해 발전소 등 배출원에 적용하는 탄소 포집·활용·저장(CCUS) 설비를 공급한다. 공기 중 이산화탄소를 직접 빨아들이는 ZeroC 설비도 사업화하고 있으며, 포집한 이산화탄소는 탄산칼슘·탄산나트륨으로 바꿔 보도블록 같은 자재로 재활용한다. 2025년에는 자발적 탄소시장에서 감축분을 거래하는 카본크레딧 플랫폼도 열었다.","tags":["CCUS","탄소포집","탄소크레딧"],"conf":"확인","global":false,"url":"https://www.lowcarbon.co.kr","ext":[],"grounded":true,"src":["https://www.epj.co.kr/news/articleView.html?idxno=34933","https://news.nate.com/view/20250228n17675","https://www.lowcarbon.co.kr/communication/newsroom/"]},{"id":"c229","name":"씨이텍","sector":"기후·에너지","subsector":"CCUS","type":"스타트업","scale":1,"founded":null,"hq":"대전","listed":"비상장","desc":"발전소나 공장에서 나오는 배기가스에 액체 흡수제를 접촉시켜 이산화탄소만 걸러내는 습식 탄소포집 기술을 사업화한 대전 소재 기업이다. 국가 CCUS 연구사업(Korea CCS 2020)의 성과인 CT-1 흡수제 기술을 보유했고, 미국 CAER의 0.7MW 규모 파일럿 포집 설비에서 성능을 검증했다. 중소벤처기업부 딥테크 팁스에 선정돼 선박에서 이산화탄소를 포집하는 기술도 개발하고 있다.","tags":["CCUS","흡수제","탄소포집","KAIST"],"conf":"확인","global":false,"url":"https://www.ce-tek.co.kr","ext":[],"grounded":true,"src":["https://www.startupn.kr/news/articleView.html?idxno=49133","https://www.venturesquare.net/946545","https://www.besuccess.com/","https://ce-tek.co.kr/"]},{"id":"c230","name":"에어레인","sector":"기후·에너지","subsector":"CCUS","type":"중소기업","scale":2,"founded":2001,"hq":"충북","listed":"비상장","desc":"머리카락 굵기의 가느다란 관(중공사) 수십만 가닥을 묶어 기체를 걸러내는 기체분리막을 개발·제조한다. 기체마다 막을 통과하는 속도가 다른 성질을 이용하는 방식으로, 바이오가스에 섞인 이산화탄소를 걸러 메탄 순도 97% 이상의 바이오메탄으로 만들거나 배기가스에서 이산화탄소를 포집하고 공기에서 질소를 뽑아내는 데 쓰인다. 2001년 설립됐다.","tags":["CCUS","기체분리막","바이오가스"],"conf":"확인","global":false,"url":"https://www.airrane.com","ext":[],"grounded":true,"src":["https://www.h2news.kr/news/articleView.html?idxno=11017","https://www.sedaily.com/article/14131441","https://core.asiae.co.kr/article/2024102113084148959"]},{"id":"c231","name":"지오에이치텍","sector":"기후·에너지","subsector":"CCUS","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"한국에너지기술연구원(KIER)이 개발한 습식 이산화탄소 포집 기술을 상용화하기 위해 세워진 기술창업 기업이다. 배기가스에서 이산화탄소를 흡수해 걸러내는 'KIERSOL' 계열 흡수제를 공급하고, 포집한 이산화탄소를 다시 활용하는 단계까지 아우르는 토탈 솔루션을 내세운다. 소형 흡수제 생산 시스템을 갖춰 제품 표준화와 상용화를 진행 중이며, 경기도 기후테크 육성 프로그램에 참여했다.","tags":["CCUS","탄소포집","솔루션"],"conf":"확인","global":false,"url":"https://geohtech.com","ext":[],"grounded":true,"src":["http://m.cbiz.kr/news/articleView.html?idxno=28895","https://kr.aving.net/news/articleView.html?idxno=1799172","https://gg-climatetechstartup.oopy.io/geohtech"]},{"id":"c232","name":"카본코","sector":"기후·에너지","subsector":"CCUS","type":"대기업","scale":4,"founded":2022,"hq":"서울","listed":"비상장","desc":"DL이앤씨가 설립한 탄소 포집·활용·저장(CCUS) 전문 자회사다. 발전소나 제철소처럼 이산화탄소를 많이 배출하는 시설의 배기가스에서 이산화탄소를 붙잡아내는 흡수제를 자체 개발했고, 탄소포집 설비를 설계·시공하는 사업을 한다. 회사는 자체 흡수제가 기존 상용 제품보다 포집에 드는 에너지 소비를 크게 줄였다고 밝혔다.","tags":["CCUS","탄소포집","플랜트","DL"],"conf":"확인","global":false,"url":"https://www.carbonco.co.kr","ext":[{"n":"DL이앤씨","rel":"계열"}],"grounded":true,"src":["https://www.mt.co.kr/estate/2025/04/22/2025042208515541473","https://www.sedaily.com/NewsView/2GRMD2QWK2","http://www.kmecnews.co.kr/news/articleView.html?idxno=27260"]},{"id":"c233","name":"클라임웍스","sector":"기후·에너지","subsector":"CCUS","type":"해외 대표","scale":4,"founded":2009,"hq":"스위스","listed":null,"desc":"대기 중 이산화탄소를 직접 걷어내는 직접공기포집(DAC) 설비를 운영하는 스위스 기업이다. 대형 팬으로 공기를 빨아들여 고체 필터에 이산화탄소만 붙잡은 뒤 떼어내는 방식을 쓴다. 아이슬란드에 오르카와 매머드 두 설비를 두고 있으며, 걷어낸 이산화탄소는 파트너사 카브픽스가 현무암 지층에 주입해 돌로 굳혀 가둔다.","tags":["DAC","탄소제거","CCUS"],"conf":"확인","global":true,"url":"https://climeworks.com","ext":[],"grounded":true,"src":["https://climeworks.com/plant-mammoth","https://climeworks.com/press-release/climeworks-switches-on-worlds-largest-direct-air-capture-plant-mammoth","https://www.cnn.com/2024/05/08/climate/direct-air-capture-plant-iceland-climate-intl/"]},{"id":"c234","name":"스탠다드에너지","sector":"기후·에너지","subsector":"ESS·배터리","type":"스타트업","scale":1,"founded":2013,"hq":"대전","listed":"비상장","desc":"불이 붙을 위험이 낮은 바나듐이온배터리(VIB)를 개발한 대전 소재 에너지저장장치(ESS) 기업이다. ESS는 전기를 모아뒀다가 필요할 때 꺼내 쓰는 설비인데, 그동안 화재 우려 때문에 사람이 많은 공간에 두기 어려웠다. 이 회사는 안전성을 근거로 대전 도시철도 1호선 구암역에 VIB 기반 ESS를 설치해 실증 운영했고, MWh급 양산 설비 구축을 추진하고 있다.","tags":["ESS","바나듐이온배터리","화재안전"],"conf":"확인","global":false,"url":"https://stndenergy.com","ext":[],"grounded":true,"src":["https://www.industrynews.co.kr/news/articleView.html?idxno=55483","https://zdnet.co.kr/view/?no=20260624190804","https://www.getnews.co.kr/news/articleView.html?idxno=856177"]},{"id":"c235","name":"두산퓨얼셀","sector":"기후·에너지","subsector":"수소·연료전지","type":"대기업","scale":4,"founded":2019,"hq":"전북","listed":"코스피","desc":"2019년 두산의 연료전지 사업 부문이 분할돼 설립된 회사로 전북 익산에 생산 공장을 두고 있다. 주력 제품은 인산형 연료전지(PAFC)로, 수소와 산소의 화학반응을 이용해 전기를 만드는 발전 설비다. 발전사에 설비를 공급하고 장기 유지보수 서비스와 기술 지원을 함께 제공하며, 고체산화물 연료전지(S
