ww.hlmando.com/ko/sustainability/sustainable-management.do","ext":[],"grounded":true,"src":["https://www.hlmando.com/ko/sustainability/sustainable-management.do","https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno=20240619000521","https://www.hansbiz.co.kr/news/articleView.html?idxno=649380"]},{"id":"c370","name":"금호타이어","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":1960,"hq":"광주","listed":"코스피","desc":"타이어를 만드는 기업으로, 탄소중립 로드맵과 환경 성과를 담은 지속가능경영보고서를 매년 발간한다. 공장에서 쓰는 전력의 재생에너지 비율을 높이고, 원료 채취부터 폐기까지 제품이 환경에 미치는 영향을 따지는 전과정평가(LCA)의 적용 범위를 넓히고 있다. 재생·바이오 원료 사용을 확인해 주는 국제 인증 ISCC PLUS를 취득했고, 지속가능한 재료를 90%까지 적용한 타이어를 개발했다.","tags":["탄소감축","재생에너지 전환","환경경영","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.kumhotire.com","ext":[],"grounded":true,"src":["https://biz.heraldcorp.com/article/10803214","https://www.smedaily.co.kr/news/articleView.html?idxno=330657","https://www.newswire.co.kr/newsRead.php?no=1038254&sourceType=rss"]},{"id":"c362","name":"기아","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":1944,"hq":"서울","listed":"코스피","desc":"완성차를 만드는 현대자동차그룹 계열사로, 2021년 2045년 탄소중립 달성을 선언하고 이듬해 사용 전력을 100% 재생에너지로 바꾸는 국제 캠페인 RE100에 가입했다. 공급·생산·물류·사용·폐기까지 차량의 전 과정에서 나오는 온실가스를 줄여 2045년까지 2019년 대비 97% 감축하고 나머지는 상쇄한다는 목표를 세웠다. 사업장은 환경경영시스템(ISO 14001) 인증을 유지하며, 매년 지속가능경영보고서로 환경경영 성과를 공개한다.","tags":["환경경영","기후변화 대응","전과정평가(LCA)","순환경제","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://worldwide.kia.com/kr/company/sustainability/sustainability-report","ext":[],"grounded":true,"src":["https://worldwide.kia.com/kr/company/sustainability/sustainability-report","https://worldwide.kia.com/kr/company/sustainability/eco/climate-change","https://www.hyundaimotorgroup.com/ko/news/kia-sustainability-report-move","https://www.kfenews.co.kr/news/articleView.html?idxno=606551"]},{"id":"c371","name":"넥센타이어","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":null,"hq":null,"listed":"코스피","desc":"타이어를 만드는 기업으로, ESG 성과를 담은 지속가능경영보고서를 발간하며 온실가스 산정 범위를 직접 배출부터 협력사·물류 등 외부 밸류체인 배출(Scope 3) 15개 항목까지 넓히고 외부 검증을 받았다. 재생·재활용 원재료를 새로 발굴해 지속가능한 원료를 최대 70%까지 적용하는 제조 기술을 개발했다. 창녕 공장 인근 멸종위기종 서식지와 보호지역을 조사하는 등 자연 생태계에 미치는 영향도 점검하고 있다.","tags":["ESG 공시","환경경영","온실가스 관리","친환경 제품 개발","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.nexentire.com/kr/sustainability/environment/","ext":[],"grounded":true,"src":["https://www.ebn.co.kr/news/articleView.html?idxno=1666648","https://news.tf.co.kr/read/economy/2214857.htm","https://www.nexentire.com/kr/sustainability/framework/","https://www.ajunews.com/view/20250616083340428"]},{"id":"c369","name":"한국타이어앤테크놀로지","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":1941,"hq":"경기","listed":"코스피","desc":"타이어를 만드는 기업으로, 매년 ESG 보고서를 발간하며 유럽 지속가능성 보고지침(CSRD)과 산림전용방지규정(EUDR) 등 강화되는 EU 환경규제에 맞춰 관리 체계를 다듬고 있다. 2023년에는 감축 목표의 과학적 타당성을 검증하는 국제 이니셔티브 SBTi로부터 2030년 단기 감축 목표와 2050년 넷제로 목표를 승인받아 탄소중립 로드맵을 구축했다. 기업의 탄소 정보 공개 수준을 평가하는 CDP 기후변화 대응 부문에서 최고 등급인 리더십 A등급을 받았다.","tags":["탄소중립","CDP 대응","환경규제 대응","온실가스 인벤토리","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.hankooktire.com","ext":[],"grounded":true,"src":["https://biz.heraldcorp.com/article/10801668","https://www.hankooktire.com/global/ko/company/media-list/media-detail.631101.html","https://www.ccnnews.co.kr/news/articleView.html?idxno=411819","https://www.insightkorea.co.kr/news/articleView.html?idxno=220164"]},{"id":"c364","name":"한온시스템","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":1986,"hq":"대전","listed":"코스피","desc":"자동차의 냉난방 등 열에너지를 관리하는 부품·솔루션을 만드는 한국앤컴퍼니그룹 계열사다. 2018년부터 매년 지속가능경영보고서를 발간하며 2040년 탄소중립, 2050년 넷제로 달성을 목표로 제시했다. 2030년까지 2019년 대비 사업장에서 직접 나오는 배출(Scope 1)과 전기 사용에 따른 간접 배출(Scope 2)을 각각 50%, 공급망 배출(Scope 3)을 55% 줄일 계획이다.","tags":["탄소중립","온실가스 관리","에너지 관리","환경안전(EHS)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.hanonsystems.com","ext":[],"grounded":true,"src":["https://www.hanonsystems.com/kr","https://biz.heraldcorp.com/article/10793099","https://www.hankookandcompany.com/ko/media/news/article-2456.do","https://www.autoracing.co.kr/news/articleView.html?idxno=48735"]},{"id":"c366","name":"현대글로비스","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":2001,"hq":"서울","listed":"코스피","desc":"현대차그룹의 물류 계열사로 완성차를 배와 육상으로 실어 나르는 일을 한다. 자동차운반선(PCTC) 선대를 운영해 현대차·기아뿐 아니라 다른 완성차 브랜드 물량도 취급하며, 중고차 수출과 배터리 재활용 등 비자동차 사업으로도 영역을 넓히고 있다. 2045년 탄소중립을 선언하고 물류 부문 온실가스를 관리하며 지속가능경영보고서를 발간한다.","tags":["탄소중립","온실가스 인벤토리","CDP 대응","친환경 물류","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.glovis.net","ext":[],"grounded":true,"src":["https://biz.heraldcorp.com/article/10732644","https://www.fnnews.com/news/202604290834009219","https://www.hyundaimotorgroup.com/ko/news/CONT0000000000155697"]},{"id":"c363","name":"현대모비스","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":1977,"hq":"서울","listed":"코스피","desc":"현대차그룹의 자동차 부품 계열사로 섀시·칵핏·프론트엔드 등 여러 부품을 하나로 묶은 모듈과 전동화·램프·전장 부품을 만든다. 국내외에서 운행 중인 현대차·기아 차량의 A/S 부품 공급도 맡고 있다. 환경경영 전담 체계를 운영하며 온실가스·에너지 관리 성과를 담은 지속가능성보고서를 매년 발간한다.","tags":["환경경영","온실가스 관리","에너지 관리","공급망 ESG","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.mobis.com/kr/sustain/enviro_info.do","ext":[],"grounded":true,"src":["https://www.mobis.com/kr/aboutus/aboutus.do","https://www.hyundaimotorgroup.com/ko/group/CONT0000000000000670","https://www.edaily.co.kr/News/Read?newsId=03542406638925984&mediaCodeNo=257"]},{"id":"c367","name":"현대위아","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":1976,"hq":"경남","listed":"코스피","desc":"경남 창원에 생산 거점을 둔 현대차그룹 계열사다. 공작기계 제조로 출발했지만 공작기계 사업부는 별도 회사로 분할됐고, 지금은 자동차 엔진과 사륜구동(4WD) 부품 등 차량 부품이 주력이다. 안전환경경영 체계와 환경경영 혁신과제를 운영하며 2045년 탄소중립 목표를 담은 지속가능성보고서를 매년 발간한다.","tags":["안전환경경영","탄소중립","온실가스 관리","환경안전(EHS)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.hyundai-wia.com/sustainability/environment_management.asp","ext":[],"grounded":true,"src":["https://www.knnews.co.kr/news/articleView.php?idxno=1462194","https://dealsite.co.kr/articles/145962","https://changwon.grandculture.net/changwon/index/GC02201175"]},{"id":"c361","name":"현대자동차","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":1967,"hq":"서울","listed":"코스피","desc":"1967년 설립된 현대차그룹의 핵심 계열사로 승용차와 상용차를 만든다. 전기차 브랜드 아이오닉과 함께 수소연료전지차 넥쏘를 내놓으며 수소차를 양산하는 세계에서 몇 안 되는 업체 중 하나다. 2045년 탄소중립을 목표로 국내외 공장의 재생에너지 100% 전환(RE100)과 자원순환을 추진하며 매년 지속가능성보고서를 발간한다.","tags":["탄소중립","RE100","온실가스 인벤토리","순환경제","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.hyundai.com/kr/ko/sustain-manage/manage-report","ext":[],"grounded":true,"src":["https://www.evolog.in/hyundai-motor-company-history","https://ko.wikipedia.org/wiki/현대자동차","https://namu.wiki/w/현대자동차"]},{"id":"c368","name":"현대트랜시스","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":2019,"hq":null,"listed":"비상장","desc":"2019년 현대다이모스가 현대파워텍을 흡수 합병하며 출범한 현대차그룹의 부품 계열사다. 자동변속기·수동변속기·듀얼클러치변속기(DCT)·무단변속기까지 변속기 전 라인업과 자동차 시트를 만든다. ESG 홈페이지에 환경 성과를 공개하고 파워트레인·시트 사업장의 온실가스 관리를 담은 지속가능경영보고서를 발간한다.","tags":["온실가스 관리","환경경영","에너지 관리","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.hyundai-transys.com/ko/esg/sustainability/report.do","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/현대트랜시스","https://www.sedaily.com/article/12172707","https://www.hankookilbo.com/News/Read/A2024040215120000319"]},{"id":"c356","name":"DB하이텍","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1997,"hq":null,"listed":"코스피","desc":"다른 회사가 설계한 반도체를 대신 생산해 주는 파운드리 기업이다. 2001년 파운드리 사업에 뛰어들어 최첨단 미세공정 대신 8인치 웨이퍼 기반의 아날로그·혼합신호 반도체에 집중해 왔고, 전력을 조절하는 전력관리반도체(PMIC)와 이미지센서가 주력이다. 환경경영 체계를 운영하며 공정의 온실가스·화학물질 관리 내용을 담은 ESG경영보고서를 발간한다.","tags":["환경경영","온실가스 관리","화학물질 관리","ESG 보고서"],"conf":"확인","global":false,"url":"https://dbhitek.com/kr/sustainability/environment/environment-management","ext":[],"grounded":true,"src":["https://www.asiae.co.kr/article/2022051209504724393","https://m.joseilbo.com/news/view.htm?newsid=571276","https://www.fnnews.com/news/202201231837592448"]},{"id":"c351","name":"LG디스플레이","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"TV와 스마트폰 등에 들어가는 디스플레이 패널을 만드는 LG그룹 계열사로 파주와 구미에 생산 거점을 두고 있다. 수익성이 낮은 LCD 비중을 줄이고 OLED 중심으로 사업 구조를 재편하는 중이다. 생산 공정의 온실가스·물·폐기물 관리를 담당하는 환경경영 체계를 운영하며 ESG 보고서를 홈페이지에 공개한다.","tags":["온실가스 관리","수자원 관리","폐기물 관리","환경경영","ESG 보고서"],"conf":"확인","global":false,"url":"https://www.lgdisplay.com/kor/esg/csm/csm-report","ext":[],"grounded":true,"src":["https://news.lgdisplay.com/2022/05/oled-생산의-메카-lg디스플레이-파주-사업장을-소개합니","https://dealsite.co.kr/articles/152876","https://www.etnews.com/20230412000196"]},{"id":"c354","name":"LG이노텍","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1970,"hq":"서울","listed":"코스피","desc":"1970년 세워진 금성알프스전자를 모태로 하는 LG그룹의 부품 계열사다. 스마트폰 카메라모듈 같은 광학솔루션과 반도체 기판 소재, 차량용 전장부품, LED를 만든다. 2030년 재생에너지 100% 사용(RE100)과 2040년 탄소중립을 목표로 세우고 재생에너지 전환율 등 성과를 담은 지속가능성보고서를 매년 발간한다.","tags":["RE100","탄소중립","재생에너지 전환","온실가스 인벤토리","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.lginnotek.com","ext":[],"grounded":true,"src":["https://www.evolog.in/lg-innotek-history","https://ko.wikipedia.org/wiki/LG이노텍","https://www.lginnotek.com/product/intro.do"]},{"id":"c360","name":"LX세미콘","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1999,"hq":"대전","listed":"코스닥","desc":"1999년 대전에서 실리콘웍스라는 이름으로 출발해 2021년 LX그룹 계열사로 편입되며 사명을 바꾼 반도체 설계 전문(팹리스) 기업이다. 화면의 각 화소에 전압을 공급해 색과 밝기를 조절하는 디스플레이 구동칩(DDI)이 주력이고, 차량용 방열기판과 마이크로컨트롤러(MCU)로 사업을 넓히고 있다. 2050년 탄소중립 로드맵을 담은 지속가능경영보고서를 발간한다.","tags":["탄소중립","유해물질 관리","자원 관리","온실가스 감축","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://esg.lxsemicon.com","ext":[],"grounded":true,"src":["https://namu.wiki/w/LX세미콘","https://www.bloter.net/news/articleView.html?idxno=616094","https://www.sedaily.com/article/20037973"]},{"id":"c357","name":"SK실트론","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1983,"hq":"경북","listed":"비상장","desc":"반도체칩의 기초 소재인 실리콘 웨이퍼를 만드는 SK그룹 계열사로 경북 구미에 생산 공장을 두고 있다. 200mm·300mm 웨이퍼를 메모리·비메모리 반도체 제조사에 공급하며, 2020년 미국 듀폰의 SiC(실리콘카바이드) 사업부를 인수해 전기차용 소재로 영역을 넓혔다. 2040년 넷제로를 선언하고 온실가스·에너지 관리 성과를 담은 지속가능경영보고서를 매년 발간한다.","tags":["넷제로","온실가스 인벤토리","에너지 관리","Scope 3 관리","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.sksiltron.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/SK실트론","https://www.thelec.kr/news/articleView.html?idxno=17337","https://www.imaeil.com/page/view/2025121811391921933"]},{"id":"c350","name":"SK하이닉스","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1983,"hq":"경기","listed":"코스피","desc":"SK그룹 계열의 메모리 반도체 기업으로 경기 이천에 본사를 두고 D램과 낸드플래시를 생산하며, 이미지센서 같은 시스템반도체도 함께 만든다. 국내 대기업 중 처음으로 RE100(쓰는 전기를 100% 재생에너지로 조달하는 캠페인)에 가입했고, 반도체 공정에서 나오는 온실가스 감축과 공정용수 재이용을 추진하며 매년 지속가능경영보고서를 발간한다.","tags":["RE100","온실가스 감축","용수 재이용","환경안전(EHS)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.skhynix.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/SK하이닉스","https://namu.wiki/w/SK하이닉스","https://encykorea.aks.ac.kr/Article/E0068558"]},{"id":"c352","name":"삼성디스플레이","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":2012,"hq":"충남","listed":"비상장","desc":"스마트폰·태블릿·노트북·TV에 들어가는 화면 패널을 개발·생산하는 삼성 계열사로, 충남 아산 탕정에 본사와 주요 생산라인을 두고 OLED와 LCD를 만든다. 2012년 삼성의 OLED와 LCD 사업이 합쳐지며 지금의 회사가 됐다. 지속가능경영 전략 아래 사업장 온실가스 감축과 수자원·폐기물 관리를 수행하며 지속가능경영보고서를 발간한다.","tags":["온실가스 감축","수자원 관리","환경안전(EHS)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.samsungdisplay.com/kor/sustainability/sustainability-management.jsp","ext":[],"grounded":true,"src":["https://www.samsungdisplay.com/kor/intro/company-overview.jsp","https://news.samsungdisplay.com/144","https://news.samsungdisplay.com/153"]},{"id":"c353","name":"삼성전기","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1973,"hq":"경기","listed":"코스피","desc":"전기를 잠깐 담아뒀다 내보내며 전류를 고르게 해주는 부품인 적층세라믹콘덴서(MLCC)와 스마트폰·자동차용 카메라 모듈, 반도체를 기판에 얹는 패키지 기판을 만드는 삼성 계열 부품사다. 기후변화 대응과 자원순환을 다루는 지속가능경영 체계를 운영하고 홈페이지에 지속가능경영보고서를 공개한다.","tags":["기후변화 대응","온실가스 관리","순환경제","환경경영","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.samsungsem.com/kr/about-us/sustainability/report.do","ext":[],"grounded":true,"src":["https://m.samsungsem.com/kr/product/passive-component/mlcc.do","https://m.thebell.co.kr/m/newsview.asp?svccode=&newskey=202304161425308200103566","https://www.etnews.com/20260318000167"]},{"id":"c349","name":"삼성전자","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1969,"hq":"경기","listed":"코스피","desc":"메모리·파운드리 등 반도체를 맡는 DS부문과 스마트폰·TV·가전 완제품을 맡는 DX부문으로 나뉘어 운영되는 종합 전자기업이다. 반도체·가전 생산 공정의 온실가스·용수·폐기물 관리와 재생에너지 전환을 다루는 환경경영 체계를 운영하며 매년 지속가능경영보고서를 발간한다.","tags":["온실가스 인벤토리","환경안전(EHS)","수자원 관리","지속가능경영보고서","재생에너지 전환"],"conf":"확인","global":false,"url":"https://www.samsung.com/sec/sustainability/main/","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/삼성전자","https://news.samsungsemiconductor.com/kr/어바웃-ds-삼성전자-ds부문-사업-개요/","https://namu.wiki/w/삼성전자/사업"]},{"id":"c359","name":"세메스","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":null,"hq":"충남","listed":"비상장","desc":"삼성전자 자회사로 반도체를 만들 때 쓰는 세정·식각·포토 등 전공정 장비와 테스트·패키지 후공정 장비, 디스플레이 장비, 공장 내 물류자동화 설비를 생산한다. 1993년 한국디앤에스로 출발해 2005년 지금의 이름으로 바꿨고 충남 천안에 사업장을 두고 있다. 환경·안전경영 체계를 별도로 운영하며 사업장의 환경·안전 관리 방침을 공개한다.","tags":["환경안전(EHS)","환경경영","협력사 ESG","공급망 ESG"],"conf":"확인","global":false,"url":"https://www.semes.com/ko/substainbility/environmental-safety-management/view","ext":[],"grounded":true,"src":["https://www.semes.com/ko/company/corporate-overview","https://ko.wikipedia.org/wiki/세메스","https://namu.wiki/w/세메스"]},{"id":"c358","name":"원익IPS","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":null,"hq":"경기","listed":"코스닥","desc":"반도체와 디스플레이를 만들 때 웨이퍼 표면에 얇은 막을 입히는 증착(CVD) 장비와 필요 없는 부분을 깎아내는 식각 장비, 특수가스 공급 장치를 공급하는 원익그룹 계열사다. 2016년 원익홀딩스에서 인적분할해 코스닥에 상장했다. 홈페이지에 환경 부문 ESG 정보를 공개하며 장비 제조 과정의 환경경영 활동을 관리한다.","tags":["환경경영","온실가스 관리","ESG 공시","환경안전(EHS)"],"conf":"확인","global":false,"url":"https://www.ips.co.kr/ko/esg/environment.php","ext":[],"grounded":true,"src":["https://www.ips.co.kr/ko/business/intro.php","https://namu.wiki/w/원익IPS"]},{"id":"c355","name":"한미반도체","sector":"대기업 환경·ESG 조직","subsector":"전자·반도체","type":"대기업 환경조직","scale":4,"founded":1980,"hq":"인천","listed":"코스피","desc":"인천 본사에서 반도체 뒷공정에 쓰이는 장비를 만드는 회사로, 칩을 잘라내는 마이크로쏘와 절단·검사·선별을 한 장비에서 처리하는 비전플레이스먼트를 공급한다. D램을 여러 층으로 쌓아 만드는 고대역폭메모리(HBM)의 칩 접합에 쓰이는 TC본더도 주력 제품이다. 홈페이지 ESG 항목에 환경경영 방침을 두고 제조 과정의 환경·품질 관리 체계를 공개한다.","tags":["환경경영","환경안전(EHS)","유해물질 관리","ESG 공시"],"conf":"확인","global":false,"url":"https://www.hanmisemi.com/","ext":[],"grounded":true,"src":["https://www.fnnews.com/news/202312110547117325","https://www.etnews.com/20240516000250","https://www.thelec.kr/news/articleView.html?idxno=50886"]},{"id":"c387","name":"HD한국조선해양","sector":"대기업 환경·ESG 조직","subsector":"철강·중공업·조선","type":"대기업 환경조직","scale":4,"founded":null,"hq":"경기","listed":"코스피","desc":"2019년 출범한 HD현대그룹 조선해양 부문의 중간지주회사로, HD현대중공업과 HD현대삼호 등 조선·엔진 계열사를 두고 그룹 조선해양 사업의 성장 전략과 연구개발 방향을 총괄한다. 탄소중립 실증설비를 구축해 친환경 선박 기술을 검증하고, HD현대 그룹 통합 ESG 사이트와 ESG 보고서를 통해 기후행동 성과를 공시한다.","tags":["탄소중립","친환경 선박","기후행동","지속가능경영보고서","온실가스 감축"],"conf":"확인","global":false,"url":"https://esg.hd.com/ko/main","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/HD한국조선해양","https://www.hd-ksoe.com/kr/brand-story/group/contents","https://namu.wiki/w/HD한국조선해양"]},{"id":"c388","name":"HD현대중공업","sector":"대기업 환경·ESG 조직","subsector":"철강·중공업·조선","type":"대기업 환경조직","scale":4,"founded":null,"hq":"울산","listed":"코스피","desc":"울산 동구에 대형 조선소를 둔 HD현대그룹의 조선 계열사로, 상선과 해양설비를 건조하고 선박용 대형 엔진과 자체 개발한 중형 '힘센엔진'을 만든다. 암모니아처럼 연소할 때 탄소가 나오지 않는 연료를 쓰는 선박 엔진 개발도 진행 중이다. 조선소 사업장 온실가스 감축을 추진하며 HD현대 그룹 ESG 보고서를 통해 환경 성과를 공개한다.","tags":["친환경 선박","탄소중립","환경안전(EHS)","온실가스 감축","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://esg.hd.com/ko/environmental/climate-action","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/HD현대중공업","https://www.hankyung.com/article/2025052542811","https://www.hhi.co.kr/Division/biz07"]},{"id":"c386","name":"동국제강","sector":"대기업 환경·ESG 조직","subsector":"철강·중공업·조선","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"고철을 전기로에 녹여 철강을 만드는 전기로 제강사로, 철근과 형강, 후판 등을 생산하며 인천·포항·당진 등에 공장을 두고 있다. 인적분할을 거쳐 지주회사 동국홀딩스 아래에서 철강 사업을 맡는 법인으로 재편됐다. 동국씨엠과 함께 그룹 지속가능경영보고서를 매년 발간해 탄소 감축 실적과 환경 인증 취득 등 ESG 성과를 공개한다.","tags":["탄소중립","전기로 제강","온실가스 감축","지속가능경영보고서","환경경영시스템"],"conf":"확인","global":false,"url":"https://www.dongkuksteel.com","ext":[],"grounded":true,"src":["https://www.snmnews.com/news/articleView.html?idxno=509502","https://www.ferrotimes.com/news/articleView.html?idxno=23817","https://namu.wiki/w/동국제강"]},{"id":"c391","name":"두산밥캣","sector":"대기업 환경·ESG 조직","subsector":"철강·중공업·조선","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"두산그룹 계열의 소형 건설장비 기업으로, 스키드스티어 로더와 미니 굴착기 등 좁은 공간에서 쓰는 장비를 설계·제조·판매한다. 건설 현장은 물론 농업, 조경·지면 관리, 광산 등에서 쓰인다. 배터리로 움직이는 전동식 소형 로더도 내놓았고, 온실가스 감축 실적을 담은 지속가능경영보고서를 매년 발간한다.","tags":["온실가스 인벤토리","지속가능경영보고서","환경경영시스템","탄소중립","에너지 효율"],"conf":"확인","global":false,"url":"https://www.doosanbobcat.com/kr/management/esg_report","ext":[],"grounded":true,"src":["https://www.doosanbobcat.com/kr","https://www.doosanbobcat.com/kr/products/compact/item_01","https://www.doosanbobcat.com/kr/products/compact/item_02","https://ko.wikipedia.org/wiki/%EB%B0%A5%EC%BA%A3_%EC%BB%B4%ED%8D%BC%EB%8B%88"]},{"id":"c390","name":"삼성중공업","sector":"대기업 환경·ESG 조직","subsector":"철강·중공업·조선","type":"대기업 환경조직","scale":4,"founded":1974,"hq":null,"listed":"코스피","desc":"1974년 설립된 삼성그룹 계열 조선사로, 컨테이너선과 LNG(액화천연가스) 운반선 같은 상선부터 원유 시추선·해양 생산설비까지 건조한다. LNG 운반선은 천연가스를 영하 160도 수준으로 얼려 액체 상태로 실어 나르는 특수 선박이다. 조선·해양 사업장의 환경·안전 관리와 온실가스 감축을 추진하며 지속가능경영보고서를 매년 발간한다.","tags":["지속가능경영보고서","온실가스 감축","환경안전(EHS)","탄소중립","친환경 선박"],"conf":"확인","global":false,"url":"https://www.samsungshi.com","ext":[],"grounded":true,"src":["https://en.wikipedia.org/wiki/Samsung_Heavy_Industries","https://en.wikipedia.org/wiki/LNG_carrier"]},{"id":"c392","name":"세아제강지주","sector":"대기업 환경·ESG 조직","subsector":"철강·중공업·조선","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"세아그룹의 강관 사업을 이끄는 지주회사로, 서울에 본사를 두고 코스피에 상장돼 있다. 강관은 속이 빈 강철 관으로 배관, 건설 구조물, 에너지 설비 등에 쓰인다. 그룹 차원의 지속가능경영보고서를 발간해 강관 생산 과정의 온실가스 배출 관리와 ESG 경영 체계를 공개한다.","tags":["지속가능경영보고서","온실가스 인벤토리","탄소중립","환경경영시스템","공급망 ESG"],"conf":"확인","global":false,"url":"https://www.seah.co.kr","ext":[],"grounded":true,"src":["https://en.wikipedia.org/wiki/SeAh_Steel_Holdings","https://en.wikipedia.org/wiki/Seah_Holdings"]},{"id":"c389","name":"한화오션","sector":"대기업 환경·ESG 조직","subsector":"철강·중공업·조선","type":"대기업 환경조직","scale":4,"founded":null,"hq":"경남","listed":"코스피","desc":"2023년 한화그룹이 대우조선해양을 인수하면서 사명을 바꾼 조선·해양 기업으로, 경남 거제에 대형 조선소를 두고 선박과 해양 설비를 건조한다. 인수 이후 설비 투자를 이어 오고 있다. 탄소중립·안전경영·기업윤리를 축으로 한 'ESG 2030 목표'를 세우고 환경경영시스템과 ESG 전용 공시 채널을 운영한다.","tags":["탄소중립","환경경영시스템","환경안전(EHS)","ESG 목표관리","친환경 선박"],"conf":"확인","global":false,"url":"https://esg.hanwhaocean.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%ED%95%9C%ED%99%94%EC%98%A4%EC%85%98","https://www.hanwha.co.kr/newsroom/media_center/news/news_view.do?seq=8115","https://www.fnnews.com/news/202605141521312807"]},{"id":"c413","name":"KT","sector":"대기업 환경·ESG 조직","subsector":"통신·IT·플랫폼","type":"대기업 환경조직","scale":4,"founded":1981,"hq":"경기","listed":"코스피","desc":"통신·IT 기업으로 매년 통합보고서를 발간해 환경 성과를 공개한다. 2050년 탄소중립을 목표로 2021년 온실가스 배출량 대비 2030년 51.7%, 2040년 75.8% 감축이라는 중간 목표를 세웠다. 전기를 많이 쓰는 데이터센터는 전력사용효율(PUE, 1에 가까울수록 전력을 덜 낭비한다는 지표)을 관리하는 방식으로 넷제로를 추진한다.","tags":["데이터센터 에너지","온실가스 감축","통합보고서","에너지 효율","탄소중립"],"conf":"확인","global":false,"url":"https://corp.kt.com/html/sustain/possibility/reports.html","ext":[],"grounded":true,"src":["https://corp.kt.com/html/sustain/possibility/reports.html","https://corp.kt.com/html/sustain/environmental/environmental.html","https://enterprise.kt.com/bt/dxstory/1815.do"]},{"id":"c418","name":"LG CNS","sector":"대기업 환경·ESG 조직","subsector":"통신·IT·플랫폼","type":"대기업 환경조직","scale":4,"founded":1987,"hq":"서울","listed":"코스피","desc":"1987년 설립된 LG그룹 계열 IT 서비스 기업으로, 기업 정보시스템을 구축·운영하는 시스템통합(SI)과 클라우드 전환, 인공지능 서비스를 주로 한다. LG 계열사를 비롯한 기업 시스템을 클라우드 기반으로 옮기는 사업을 추진하고 데이터센터도 직접 운영한다. 지속가능경영보고서를 발간하며 데이터센터 에너지 효율화 등 환경경영 과제를 관리한다.","tags":["지속가능경영보고서","데이터센터 에너지","환경경영시스템","온실가스 감축","에너지 효율"],"conf":"확인","global":false,"url":"https://connect.lgcns.com","ext":[],"grounded":true,"src":["https://en.wikipedia.org/wiki/LG_CNS","https://www.lgcns.com/kr/service/modern-it-infra-on-cloud/infrastructure","https://www.lg.co.kr/media/release/23310"]},{"id":"c414","name":"LG유플러스","sector":"대기업 환경·ESG 조직","subsector":"통신·IT·플랫폼","type":"대기업 환경조직","scale":4,"founded":1996,"hq":"서울","listed":"코스피","desc":"1996년 출범한 LG텔레콤을 뿌리로, 2010년 LG데이콤·LG파워콤과 합쳐져 지금의 모습이 된 LG그룹 계열 유무선 통신사다. 개인 대상 이동통신·인터넷·IPTV와 기업 대상 통신·보안·클라우드 서비스를 함께 제공한다. '2025 지속가능경영보고서'를 발간하고 통신 인프라와 데이터센터의 에너지 효율 개선, 탄소 감축 목표를 관리한다.","tags":["지속가능경영보고서","데이터센터 에너지","온실가스 감축","탄소중립","ESG 경영체계"],"conf":"확인","global":false,"url":"https://www.lguplus.com/about/ko/sustainability/management-report","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/LG_U%2B","https://www.lguplus.com/biz/all/telecom/internet-cctv/officenet/B000000005"]},{"id":"c412","name":"SK텔레콤","sector":"대기업 환경·ESG 조직","subsector":"통신·IT·플랫폼","type":"대기업 환경조직","scale":4,"founded":1984,"hq":"서울","listed":"코스피","desc":"SK그룹 계열의 이동통신 기업으로, 최근 인공지능 데이터센터를 새 성장축으로 삼아 부지 확보와 변전 설비 구축을 맡을 100% 자회사 'SK하이퍼'를 세웠다. 데이터센터는 전력을 많이 쓰는 시설이라 전력 조달과 효율이 핵심 과제가 된다. ESG 자료실을 통해 지속가능경영보고서와 온실가스 데이터를 공개하며 재생에너지 전환도 추진한다.","tags":["온실가스 인벤토리","데이터센터 에너지","RE100","지속가능경영보고서","탄소중립"],"conf":"확인","global":false,"url":"https://www.sktelecom.com/esg/lib/persist.do","ext":[],"grounded":true,"src":["https://news.sktelecom.com/227156","https://www.hankyung.com/article/2026072325811","https://www.aitimes.com/news/articleView.html?idxno=213122","https://byline.network/2026/07/23-620/"]},{"id":"c415","name":"네이버","sector":"대기업 환경·ESG 조직","subsector":"통신·IT·플랫폼","type":"대기업 환경조직","scale":4,"founded":1999,"hq":"경기","listed":"코스피","desc":"검색 포털과 온라인 서비스를 운영하며 자체 데이터센터 '각'을 춘천(2013년 완공)과 세종(2023년 완공)에 두고 있다. 각 세종은 바깥 찬 공기를 끌어들여 서버실을 식히는 방식을 적용해 냉방에 드는 전력을 줄였고, 각 춘천은 친환경 건축 인증인 LEED에서 최고 등급을 받았다. 환경 전략과 탄소 감축 성과는 매년 지속가능성 보고서로 공개한다.","tags":["데이터센터 에너지","탄소중립","재생에너지","지속가능경영보고서","에너지 효율"],"conf":"확인","global":false,"url":"https://www.navercorp.com/esg/esgReports","ext":[],"grounded":true,"src":["https://www.navercorp.com/service/datacenterGak","https://namu.wiki/w/%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%84%BC%ED%84%B0%20%EA%B0%81","https://www.thelec.kr/news/articleView.html?idxno=23962","https://www.greened.kr/news/articleView.html?idxno=293752"]},{"id":"c417","name":"삼성SDS","sector":"대기업 환경·ESG 조직","subsector":"통신·IT·플랫폼","type":"대기업 환경조직","scale":4,"founded":1985,"hq":"서울","listed":"코스피","desc":"삼성그룹 계열 IT 서비스 기업으로, 기업 정보시스템 구축·운영(SI·아웃소싱)과 클라우드 사업을 하고 '첼로(Cello)'라는 디지털 플랫폼으로 물류 서비스도 제공한다. 최근에는 인공지능 연산용 데이터센터와 GPU 임대 서비스에 투자하고 있다. 환경경영 체계 아래 친환경 데이터센터를 별도 관리 영역으로 두고 에너지 효율화 성과를 지속가능경영보고서로 공시한다.","tags":["친환경 데이터센터","환경경영시스템","에너지 효율","지속가능경영보고서","온실가스 인벤토리"],"conf":"확인","global":false,"url":"https://www.samsungsds.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%EC%82%BC%EC%84%B1SDS","https://www.samsungsds.com/us/digital-transformation-logistics-service/cello-digital-services.html","https://www.finance-scope.com/article/view/scp202601280018"]},{"id":"c416","name":"카카오","sector":"대기업 환경·ESG 조직","subsector":"통신·IT·플랫폼","type":"대기업 환경조직","scale":4,"founded":null,"hq":"제주","listed":"코스피","desc":"매년 지속가능성 보고서를 내고 기후변화 대응을 3대 중대이슈의 하나로 다룬다. 안산 데이터센터에는 태양광 발전소에서 전기를 직접 사들이는 계약(직접 PPA)을 처음 적용했고, 제3자 검증을 거친 이곳의 연간 온실가스 감축량은 4,753톤(CO2 환산)이다. 제주 오피스, 판교 아지트, 안산 데이터센터, 용인 AI캠퍼스가 환경경영 국제표준인 ISO 14001 인증을 받았다.","tags":["데이터센터 에너지","온실가스 감축","지속가능경영보고서","탄소중립","ESG 공시"],"conf":"확인","global":false,"url":"https://www.kakaocorp.com/page/detail/12070","ext":[],"grounded":true,"src":["https://www.kakaocorp.com/page/detail/12070","https://www.insight.co.kr/news/559947","https://www.sentv.co.kr/article/view/sentv202606240083","https://www.kakaocorp.com/page/detail/10512"]},{"id":"c372","name":"GS칼텍스","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":1967,"hq":"서울","listed":"비상장","desc":"정유·석유화학 사업을 하며 매년 지속가능성보고서에 환경 성과를 공개한다. 최근 보고서에서는 설비·에너지 효율 개선으로 직접·간접 온실가스 배출량(Scope 1·2)을 전년보다 10만 톤 이상 줄였다고 밝혔다. 여수공장에서는 배출되는 이산화탄소를 붙잡아 액화 탄산이나 드라이아이스 등으로 다시 쓰는 방안을 추진하고, 공장 유휴 부지에 태양광 설비를 설치해 재생에너지 전력을 늘리고 있다.","tags":["온실가스 감축","재생에너지 전력구매(PPA)","환경안전(EHS)","탄소중립","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://gscaltexmediahub.com/esg/gsc-esg/sustainability_report_environmental/","ext":[],"grounded":true,"src":["https://www.gscaltex.com/kr/Sustainability/SustainabilityReport","http://www.srtimes.kr/news/articleView.html?idxno=209069","https://gscaltexmediahub.com/esg/gsc-esg/sustainability_report_environmental/","https://gscaltexmediahub.com/esg/gsc-2023-sustainability-report-environmental/"]},{"id":"c374","name":"HD현대오일뱅크","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":1964,"hq":"충남","listed":"비상장","desc":"충남 대산에 하루 약 39만 배럴 규모의 정제 설비를 둔 정유회사로, HD현대 그룹의 ESG 공시 체계 안에서 매년 지속가능경영보고서를 발간한다. 생산 과정의 탄소 배출이 적은 블루수소, 식물 등 바이오 원료를 쓰는 화이트바이오, 친환경 화학·소재를 미래 사업으로 추진한다. 이산화탄소를 포집해 다른 물질로 바꾸는 기술과 폐윤활유 재활용 기술에도 투자하고 있다.","tags":["기후행동","온실가스 관리","환경안전(EHS)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.oilbank.co.kr/main/index.do","ext":[],"grounded":true,"src":["https://esg.hd.com/ko/environmental/climate-action","https://esg.hd.com/upload/admin/report/1751332828474/2024%20HD%ED%98%84%EB%8C%80%EC%98%A4%EC%9D%BC%EB%B1%85%ED%81%AC%20%EC%A7%80%EC%86%8D%EA%B0%80%EB%8A%A5%EA%B2%BD%EC%98%81%EB%B3%B4%EA%B3%A0%EC%84%9C_KOR.pdf","https://www.hansbiz.co.kr/news/articleView.html?idxno=653310","https://www.econovill.com/news/articleView.html?idxno=637147"]},{"id":"c377","name":"LG에너지솔루션","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":2020,"hq":"서울","listed":"코스피","desc":"2020년 LG화학의 배터리 사업부문이 분할돼 설립된 배터리 제조사로 2022년 코스피에 상장했다. 전기차용 배터리와 전력을 저장해 두었다 쓰는 에너지저장장치(ESS)용 배터리, IT기기용 배터리를 개발·생산하며 국내외에 생산·판매·연구 거점을 두고 있다. 재생에너지 100% 전환(RE100)과 탄소중립을 목표로 기후행동 체계를 운영하고 ESG 보고서를 발간한다.","tags":["RE100","탄소중립","기후행동","재생에너지 전력구매(PPA)","ESG 보고서"],"conf":"확인","global":false,"url":"https://www.lgensol.com","ext":[],"grounded":true,"src":["https://www.lgensol.com/kr/company-about","https://ko.wikipedia.org/wiki/LG에너지솔루션"]},{"id":"c383","name":"SKC","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":1976,"hq":null,"listed":"코스피","desc":"1976년 설립된 SK그룹 계열 소재 기업으로 필름·화학 사업에서 출발해 이차전지 소재와 반도체 소재 중심으로 사업을 재편해 왔다. 배터리 소재인 동박(얇은 구리 박)은 자회사 SK넥실리스가 생산하고, 반도체 소재 부문은 데이터센터용 테스트 소켓 등을 공급한다. 2040년 넷제로를 목표로 온실가스 감축 실적을 관리하며 지속가능경영보고서를 매년 발간한다.","tags":["넷제로","온실가스 감축","기후변화 대응","공급망 ESG","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://skc.kr/kor/corporation/sustain/report.do","ext":[],"grounded":true,"src":["https://www.komachine.com/ko/companies/skc","https://weekly.hankooki.com/news/articleView.html?idxno=7176206","https://www.fntimes.com/html/view.php?ud=2026042715033157387de3572ddd_18"]},{"id":"c379","name":"SK온","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":2021,"hq":"서울","listed":"비상장","desc":"SK이노베이션의 배터리 사업이 2021년 물적분할돼 설립된 회사로 SK이노베이션이 지분 100%를 보유한다. 전기차용 배터리를 개발·생산하며 미국·유럽·중국에 현지 공장을 두고 양산하고 있다. 안전·보건·환경(SHE) 방침 아래 사업장을 관리하고 2030년 재생에너지 100%(RE100) 달성을 목표로 ESG 보고서를 공개한다.","tags":["환경안전(EHS)","RE100","폐배터리 재활용","온실가스 관리","ESG 보고서"],"conf":"확인","global":false,"url":"https://www.sk-on.com","ext":[],"grounded":true,"src":["http://www.sk-on.com/company/history.asp","http://www.sk-on.com/business/business_01.asp","https://namu.wiki/w/SK온"]},{"id":"c384","name":"SK케미칼","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":null,"hq":"경기","listed":"코스피","desc":"SK그룹 계열 화학기업으로 버려진 플라스틱을 화학적으로 분해해 원료 상태로 되돌리는 화학적 재활용 사업을 추진한다. 재활용 원료로 만든 투명 플라스틱 소재 코폴리에스터를 화장품 용기 등에 공급하며, 재활용 소재 판매 비중을 단계적으로 늘리는 목표를 두고 있다. 순환경제 과제와 대응 방안을 담은 지속가능경영보고서를 매년 발간한다.","tags":["순환경제","화학적 재활용","온실가스 관리","환경안전(EHS)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.skchemicals.com/","ext":[],"grounded":true,"src":["https://www.skchemicals.com/prcenter/new_view.aspx?serno=2998","https://www.etoday.co.kr/news/view/2074349","https://www.mt.co.kr/industry/2026/01/18/2026011514322661673"]},{"id":"c376","name":"금호석유화학","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":1970,"hq":"서울","listed":"코스피","desc":"1970년 설립된 화학기업으로 합성고무와 합성수지를 주력으로 생산한다. SBR·BR 등 범용 합성고무와 의료용 장갑 소재인 NB라텍스, 자동차·가전·식품용기·건자재에 쓰이는 ABS·EPS 등 플라스틱 수지, 고무 제품의 내구성을 높이는 고무약품을 만든다. 탄소중립 로드맵과 탄소 포집·활용·저장(CCUS) 계획, 기후 리스크 분석을 담은 지속가능경영보고서를 매년 발간한다.","tags":["탄소중립","CCUS","기후 리스크 분석","자연자본(TNFD)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://kkpc.com/kor/","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/금호석유화학","https://kpb.co.kr/kor/prcenter/news/newsDetail/?seq=116&rightpage=1"]},{"id":"c380","name":"롯데정밀화학","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":null,"hq":null,"listed":"코스피","desc":"롯데그룹 계열 화학기업으로 염소 계열, 암모니아 계열, 셀룰로스 계열, 전자재료 제품을 생산한다. 에폭시수지 원료인 ECH와 화학산업 기초원료인 가성소다, 암모니아와 요소수를 공급하며, 메셀로스·헤셀로스 등 산업용·식의약용 셀룰로스 소재를 만들어 해외에 수출한다. 사업장 온실가스와 환경안전을 관리하고 지속가능경영보고서를 매년 발간한다.","tags":["온실가스 관리","환경안전(EHS)","화학물질 관리","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.lottefinechem.com","ext":[],"grounded":true,"src":["https://www.lottefinechem.com/LFC_2021SR_MS/data/Introduction_KOR.pdf","https://dealsite.co.kr/articles/163446"]},{"id":"c378","name":"삼성SDI","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":1970,"hq":"경기","listed":"코스피","desc":"전기차와 에너지저장장치(ESS), IT기기에 쓰이는 배터리와 반도체·디스플레이용 전자재료를 개발·생산하는 삼성그룹 계열사다. 배터리는 전기차용과 전동공구·데이터센터 전원장치 등에 쓰이는 소형 제품으로 나뉘고, 전자재료는 반도체 패터닝 소재와 OLED 소재가 중심이다. 사업장 온실가스와 자원순환을 관리하며 매년 지속가능경영보고서를 발간한다.","tags":["온실가스 관리","순환경제","RE100","환경안전(EHS)","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.samsungsdi.com","ext":[],"grounded":true,"src":["https://www.samsungsdi.co.kr/business/index.html","https://www.samsungcareers.com/subsid/detail/C31","https://www.thelec.kr/news/articleView.html?idxno=55771"]},{"id":"c373","name":"에쓰오일","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":1976,"hq":"서울","listed":"코스피","desc":"2008년부터 매년 지속가능성 보고서를 발간해 사업장 환경·안전 관리와 온실가스 감축 활동을 공개해 온 정유사다. 기후변화와 에너지 전환에 대응하기 위해 온실가스 감축, 석유화학사업 확장, 친환경 에너지사업 진출을 3대 그린 이니셔티브로 정해 추진한다. 2012년부터는 중장기 감축 목표와 실행계획을 관리하는 탄소경영 체계를 운영한다.","tags":["온실가스 감축","환경안전(EHS)","대기오염 관리","ESG 보고서"],"conf":"확인","global":false,"url":"https://www.s-oil.com/sustainability/Report.aspx","ext":[],"grounded":true,"src":["https://www.s-oil.com/sustainability/Report.aspx","https://www.etoday.co.kr/news/view/2154483","https://www.s-oil.com/sustainability/Growth.aspx"]},{"id":"c381","name":"포스코퓨처엠","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":null,"hq":"경북","listed":"코스피","desc":"전기차 배터리에 들어가는 양극재·음극재와 제철용 내화물, 라임케미칼을 만드는 포스코그룹 소재 기업이다. 2050년까지 전 사업군의 탄소중립 달성을 목표로 전담 조직을 두고 재생에너지 확대와 저탄소 연료 전환을 추진한다. 2035년까지 양·음극재 생산에 쓰는 전력을 모두 재생에너지로 바꾸겠다는 계획을 세웠고, 매년 기업시민보고서를 내어 전략과 성과를 공개한다.","tags":["탄소중립","온실가스 관리","환경경영","순환경제","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.poscofuturem.com/esg/strategy.do","ext":[],"grounded":true,"src":["https://newsroom.posco.com/kr/%ED%8F%AC%EC%8A%A4%EC%BD%94%ED%93%A8%EC%B2%98%EC%97%A0-%EA%B8%B0%EC%97%85%EC%8B%9C%EB%AF%BC%EB%B3%B4%EA%B3%A0%EC%84%9C-%EB%B0%9C%EA%B0%84-esg%EA%B2%BD%EC%98%81-%EC%A0%84%EB%9E%B5%E2%80%A2/","https://www.poscofuturem.com/business/energy.do","https://www.poscofuturem.com/esg/strategy3.do"]},{"id":"c385","name":"포스코홀딩스","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":1968,"hq":"경북","listed":"코스피","desc":"지주회사 체제 전환과 함께 출범한 포스코그룹의 지주회사로, 철강·이차전지소재·수소 등 주요 사업회사의 ESG 경영을 총괄한다. 'Green Tomorrow, With POSCO'를 그룹 ESG 비전으로 내걸고 탄소중립 전략 방향을 조율한다. 지주회사의 역할과 사업회사별 ESG 전략·성과를 함께 담은 기업시민보고서를 매년 발간한다.","tags":["탄소중립","ESG 전략","온실가스 인벤토리","기후변화 대응","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.posco-inc.com/poscoinc/v4/kor/esg/s91e4000400c.jsp","ext":[],"grounded":true,"src":["https://newsroom.posco.com/kr/%ED%8F%AC%EC%8A%A4%EC%BD%94%ED%99%80%EB%94%A9%EC%8A%A4-%EA%B7%B8%EB%A3%B9-%EC%B0%A8%EC%9B%90-esg-%EC%A0%84%EB%9E%B5-%EB%B0%8F-%EC%84%B1%EA%B3%BC-%EB%8B%B4%EC%9D%80-%EB%B0%9C%EA%B0%84/","http://www.posco-inc.com/poscoinc/v4/kor/esg/s91e4000400c.jsp","https://biz.newdaily.co.kr/site/data/html/2022/09/01/2022090100028.html"]},{"id":"c375","name":"한화토탈에너지스","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":null,"hq":"충남","listed":"비상장","desc":"충남 대산석유화학단지에서 20여 개 단위공장으로 이뤄진 석유화학·에너지 복합단지를 운영하는 한화그룹 계열사다. 1988년 설립돼 고부가 화학제품과 에너지 제품을 함께 생산한다. 지속가능경영보고서를 발간해 탄소중립 이행 계획과 기후 위험·기회 대응 전략을 공개한다.","tags":["환경안전(EHS)","탄소중립","화학물질 관리","온실가스 관리","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.htpchem.com/","ext":[],"grounded":true,"src":["https://www.htpchem.com/","https://www.hanwha.co.kr/business/manufacture/total.do","https://m.htpchem.com/Download/2024%20%ED%95%9C%ED%99%94%ED%86%A0%ED%83%88%EC%97%90%EB%84%88%EC%A7%80%EC%8A%A4%20%EC%A7%80%EC%86%8D%EA%B0%80%EB%8A%A5%EA%B2%BD%EC%98%81%EB%B3%B4%EA%B3%A0%EC%84%9C%20%EA%B5%AD%EB%AC%B8.pdf"]},{"id":"c382","name":"현대제철","sector":"대기업 환경·ESG 조직","subsector":"화학·정유·소재","type":"대기업 환경조직","scale":4,"founded":null,"hq":null,"listed":"코스피","desc":"고로와 전기로 공정을 함께 운영하는 제철사로, 두 공정을 결합한 '전기로-고로 복합 프로세스'를 통해 쇳물 생산 단계의 탄소 배출을 줄이고 있다. 이 방식으로 만든 저탄소 강재 'HyECOsteel'은 자사 고로재보다 탄소 배출이 20% 이상 적다. 2050년 탄소중립을 목표로 감축 계획과 기후변화 대응 현황을 담은 통합보고서를 매년 발간한다.","tags":["탄소중립","온실가스 감축","대기오염 관리","기후변화 대응","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://www.hyundai-steel.com/kr/sustainability/esg","ext":[],"grounded":true,"src":["https://www.hyundai-steel.com/kr/sustainability/carbon-neutral","https://kind.krx.co.kr/external/2024/07/31/000566/20240731001139/%ED%98%84%EB%8C%80%EC%A0%9C%EC%B2%A0%202024%20%ED%86%B5%ED%95%A9%EB%B3%B4%EA%B3%A0%EC%84%9C%20(%EA%B5%AD%EB%AC%B8)_fin.pdf","https://esg.hyundai-steel.com/2022/front/contents/contentView.do?cntntsCode=22ea0102&menuSn=356"]},{"id":"c466","name":"대한상공회의소","sector":"ESG 공시·검증·자문","subsector":"공시·데이터 인프라","type":"공공·연구","scale":3,"founded":null,"hq":"서울","listed":null,"desc":"국내 기업들이 회원으로 참여하는 경제단체로 ESG 플랫폼 '으쓱'을 운영한다. 중소기업의 ESG(환경·사회·지배구조) 경영 우수 실천사례 영상과 관련 정보를 모아 기업은 물론 일반인도 쉽게 이해할 수 있게 제공한다. EU 수출기업을 위한 공시기준 가이드북과 업종별 ESG 경영지원 가이드북을 펴냈고, 은행과 연계한 ESG 지속가능성연계대출 코너도 두고 있다.","tags":["ESG 정보 플랫폼","ESG 가이드 제공","ESG 공시 정보"],"conf":"확인","global":false,"url":"https://esg.korcham.net/","ext":[],"grounded":true,"src":["https://esg.korcham.net/","https://www.etnews.com/20211215000221","https://www.socialvalue.kr/news/view/1065572945756734"]},{"id":"c464","name":"에프앤가이드","sector":"ESG 공시·검증·자문","subsector":"공시·데이터 인프라","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"코스닥","desc":"증권사 리서치 리포트와 상장사 재무·시장 데이터를 모아 제공하는 금융정보 회사로, 투자분석용 프로그램 퀀티와이즈(QuantiWise)와 펀드평가·인덱스(주가지수) 서비스를 운영한다. ESG 분야에서는 한국·미국·일본·중국 등 세계 상장기업의 최근 5개년 ESG 등급 데이터를 제공하고, 한국ESG기준원(KCGS)과 제휴해 국내 상장사 ESG 평가 데이터도 함께 공급한다.","tags":["ESG 데이터 제공","ESG 등급 데이터","금융정보 플랫폼"],"conf":"확인","global":false,"url":"https://corp.fnguide.com/","ext":[],"grounded":true,"src":["https://corp.fnguide.com/Data/ESG","https://corp.fnguide.com/Service/FinancialService","https://www.hankyung.com/economy/article/202009150520Y"]},{"id":"c465","name":"중소벤처기업진흥공단","sector":"ESG 공시·검증·자문","subsector":"공시·데이터 인프라","type":"공공·연구","scale":3,"founded":null,"hq":"경남","listed":null,"desc":"중소기업을 지원하는 공공기관으로 'ESG 통합플랫폼'을 운영한다. 기업이 체크리스트로 스스로 ESG 수준을 점검하는 자가진단과, 전문 컨설턴트가 현장을 방문해 수준을 측정하고 맞춤형 개선 과제를 뽑아주는 심층진단·상담을 제공한다. 거래기업으로부터 ESG 요구를 받는 중소기업이 주 대상이며, 자가진단 참여기업 중 기준을 충족하면 시중은행 금융 인센티브로 연결된다.","tags":["ESG 진단 플랫폼","기후공시 지원","공급망 실사 대응","온실가스 인벤토리 지원"],"conf":"확인","global":false,"url":"https://esg.kosmes.or.kr/","ext":[],"grounded":true,"src":["https://esg.kosmes.or.kr/","https://kdoctor.kosmes.or.kr/smartintro/esgintro.do","https://www.kosmes.or.kr/nsh/SH/SBI/SHSBI113M0.do"]},{"id":"c462","name":"한국거래소","sector":"ESG 공시·검증·자문","subsector":"공시·데이터 인프라","type":"공공·연구","scale":3,"founded":2005,"hq":"부산","listed":"비상장","desc":"주식·채권 시장을 운영하는 거래소로, ESG 포털에서 상장기업의 지속가능경영보고서와 지배구조보고서 등 흩어져 있던 ESG 공시·평가 정보를 한곳에 모아 제공한다. 2020년에는 사회책임투자채권 전용 세그먼트를 열어, 조달한 돈을 친환경·사회적 사업에 쓰는 녹색채권과 사회적채권, 지속가능채권의 발행·공시 정보를 관리한다.","tags":["ESG 공시 인프라","ESG 데이터 제공","ESG 채권 시장 운영"],"conf":"확인","global":false,"url":"https://esg.krx.co.kr/","ext":[],"grounded":true,"src":["https://esg.krx.co.kr/contents/02/02010000/ESG02010000.jsp","https://sribond.krx.co.kr/","https://www.fsc.go.kr/no010101/77085"]},{"id":"c463","name":"한국회계기준원","sector":"ESG 공시·검증·자문","subsector":"공시·데이터 인프라","type":"공공·연구","scale":3,"founded":1999,"hq":"서울","listed":null,"desc":"기업이 따라야 할 회계·지속가능성 공시기준을 만드는 기관으로, 산하에 지속가능성기준위원회(KSSB)를 두고 있다. 2024년 4월 국내 지속가능성 공시기준 공개초안을 발표해 약 4개월간 의견을 모았고, 2026년 2월 공시기준서 제1호 '일반 요구사항'과 제2호 '기후 관련 공시' 제정을 의결·공표했다. 제2호는 기업이 기후 관련 위험과 기회를 거버넌스·전략·위험관리·지표 및 목표로 나눠 공시하도록 한 기준이다.","tags":["지속가능성 공시기준 제정","KSSB 운영","ESG 공시 정책"],"conf":"확인","global":false,"url":"https://www.kasb.or.kr/","ext":[],"grounded":true,"src":["https://www.kasb.or.kr/","https://www.intn.co.kr/news/articleView.html?idxno=2049269","https://www.shinkim.com/kor/media/newsletter/2441"]},{"id":"c441","name":"김앤장 법률사무소","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":1973,"hq":"서울","listed":"비상장","desc":"1973년 문을 연 법률사무소로 환경 그룹과 ESG 그룹을 함께 운영한다. 환경 그룹은 기업이 환경·기후변화 규제 변화에 맞춰 원료와 제품의 앞뒤 공급망을 관리하고 관련 부서 간 협업 체계를 갖추도록 자문한다. 2018년 환경에너지연구소를 세운 것을 시작으로 ESG 경영 자문을 해왔고, 이후 ESG경영연구소를 별도로 설립해 자문 범위를 넓혔다.","tags":["환경 소송","환경 규제 대응","탄소배출권 자문","ESG 자문"],"conf":"확인","global":false,"url":"https://www.kimchang.com/ko/main.kc","ext":[],"grounded":true,"src":["https://www.kimchang.com/ko/expertise/detail.kc?idx=172","https://www.hankyung.com/article/2022042088251","https://ko.wikipedia.org/wiki/김앤장_법률사무소"]},{"id":"c444","name":"법무법인 광장","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":1977,"hq":"서울","listed":"비상장","desc":"환경팀과 ESG팀을 운영하며 기업의 환경 인허가 취득, 환경사고 처리, 제품 안전 관리, 규제 개혁 대응, ESG 경영전략 수립까지 묶어서 자문한다. 환경부에서 오랜 기간 근무한 전직 공직자 등 규제 실무 경험자가 자문에 참여한다. ESG 정책과 규제 이슈를 조사·연구하는 'ESG 지속가능경영 연구원'도 설립해 기업법무 자문을 뒷받침한다.","tags":["환경 규제 대응","ESG 자문","환경 소송"],"conf":"확인","global":false,"url":"https://www.leeko.com/","ext":[],"grounded":true,"src":["https://www.leeko.com/leenko/main.do?lang=KR","https://www.lawtimes.co.kr/news/169081","https://www.hankyung.com/article/2021042036691"]},{"id":"c448","name":"법무법인 바른","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":1998,"hq":"서울","listed":"비상장","desc":"1998년 설립된 법무법인으로 소송 업무에 강점을 둔 국내 대형 로펌 중 하나로 꼽힌다. 환경 분야에서는 대기·수질·폐기물·토양오염부터 유해화학물질과 제품 환경규제, 온실가스·기후변화까지 아우르는 전담 대응팀을 운영한다. 환경 관련 소송과 행정처분 대응, 형사사건, 규제 자문을 수행한다.","tags":["환경 소송","환경 규제 대응","기후변화 대응","폐기물 규제 자문"],"conf":"확인","global":false,"url":"https://www.barunlaw.com/","ext":[],"grounded":true,"src":["http://www.barunlaw.com/category/F/205","https://namu.wiki/w/%EB%B2%95%EB%AC%B4%EB%B2%95%EC%9D%B8(%EC%9C%A0)%20%EB%B0%94%EB%A5%B8"]},{"id":"c443","name":"법무법인 세종","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":1983,"hq":"서울","listed":"비상장","desc":"환경미래전략센터를 두고 환경 규제 대응, 개발사업 입지 선정과 환경영향평가 협의, 온실가스 감축을 포함한 ESG 경영 전략, 환경 단속 대응 업무를 맡는다. 인허가와 법규 준수 자문, 사업장 허가를 하나로 묶어 관리하는 통합환경관리제도 대응, 배출권거래제와 기후변화 관련 자문·소송, 화학물질 등록·관리 자문, 토양오염과 폐기물 분쟁 해결까지 폭넓게 다룬다.","tags":["환경 규제 대응","환경영향평가 자문","ESG 컴플라이언스","화학물질 규제 자문"],"conf":"확인","global":false,"url":"https://www.shinkim.com/kor","ext":[],"grounded":true,"src":["https://www.shinkim.com/kor/business/view/U1008","https://www.shinkim.com/kor/member/view/2974","https://www.monthlypeople.com/news/articleView.html?idxno=270092"]},{"id":"c445","name":"법무법인 율촌","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":1997,"hq":"서울","listed":"비상장","desc":"2020년 12월 ESG연구소를 세우고 환경·에너지팀과 묶어 기후변화 규제팀을 운영한다. 전 환경부 환경정책실장 출신 연구소장을 비롯해 변호사와 변리사, 환경정책 전문가 등 30여 명이 참여해 탄소배출권 거래제와 기후변화 규제 대응, 환경·안전·보건 관련 자문을 맡는다. 2021년부터는 환경·지속가능성 컨설팅사 ERM과 제휴해 법률과 기술을 함께 다루는 자문을 제공한다.","tags":["탄소배출권 자문","기후변화 대응","환경 규제 대응","ESG 자문"],"conf":"확인","global":false,"url":"https://www.yulchon.com/","ext":[],"grounded":true,"src":["https://www.yulchon.com/ko/expertise/practices/esg-and-environmental-social-and-governance-/1415/page.do","https://www.hankyung.com/society/article/2021011705521","https://www.hankyung.com/article/202108049857i","https://sedaily.com/NewsView/2GRLGND12G"]},{"id":"c447","name":"법무법인 지평","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"비상장","desc":"변호사와 컨설턴트가 함께 일하는 ESG센터를 두고 환경·사회·지배구조 전반의 법률 자문과 컨설팅을 함께 제공한다. 기업의 온실가스 배출량 산정과 기후 리스크 평가, 탄소중립 목표 수립을 돕고, ISSB·KSSB와 유럽 CSRD 등 국내외 지속가능성 공시 기준 대응을 자문한다. 환경 인허가 점검과 안전보건 관리체계 구축 같은 환경·보건·안전(EHS) 컨설팅도 맡는다.","tags":["ESG 자문","ESG 컨설팅","환경 규제 대응","공급망 실사 자문"],"conf":"확인","global":false,"url":"https://www.jipyong.com/kr/","ext":[],"grounded":true,"src":["https://www.jipyong.com/kr/business/business_introduce.php?seq=239","https://www.hankyung.com/society/article/2021042037191","https://www.sedaily.com/article/14055975"]},{"id":"c442","name":"법무법인 태평양","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":1980,"hq":"서울","listed":"비상장","desc":"2013년 구성한 환경팀을 2021년 30여 명 규모의 '환경규제대응 태스크포스'로 확대 개편했다. 유해화학물질 안전관리와 화학사고 대비·대응, 화학물질 확인·등록·평가·수출입에 관한 자문을 제공한다. 환경 법령 제·개정 과정에 대한 대응 자문도 함께 수행한다.","tags":["환경 규제 대응","화학물질 규제 자문","ESG 자문","기후변화 대응"],"conf":"확인","global":false,"url":"https://www.bkl.co.kr/","ext":[],"grounded":true,"src":["https://www.bkl.co.kr/law/practice/%ED%99%98%EA%B2%BD","https://www.hankyung.com/article/2024042158821"]},{"id":"c446","name":"법무법인 화우","sector":"ESG 공시·검증·자문","subsector":"법무법인 환경·ESG","type":"대기업","scale":4,"founded":2003,"hq":"서울","listed":"비상장","desc":"2020년 ESG그룹을 출범시키고 2022년에는 환경규제대응센터를 따로 열었다. 수질·대기·폐기물·화학물질·토양오염 등 환경 규제 전반을 자문하고, 환경부와 지방자치단체의 행정처분에 대한 행정심판·행정소송, 관련 민형사 소송을 대리한다. 국내외 정책 동향을 반영한 맞춤형 법률 자문을 제공한다.","tags":["환경 규제 대응","ESG 자문","환경 소송"],"conf":"확인","global":false,"url":"https://www.yoonyang.com/","ext":[],"grounded":true,"src":["https://www.lawtimes.co.kr/news/166262","https://www.hankyung.com/article/202012039080i","https://www.fnnews.com/news/202209021202122836"]},{"id":"c439","name":"MSCI","sector":"ESG 공시·검증·자문","subsector":"신용평가·ESG평가","type":"해외 대표","scale":4,"founded":null,"hq":"미국","listed":null,"desc":"글로벌 주가지수와 ESG 리서치를 제공하는 미국 기관이다. 산하 MSCI ESG 리서치가 전 세계 상장·비상장 기업을 대상으로 업종별로 재무에 영향을 줄 수 있는 환경·사회·지배구조 리스크에 얼마나 잘 대응하는지를 평가해 AAA부터 CCC까지 등급을 매긴다. 이 등급과 관련 지수는 연기금·자산운용사 등 기관투자자가 투자 판단에 활용한다.","tags":["ESG 등급 평가","ESG 리서치","ESG 지수","책임투자 데이터"],"conf":"확인","global":true,"url":"https://www.msci.com/","ext":[],"grounded":true,"src":["https://www.msci.com/data-and-analytics/sustainability-solutions/esg-ratings","https://www.msci.com/documents/1296102/34424357/MSCI+ESG+Ratings+Methodology.pdf","https://www.k-esg.org/disclosure/msci","https://kiri.or.kr/pdf/연구자료/기타보고서/issue_22-04_3.pdf"]},{"id":"c437","name":"나이스디앤비","sector":"ESG 공시·검증·자문","subsector":"신용평가·ESG평가","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"코스닥","desc":"기업 신용평가와 기업정보 서비스를 제공하는 평가기관으로, 중견·중소기업에 맞춘 ESG 평가 모형과 업종별 지표를 개발해 ESG 진단과 컨설팅을 수행한다. 대기업·원청업체에 제출하는 협력사 평가도 맡아, 규모가 작은 기업이 거래처가 요구하는 환경·사회·지배구조 점검 절차에 대응하도록 돕는다.","tags":["중소기업 ESG 평가","공급망 ESG 진단","기업정보 데이터"],"conf":"확인","global":false,"url":"https://www.nicednb.com/","ext":[],"grounded":true,"src":["https://www.nicednb.com/sv/service08.do","https://www.nicednb.com/sv/service03.do","https://www.nicers.co.kr/main.html"]},{"id":"c436","name":"나이스신용평가","sector":"ESG 공시·검증·자문","subsector":"신용평가·ESG평가","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"기업이 발행하는 회사채 등의 원리금 상환 능력을 등급으로 매기는 신용평가회사다. 녹색채권을 비롯한 ESG 채권에 대해서는 별도의 인증평가를 수행해, 조달한 자금이 적합한 친환경 사업에 쓰이는지와 자금 관리·사후 보고 체계가 갖춰졌는지를 점검하고 인증 의견을 부여한다.","tags":["ESG 채권 인증평가","기업 ESG 평가","녹색채권 외부검토","신용평가"],"conf":"확인","global":false,"url":"https://www.nicerating.com/","ext":[],"grounded":true,"src":["https://www.nicerating.com/main.do","https://paxnetnews.com/articles/72550"]},{"id":"c440","name":"서스테이널리틱스","sector":"ESG 공시·검증·자문","subsector":"신용평가·ESG평가","type":"해외 대표","scale":4,"founded":null,"hq":"네덜란드","listed":null,"desc":"2020년 7월 미국 모닝스타에 인수돼 '모닝스타 서스테이널리틱스'로 운영되는 ESG 리서치 기관이다. 기업이 업종별로 어떤 환경·사회·지배구조 리스크에 노출돼 있고 이를 얼마나 관리하는지를 평가해 ESG 리스크 등급을 산출하며, 등급은 위험의 심각도에 따라 다섯 단계로 구분된다. 상장기업뿐 아니라 채권 발행사와 비상장기업까지 평가 대상에 포함한다.","tags":["ESG 리스크 등급","ESG 리서치","책임투자 데이터"],"conf":"확인","global":true,"url":"https://www.sustainalytics.com/","ext":[],"grounded":true,"src":["https://www.sustainalytics.com/esg-data","https://newsroom.morningstar.com/newsroom/news-archive/press-release-details/2024/Morningstar-Sustainalytics-Introduces-Significant-Enhancements-to-its-ESG-Risk-Ratings/default.aspx","https://www.sustainalytics.com/morningstar-sustainalytics-ratings-transparency/methodology-disclosure-archive"]},{"id":"c434","name":"한국기업평가","sector":"ESG 공시·검증·자문","subsector":"신용평가·ESG평가","type":"중견기업","scale":3,"founded":1983,"hq":"서울","listed":"코스닥","desc":"1983년 설립돼 코스닥에 상장한 신용평가회사로, 회사채·기업어음과 자산유동화증권(ABS)의 신용등급을 매기고 사업 타당성 검토와 가치평가, 프로젝트금융·SOC 평가도 수행한다. ESG 분야에서는 조달 자금이 적합한 사업에 쓰이는지와 자금 관리·공시 수준을 살피는 ESG 금융상품 인증평가, 기업의 환경·사회·지배구조 수준을 등급으로 매기는 기업 ESG 평가를 함께 운영한다.","tags":["ESG 채권 인증평가","기업 ESG 평가","녹색채권 외부검토","신용평가"],"conf":"확인","global":false,"url":"https://www.korearatings.com/","ext":[],"grounded":true,"src":["https://www.korearatings.com/cms/frCmnCon/index.do?MENU_ID=950","https://www.korearatings.com/cms/frCmnCon/index.do?MENU_ID=1490","https://comp.fnguide.com/SVO2/ASP/SVD_Main.asp?pGB=1&gicode=A034950"]},{"id":"c435","name":"한국신용평가","sector":"ESG 공시·검증·자문","subsector":"신용평가·ESG평가","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"1985년 설립된 신용평가회사로 2001년 국제 신용평가사 무디스에 편입됐고 현재 무디스가 지분을 보유하고 있다. 기업과 금융회사가 발행하는 회사채 등의 원리금 상환 능력을 등급으로 평가해 공시하며, 등급 전망(Rating Outlook)과 워치리스트 같은 무디스의 평가 체계를 도입해 운영한다.","tags":["ESG 채권 인증평가","녹색채권 외부검토","ESG 사후검토","신용평가"],"conf":"확인","global":false,"url":"https://www.kisrating.com/","ext":[],"grounded":true,"src":["https://www.kisrating.com/","https://www.bond.co.kr/conts/10038"]},{"id":"c438","name":"한국평가데이터","sector":"ESG 공시·검증·자문","subsector":"신용평가·ESG평가","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"국내 기업 정보를 대규모로 축적해 기업정보 조회 서비스 크레탑(CRETOP)을 운영하는 기업평가기관으로, 이 데이터를 바탕으로 기업 신용평가와 기술평가를 수행한다. ESG 평가와 데이터 플랫폼 구축, 해외 기업정보 제공도 함께 하며, 기업 재무·비재무 데이터를 활용해 환경·사회·지배구조 수준을 평가한다.","tags":["기업 ESG 평가","ESG 자가진단","기업데이터 분석"],"conf":"확인","global":false,"url":"http://www.kodata.co.kr/","ext":[],"grounded":true,"src":["https://www.kdi.re.kr/research/reportView?pub_no=18648","https://data.cretop.com/story/indexDataStory","http://www.kodata.co.kr/ci/CIINT01R0.do"]},{"id":"c455","name":"BSI코리아","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"국제 표준 개발·보급 기관인 영국표준협회(BSI)의 한국 조직으로, 기업의 환경경영 체계가 국제표준 ISO 14001 요구사항에 맞는지 심사해 인증을 부여한다. 온실가스 분야에서는 ISO 14064에 따라 기업이 산정한 배출량과 탄소발자국을 제3자 입장에서 검증하며, 사전 진단인 갭 분석과 내부심사원 양성 교육과정도 운영한다.","tags":["ISO 14001 인증","온실가스 배출량 검증","지속가능성 보고 검증","ESG 보고 자문"],"conf":"확인","global":false,"url":"https://www.bsigroup.com/ko-KR/","ext":[],"grounded":true,"src":["https://www.bsigroup.com/ko-KR/iso-14001-environmental-management/certification/","https://www.bsigroup.com/ko-KR/products-and-services/standards/iso-14064-greenhouse-gas-requirements/","https://www.bsigroup.com/ko-KR/training-courses/iso14064-3-----/"]},{"id":"c453","name":"DNV 비즈니스어슈어런스 코리아","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"노르웨이에 본사를 둔 인증·검증 그룹 DNV의 국내 비즈니스어슈어런스 법인이다. 기업의 경영시스템이 국제 표준에 맞게 운영되는지 심사해 인증서를 발급하고, 협력사까지 포함한 공급망 어슈어런스와 관련 교육을 제공한다. DNV 그룹은 선박 선급 검사와 해운·에너지 분야 기술 자문, 소프트웨어 사업도 함께 수행한다.","tags":["온실가스 배출량 검증","ISO 14001 인증","지속가능성 보고 검증"],"conf":"확인","global":false,"url":"https://www.dnv.co.kr/","ext":[],"grounded":true,"src":["https://www.dnv.com/about/business-assurance/","https://www.dnv.co.kr/assurance/general/country-sites.html"]},{"id":"c456","name":"SGS코리아","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"스위스에 본사를 둔 세계적인 시험·검사·인증(TIC) 기업 SGS의 한국 법인이다. 제품과 설비가 규격·안전 기준에 맞는지 시험하고 검사하며, 기업의 환경·사회·지배구조(ESG) 관리 수준을 자체 기준으로 심사해 ESG 인증서를 발급한다. 이 기준은 30여 년간 쌓은 심사 데이터와 주요 지속가능성 표준의 요건을 정리해 만든 것이다. 석유·가스·화학 산업의 검사·시험·검증 서비스도 제공한다.","tags":["온실가스 배출량 검증","ESG 인증","지속가능성 보고 검증","ISO 14001 인증"],"conf":"확인","global":false,"url":"https://www.sgs.com/ko-kr","ext":[],"grounded":true,"src":["https://www.sgs.com/ko-kr/services/esg-certification","https://www.sgs.com/ko-kr"]},{"id":"c458","name":"TÜV SÜD 코리아","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"독일계 시험·인증기관 TÜV SÜD의 한국 법인이다. ISO 14064-1 기준에 따라 기업이 자사 온실가스 배출량을 빠짐없이 집계하는 목록(인벤토리)을 만들도록 돕고, 외부 기관의 제3자 검증(ISO 14064-3)에 필요한 자료와 절차를 미리 정비해준다. EU·미국·한국의 기후 규제 대응과 CDP·IFRS 기준 공시 준비, 글로벌 공급망 관리 지원도 함께 제공한다.","tags":["온실가스 배출량 검증","SBTi 대응 자문","ISO 인증","기후공시 검증"],"conf":"확인","global":false,"url":"https://www.tuvsud.com/ko-kr","ext":[],"grounded":true,"src":["https://www.tuvsud.com/ko-kr/services/auditing-and-system-certification/iso-14064-1"]},{"id":"c454","name":"로이드인증원","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"영국에 본사를 둔 인증기관 LRQA의 한국 법인이다. 기업의 환경경영시스템이 국제 표준 ISO 14001에 맞는지 영국 인정기구(UKAS)의 인정을 받아 심사하고 인증서를 발급하며, 심사는 문서 검토와 현장 방문 심사 두 단계로 진행된다. ISO 14064에 따른 온실가스 배출량 검증과 공급망 검증도 수행하고, IRCA 승인 인증심사원 양성 교육 과정을 운영한다.","tags":["온실가스 배출량 검증","ISO 14001 인증","CDP 보고서 검증","지속가능성 보고 검증"],"conf":"확인","global":false,"url":"https://www.lrqa.com/ko-kr/","ext":[],"grounded":true,"src":["https://www.lrqa.com/ko-kr/iso-14001/certification/","https://www.lrqa.com/ko-kr/training/iso-14001-lead-auditor/","https://www.lrqa.com/en-us/iso-14064/"]},{"id":"c457","name":"뷰로베리타스 코리아","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"1828년 설립된 프랑스계 시험·검사·인증(TIC) 기업 뷰로베리타스의 한국 조직이다. 1979년부터 국내에서 조선, 산업설비, 원자재, 인증, 소비재 시험검사 분야에 걸쳐 여러 법인으로 사업을 해왔다. 품질·안전보건·환경·사회적 책임(QHSE) 분야의 심사와 시험·분석 서비스를 제공하며, 소비재 시험·검사·인증을 맡는 시험소를 2015년 경기 평촌에 설치했다.","tags":["ISO 14001 인증","환경 규제 대응","지속가능성 검증","신재생에너지 인증"],"conf":"확인","global":false,"url":"https://www.bureauveritas.co.kr/","ext":[],"grounded":true,"src":["https://www.bureauveritas.co.kr/Bureau-veritas-about-us","https://www.bureauveritas.co.kr/Laboratory-testing","https://www.etnews.com/20251017000199"]},{"id":"c460","name":"에코나인","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"2011년부터 기업의 지속가능경영보고서를 제작해 온 ESG 자문 기업이다. 보고서 작성과 제3자 검증을 함께 수행하며, 보고서 작성법과 환경·기후변화 대응, ISO 경영시스템을 다루는 ESG 교육 과정도 운영한다. 글로벌 공급망 ESG 평가기관인 에코바디스(EcoVadis)의 트레이닝 파트너로 교육센터를 운영한다.","tags":["지속가능성 보고 검증","지속가능경영보고서 발간","ESG 컨설팅","ESG 교육"],"conf":"확인","global":false,"url":"https://econine.kr/","ext":[],"grounded":true,"src":["https://www.energydaily.co.kr/news/articleView.html?idxno=150267","https://maily.so/econine/posts/d5ryjyk8r1w","https://www.the-pr.co.kr/news/articleView.html?idxno=53119"]},{"id":"c459","name":"컨트롤유니온 코리아","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"100년 넘는 역사를 가진 네덜란드계 검사·시험·인증(TIC) 기업 컨트롤유니온의 한국 법인으로 2008년 설립됐다. 친환경 분야 제3자 인증과 검증, 화물 검정 업무를 수행한다. 바이오에너지 조직을 두고 바이오연료·바이오가스·폐자원 에너지를 대상으로 ISCC 인증을 다루는데, ISCC는 공급망 전체의 원료 이력과 온실가스 감축 실적을 확인하는 국제 인증이다.","tags":["온실가스 배출량 검증","지속가능성 보고 검증","친환경 인증"],"conf":"확인","global":false,"url":"https://korea.controlunion.com/","ext":[],"grounded":true,"src":["https://korea.controlunion.com/service/certification/","https://korea.controlunion.com/process/","https://greenenertec.com/pressrelease/?idx=167628788&bmode=view"]},{"id":"c449","name":"한국경영인증원","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"인증·평가·교육을 함께 제공하는 국내 인증기관이다. 품질·환경·안전 등 경영시스템 인증과 제품인증, 사회적 가치 인증·평가를 운영하고, 배출권거래제 검증지침에 따른 온실가스 배출량·에너지 사용량 검증과 탄소발자국, 자발적 검증, CDP 검증, 산림 탄소흡수량 검증을 수행한다. ESG경영센터를 통해 기업이 발간한 지속가능경영보고서를 독립된 제3자 입장에서 검증한다.","tags":["지속가능성 보고 검증","온실가스 배출량 검증","ISO 인증","ESG 평가"],"conf":"확인","global":false,"url":"https://www.ikmr.co.kr/","ext":[],"grounded":true,"src":["https://www.ikmr.co.kr/","https://ikmr-esg.co.kr/"]},{"id":"c452","name":"한국생산성본부인증원","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"한국생산성본부 계열 인증기관으로 1994년 출범했다. 품질·환경·안전·정보보안·준법경영 등 ISO 경영시스템 인증을 발급하며, 정부의 온실가스 감축 정책에 따라 기업이 제출하는 온실가스 명세서를 객관적으로 검증하는 서비스도 제공한다. 최근에는 녹색건축, 장애물 없는 생활환경(BF) 인증과 인공지능 경영시스템 국제표준(ISO/IEC 42001) 인증으로 영역을 넓혔다.","tags":["온실가스 배출량 검증","ESG 보고서 검증","ISO 인증"],"conf":"확인","global":false,"url":"http://www.kpcqa.or.kr/","ext":[],"grounded":true,"src":["https://www.kpcqa.or.kr/manage/iso21001.asp","http://www.enewstoday.co.kr/news/articleView.html?idxno=2332574","https://www.kab.or.kr/kor/kcn/kcn/view.do?orgIdx=152&menuNo=400010"]},{"id":"c451","name":"한국표준협회","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"공공·연구","scale":3,"founded":1962,"hq":"서울","listed":null,"desc":"기업의 온실가스 배출량과 제품 탄소발자국을 국제표준(ISO 14064, ISO 14067)에 따라 독립적으로 확인해 주는 검증기관이다. 사업장 경계 안에서 나온 배출량을 자발적으로 산정해 검증받는 서비스와 감축량 검증, 정부 온실가스 목표관리제 검증을 수행한다. 검증받은 제품 탄소발자국 정보는 고객사·투자자의 요구에 답하거나 지속가능경영보고서에 공개할 때 쓰인다.","tags":["온실가스 배출량 검증","제품탄소발자국 검증","지속가능성 보고 검증","ESG 컨설팅"],"conf":"확인","global":false,"url":"https://www.ksa.or.kr/","ext":[],"grounded":true,"src":["https://ksa.or.kr/ksa_kr/16257/subview.do","https://ksa.or.kr/ksa_kr/7399/subview.do","https://ksa.or.kr/ksa_kr/16258/subview.do","https://ksa.or.kr/ksa_kr/882/subview.do"]},{"id":"c450","name":"한국품질재단","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"공공·연구","scale":3,"founded":1993,"hq":"서울","listed":null,"desc":"기업의 품질 경쟁력을 높이기 위해 1993년 설립된 비영리 재단법인으로, 산업통상자원부가 승인한 국내 1호 ISO 인증기관이다. ISO 9001(품질경영)과 ISO 14001(환경경영) 같은 경영시스템 인증과 제품 인증을 수행한다. 이와 함께 온실가스 검증과 ESG 평가, 실무 중심 교육 사업도 운영하고 있다.","tags":["온실가스 배출량 검증","ISO 14001 인증","지속가능성 보고 검증","ESG 평가"],"conf":"확인","global":false,"url":"https://www.kfq.or.kr/","ext":[],"grounded":true,"src":["https://www.kfq.or.kr/","https://www.kfq.or.kr/standard-iso-14001","https://www.kfq.or.kr/certification-kfq-management"]},{"id":"c461","name":"한컨설팅그룹","sector":"ESG 공시·검증·자문","subsector":"인증·검증기관","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"ESG 컨설팅과 교육을 전문으로 하는 기업이다. 기업의 환경·사회·지배구조 활동과 성과를 담은 지속가능경영보고서 작성을 지원하고, 보고 내용과 데이터의 신뢰성을 확인하는 제3자 검증 관련 업무를 수행한다. 보고서를 심사할 인력을 기르는 'ESG보고서 검증원' 자격과정을 여러 기수에 걸쳐 운영해 왔다.","tags":["지속가능성 보고 검증","ESG 검증심사원 교육","ESG 컨설팅"],"conf":"확인","global":false,"url":"https://hcg.kr/","ext":[],"grounded":true,"src":["https://hcg.kr/esg%EC%BB%A8%EC%84%A4%ED%8C%85/%EC%A7%80%EC%86%8D%EA%B0%80%EB%8A%A5%EA%B2%BD%EC%98%81%EB%B3%B4%EA%B3%A0%EC%84%9C/","https://hcg.kr/%ED%95%9C%ED%8F%89%EC%83%9Desg%EA%B5%90%EC%9C%A1%EC%9B%90/esg%EB%B3%B4%EA%B3%A0%EC%84%9C-%EA%B2%80%EC%A6%9D%EC%8B%AC%EC%82%AC%EC%9B%90-%EC%9E%90%EA%B2%A9%EA%B3%BC%EC%A0%95/"]},{"id":"c433","name":"BDO성현회계법인","sector":"ESG 공시·검증·자문","subsector":"회계법인","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"글로벌 회계·자문 네트워크 BDO 인터내셔널의 한국 회원사다. 회계감사와 세무, 재무자문에 더해 ESG센터를 두고 기업의 ESG 경영체계와 협력사(공급망) 평가체계를 구축·운영해준다. ESG 소비자 대응 전략 수립과 ESG 성과지표(KPI) 관리, ESG 보고서 인증 서비스도 제공한다.","tags":["ESG 보고서 인증","공급망 ESG 평가","ESG 경영체계 구축","ESG 공시 자문"],"conf":"확인","global":false,"url":"https://www.bdo.kr/","ext":[],"grounded":true,"src":["https://www.bdo.kr/ko-kr/%EC%84%9C%EB%B9%84%EC%8A%A4/%ED%8A%B9%EB%B3%84%EC%9E%90%EB%AC%B8-%EC%84%9C%EB%B9%84%EC%8A%A4/esg%EC%BB%A8%EC%84%A4%ED%8C%85","https://www.sejungilbo.com/news/articleView.html?idxno=43415"]},{"id":"c430","name":"EY한영","sector":"ESG 공시·검증·자문","subsector":"회계법인","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"비상장","desc":"기후변화·지속가능경영 서비스(CCaSS) 조직을 중심으로 2021년 회계감사·세무·컨설팅 등 여러 부문의 전문가를 모은 'ESG 임팩트 허브'를 출범시켰다. 기업의 ESG 전략 수립부터 신사업 개발까지 자문하며, IFRS S2 등 기후 관련 공시 기준에 맞춰 온실가스 배출량을 산정하고 공개하도록 지원한다.","tags":["ESG 공시 자문","지속가능성 보고 검증","기후변화 대응 자문","ESG 전략 컨설팅"],"conf":"확인","global":false,"url":"https://www.ey.com/ko_kr","ext":[],"grounded":true,"src":["https://www.newsis.com/view/NISX20210720_0001518978","https://www.ey.com/ko_kr/services/climate-change-sustainability-services","https://www.sedaily.com/NewsVIew/22OZIM978Z"]},{"id":"c432","name":"대주회계법인","sector":"ESG 공시·검증·자문","subsector":"회계법인","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"글로벌 회계·자문 네트워크 그랜트손튼(Grant Thornton)의 한국 회원사로, 147개국 700여 개 사무소 네트워크를 활용해 고객사에 자문을 제공한다. 2022년부터 ESG 분야에 진출해 기업의 ESG 전략 수립과 지속가능성 공시 대응 자문을 수행한다. 2024년에는 서강대 경제대학원과 ESG·탄소 회계시스템 구축 및 전문가 양성을 위한 업무협약을 맺었다.","tags":["ESG 공시 자문","ESRS 대응","ISSB 대응","지속가능경영 컨설팅"],"conf":"확인","global":false,"url":"https://www.grantthornton.kr","ext":[{"n":"한국ESG경영개발원","r
