OFC)로도 제품군을 넓히고 있다.","tags":["수소","연료전지","발전용","PAFC"],"conf":"확인","global":false,"url":"https://www.doosanfuelcell.com","ext":[{"n":"두산","rel":"계열"}],"grounded":true,"src":["https://www.doosanfuelcell.com/kr","https://ko.wikipedia.org/wiki/%EB%91%90%EC%82%B0%ED%93%A8%EC%96%BC%EC%85%80","https://www.pinpointnews.co.kr/news/articleView.html?idxno=454690"]},{"id":"c236","name":"범한퓨얼셀","sector":"기후·에너지","subsector":"수소·연료전지","type":"중견기업","scale":3,"founded":2019,"hq":"경남","listed":"코스닥","desc":"경남 창원에 자리한 수소연료전지 전문기업으로 2022년 코스닥에 상장했다. 잠수함에 들어가는 연료전지 모듈을 만들어 해군 차세대 잠수함인 장보고-III에 공급했고, 이후 예비품 공급 계약도 이어 가고 있다. 건물에 전기와 열을 공급하는 건물용 연료전지, 수소차에 수소를 채우는 충전소 구축 사업도 함께 수행한다.","tags":["수소","연료전지","수소충전소","잠수함"],"conf":"확인","global":false,"url":"https://bumhanfuelcell.com","ext":[{"n":"범한산업","rel":"계열"}],"grounded":true,"src":["https://www.digitaltoday.co.kr/news/articleView.html?idxno=447769","https://www.newswire.co.kr/newsRead.php?no=1038915&sourceType=rss","https://www.asiae.co.kr/article/2024122407401662182"]},{"id":"c237","name":"비나텍","sector":"기후·에너지","subsector":"수소·연료전지","type":"중소기업","scale":2,"founded":1999,"hq":"전북","listed":"코스닥","desc":"전기를 빠르게 저장했다가 필요한 순간 내보내는 에너지 저장장치인 슈퍼커패시터를 만들어 재생에너지 설비와 전기차 등에 공급한다. 수소연료전지의 핵심 소재·부품인 지지체와 촉매, 막전극접합체(MEA)도 함께 생산해 소재부터 부품까지 일괄 대응한다. 1999년 설립된 코스닥 상장 소재·부품 기업이다.","tags":["수소","연료전지 부품","슈퍼커패시터","MEA"],"conf":"확인","global":false,"url":"https://www.vinatech.com","ext":[],"grounded":true,"src":["https://www.vinatech.com/kr/","https://www.fnnews.com/news/202201070942010822","https://m.asiatime.co.kr/1065578743140677"]},{"id":"c238","name":"에스퓨얼셀","sector":"기후·에너지","subsector":"수소·연료전지","type":"중소기업","scale":2,"founded":2014,"hq":null,"listed":"코스닥","desc":"건물에 설치해 전기와 열을 함께 공급하는 고분자전해질(PEM) 방식 수소연료전지 시스템을 주력으로 만든다. 1kW급부터 50kW급까지 제품군을 갖췄고, 이 기술을 바탕으로 수소 모빌리티용 연료전지 파워팩과 수소 드론 등으로 사업을 넓히고 있다. 태양광 기업 에스에너지가 2014년 인수·설립한 회사로 2018년 코스닥에 상장했다.","tags":["수소","연료전지","건물용"],"conf":"확인","global":false,"url":"https://www.s-fuelcell.com","ext":[],"grounded":true,"src":["https://comp.fnguide.com/SVO2/ASP/SVD_Main.asp?gicode=A288620","https://www.industrynews.co.kr/news/articleView.html?idxno=40082","https://theviewers.co.kr/View.aspx?No=3354748"]},{"id":"c239","name":"일진하이솔루스","sector":"기후·에너지","subsector":"수소·연료전지","type":"대기업","scale":4,"founded":null,"hq":"전북","listed":"코스피","desc":"일진그룹 계열의 수소 저장·운송 장비 기업으로, 복합소재로 만든 타입4 고압 수소용기를 생산한다. 금속 용기보다 가볍고 높은 압력을 견뎌 수소차 연료탱크와 수소를 실어 나르는 튜브트레일러에 쓰인다. 2023년에는 450바 압력의 타입4 수소 튜브트레일러를 전주시에 공급했다.","tags":["수소","수소저장탱크","수소차"],"conf":"확인","global":false,"url":"https://www.hysolus.com","ext":[{"n":"일진그룹","rel":"계열"}],"grounded":true,"src":["https://www.electimes.com/news/articleView.html?idxno=330009","https://www.etnews.com/20210709000068","https://www.hankyung.com/article/202312084197Y"]},{"id":"c240","name":"지필로스","sector":"기후·에너지","subsector":"수소·연료전지","type":"중소기업","scale":2,"founded":2009,"hq":null,"listed":"비상장","desc":"연료전지가 만든 전기를 실제로 쓸 수 있는 형태로 바꿔주는 전력변환장치 기술에서 출발해, 남는 재생에너지 전력으로 물을 분해해 수소를 만드는 P2G(Power to Gas) 시스템 설계·구축으로 사업을 넓혔다. 알칼라인과 고분자전해질(PEM), 음이온교환막(AEM) 등 여러 방식의 수전해 설비를 다루며, 제주 상명 풍력발전 단지의 잉여 전력으로 그린수소를 생산하는 실증 사업을 수행했다. 2009년 설립됐다.","tags":["수소","전력변환","P2G","수전해"],"conf":"확인","global":false,"url":"http://www.g-philos.co.kr","ext":[],"grounded":true,"src":["https://h2news.kr/mobile/article.html?no=9910","http://www.energy-news.co.kr/news/articleView.html?idxno=79128","https://www.electimes.com/news/articleView.html?idxno=325847"]},{"id":"c241","name":"하이리움산업","sector":"기후·에너지","subsector":"수소·연료전지","type":"스타트업","scale":1,"founded":2014,"hq":null,"listed":"비상장","desc":"KIST(한국과학기술연구원) 원천기술을 바탕으로 액화수소의 생산·저장·운송 기술을 개발한 기업이다. 수소를 액체로 만들면 기체 상태보다 훨씬 작은 부피에 많은 양을 담을 수 있어 이동과 보관이 쉬워진다. 모빌리티용 초경량 액화수소 탱크와 이동식 액화수소 충전소를 만들고, 액화수소로 오래 비행하는 드론과 UAM·무인선박용 액화수소 파워팩을 공급한다. 2017년 액화수소 드론 비행에 성공했다.","tags":["액화수소","수소드론","저장탱크"],"conf":"확인","global":false,"url":"https://hylium-industries.com","ext":[],"grounded":true,"src":["https://www.h2news.kr/news/articleView.html?idxno=12489","https://www.inenews.kr/news/articleView.html?idxno=2315","https://hylium-industries.com/news_media/?bmode=view&idx=19392308","http://www.todayenergy.kr/news/articleView.html?idxno=239484"]},{"id":"c242","name":"그리드위즈","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"중소기업","scale":2,"founded":2013,"hq":"경기","listed":"코스닥","desc":"전력이 모자랄 때 공장·건물이 전기 사용을 줄이고 그 대가를 받는 수요반응(DR) 제도에서, 참여 고객을 모아 감축 자원을 관리하는 사업이 주력이다. 전기차 충전 등 이모빌리티와 에너지저장장치(ESS), 태양광 사업도 함께 운영하며 여기서 나오는 전력 데이터를 다룬다. 2013년 설립돼 2024년 6월 코스닥에 상장했다.","tags":["수요반응","DR","에너지 데이터","VPP"],"conf":"확인","global":false,"url":"https://www.gridwiz.com","ext":[],"grounded":true,"src":["https://m.edaily.co.kr/news/read?newsId=01351366638921720&mediaCodeNo=257","https://www.newspim.com/news/view/20240524000618","https://www.newsis.com/view/NISX20240614_0002772526"]},{"id":"c243","name":"나인와트","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"건물이 쓰는 에너지를 데이터로 분석해 어느 부분을 고치면 에너지와 탄소를 얼마나 줄일 수 있는지 진단해 주는 기업이다. 공공데이터와 건물 에너지 모델링을 결합해 건물별 에너지 효율 상태를 파악하고 개선 시나리오를 제시한다. 에너지 리노베이션 플랫폼 '와티(WATTI)', 도시 단위 에너지 소비 분석 서비스 'SAVE-E', 전기요금 절감용 'Insight-E' 등을 운영한다.","tags":["건물 에너지","빅데이터","에너지 효율"],"conf":"확인","global":false,"url":"https://ninewatt.com","ext":[],"grounded":true,"src":["https://ninewatt.com/ko/about","https://news.nate.com/view/20241107n27944","https://www.beyondpost.co.kr/view.php?ud=2024101811465667599aeda69934_30","https://gg-climatetechstartup.oopy.io/ninewatt"]},{"id":"c244","name":"루트에너지","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":2013,"hq":"서울","listed":"비상장","desc":"태양광·풍력 발전소를 짓고 운영하는 데 드는 자금을 여러 사람의 투자로 모으는 재생에너지 전문 크라우드펀딩 플랫폼을 운영한다. 설치 공간이나 초기 자본이 없어 발전사업에 참여하기 어려웠던 개인도 온라인으로 소액 투자할 수 있게 한 것이 핵심이다. 발전소 인근 주민이 직접 투자해 수익을 나눠 갖는 주민참여형 재생에너지 사업과, 기업이 쓰는 전기를 재생에너지로 바꾸는 RE100 전환 지원 사업도 함께 한다.","tags":["크라우드펀딩","주민참여","재생에너지 금융"],"conf":"확인","global":false,"url":"https://www.rootenergy.co.kr","ext":[],"grounded":true,"src":["https://www.rootenergy.co.kr/","https://www.venturesquare.net/751475/","https://netzero2050.or.kr/news/newsletter.php?ptype=view&code=newsletter&idx=454","https://www.industrynews.co.kr/news/articleView.html?idxno=50818"]},{"id":"c245","name":"브이젠","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"태양광·풍력처럼 여기저기 흩어진 소규모 발전 설비를 클라우드 소프트웨어로 묶어 하나의 발전소처럼 통합 관리하는 가상발전소(VPP) 소프트웨어 기업이다. 자체 개발한 'K-VPP' 솔루션은 인공지능 예측 기술로 발전량을 미리 계산해 발전소들을 통합 관제한다. 2021년에는 발전공기업이 보유한 태양광·풍력·ESS·연료전지 등 58개 발전소를 아우르는 가상발전소 솔루션 공급계약을 맺었다.","tags":["VPP","분산에너지","플랫폼"],"conf":"확인","global":false,"url":"https://vgen.co.kr","ext":[],"grounded":true,"src":["https://www.ikld.kr/news/articleView.html?idxno=230890","http://vgen.co.kr/","http://vgen.co.kr/38","https://platum.kr/archives/158297"]},{"id":"c246","name":"브이피피랩","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"포스코에너지의 첫 사내벤처로 출발해 제주에서 설립된 재생에너지 IT 기업이다. 인공지능으로 태양광·풍력 발전소의 발전량과 수요를 예측하고, 흩어진 소규모 발전 자원을 하나의 발전소처럼 묶어 전력시장에 대신 팔아 주는 소규모 전력중개 플랫폼 '플로우(flow)'를 운영한다. 국내 최대 재생에너지 시장인 제주를 기반으로 전국의 분산 발전 자원을 대상으로 서비스한다.","tags":["VPP","발전량 예측","전력중개"],"conf":"확인","global":false,"url":"https://www.vpplab.kr","ext":[],"grounded":true,"src":["https://www.investkorea.org/jj-kr/bbs/i-2597/detail.do?ntt_sn=32","https://www.newswire.co.kr/newsRead.php?no=946936","https://www.todayenergy.kr/news/articleView.html?idxno=278286","http://dcamp.kr/news/story/7320"]},{"id":"c247","name":"식스티헤르츠","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":2020,"hq":"서울","listed":"비상장","desc":"전국에 흩어진 태양광·풍력 설비의 발전량을 예측해 지도 위에 보여주는 '햇빛바람지도' 서비스를 만든 기후테크 기업이다. 전국 약 13만 개의 태양광·풍력·에너지저장장치(ESS)를 하나의 가상발전소(VPP)로 연결해 관리하는 소프트웨어를 개발한다. 기상 빅데이터 처리 시스템을 만들어 재생에너지 발전량 예측에 활용하고 있다.","tags":["VPP","발전량 예측","소프트웨어"],"conf":"확인","global":false,"url":"https://60hz.io","ext":[],"grounded":true,"src":["https://map.60hz.io/","https://www.industrynews.co.kr/news/articleView.html?idxno=51982","https://home.kepco.co.kr/kepco/front/html/WZ/2023_05_06/sub3_3.html","https://netzero2050.or.kr/news/newsletter.php?ptype=view&idx=455&page=2&code=newsletter"]},{"id":"c248","name":"에너닷","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"태양광 발전소 운영에 필요한 데이터를 다루는 재생에너지 IT 기업이다. AI 기반 태양광 발전소 통합 모니터링 서비스 '썬디(Sundy)'와 플랫폼 '엔비전(envision)'을 통해 발전소 원격 제어, 디지털 유지보수(O&M), 전력중개, 발전 법인 자산관리, 전력거래 정산을 지원한다. 대규모 신재생에너지 발전사업자와 에너지 공기업, RE100 이행을 준비하는 기업이 주 고객이다.","tags":["VPP","태양광 관리","에너지 IT"],"conf":"확인","global":false,"url":"https://www.enerdot.co.kr","ext":[],"grounded":true,"src":["https://www.energy-news.co.kr/news/articleView.html?idxno=78306","https://magazine.hankyung.com/job-joy/article/202006259394b","https://www.enerdot.co.kr/"]},{"id":"c249","name":"에이치에너지","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":2017,"hq":null,"listed":"비상장","desc":"시민이 조합원으로 참여해 자금을 모으고 그 돈으로 전국의 지붕형 태양광 발전소를 짓는 재생에너지 투자 플랫폼 '모햇'을 운영한다. 발전소에서 나온 수익은 약정 이자 형태로 투자자에게 돌아가며, 누적 투자금은 5천억 원을 넘어섰다. 인공지능을 활용해 사업장의 에너지저장장치(ESS) 운영을 최적화하고 자가용 태양광의 남는 전기를 중개시장에 거래해주는 사업도 함께 한다.","tags":["공유 태양광","에너지 투자","모햇"],"conf":"확인","global":false,"url":"https://www.henergy.xyz","ext":[],"grounded":true,"src":["https://platum.kr/archives/289565","https://www.venturesquare.net/1093195","https://www.venturesquare.net/1035265"]},{"id":"c250","name":"엔라이튼","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":2016,"hq":"서울","listed":"비상장","desc":"솔라커넥트에서 사명을 바꾼 에너지 IT 플랫폼 기업이다. 태양광 발전소를 짓고 운영하는 데 필요한 사업성 검토와 금융 자문, 시공, 모듈·인버터 등 기자재 유통, 발전소 자산관리(O&M)까지 전 과정의 참여자를 연결한다. AI 기반 태양광 자산관리 플랫폼 '발전왕'은 전국 2만 9,500여 개 발전소에서 실시간 발전 데이터를 모으며 등록 용량이 누적 7GW를 넘었다.","tags":["에너지 플랫폼","태양광","발전왕","전력중개"],"conf":"확인","global":false,"url":"https://www.solarconnect.kr","ext":[],"grounded":true,"src":["https://www.newswire.co.kr/newsRead.php?no=938028","https://www.electimes.com/news/articleView.html?idxno=227787","https://www.solartodaymag.com/news/articleView.html?idxno=20571"]},{"id":"c251","name":"인코어드테크놀로지스","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":2013,"hq":"서울","listed":"비상장","desc":"전력 사용 데이터를 초 단위로 수집·분석하는 에너지 AI 기업이다. 스마트 계량기 '에너톡'은 15분 단위이던 기존 계량 방식과 달리 실시간 전기 사용 패턴을 클라우드에 담아 요금 누진 단계 알림, 사용량 예측, 베란다 태양광 발전량 확인 등을 제공한다. 통합 에너지 플랫폼 '아이리스에너지'에서는 생성형 AI로 기업의 재생에너지 전력구매계약(PPA) 비용과 계약 용량을 자동 분석하는 서비스를 운영한다.","tags":["에너지 AI","IoT","발전량 예측"],"conf":"확인","global":false,"url":"https://www.encoredtech.com","ext":[],"grounded":true,"src":["https://www.industrynews.co.kr/news/articleView.html?idxno=65453","https://enertalk.kr/","https://thevc.kr/encoredtechnologies"]},{"id":"c252","name":"해줌","sector":"기후·에너지","subsector":"에너지 IT·VPP·DR","type":"스타트업","scale":1,"founded":2012,"hq":"서울","listed":"비상장","desc":"인공위성 기상 데이터와 AI로 태양광 발전량을 예측하는 에너지 IT 기업이다. 모니터링 서비스 '내일의발전'은 정지궤도 위성 천리안 2호 데이터를 활용해 발전소의 예상 발전량과 실제 발전량을 보여주고 가정용 태양광 설비도 관리할 수 있게 한다. 하루 전·한 시간 전 입찰에 맞춘 발전량 예측 API도 제공해, 발전량을 미리 알리고 정확도에 따라 정산받는 소규모 전력중개 사업에 쓰인다.","tags":["VPP","태양광 예측","전력중개"],"conf":"확인","global":false,"url":"https://haezoom.com","ext":[],"grounded":true,"src":["https://www.todayenergy.kr/news/articleView.html?idxno=225480","https://www.industrynews.co.kr/news/articleView.html?idxno=44127","https://www.haezoom.io/api/"]},{"id":"c253","name":"소프트베리","sector":"기후·에너지","subsector":"친환경 모빌리티·충전","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"전기차 충전소 정보 앱 'EV인프라'를 운영하는 충전 플랫폼 기업이다. 전국 충전소의 위치와 사용 가능 여부를 실시간으로 확인하고 충전 요금을 앱에서 간편 결제할 수 있게 해, 사업자마다 흩어져 있는 충전 인프라를 하나의 화면으로 묶어준다. SK와 현대자동차 제로원 등이 참여한 80억 원 규모의 시리즈A 투자를 유치했다.","tags":["전기차 충전","앱","충전 데이터"],"conf":"확인","global":false,"url":"https://www.soft-berry.co","ext":[],"grounded":true,"src":["https://www.industrynews.co.kr/news/articleView.html?idxno=48652","https://www.electimes.com/news/articleView.html?idxno=227704","https://www.thebell.co.kr/free/content/ArticleView.asp?key=202410212111101920102283"]},{"id":"c254","name":"스칼라데이터","sector":"기후·에너지","subsector":"친환경 모빌리티·충전","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"전기차 충전 앱 '모두의충전'을 운영하는 기업이다. 여러 충전사업자의 충전기 정보를 한 앱에 모아 위치와 상태를 확인하게 하고, 통합 결제 서비스 '모두페이'로 사업자마다 다른 회원카드 없이 충전 요금을 낼 수 있도록 한다. NFC를 활용해 충전 인증 방식을 개선하는 기술도 개발하고 있으며, 2022년 GS에너지로부터 30억 원 규모의 투자를 유치했다.","tags":["전기차 충전","플랫폼","충전 데이터"],"conf":"확인","global":false,"url":"https://evmodu.kr","ext":[{"n":"GS에너지","rel":"투자"}],"grounded":true,"src":["https://platum.kr/archives/198591","https://www.venturesquare.net/869314","https://thevc.kr/scalardata"]},{"id":"c255","name":"에버온","sector":"기후·에너지","subsector":"친환경 모빌리티·충전","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"완속 충전기를 중심으로 전국 1만5000기가 넘는 전기차 충전 설비를 운영하는 충전사업자(CPO)다. 충전기 상태를 원격으로 감시하고 정비하는 자체 운영 체계를 갖췄으며, 이용자용 앱으로 충전기 검색과 결제를 지원한다. 2012년 LG CNS의 전기차 충전 자회사로 출발해 2016년 독립했고, 2026년 7월 코스닥 상장 예비심사를 신청했다.","tags":["전기차 충전","충전 사업자","IPO"],"conf":"확인","global":false,"url":"https://www.everon.co.kr","ext":[],"grounded":true,"src":["https://www.etoday.co.kr/news/view/2604695","https://www.newspim.com/news/view/20260720001021","https://www.everon.co.kr/notice"]},{"id":"c256","name":"채비","sector":"기후·에너지","subsector":"친환경 모빌리티·충전","type":"스타트업","scale":1,"founded":2016,"hq":"서울","listed":"비상장","desc":"전기차 충전기를 직접 개발·제조하고 설치와 관제센터 운영, 결제 서비스까지 함께 제공하는 전기차 충전 기업이다. 7kW 완속충전기부터 50·100·200kW 급속충전기, 400kW 초고속 충전기까지 폭넓은 제품군을 자체 기술로 개발해 충전 사업자로서 충전소를 직접 운영한다. 2024년 1월 기존 사명 '대영채비'를 '채비'로 변경했다.","tags":["전기차 충전","급속충전","제조"],"conf":"확인","global":false,"url":"https://chaevi.com","ext":[],"grounded":true,"src":["https://www.idaegu.com/newsView/idg202206220042","https://www.tago.kr/charge/company/chaevi.htm","https://thevc.kr/chaevi"]},{"id":"c257","name":"플러그링크","sector":"기후·에너지","subsector":"친환경 모빌리티·충전","type":"스타트업","scale":1,"founded":2021,"hq":"서울","listed":"비상장","desc":"아파트 등 공동주택을 중심으로 전기차 완속 충전 인프라를 직접 설치하고 운영하는 기업이다. 블루투스 기반 특허 기술로 차종에 관계없이 충전기를 꽂으면 인증과 결제가 자동으로 이뤄지는 서비스를 제공하고, 24시간 원격 모니터링으로 화재 등 이상 상황에 대응한다. 2025년 한화솔루션의 전기차 충전 사업 부문을 인수해 운영 기반을 넓혔다.","tags":["전기차 충전","완속충전","인프라"],"conf":"확인","global":false,"url":"https://pluglink.kr","ext":[],"grounded":true,"src":["https://pluglink.kr/en","https://demoday.co.kr/bm-analysis/290","https://www.electimes.com/news/articleView.html?idxno=363935"]},{"id":"c258","name":"HD현대에너지솔루션","sector":"기후·에너지","subsector":"태양광","type":"대기업","scale":4,"founded":2016,"hq":"경기","listed":"코스피","desc":"태양광 셀과 모듈을 직접 만들어 파는 HD현대 계열사다. 셀 400MW, 모듈 1.3GW 규모 생산설비를 갖추고 셀에서 모듈까지 이어지는 수직계열 생산 체계를 운영한다. 빛을 전기로 바꾸는 효율을 높인 N타입 토프콘(TOPCon) 방식의 고효율 제품이 주력이며, 국내 생산라인에서 만든 셀을 미국 모듈 제조사에 수출하기도 했다.","tags":["태양광","모듈","HD현대"],"conf":"확인","global":false,"url":"https://www.hd-hyundaies.co.kr","ext":[{"n":"HD현대","rel":"계열"}],"grounded":true,"src":["https://www.hd-hyundaies.co.kr/","https://www.hd-hyundaies.co.kr/company/news.do","https://www.theguru.co.kr/news/article.html?no=104890","https://newenergyinfo.kr/18/?idx=21557767&bmode=view"]},{"id":"c259","name":"OCI홀딩스","sector":"기후·에너지","subsector":"태양광","type":"대기업","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"OCI그룹의 지주회사로, 자회사를 통해 태양광 패널의 기초 소재인 폴리실리콘 사업을 운영한다. 말레이시아 생산법인에서 순도가 매우 높은 고순도 폴리실리콘을 만들어 국내외 태양광 업체에 공급한다. 폴리실리콘 외에 에너지솔루션, 도시개발 등 여러 사업 자회사를 거느린 지주 구조를 갖추고 있다.","tags":["태양광","폴리실리콘","소재"],"conf":"확인","global":false,"url":"https://www.oci-holdings.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/OCI홀딩스","https://www.oci-holdings.co.kr/business/green-energy","https://www.thebell.co.kr/front/newsview.asp?key=202211241638055960105485"]},{"id":"c260","name":"SK이터닉스","sector":"기후·에너지","subsector":"태양광","type":"중견기업","scale":3,"founded":2024,"hq":"서울","listed":"코스닥","desc":"2024년 SK디앤디의 에너지 사업 부문이 인적분할해 출범한 재생에너지 전문기업이다. 분할 이후 SK디앤디는 부동산을, SK이터닉스는 친환경 발전사업을 맡는 구조가 됐다. 태양광·풍력 발전단지와 연료전지 발전소를 개발해 운영하고, 남는 전기를 저장했다가 필요할 때 쓰는 ESS 사업도 한다.","tags":["재생에너지","디벨로퍼","연료전지 발전"],"conf":"확인","global":false,"url":"https://www.sketernix.com","ext":[{"n":"KKR","rel":"투자"}],"grounded":true,"src":["https://m.thebell.co.kr/m/newsview.asp?svccode=&newskey=202405261737111160102355","https://www.h2news.kr/news/articleView.html?idxno=12328"]},{"id":"c261","name":"브라이트에너지파트너스","sector":"기후·에너지","subsector":"태양광","type":"스타트업","scale":1,"founded":2018,"hq":"서울","listed":"비상장","desc":"태양광을 중심으로 배터리 에너지저장장치(BESS)와 풍력까지 재생에너지 발전소를 개발하고 장기 운영하는 기업이다. 전국 300곳이 넘는 태양광 발전소에서 생산한 전기와 신재생에너지공급인증서(REC)를 재생에너지 구매가 필요한 국내 기업에 판매한다. 2021년 8월 첫 투자 이후 세계 최대 자산운용사 블랙록이 누적 3,810억 원을 투자했고, 이 자금은 태양광 포트폴리오 1GW 이상 확대와 전기차 급속충전 인프라, BESS 확보에 쓰인다.","tags":["태양광","발전소 운영","IPP","블랙록"],"conf":"확인","global":false,"url":"https://bep.co.kr","ext":[{"n":"블랙록","rel":"투자"}],"grounded":true,"src":["https://www.sedaily.com/NewsView/2DBSDC3XSN","https://zdnet.co.kr/view/?no=20240718092009","https://m.ekn.kr/view.php?key=20240718027378802"]},{"id":"c262","name":"신성이엔지","sector":"기후·에너지","subsector":"태양광","type":"중견기업","scale":3,"founded":1977,"hq":null,"listed":"코스피","desc":"반도체·디스플레이 공장처럼 미세먼지 하나 없는 생산 환경이 필요한 곳에 클린룸 설비를 설계·구축하는 코스피 상장 기업이다. 이차전지 생산 공정에 필요한 극도로 건조한 공간을 만드는 드라이룸 사업도 수행한다. 여기에 태양광 모듈을 제조하고 태양광 발전 시스템을 구축하는 재생에너지 사업을 함께 하고 있다.","tags":["태양광","모듈","클린룸"],"conf":"확인","global":false,"url":"https://www.shinsungeng.com","ext":[],"grounded":true,"src":["https://zdnet.co.kr/view/?no=20260206151851","https://m.ddaily.co.kr/page/view/2026031614222029276"]},{"id":"c263","name":"에스에너지","sector":"기후·에너지","subsector":"태양광","type":"중견기업","scale":3,"founded":2001,"hq":"서울","listed":"코스닥","desc":"2001년 설립돼 2007년 코스닥에 상장한 태양광 전문기업이다. 태양전지 모듈을 직접 만들고, 발전소를 개발해 짓는 EPC부터 준공 뒤 고장을 살피고 성능을 관리하는 O&M까지 한 회사에서 수행한다. 자회사 에스퓨얼셀을 통해 수소연료전지 사업도 함께 하고 있다.","tags":["태양광","모듈","EPC"],"conf":"확인","global":false,"url":"https://www.s-energy.com","ext":[],"grounded":true,"src":["http://www.businessreport.kr/news/articleView.html?idxno=44897","http://knnws.com/news/view.php?idx=12908","https://www.etoday.co.kr/news/view/2575970"]},{"id":"c264","name":"한화솔루션","sector":"기후·에너지","subsector":"태양광","type":"대기업","scale":4,"founded":2020,"hq":"서울","listed":"코스피","desc":"한화그룹 계열의 화학·에너지 기업으로 큐셀 부문에서 태양광 셀과 모듈을 만들어 판매한다. 셀은 빛을 전기로 바꾸는 부품이고, 이를 여러 장 묶어 판 형태로 만든 것이 모듈이다. 국내 발전사업용 모듈을 공급하는 한편 미국 조지아주에는 잉곳·웨이퍼·셀·모듈을 한곳에서 생산하는 거점을 두고 있다. 토프콘(TOPCon) 기술을 적용한 큐트론 시리즈가 대표 제품이다.","tags":["태양광","셀·모듈","큐셀","재생에너지"],"conf":"확인","global":false,"url":"https://www.hanwhasolutions.com","ext":[{"n":"한화","rel":"계열"}],"grounded":true,"src":["https://www.hanwha.co.kr/newsroom/media_center/news/news_view.do?seq=15717","https://biz.heraldcorp.com/article/10767845","https://www.mtnews.net/news/articleView.html?idxno=17888"]},{"id":"c265","name":"SK오션플랜트","sector":"기후·에너지","subsector":"풍력","type":"대기업","scale":4,"founded":null,"hq":"경남","listed":"코스피","desc":"바다에 세우는 풍력발전기를 아래에서 떠받치는 하부구조물(재킷)을 만드는 SK그룹 계열사다. 경남 고성에 기반을 두고 있으며, 하부구조물의 기본 자재인 두꺼운 강관을 2000년 국내에서 처음 국산화했고 2020년에는 국내 기업 중 처음으로 해상풍력 재킷을 수출했다. 대만 해상풍력 프로젝트 등 해외에도 구조물을 공급하며, 고성에 대규모 해상풍력 생산기지를 추가로 조성하고 있다.","tags":["해상풍력","하부구조물","재킷"],"conf":"확인","global":false,"url":"https://www.skoceanplant.com","ext":[{"n":"코리오제너레이션","rel":"협력"}],"grounded":true,"src":["https://ko.wikipedia.org/wiki/SK오션플랜트","https://www.skoceanplant.com/bbs/board.php?bo_table=05_01&wr_id=111","https://www.ferrotimes.com/news/articleView.html?idxno=35108"]},{"id":"c266","name":"대명에너지","sector":"기후·에너지","subsector":"풍력","type":"중견기업","scale":3,"founded":2000,"hq":"서울","listed":"코스닥","desc":"2000년 설립돼 2022년 코스닥에 상장한 재생에너지 기업이다. 풍력·태양광 발전단지를 사업 개발 단계부터 설계·조달·시공, 준공 뒤 운영관리(O&M)까지 직접 수행하는 것이 특징이다. 전기를 저장했다가 쓰는 ESS 연계 사업으로도 영역을 넓히고 있다.","tags":["풍력","태양광","디벨로퍼"],"conf":"확인","global":false,"url":"https://www.daemyoung-eng.com","ext":[],"grounded":true,"src":["https://www.metroseoul.co.kr/article/20220223500373","https://www.the-stock.kr/news/articleView.html?idxno=15815","https://www.dailyinvest.kr/news/articleView.html?idxno=65802"]},{"id":"c267","name":"베스타스","sector":"기후·에너지","subsector":"풍력","type":"해외 대표","scale":4,"founded":1945,"hq":"덴마크","listed":null,"desc":"덴마크 오르후스에 본사를 둔 풍력터빈 제조사다. 육상·해상 풍력터빈을 설계·생산해 설치하고, 가동 중인 터빈의 날개 점검, 기어박스 교체, 발전기 수리 같은 유지보수와 수명이 다한 설비의 해체까지 맡는다. 해상용으로는 15MW급 V236 기종을 내놓았으며, 풍력 발전 프로젝트 개발에도 참여한다.","tags":["풍력터빈","제조","글로벌"],"conf":"확인","global":true,"url":"https://www.vestas.com","ext":[],"grounded":true,"src":["https://www.vestas.com/en","https://www.vestas.com/en/energy-solutions/offshore-wind-turbines","https://www.vestas.com/en/energy-solutions/offshore-wind-turbines/V236-15MW"]},{"id":"c268","name":"씨에스윈드","sector":"기후·에너지","subsector":"풍력","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"코스피","desc":"풍력발전기를 떠받치는 풍력타워를 만드는 기업으로 2003년 굴뚝 제작에서 풍력타워로 사업을 전환했다. 베트남, 미국, 포르투갈, 중국, 튀르키예, 대만에 생산법인을 두고 육상과 해상 풍력타워를 공급한다. 2023년 유럽 해상풍력 하부구조물 기업 블라트 인더스트리를 인수해 바다에 구조물을 고정하는 모노파일 등도 공급한다.","tags":["풍력","풍력타워","해상풍력"],"conf":"확인","global":false,"url":"https://www.cswind.com","ext":[],"grounded":true,"src":["https://www.cswind.com/company_information/about_us/","https://ko.wikipedia.org/wiki/씨에스윈드","https://cswind.com/company_information/history/"]},{"id":"c269","name":"오스테드","sector":"기후·에너지","subsector":"풍력","type":"해외 대표","scale":4,"founded":null,"hq":"덴마크","listed":null,"desc":"덴마크의 해상풍력 기업으로, 바다에 풍력발전단지를 개발해 짓고 직접 운영한다. 유럽을 중심으로 대만·호주 등 아시아태평양으로 사업을 넓혔다. 한국에서는 2023년 11월 산업통상자원부로부터 인천 앞바다 해상풍력 사업의 개발 권한을 확보했고, 이후 한국남동발전·포스코그룹과 공동개발 협력을 맺었다.","tags":["해상풍력","디벨로퍼","글로벌"],"conf":"확인","global":true,"url":"https://orsted.com","ext":[],"grounded":true,"src":["https://orsted.kr/en/news/2023/11/incheon-project","https://orsted.kr/ko/news/2024/02/orsted-and-incheon-city-join-forces-to-revitalise-incheon-economy","https://www.asiae.co.kr/article/2025092609145109825"]},{"id":"c270","name":"유니슨","sector":"기후·에너지","subsector":"풍력","type":"중소기업","scale":2,"founded":1984,"hq":"경남","listed":"코스닥","desc":"바람의 힘으로 전기를 만드는 풍력발전기와 이를 떠받치는 풍력타워를 직접 제조하는 기업이다. 750kW급부터 4.5MW급까지 다양한 용량의 풍력발전시스템을 경상남도 사천 공장에서 생산하며, 바다와 접한 입지를 활용해 대형 설비를 운송·수출한다. 발전기 판매에 그치지 않고 풍력발전단지의 설치·시공까지 수행하는 코스닥 상장사다.","tags":["풍력","풍력터빈","제조"],"conf":"확인","global":false,"url":"https://www.unison.co.kr","ext":[],"grounded":true,"src":["https://www.unison.co.kr/","https://www.pinpointnews.co.kr/news/articleView.html?idxno=394993","http://www.dailyinvest.kr/news/articleView.html?idxno=52680"]},{"id":"c271","name":"효성중공업","sector":"기후·에너지","subsector":"풍력","type":"대기업","scale":4,"founded":2018,"hq":"서울","listed":"코스피","desc":"효성그룹의 중공업 계열사로 변압기·차단기 등 전력망에 쓰이는 설비를 만들고 건설업도 함께 한다. 국내와 아시아에서 처음으로 765kV급 초고압 변압기를 개발해 북미·중남미·인도 등에 공급해 왔다. 수소차 충전 설비 사업도 벌여 정부세종청사, 국회, 고속도로 휴게소 등에 수소충전소를 공급했고, 태양광·풍력처럼 출력이 수시로 변하는 재생에너지의 전압을 안정시키는 STATCOM 설비 기술도 보유한다.","tags":["풍력","중전기기","수소충전소"],"conf":"확인","global":false,"url":"https://www.hyosungheavyindustries.com","ext":[{"n":"효성","rel":"계열"}],"grounded":true,"src":["https://www.hyosungheavyindustries.com/kr","https://www.hyosungheavyindustries.com/kr/business/gas_filling_station.do","https://www.hyosungheavyindustries.com/kr/business/power-products/P010101","https://news.mt.co.kr/mtview.php?no=2021062910221891048"]},{"id":"c272","name":"서스틴베스트","sector":"탄소·ESG","subsector":"ESG 평가·데이터","type":"중소기업","scale":2,"founded":2006,"hq":"서울","listed":"비상장","desc":"기업이 환경·사회·지배구조(ESG) 측면에서 얼마나 잘 관리되고 있는지를 자체 개발한 평가모델로 분석해 연기금·자산운용사 등 기관투자자에게 제공한다. 주주총회 안건을 검토해 찬반 의견을 제시하는 의결권 자문, 주주관여, 사회책임투자(SRI) 전략 컨설팅도 함께 수행한다. 2006년 설립됐다.","tags":["ESG 평가","의결권 자문","책임투자"],"conf":"확인","global":false,"url":"https://www.sustinvest.com","ext":[],"grounded":true,"src":["https://sustinvest.com/service","https://www.sustinvest.com/stewardship-code","https://www.greened.kr/news/articleView.html?idxno=292675"]},{"id":"c273","name":"아이이에스지","sector":"탄소·ESG","subsector":"ESG 평가·데이터","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"AI와 빅데이터로 기업의 ESG(환경·사회·지배구조) 정보를 모아 관리하는 기업용 솔루션을 만든다. 나라와 기관마다 형식이 제각각인 ESG 규제 문서를 AI로 구조화해 기업이 대외 공시에 바로 활용할 수 있게 하며, 진단·데이터 수집 등 7개 모듈로 솔루션을 구성했다. 포스코그룹 사내벤처로 출발해 2022년 분사했다.","tags":["ESG 데이터","공시","솔루션"],"conf":"추정","global":false,"url":"https://www.i-esg.io","ext":[],"grounded":true,"src":["https://zdnet.co.kr/view/?no=20241008084244","https://www.startuptoday.kr/news/articleView.html?idxno=50237","https://www.i-esg.io/"]},{"id":"c274","name":"지속가능발전소","sector":"탄소·ESG","subsector":"ESG 평가·데이터","type":"스타트업","scale":1,"founded":2013,"hq":"서울","listed":"비상장","desc":"기업의 재무제표에 드러나지 않는 ESG(환경·사회·지배구조) 정보를 인공지능으로 분석해 투자자와 기업에 제공한다. 'ESG 로보애널리스트'를 표방하는 후즈굿(Who's Good)은 사람이 일일이 조사하는 대신 알고리즘이 데이터를 자동 수집·평가해 기업별 ESG 성과 리포트를 낸다. 지속가능성 회계기준위원회(SASB) 라이선스를 보유해 업종별로 중요한 이슈에 가중치를 두고 평가한다.","tags":["ESG 데이터","AI","후즈굿"],"conf":"확인","global":false,"url":"https://www.whosgood.org","ext":[],"grounded":true,"src":["https://whosgood.org/","https://blog.rocketpunch.com/2019/06/28/whosgood/","https://www.nextunicorn.kr/company/07dafb23a581e584"]},{"id":"c275","name":"한국ESG기준원","sector":"탄소·ESG","subsector":"ESG 평가·데이터","type":"공공·연구","scale":3,"founded":2002,"hq":"서울","listed":null,"desc":"상장회사와 금융회사 약 900곳을 대상으로 환경·사회·지배구조(ESG) 등급을 매기는 평가기관으로, 이전 이름은 한국기업지배구조원이다. 2002년부터 기업지배구조 평가를 시행해 왔고 등급은 S부터 D까지 7개로 나뉜다. ESG 모범규준과 스튜어드십 코드를 만들고, 2012년부터는 기관투자자를 위한 주주총회 안건 분석과 의결권 자문 서비스도 제공한다.","tags":["ESG 평가","ESG 등급","지배구조"],"conf":"확인","global":false,"url":"https://www.cgs.or.kr","ext":[],"grounded":true,"src":["https://www.cgs.or.kr/business/esg_tab01.jsp","https://www.cgs.or.kr/about/organization.jsp","https://www.cgs.or.kr/business/esg_tab04.jsp"]},{"id":"c276","name":"한국ESG연구소","sector":"탄소·ESG","subsector":"ESG 평가·데이터","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"대신파이낸셜그룹 계열 대신경제연구소의 자회사로 2021년 출범한 ESG 리서치 기관이다. 연기금·자산운용사 등 기관투자자를 대상으로 투자 대상 기업의 환경·사회·지배구조 성과를 평가한다. 상장기업 주주총회에 올라온 안건을 분석해 어떻게 의결권을 행사할지 조언하는 의결권 자문도 주력 서비스다.","tags":["ESG 평가","의결권 자문","리서치"],"conf":"확인","global":false,"url":"https://www.kesgresearch.com","ext":[{"n":"대신파이낸셜그룹","rel":"계열"}],"grounded":true,"src":["https://kesgresearch.com/","https://fg.daishin.com/group/group/child/child_info10.html"]},{"id":"c277","name":"에코네트워크","sector":"탄소·ESG","subsector":"ESG·기후 컨설팅","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"기업과 공공기관을 대상으로 온실가스 배출량 관리, 탄소배출권 거래, 기후 리스크 분석과 기후 관련 정보 공시 대응 등을 자문하는 기후·환경 컨설팅 기업이다. 자문에만 머물지 않고 재생에너지 발전과 해외 온실가스 감축사업을 직접 투자·개발하는 사업 부문도 함께 운영한다.","tags":["기후변화","탄소배출권","컨설팅"],"conf":"추정","global":false,"url":"https://www.econetwork.co.kr","ext":[],"grounded":true,"src":["https://www.econetwork.co.kr/","http://econetwork.co.kr/?page_id=246","http://www.dailyimpact.co.kr/news/articleView.html?idxno=29309"]},{"id":"c278","name":"에코시안","sector":"탄소·ESG","subsector":"ESG·기후 컨설팅","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"기업·기관·지자체가 배출하는 온실가스를 산정해 목록으로 정리하고, 배출권거래제 등 정부 규제에 대응하도록 돕는 컨설팅을 수행한다. 공장·건물의 에너지 사용 실태를 점검하는 에너지 진단과 신재생에너지 사업도 함께 다룬다. 배출량 계산과 배출권 거래 기록을 관리하는 자체 IT 시스템을 개발해 제공한다.","tags":["ESG 컨설팅","탄소배출권","에너지 진단"],"conf":"확인","global":false,"url":"https://www.ecosian.com","ext":[],"grounded":true,"src":["https://www.ecosian.com/index","https://ecosian.com/service/consulting/carbon","https://his.pusan.ac.kr/bbs/pnuenv/2718/825337/download.do"]},{"id":"c279","name":"에코앤파트너스","sector":"탄소·ESG","subsector":"ESG·기후 컨설팅","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"정부·기업·금융기관을 대상으로 탄소중립과 ESG 경영 전략을 세우고 이행을 자문하는 기후·환경 전문 컨설팅 기업이다. 기업이 직접 태우는 연료부터 협력사와 제품 사용 단계까지 이어지는 온실가스 배출량을 산정하고 외부 검증에 대응하는 업무를 맡는다. 공급망 탄소관리 전략 수립과 관련 IT 시스템 구축도 함께 제공한다.","tags":["기후 컨설팅","탄소중립","ESG 전략","환경컨설팅","ESG","기후변화"],"conf":"확인","global":false,"url":"http://www.eco-partners.co.kr","ext":[],"grounded":true,"src":["http://www.eco-partners.co.kr/","https://esgko.com/%EC%A3%BC%EC%97%90%EC%BD%94%EC%95%A4%ED%8C%8C%ED%8A%B8%EB%84%88%EC%8A%A4-%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94%EB%8C%80%EC%9D%91-%EC%A7%80%EC%86%8D%EA%B0%80%EB%8A%A5%EA%B2%BD%EC%98%81-esg/"]},{"id":"c280","name":"한국생산성본부","sector":"탄소·ESG","subsector":"ESG·기후 컨설팅","type":"공공·연구","scale":3,"founded":1957,"hq":"서울","listed":null,"desc":"1957년 재단법인으로 설립되어 1986년 산업발전법 제정에 따라 특별법인으로 전환된 교육·컨설팅 전문기관이다. 생산성 연구조사와 교육훈련, 컨설팅, 지수 조사·발표, 자격인증 업무를 수행한다. 지속가능경영추진단을 두고 기업의 ESG 수준 진단과 전략 수립, 운영체계 구축, 지속가능경영보고서 발간·검증까지 지원한다.","tags":["ESG 컨설팅","교육","지속가능경영"],"conf":"확인","global":false,"url":"https://www.kpc.or.kr","ext":[],"grounded":true,"src":["https://www.kpc.or.kr/","https://onkpc.or.kr/e-kpc/front/ekpc/institution.jsp","http://kesg.kr/"]},{"id":"c281","name":"그리너리","sector":"탄소·ESG","subsector":"배출권·탄소크레딧","type":"스타트업","scale":1,"founded":2021,"hq":"서울","listed":"비상장","desc":"기업과 개인이 온실가스를 줄인 실적을 크레딧으로 만들어 사고팔 수 있는 자발적 탄소시장 플랫폼 '팝플(POPLE)'을 운영한다. 팝플은 감축 크레딧의 발행부터 거래까지를 한 곳에서 처리한다. 제품이 만들어져 폐기되기까지의 환경영향을 계산하는 전과정평가(LCA)를 자동화한 솔루션 '엔비온(ENVION)'과 탄소발자국 모니터링·컨설팅 사업도 함께 한다.","tags":["탄소크레딧","자발적 탄소시장","팝플"],"conf":"확인","global":false,"url":"https://www.greenery.im","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/202204226597i","https://www.pressian.com/pages/articles/2022120612444205947","https://www.rocketpunch.com/companies/greenery"]},{"id":"c282","name":"나무이엔알","sector":"탄소·ESG","subsector":"배출권·탄소크레딧","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"탄소배출권 시장 분석과 온실가스 감축사업 컨설팅을 수행하는 배출권 전문기업.","tags":["탄소배출권","시장 분석","컨설팅"],"conf":"확인","global":false,"url":"https://namuenr.com","ext":[]},{"id":"c283","name":"베리워즈","sector":"탄소·ESG","subsector":"배출권·탄소크레딧","type":"스타트업","scale":1,"founded":2019,"hq":null,"listed":"비상장","desc":"동남아시아를 겨냥해 전기이륜차와, 방전된 배터리를 충전된 것으로 갈아 끼우는 교환형 충전 스테이션(BSS)을 보급한다. 차체는 판매하고 배터리는 구독 형태로 제공하며, 내연기관 이륜차 대비 줄어든 온실가스를 제3자 검증을 거쳐 탄소크레딧으로 만들어 파는 수익 구조를 갖췄다. 2023년 캄보디아에서 전기이륜차 기반 온실가스 감축사업을 유엔에 등록하고 현지에 조립·생산 공장을 세웠다.","tags":["탄소크레딧","전기이륜차","동남아","국제감축"],"conf":"확인","global":false,"url":"https://www.verywords.com","ext":[],"grounded":true,"src":["https://wowtale.net/2023/11/09/66394/","https://asan-aer.org/","https://www.nextunicorn.kr/company/03ca5e246f15dd24"]},{"id":"c284","name":"에코아이","sector":"탄소·ESG","subsector":"배출권·탄소크레딧","type":"중소기업","scale":2,"founded":2005,"hq":"서울","listed":"코스닥","desc":"해외에서 온실가스를 줄이는 사업을 직접 벌여 그 감축량을 탄소배출권으로 인정받은 뒤, 배출권이 필요한 기업에 판매하는 사업을 한다. 탄소시장을 분석해 기업의 환경경영 의사결정을 돕는 자체 서비스 '카본아이'를 운영하고 환경규제 대응 컨설팅도 수행한다. 2013년 환경컨설팅사 에코아이를 합병하며 지금의 이름이 됐고 2023년 11월 코스닥에 상장했다.","tags":["탄소배출권","감축사업","컨설팅"],"conf":"확인","global":false,"url":"https://www.ecoeye.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%EC%97%90%EC%BD%94%EC%95%84%EC%9D%B4","https://www.thebell.co.kr/free/content/ArticleView.asp?key=202303211307203920107711&lcode=00","https://news.mt.co.kr/mtview.php?no=2023112115480836701"]},{"id":"c285","name":"윈클","sector":"탄소·ESG","subsector":"배출권·탄소크레딧","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"기업과 개인이 모두 참여할 수 있는 자발적 탄소배출권 거래 마켓플레이스를 운영한다. 플랫폼에서 일어나는 거래를 블록체인에 기록해, 같은 배출권이 두 번 팔리는 이중판매 문제를 막는 것이 특징이다. 기업이 자사 탄소배출량을 산정·관리하는 기능까지 묶어 제공하며 500글로벌로부터 시드 투자를 유치했다.","tags":["탄소배출권","거래 플랫폼","탄소크레딧"],"conf":"확인","global":false,"url":"https://www.wincl.io","ext":[],"grounded":true,"src":["https://platum.kr/archives/224749","https://wowtale.net/2024/03/22/73985/","https://www.wincl.io/"]},{"id":"c286","name":"후시파트너스","sector":"탄소·ESG","subsector":"배출권·탄소크레딧","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"AI 탄소 플랫폼 '카본AI'로 감축 프로젝트 발굴부터 배출량 측정·보고·검증(MRV), 감축 전략 수립, 배출권 거래까지 한 플랫폼에서 지원한다. 개인 전기차 이용자가 차량·주행 데이터를 등록하면 온실가스 감축량을 산정해 배출권으로 전환할 수 있는 플랫폼을 운영한다. 서울에너지공사와 함께 시민·기업의 태양광 감축실적을 모아 배출권으로 바꾸는 '에너지모아' 사업의 승인·인증 실무도 맡고 있다.","tags":["탄소크레딧","카본AI","탄소경영"],"conf":"확인","global":false,"url":"https://www.hooxipartners.com","ext":[],"grounded":true,"src":["https://www.motorgraph.com/news/articleView.html?idxno=43499","https://www.asiatoday.co.kr/kn/view.php?key=20260616001701551","https://besuccess.com/?p=183983"]},{"id":"c287","name":"글래스돔","sector":"탄소·ESG","subsector":"탄소회계·관리 SaaS","type":"스타트업","scale":1,"founded":2019,"hq":"경기","listed":"비상장","desc":"공장의 생산관리시스템(MES)·전사자원관리(ERP)·설비 제어장치에서 에너지와 공정 데이터를 직접 끌어와, 제품 한 개당 탄소배출량을 실측 기반으로 계산하는 솔루션을 제공한다. 유럽연합이 수입품의 탄소배출에 비용을 매기는 탄소국경조정제도(CBAM) 대응 솔루션은 국제 인증기관 로이드인증원(LRQA)에서 EU 규제 적합성을 검증받았다. 제조 공정 운영을 최적화하는 솔루션도 함께 운영한다.","tags":["탄소발자국","CBAM","제조 데이터"],"conf":"확인","global":false,"url":"https://glassdome.com","ext":[],"grounded":true,"src":["https://www.venturesquare.net/995588","https://www.venturesquare.net/1046200","https://glassdome.com/ko/"]},{"id":"c288","name":"리빗","sector":"탄소·ESG","subsector":"탄소회계·관리 SaaS","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"제조업과 건설업 기업을 주 대상으로, 웹에서 바로 쓰는 SaaS 형태의 탄소배출 관리 솔루션 '탄솔루션'을 제공한다. 배출량 등록과 모니터링을 자동화해 담당자가 간편하게 관리하도록 하고, 제품 단위로 배출량을 추적하는 시스템도 함께 갖췄다. 국제 표준 가이드라인에 맞춘 보고서를 자동으로 생성해준다.","tags":["탄소배출량","측정","감축"],"conf":"확인","global":false,"url":"https://www.tanso.life","ext":[],"grounded":true,"src":["https://www.sisajournal-e.com/news/articleView.html?idxno=408776","https://sparklabs.co.kr/kr/portfolio/livit-tansolution/","https://news.nate.com/view/20240403n03275"]},{"id":"c289","name":"엔츠","sector":"탄소·ESG","subsector":"탄소회계·관리 SaaS","type":"스타트업","scale":1,"founded":2021,"hq":"서울","listed":"비상장","desc":"기업의 탄소배출량을 회계처럼 체계적으로 산정·관리하는 SaaS 플랫폼 '엔스코프'를 운영한다. 사내 ERP는 물론 한국전력, 폐기물 관리 시스템 올바로 같은 외부 시스템과 연결해 데이터를 자동으로 모으고, 국제 기준에 따라 배출량을 계산·검증한 뒤 TCFD·CDP 등 국제 공시 기준에 맞춘 보고서 작성까지 지원한다. 35억 원 규모 시리즈A 투자를 유치했다.","tags":["탄소회계","SaaS","탄소중립"],"conf":"확인","global":false,"url":"https://aents.co","ext":[],"grounded":true,"src":["https://www.thebell.co.kr/free/content/ArticleView.asp?key=202511280622038880106440","https://www.gttkorea.com/news/articleView.html?idxno=13169","https://www.mashupventures.co/contents/aents-investment"]},{"id":"c290","name":"오후두시랩","sector":"탄소·ESG","subsector":"탄소회계·관리 SaaS","type":"스타트업","scale":1,"founded":2021,"hq":"서울","listed":"비상장","desc":"AI를 활용한 기업용 탄소관리 SaaS '그린플로'를 운영한다. 연료·전기·난방 사용 현황을 설문에 답하듯 입력하면 배출량이 자동으로 계산돼, 연료를 직접 태워 나오는 배출(스코프1)과 전기 사용에 따른 간접 배출(스코프2)을 짧은 시간에 확인할 수 있다. 비용 자료를 기반으로 배출량을 산정하는 기술을 특허 출원했고, 경기도 중소기업 기후경영 서비스 등 소규모 사업자용 서비스로도 범위를 넓혔다.","tags":["탄소관리","SaaS","AI"],"conf":"확인","global":false,"url":"https://www.greenflow.eco","ext":[],"grounded":true,"src":["https://zdnet.co.kr/view/?no=20230518214052","https://platum.kr/archives/219244","https://www.greenflow.eco/"]},{"id":"c291","name":"워터쉐드","sector":"탄소·ESG","subsector":"탄소회계·관리 SaaS","type":"해외 대표","scale":4,"founded":2019,"hq":"미국","listed":null,"desc":"기업이 자사의 온실가스 배출량을 측정하고 줄이도록 돕는 미국의 소프트웨어 기업이다. 50만 건이 넘는 배출계수 데이터를 기반으로 직접 배출부터 협력업체·공급망 배출(스코프 1~3)까지 산출하고, 유럽 CSRD와 CDP 등 각국 기후공시 기준에 맞춘 보고서 작성을 지원한다. 탄소 외에 물·폐기물 사용량 집계 기능도 함께 제공한다.","tags":["탄소회계","SaaS","글로벌"],"conf":"확인","global":true,"url":"https://watershed.com","ext":[],"grounded":true,"src":["https://watershed.com/platform/measure/carbon-accounting","https://watershed.com/","https://research.contrary.com/company/watershed","https://trellis.net/article/california-startup-watershed-raises-100-million-emissions-tracking-software/"]},{"id":"c292","name":"탄소중립연구원","sector":"탄소·ESG","subsector":"탄소회계·관리 SaaS","type":"스타트업","scale":1,"founded":null,"hq":"서울","listed":"비상장","desc":"기업이 배출하는 온실가스를 계산하고 관리하는 구독형 소프트웨어(SaaS) '그리너프(GreenERP)'를 개발하는 기후테크 스타트업이다. 전기요금·난방·유류비처럼 부서마다 흩어져 있는 데이터를 하나로 모아 배출량을 산출하고, 대시보드 실시간 모니터링과 주간·월간 보고서 형태로 보여준다. 탄소 전문 인력이 없는 기업도 기존 ERP 업무 흐름 안에서 배출량을 관리하고, ESG 보고서 작성이나 자체 감축 목표 설정에 활용할 수 있도록 하는 것이 목표다.","tags":["탄소회계","규제 대응","그리너프"],"conf":"확인","global":false,"url":"https://www.cnrikorea.com","ext":[],"grounded":true,"src":["https://www.cnrikorea.com/","https://www.nextunicorn.kr/company/e55c2d151ff50989","https://thevc.kr/carbonneutralresearchinstitute"]},{"id":"c293","name":"하나루프","sector":"탄소·ESG","subsector":"탄소회계·관리 SaaS","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"기업용 온실가스 관리 플랫폼 '하나에코(Hana.eco)'를 개발하는 클라우드 소프트웨어 스타트업이다. 배출 활동 데이터를 모아 배출량 추이를 분석하고 감축 전략 수립에 필요한 정보를 제공하며, 협력사까지 포함한 공급망 전반의 배출량도 추적한다. 유럽의 탄소국경조정제도(CBAM), 배출권거래제(ETS) 같은 국내외 기후 규제에 맞춰 보고서를 자동으로 만들어 주는 기능을 갖추고 있다.","tags":["탄소관리","플랫폼","소프트웨어"],"conf":"확인","global":false,"url":"https://www.hanaloop.com","ext":[],"grounded":true,"src":["https://www.ecoloop.io/ko/","https://www.hanaloop.com/en/blog/2025/20250219-clean-air-expo/","https://www.rocketpunch.com/companies/hanaloop","https://www.innoforest.co.kr/company/CP00024177/하나루프"]},{"id":"c294","name":"세이프케미컬","sector":"환경 엔지니어링·컨설팅","subsector":"EHS·화학물질 관리","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"화학물질을 제조하거나 수입하는 기업이 정부에 물질을 등록·신고하고 규제 요건을 갖추도록 돕는 컨설팅 기업이다. 산업용 화학물질뿐 아니라 농약, 살균·살충 등에 쓰이는 살생물제, 식품첨가물, 식품 용기까지 인허가 업무를 다룬다. 유럽·미국·일본·중국·대만 등 해외 화학물질 규제 대응과 시험 의뢰 대행도 지원한다.","tags":["화학물질","화평법","컨설팅"],"conf":"확인","global":false,"url":"http://www.safechemicals.net","ext":[],"grounded":true,"src":["http://www.safechemicals.net/ko/","http://www.safechemicals.net/ko/?c=189","https://kreachhub.safechemicals.net/"]},{"id":"c295","name":"씨아이알에스그룹코리아","sector":"환경 엔지니어링·컨설팅","subsector":"EHS·화학물질 관리","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"화학물질 규제 대응을 전문으로 하는 글로벌 컨설팅 그룹 CIRS의 한국법인으로 2018년 설립됐다. 국내 화평법과 살생물제 규제는 물론 유럽 REACH, 중국·영국 등 해외 화학물질 등록 절차를 대행한다. 화장품·의료기기 인허가와 식품·사료 규제 대응, 각종 제품 인증까지 다루며 각국 화학 규제를 찾아보는 자체 검색 도구도 운영한다.","tags":["화학물질 등록","규제 대응","컨설팅"],"conf":"확인","global":false,"url":"https://kr.cirs-group.com","ext":[],"grounded":true,"src":["https://kr.cirs-group.com/sub/sub01_01.php","https://kr.cirs-group.com/sub/sub03_01.php?boardid=letter&mode=view&idx=699","https://kr.cirs-group.com/sub/sub01_05_detail.php?idx=23"]},{"id":"c296","name":"켐토피아","sector":"환경 엔지니어링·컨설팅","subsector":"EHS·화학물질 관리","type":"중소기업","scale":2,"founded":null,"hq":"서울","listed":"비상장","desc":"화학물질 등록·평가법(K-REACH) 대응을 비롯한 화학물질 규제 컨설팅과 안전보건환경 관리 소프트웨어를 함께 제공한다. 사업장의 화학물질 정보를 관리하는 Dr.CMS, 환경·보건·안전 업무를 하나로 묶는 Dr.EHS를 개발했고, 중대재해 예방을 돕는 'CEO 안심' 솔루션도 내놓았다. 2002년에 설립됐다.","tags":["화학물질 관리","K-REACH","EHS 솔루션","규제 대응"],"conf":"확인","global":false,"url":"https://www.chemtopia.net","ext":[],"grounded":true,"src":["https://www.chemtopia.net/","https://chemtopia.net/ko/k-reach/k-reach-e-7","https://mbiz.heraldcorp.com/article/3377959"]},{"id":"c297","name":"AECOM","sector":"환경 엔지니어링·컨설팅","subsector":"종합 환경 엔지니어링","type":"해외 대표","scale":4,"founded":null,"hq":"미국","listed":null,"desc":"미국 텍사스주 댈러스에 본사를 둔 다국적 인프라 컨설팅 기업이다. 교통·수자원·환경·에너지·건물 분야에서 자문과 계획, 설계·엔지니어링부터 시공 및 사업 관리까지 프로젝트 전 생애주기에 걸친 서비스를 공공·민간 발주처에 제공한다. 뉴욕증권거래소에 ACM 종목코드로 상장돼 있다.","tags":["글로벌","인프라","환경 엔지니어링"],"conf":"확인","global":true,"url":"https://aecom.com","ext":[],"grounded":true,"src":["https://aecom.com/","https://en.wikipedia.org/wiki/AECOM","https://www.forbes.com/companies/aecom/"]},{"id":"c298","name":"건화","sector":"환경 엔지니어링·컨설팅","subsector":"종합 환경 엔지니어링","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"1990년 설립된 종합 엔지니어링 기업으로 상하수도와 국토개발, 도로·철도·항만, 플랜트 등 사회기반시설을 기획·설계·감리한다. 설계뿐 아니라 사업관리와 유지관리까지 건설 전 단계에 걸친 업무를 수행한다. 베트남, 필리핀, 방글라데시, 아제르바이잔, 에콰도르 등에 지사를 두고 해외 사업도 진행한다.","tags":["상하수도","환경시설 설계","종합 엔지니어링"],"conf":"확인","global":false,"url":"https://www.kunhwaeng.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/건화_(기업)","http://www1.kunhwaeng.co.kr/m/sub_page/1_4.asp"]},{"id":"c299","name":"다산컨설턴트","sector":"환경 엔지니어링·컨설팅","subsector":"종합 환경 엔지니어링","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"교통·수자원·환경·국토개발·에너지 플랜트 분야의 설계와 건설사업관리를 수행하는 종합 건설엔지니어링 기업이다. 도로·교량·터널·철도 같은 토목 시설은 물론 상하수도와 환경 시설의 사업기획, 타당성조사, 계획, 설계를 맡는다. 1993년 창립했고 본사는 경북 구미에 있다.","tags":["토목설계","구조","환경설계"],"conf":"확인","global":false,"url":"https://www.dasan93.co.kr","ext":[],"grounded":true,"src":["https://www.engcontest.or.kr/company/company.php?boardid=company&mode=view&idx=24","https://g2bmarket.com/detail/dasankeonseolteonteu","https://www.saramin.co.kr/zf_user/company-info/view/csn/Uko3cDNYZEdONGR5bnVUQ1JGdUY3UT09"]},{"id":"c300","name":"도화엔지니어링","sector":"환경 엔지니어링·컨설팅","subsector":"종합 환경 엔지니어링","type":"중견기업","scale":3,"founded":1957,"hq":"서울","listed":"코스피","desc":"1957년 설립된 국내 최초의 종합 엔지니어링 회사로, 상하수도·수자원개발·도시계획·도로·철도·환경 등 엔지니어링 전 분야의 계획과 설계, 감리를 수행한다. 광역상수도를 비롯한 전국 상수도 시설 설계, 바닷물을 민물로 바꾸는 해수담수화와 강변여과수 같은 대체 수자원 개발, 노후 상수도 현대화가 물 분야의 주축이다. 플랜트와 EPC 사업도 함께 하는 코스피 상장사다.","tags":["상하수도","수처리 설계","환경플랜트","종합설계","설계","엔지니어링"],"conf":"확인","global":false,"url":"https://www.dohwa.co.kr","ext":[],"grounded":true,"src":["https://www.dohwa.co.kr/aboutus/overview","https://namu.wiki/w/%EB%8F%84%ED%99%94%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81","https://en-wiki.org/wiki/%EB%8F%84%ED%99%94%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81"]},{"id":"c301","name":"동명기술공단","sector":"환경 엔지니어링·컨설팅","subsector":"종합 환경 엔지니어링","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"토목·환경 전 분야의 설계와 감리에 더해 측량, 시설물 유지관리까지 수행하는 종합 엔지니어링·건축사사무소다. 국내 건설기술용역 초창기부터 활동해 온 1세대 엔지니어링 기업으로, 알제리 부그줄 신도시 설계 등 해외 30여 개국의 도시개발 사업에도 참여했다.","tags":["토목설계","환경설계","감리"],"conf":"확인","global":false,"url":"https://www.dmec.co.kr","ext":[],"grounded":true,"src":["https://www.dmec.co.kr/","https://www.thebell.co.kr/free/content/ArticleView.asp?key=202505231717293720102319","https://www.saramin.co.kr/zf_user/company-info/view/csn/aU1nZ0h0OEYxaDdqOURzZGtuM1BZZz09"]},{"id":"c302","name":"동부엔지니어링","sector":"환경 엔지니어링·컨설팅","subsector":"종합 환경 엔지니어링","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"도로·구조, 철도, 국토개발, 수자원, 환경을 주요 사업분야로 하는 종합 엔지니어링사다. 사회기반시설의 계획과 설계에 더해 시공 단계의 감리 업무도 함께 수행한다. 본사는 서울에 있다.","tags":["토목설계","환경영향평가","수자원"],"conf":"확인","global":false,"url":"https://www.dbeng.co.kr","ext":[],"grounded":true,"src":["https://www.dbeng.co.kr/index/index.asp"]},{"id":"c303","name":"동성엔지니어링","sector":"환경 엔지니어링·컨설팅","subsector":"종합 환경 엔지니어링","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"하천기본계획과 유역 치수계획, 수해복구 설계 등 물 관련 용역을 중심에 둔 종합 엔지니어링사다. 하천유지용수와 수자원개발계획, 물순환을 고려한 친수공간 계획도 수행한다. 이 밖에 환경, 상하수도, 도시계획, 단지·조경, 교통 설계와 해외 사업까지 om/bbs/content.php?co_id=ecosystem","http://www.entopeng.com/bbs/content.php?co_id=ecosearch"]},{"id":"c318","name":"그린에코스","sector":"생태·해양·기타","subsector":"생태 복원·조사","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"2002년 설립된 환경 컨설팅·정보시스템 기업으로, 대기와 수질, 생태계, 화학물질의 움직임을 컴퓨터로 모사하는 모델링 시스템을 개발한다. GIS(지리정보시스템)와 웹 기술을 결합한 원격 통합 모니터링으로 환경 상태를 예측·진단하며, 환경정보시스템 구축과 소프트웨어 공급, 유역 수질 모델링, 소규모 수처리 사업도 수행한다.","tags":["생태조사","자연환경","생태복원"],"conf":"확인","global":false,"url":"https://www.greenecos.co.kr","ext":[],"grounded":true,"src":["https://www.greenecos.co.kr/","https://www.greenecos.co.kr/?page_id=2"]},{"id":"c319","name":"에코탑","sector":"생태·해양·기타","subsector":"생태 복원·조사","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"생태숲 조성과 훼손된 생태계 복원, 마을·지역 정비 등을 하는 생태복원 전문 중소기업이다. 산업 공정에서 나오는 부산물을 재활용해 무른 땅을 단단하게 굳히는 친환경 고화제 등 건설 재료를 개발·생산·판매하는 친환경 소재 사업도 함께 한다.","tags":["생태복원","환경사업"],"conf":"추정","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.incruit.com/company/1689837501/","https://www.saramin.co.kr/zf_user/company-info/view/csn/ZTRwdDB2ejUwZGw5K1gzNjZVOWhsZz09/company_nm/(%EC%A3%BC)%EC%97%90%EC%BD%94%ED%83%91","https://www.jobplanet.co.kr/companies/179352/reviews/%EC%97%90%EC%BD%94%ED%83%91"]},{"id":"c320","name":"자연과기술","sector":"생태·해양·기타","subsector":"생태 복원·조사","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":null,"desc":"하천·생태계 복원 조사와 시공을 수행하는 생태복원 전문기업.","tags":["생태복원","하천복원","생태조사"],"conf":"확인","global":false,"url":null,"ext":[]},{"id":"c321","name":"자연과환경","sector":"생태·해양·기타","subsector":"생태 복원·조사","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"코스닥","desc":"1999년 설립돼 2005년 코스닥에 상장한 환경생태 복원 기업이다. 훼손된 하천과 습지를 되살리는 생태복원 공사, 오염된 토양을 정화하는 토양정화, 빗물을 모아 두는 PC 저류조 사업을 하며 생태블록·투수블록과 친환경 콘크리트 제품을 직접 만들어 공급한다. 조경과 환경플랜트 사업도 함께 한다.","tags":["생태복원","인공습지","환경소재","수질정화","환경플랜트"],"conf":"확인","global":false,"url":"http://www.e-nne.co.kr","ext":[],"grounded":true,"src":["http://www.e-nne.co.kr/kor/main/","https://comp.fnguide.com/SVO2/ASP/SVD_Main.asp?gicode=A043910","https://www.stockplus.com/m/stocks/KOREA-A043910"]},{"id":"c322","name":"선일기술산업","sector":"생태·해양·기타","subsector":"소음·진동","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"1994년부터 소음과 진동 문제를 다뤄 온 전문업체로, 현장 측정과 분석에서 시작해 저감 대책 수립과 실제 시공까지 한 번에 맡는다. 소음·진동 공정시험기준에 따른 측정·평가를 수행하며 공동주택 층간소음 측정, 생활소음·진동 규제 대응 같은 업무를 다룬다.","tags":["소음진동","측정분석","저감대책"],"conf":"확인","global":false,"url":"https://www.sunileng.co.kr","ext":[],"grounded":true,"src":["https://www.sunileng.co.kr/","http://sunileng.biz/technote6/board.php?board=data6&command=body&no=13","http://sunileng.biz/technote6/board.php?board=data2&command=body&no=87"]},{"id":"c323","name":"에스코알티에스","sector":"생태·해양·기타","subsector":"소음·진동","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":null,"desc":"교량·철도 구조물용 방진·면진 제품 등 진동 저감 솔루션을 다루는 기업.","tags":["방진","면진","소음진동"],"conf":"추정","global":false,"url":"http://enrtech.co.kr","ext":[]},{"id":"c324","name":"한국방진방음","sector":"생태·해양·기타","subsector":"소음·진동","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"1992년 설립된 소음·진동 제어 전문업체다. 기계나 설비의 진동이 건물로 전달되지 않도록 막아 주는 스프링 마운트와 방진 행거, 방진 패드, 소음을 줄이는 소음기(사일런서) 등을 설계·생산하며 해당 제품군으로 ISO 9001 인증을 받았다. 방진·방음 시설 시공과 소음·진동 측정 업무도 수행한다.","tags":["방진","방음","소음진동 저감"],"conf":"확인","global":false,"url":"http://kvceng.com","ext":[],"grounded":true,"src":["http://www.kvceng.com/","http://kvceng.com/theory/theory_vibration.php","http://www.kharn.kr/news/article.html?no=16457"]},{"id":"c325","name":"쉐코","sector":"생태·해양·기타","subsector":"해양환경","type":"스타트업","scale":1,"founded":null,"hq":"인천","listed":"비상장","desc":"바다에 유출된 기름을 걷어내는 소형 방제 로봇 '쉐코 아크(SHECO ARK)'를 개발한 소셜벤처다. 길이 1m, 무게 130kg 남짓한 배 모양의 전기 구동 로봇으로, 스스로 항행하며 수면의 오염물질을 감지해 기름과 부유 쓰레기를 빨아들이고 기름과 물을 실시간으로 분리한다. 흡착포로 사람이 직접 걷어내던 소규모 유출 사고 대응을 기계로 대체하는 것을 목표로 하며, 해양경찰과 함께 무인 해양정화 실증도 진행했다.","tags":["해양방제","로봇","기름유출","소셜벤처"],"conf":"확인","global":false,"url":"https://sheco.co","ext":[],"grounded":true,"src":["https://sheco.co/","https://www.sedaily.com/article/20071595","https://www.startuptoday.kr/news/articleView.html?idxno=45331","https://skinnonews.com/archives/89977"]},{"id":"c326","name":"에코피스","sector":"생태·해양·기타","subsector":"해양환경","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"자율주행 수상 로봇 '에코봇(ECO-BOT)'으로 호수·저수지·댐 등 담수 지역의 수질을 관리하는 스타트업이다. 물 위에 뜬 채 스스로 이동하며 녹조를 비롯한 부유 오염물질을 빨아들이고, 물의 대류를 일으켜 수역이 스스로 깨끗해지는 힘을 높인다. 사물인터넷(IoT)과 AI로 수질 데이터를 함께 수집·분석하며, 국내 AI 반도체 기업 리벨리온과 로봇의 실시간 영상 분석·자율 경로 최적화 기능을 고도화하는 협력을 맺었다.","tags":["수상 정화 로봇","AI","수질관리"],"conf":"확인","global":false,"url":"http://www.eco-peace.co.kr","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2026060840241","https://www.venturesquare.net/1089870","https://kr.aving.net/news/articleView.html?idxno=1796603","https://www.sedaily.com/article/20051758"]},{"id":"c327","name":"오셔닉","sector":"생태·해양·기타","subsector":"해양환경","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"지속가능한 바다를 목표로 해양 분야 기술 컨설팅을 제공하는 기업이다. 해양 물리조사와 해양환경 조사, 바다의 흐름과 변화를 컴퓨터로 계산하는 수치모델링, 실제 해역을 가상으로 재현하는 디지털 트윈 서비스를 수행한다. 별도의 환경영향평가센터를 두고 관련 평가 업무도 맡고 있다.","tags":["해양환경","해양컨설팅"],"conf":"추정","global":false,"url":"https://oceaniccnt.com","ext":[],"grounded":true,"src":["http://oceaniccnt.com/","https://oceaniccnt.com/main/page.html?pid=89","https://oceaniccnt.com/main/page.html?pid=91","http://oceaniccnt.com/board/index.html?id=notice&no=107"]},{"id":"c328","name":"오션테크","sector":"생태·해양·기타","subsector":"해양환경","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"1997년 설립돼 정부기관과 연구소, 대학 등에 해양 관측 장비를 공급해 온 기업이다. 해양·기상 관측 부이를 직접 제작·설치하고 유지관리하며, 파도의 힘으로 스스로 움직이는 무인 관측장비 웨이브 글라이더와 자체 개발한 무인수상정(USV)을 활용해 수심 측량, 수질 조사 같은 원격 해양조사 서비스를 제공한다.","tags":["해양조사","해양관측","장비"],"conf":"추정","global":false,"url":"https://www.oceantech.co.kr","ext":[],"grounded":true,"src":["http://www.oceantech.co.kr/OT/OT_01com_01.php","https://www.oceantech.co.kr/OT/OT_02bus_02.php","https://www.oceantech.co.kr/OT/OT_02bus_02_2.php","http://www.oceantech.co.kr/OT/OT_02bus_02_3.php?OTU_tab=3"]},{"id":"c329","name":"지오시스템리서치","sector":"생태·해양·기타","subsector":"해양환경","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"2000년 설립된 해양·연안 환경 조사 전문기업이다. 수리·퇴적역학 조사, 수로 및 무인항공측량, 수질·퇴적물 조사를 수행하고, 바닷물의 흐름과 오염 확산을 컴퓨터로 계산해 예측하는 수치모델링으로 실시간 해양예측시스템을 구축·운영한다. 연안침식 실태조사, 연안재해 예측, 항로표지 설계·유지관리 등 해양 환경 엔지니어링 서비스도 제공한다.","tags":["해양조사","수치모델링","해양환경","조사선"],"conf":"확인","global":false,"url":"https://www.geosr.com","ext":[],"grounded":true,"src":["https://www.geosr.com/","http://kor.theasian.asia/archives/148586","https://www.saramin.co.kr/zf_user/company-info/view/csn/U3hvelpvb1dNQk15SDNEUEVCYUpLZz09"]},{"id":"c330","name":"포어시스","sector":"생태·해양·기타","subsector":"해양환경","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"바다로 흘러드는 쓰레기를 하천 단계에서 미리 막는 '하천 쓰레기 차단시설'을 만드는 스타트업이다. 하천 조건에 맞는 최적 설치 위치를 정하고 구조물을 제작·설치한 뒤 유지보수까지 맡으며, AI와 사물인터넷(IoT)을 붙여 쓰레기 발생 데이터를 쌓고 수거 동선을 최적화하는 관리 플랫폼도 함께 운영한다. 걷어낸 해양 폐플라스틱을 다시 자원으로 되돌리는 재활용 사업도 하고 있다.","tags":["해양쓰레기","해양폐기물","IoT","솔루션"],"conf":"확인","global":false,"url":"https://www.frss.co.kr","ext":[],"grounded":true,"src":["https://m.etnews.com/20200925000140","https://www.etnews.com/20210209000216","https://www.elec4.co.kr/article/articleView.asp?idx=24672","https://thevc.kr/foresys"]},{"id":"c331","name":"대현환경","sector":"생태·해양·기타","subsector":"환경 서비스·교육","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"1998년 설립된 환경오염물질 측정·분석 대행기업으로 경기 안양에 있다. 대기, 수질, 소음·진동, 악취, 해양 등 분야별 환경오염도를 측정·분석하고, 배출가스와 폐수·폐기물·토양에 든 다이옥신 등 잔류성 유기오염물질 분석도 수행한다. 환경영향평가와 사후환경영향조사 업무도 함께 맡는다.","tags":["측정대행","환경분석"],"conf":"추정","global":false,"url":"https://www.daehyun98.com","ext":[],"grounded":true,"src":["https://www.daehyun98.com/","http://www.daehyun98.com/about_us/history.php","https://daehyun98.com/business/environmental.php"]},{"id":"c332","name":"에코샵홀씨","sector":"생태·해양·기타","subsector":"환경 서비스·교육","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"숲과 자연을 소재로 한 환경교육 교구와 콘텐츠를 개발·공급하는 기업이다. 곤충 체험 교구, 생태 포스터, 놀이카드처럼 숲놀이·자연학습에 쓰이는 교재를 직접 만들고, 생태·환경교육 콘텐츠도 연구·개발한다. 숲해설사와 생태 교사, 유아·아동 교육기관이 주된 이용자다.","tags":["환경교육","교구","생태체험"],"conf":"확인","global":false,"url":"http://wholesee.com","ext":[],"grounded":true,"src":["https://wholesee.com/","https://wholesee.com/category/%EB%86%80%EC%9D%B4%EC%B9%B4%EB%93%9C/31/"]},{"id":"c333","name":"유브이넥스","sector":"생태·해양·기타","subsector":"환경 서비스·교육","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"냄새·악취와 휘발성유기화합물(VOC), 실내 공기질, 수질을 측정하는 환경측정 서비스 기업이다. 축사 주변 악취 민원의 원인을 밝히는 현장 측정처럼 의뢰를 받아 측정을 수행하며, 공기를 희석해 냄새 정도를 수치화하는 복합악취 측정도 다룬다. 휴대용 VOC 측정기 등 측정 장비의 판매와 대여, 세균·곰팡이와 라돈·전자파 측정도 함께한다.","tags":["악취측정","VOC","환경측정"],"conf":"확인","global":false,"url":"https://uvnex.com","ext":[],"grounded":true,"src":["https://uvnex.com/","https://uvnex.com/faq/","https://uvnex.com/product-category/%EB%83%84%EC%83%88-%EC%95%85%EC%B7%A8-%EC%B8%A1%EC%A0%95%EA%B8%B0/"]},{"id":"c334","name":"트리플래닛","sector":"생태·해양·기타","subsector":"환경 서비스·교육","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"시민이 참여하는 방식으로 숲을 만들어 온 소셜벤처다. 나무 심기 게임과 크라우드펀딩에서 출발해 개인·기업·정부기관이 참여할 수 있는 숲 조성 상품을 기획하고, 국내외에서 실제로 나무를 심는다. 세월호 기억의 숲, 강원도 산불 피해 복구 숲, 네팔 지진 피해 복구 숲처럼 사회적·환경적으로 나무가 필요한 곳을 대상으로 삼아 왔으며, 반려나무와 교실숲 등 일상에서 나무를 접하게 하는 프로젝트도 운영한다.","tags":["나무심기","숲 조성","소셜벤처"],"conf":"추정","global":false,"url":"https://treepla.net","ext":[],"grounded":true,"src":["https://treepla.net/about","https://www.treepla.net/brandhistory","https://sparklabs.co.kr/kr/portfolio/treeplanet/","https://platum.kr/archives/46679"]},{"id":"c335","name":"국립공원공단","sector":"공공·연구","subsector":"공공기관","type":"공공·연구","scale":4,"founded":1987,"hq":"강원","listed":null,"desc":"1987년 설립되어 한라산을 제외한 전국 국립공원 21곳을 관리하는 준정부기관으로, 본부는 강원 원주에 있다. 공원시설을 설치·관리하고 탐방 안내와 홍보를 맡는다. 자연생태계와 자연·문화경관을 조사·연구하고 야생 동식물을 복원·증식해 생물종다양성을 늘리며, 정기 생태조사로 주요 지표종의 개체 수와 서식 환경 변화를 추적한다.","tags":["환경부 산하","국립공원","생태 보전"],"conf":"확인","global":false,"url":"https://www.knps.or.kr","ext":[],"grounded":true,"src":["https://knps.or.kr/portal/main/contents.do?menuNo=8000665","https://m.knps.or.kr/pintro/knps.do","https://ko.wikipedia.org/wiki/%EA%B5%AD%EB%A6%BD%EA%B3%B5%EC%9B%90%EA%B3%B5%EB%8B%A8"]},{"id":"c336","name":"한국환경보전원","sector":"공공·연구","subsector":"공공기관","type":"공공·연구","scale":4,"founded":null,"hq":null,"listed":null,"desc":"1978년 설립된 환경보전협회가 환경정책기본법 개정에 따라 2023년 이름을 바꾼 환경부 산하 기관이다. 사단법인에서 재단법인으로 전환하면서 배출업체 중심의 회원 제도를 없애 공공성을 강화했다. 환경기술인 법정교육과 대국민 환경 홍보를 비롯해 학교·사회 환경교육, 하천과 자연생태계 훼손지 복원, 환경산업·기술 국제 전시회 개최 등의 사업을 수행한다.","tags":["환경부 산하","환경교육","환경관리"],"conf":"확인","global":false,"url":"https://www.keci.or.kr","ext":[],"grounded":true,"src":["https://encykorea.aks.ac.kr/Article/E0064959","https://www.newswire.co.kr/newsRead.php?no=946127","https://zdnet.co.kr/view/?no=20220614093853"]},{"id":"c337","name":"한국환경산업기술원","sector":"공공·연구","subsector":"공공기관","type":"공공·연구","scale":4,"founded":2009,"hq":"서울","listed":null,"desc":"2009년 한국환경기술진흥원과 친환경상품진흥원이 통합해 출범한 준정부기관으로, 서울 은평구에 있다. 환경기술 연구개발(R&D) 사업의 기획·평가·관리를 맡고, 환경표지와 녹색인증 같은 친환경 인증제도를 운영해 친환경 상품 구매를 뒷받침한다. 중소환경기업의 사업화와 해외 진출을 지원하며, ESG 경영 확산과 녹색투자 지원 사업도 수행한다.","tags":["환경부 산하","R&D 지원","환경산업 육성"],"conf":"확인","global":false,"url":"https://www.keiti.re.kr","ext":[],"grounded":true,"src":["https://www.keiti.re.kr/","https://ko.wikipedia.org/wiki/%ED%95%9C%EA%B5%AD%ED%99%98%EA%B2%BD%EC%82%B0%EC%97%85%EA%B8%B0%EC%88%A0%EC%9B%90","https://www.keiti.re.kr/site/keiti/02/10202030000002018092810.jsp"]},{"id":"c338","name":"해양환경공단","sector":"공공·연구","subsector":"공공기관","type":"공공·연구","scale":4,"founded":null,"hq":"서울","listed":null,"desc":"해양오염 방제와 해양환경 보전을 담당하는 해양수산부 산하 준시장형 공기업이다. 2008년 해양환경관리공단으로 설립돼 2018년 지금의 이름으로 바뀌었다. 전국 29개 주요 무역항에 청소·방제 선박을 배치해 해상 쓰레기를 치우고 오염사고 발생 시 방제작업을 벌이며, 전국 13개 해양환경관리사업소에서 선박 폐유를 수거·저장·처리한다.","tags":["해양수산부 산하","해양오염 방제","해양환경 관리"],"conf":"확인","global":false,"url":"https://www.koem.or.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%ED%95%B4%EC%96%91%ED%99%98%EA%B2%BD%EA%B3%B5%EB%8B%A8","https://www.koem.or.kr/site/koem/04/10401020000002019051004.jsp","https://www.alioplus.go.kr/organization/organHeadDetail.do?typ=region&apbaId=C0533"]},{"id":"c339","name":"국립생물자원관","sector":"공공·연구","subsector":"연구기관","type":"공공·연구","scale":3,"founded":2007,"hq":"인천","listed":null,"desc":"국가 생물자원을 조사·연구하고 생물 표본을 수집·보관하는 환경부 소속기관으로 2007년 문을 열었다. 국가 생물다양성의 보전·관리 연구, 생물자원을 산업에 활용하기 위한 지원 연구, 생물자원 정보 관리와 정책 지원 연구를 수행한다. 인천 서구 종합환경연구단지에 있으며 생물 표본을 보여주는 전시관도 운영한다.","tags":["생물자원","생물다양성","환경부 소속"],"conf":"확인","global":false,"url":"https://www.nibr.go.kr","ext":[],"grounded":true,"src":["https://www.nibr.go.kr/","https://ko.wikipedia.org/wiki/%EA%B5%AD%EB%A6%BD%EC%83%9D%EB%AC%BC%EC%9E%90%EC%9B%90%EA%B4%80"]},{"id":"c340","name":"국립생태원","sector":"공공·연구","subsector":"연구기관","type":"공공·연구","scale":3,"founded":2013,"hq":"충남","listed":null,"desc":"충남 서천에 자리한 환경부 산하 생태 연구·전시 기관으로 2013년 정식 개관했다. 전국의 자연환경 실태를 주기적으로 파악하는 전국자연환경조사 업무를 수행한다. 생태계를 재현한 실내 전시관 에코리움과 주변 야외 생태전시장을 운영해 일반인 대상 전시와 교육도 함께 한다.","tags":["생태연구","자연환경조사","환경부 산하"],"conf":"확인","global":false,"url":"https://www.nie.re.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%EA%B5%AD%EB%A6%BD%EC%83%9D%ED%83%9C%EC%9B%90","https://ecosurvey.nie.re.kr/newecoAdmin/","https://www.nie-ecobank.kr/statistics/exminDat/inquire.do"]},{"id":"c341","name":"국립해양생물자원관","sector":"공공·연구","subsector":"연구기관","type":"공공·연구","scale":3,"founded":2015,"hq":"충남","listed":null,"desc":"해양생물자원을 체계적으로 확보하고 보존·관리하는 해양수산부 산하 기관으로 2015년 충남 서천 장항에 문을 열었다. 확보한 해양생물자원을 해양바이오 산업에 쓸 수 있도록 개발·보급하는 일도 맡는다. 해양생물 표본을 전시하는 '씨큐리움'과 교육 프로그램을 운영한다.","tags":["해양생물자원","해양수산부 산하","연구"],"conf":"확인","global":false,"url":"https://www.mabik.re.kr","ext":[],"grounded":true,"src":["https://www.mabik.re.kr/","https://www.mof.go.kr/doc/ko/selectDoc.do?docSeq=61324","https://namu.wiki/w/%EA%B5%AD%EB%A6%BD%ED%95%B4%EC%96%91%EC%83%9D%EB%AC%BC%EC%9E%90%EC%9B%90%EA%B4%80"]},{"id":"c342","name":"국립환경과학원","sector":"공공·연구","subsector":"연구기관","type":"공공·연구","scale":3,"founded":1978,"hq":"인천","listed":null,"desc":"환경 보전과 오염 방지를 위한 조사·연구를 맡는 환경부 소속 국가연구기관이다. 대기환경과 대기질 예보, 유역별 물환경 관리, 화학물질 등 환경유해인자가 건강에 미치는 영향을 따지는 위해성 평가 연구를 수행한다. 전국 대기오염 측정망의 운영 지침을 마련하고 측정 자료를 분석·관리하며, 수질오염총량관리 정보체계도 운영한다.","tags":["환경부 소속","환경연구","측정분석","측정망","정보시스템","국가연구기관"],"conf":"확인","global":false,"url":"https://www.nier.go.kr","ext":[],"grounded":true,"src":["https://www.nier.go.kr/","https://www.nier.go.kr/front/kor/cmm/nier_res02.do?menuNo=12002","https://ko.wikipedia.org/wiki/%EA%B5%AD%EB%A6%BD%ED%99%98%EA%B2%BD%EA%B3%BC%ED%95%99%EC%9B%90"]},{"id":"c343","name":"한국해양과학기술원","sector":"공공·연구","subsector":"연구기관","type":"공공·연구","scale":3,"founded":1973,"hq":"부산","listed":null,"desc":"해양과학기술 연구개발과 인력 양성을 담당하는 해양 분야 국책연구기관으로, 2012년 현재의 체제로 재출범했다(영문 약칭 KIOST). 본원은 부산 영도구에 있으며 2018년 부산 신청사를 열었다. 울릉도·독도해양연구기지와 제주국제해양과학연구지원센터를 운영하며 해양생태계 감시, 기후·해양환경 변화 조사 연구를 수행한다.","tags":["해양연구","정부출연연","KIOST"],"conf":"확인","global":false,"url":"https://www.kiost.ac.kr","ext":[],"grounded":true,"src":["https://www.kiost.ac.kr/kor.do","https://www.kiost.ac.kr/kor/sub04_01_02.do","https://www.kiost.ac.kr/kor/sub04_10.do"]},{"id":"c344","name":"한국환경연구원","sector":"공공·연구","subsector":"연구기관","type":"공공·연구","scale":3,"founded":null,"hq":"세종","listed":null,"desc":"환경정책을 연구하고 환경영향평가서를 검토하는 국책연구기관으로, 국무조정실 산하 경제·인문사회연구회 소속이다. 1992년 한국환경기술개발원으로 출발해 한국환경정책·평가연구원을 거쳐 2021년 지금 이름으로 바뀌었다. 2014년 서울에서 세종으로 옮겼으며 환경영향평가 법정 검토기관으로 지정돼 있다.","tags":["국책연구기관","환경정책","환경영향평가"],"conf":"확인","global":false,"url":"https://www.kei.re.kr","ext":[],"grounded":true,"src":["https://www.kei.re.kr/","https://ko.wikipedia.org/wiki/%ED%95%9C%EA%B5%AD%ED%99%98%EA%B2%BD%EC%97%B0%EA%B5%AC%EC%9B%90"]},{"id":"c345","name":"한국폐기물협회","sector":"공공·연구","subsector":"협회·단체","type":"공공·연구","scale":2,"founded":null,"hq":"서울","listed":null,"desc":"폐기물관리법에 근거해 2009년 설립허가를 받은 환경부 소관 협회다. 폐기물 처리 담당자를 위한 법정교육과 환경기술 인력 양성 교육을 운영하고, 자원순환의 날 기념행사 등 환경부 업무를 대행한다. 폐기물 처리기술 발표회, 지자체 자원순환 워크숍, 분리배출 체험교실 같은 행사와 교육도 진행한다.","tags":["폐기물","자원순환","협회"],"conf":"확인","global":false,"url":"https://www.kwaste.or.kr","ext":[],"grounded":true,"src":["http://www.kwaste.or.kr/","https://www.kwasteedu.or.kr/"]},{"id":"c346","name":"한국환경산업협회","sector":"공공·연구","subsector":"협회·단체","type":"공공·연구","scale":2,"founded":null,"hq":"서울","listed":null,"desc":"환경기술 및 환경산업 지원법에 근거해 설립된 법정법인으로, 국내 환경기업의 해외 진출을 돕는다. 수출 가능성이 있는 기업을 수출형 환경기업으로 키우는 육성 사업과, 진출 유망국에 민관 합동 시장개척단을 보내 사업 발굴과 수주를 지원하는 사업을 운영한다. 해외시장 조사와 환경 분야 전문인력 양성 교육도 맡는다.","tags":["환경산업","협회","해외진출 지원"],"conf":"확인","global":false,"url":"https://www.keia.kr","ext":[],"grounded":true,"src":["https://www.keia.kr/main/content/view/MN10100000.do","https://keia.kr/"]},{"id":"c347","name":"한국환경영향평가협회","sector":"공공·연구","subsector":"협회·단체","type":"공공·연구","scale":2,"founded":null,"hq":null,"listed":null,"desc":"환경영향평가를 대행하는 업체와 관련 전문가들이 회원으로 참여하는 사단법인이다. 환경영향평가서 설명회·공청회 진행과 검토·자문을 맡을 전문가를 회원사와 연결하는 '환경영향평가사 인력뱅크'를 운영한다. 회원사 소식과 채용 정보 등 업계 정보도 함께 제공한다.","tags":["환경영향평가","협회","대행업"],"conf":"확인","global":false,"url":"https://www.eiaa.or.kr","ext":[],"grounded":true,"src":["https://www.eiaa.or.kr/","https://eiaa.or.kr/page/s6/s4.php"]},{"id":"c348","name":"한국환경한림원","sector":"공공·연구","subsector":"협회·단체","type":"공공·연구","scale":2,"founded":null,"hq":null,"listed":null,"desc":"환경 보전에 기여한 전문가를 발굴·지원하고, 학술 연구와 국제 교류를 통해 환경 보전과 지속가능한 발전에 이바지하려는 비영리 학술단체다. 2011년 창립총회를 열고 그해 12월 비영리법인으로 등록했다. 2012년부터 환경리더스포럼을 열어 환경 현안을 논의해 왔으며 사무국은 서울 강남구에 있다.","tags":["학술단체","환경정책","전문가 네트워크"],"conf":"확인","global":false,"url":"https://www.kaoes.or.kr","ext":[],"grounded":true,"src":["https://www.kaoes.or.kr/introduction/history.do","https://ko.wikipedia.org/wiki/%ED%95%9C%EA%B5%AD%ED%99%98%EA%B2%BD%ED%95%9C%EB%A6%BC%EC%9B%90"]},{"id":"c394","name":"DL이앤씨","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":2021,"hq":"서울","listed":"코스피","desc":"탄소포집·활용·저장(CCUS) 전문 자회사 '카본코'를 세워, 발전소나 공장에서 나오는 이산화탄소를 붙잡아 다시 쓰거나 땅에 저장하는 설비의 설계·조달·시공 사업을 벌이고 있다. 호주 친환경 비료 제조사와 탄소 포집 시설 기본설계 계약에 합의하고, GE가스파워와 아시아·오세아니아 지역 친환경 발전소 건설 협약을 맺는 등 해외 사업도 추진한다.","tags":["탄소포집(CCUS)","탄소중립","친환경 신사업","지속가능경영보고서","온실가스 감축"],"conf":"확인","global":false,"url":"https://www.dlenc.co.kr/sustainability/environment/Act07.do","ext":[],"grounded":true,"src":["https://www.hankyung.com/realestate/article/202208195072i","https://news.mt.co.kr/mtview.php?no=2022103109062171342","http://www.kmecnews.co.kr/news/articleView.html?idxno=27260"]},{"id":"c396","name":"HDC현대산업개발","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"'지속가능경영보고서 2025'를 발간해 기후변화 대응과 안전보건, 건설 품질, 지속가능한 공급망 구축을 핵심 과제로 제시했다. 보고서에는 IFRS 지속가능성 공시기준(S1·S2)과 유럽 지속가능성 공시기준(ESRS), GRI, SASB, TCFD 등 국제 기준을 폭넓게 반영했다. 주요 ESG 성과는 외부 기관의 제3자 검증을 거쳤다.","tags":["지속가능경영보고서","ESG 경영체계","친환경 캠페인","온실가스 감축","환경안전(EHS)"],"conf":"확인","global":false,"url":"https://www.hdc-dvp.com","ext":[],"grounded":true,"src":["https://www.getnews.co.kr/news/articleView.html?idxno=829021","https://www.sisaweek.com/news/articleView.html?idxno=226824","https://www.mhns.co.kr/news/articleView.html?idxno=719004"]},{"id":"c399","name":"계룡건설산업","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":1970,"hq":"대전","listed":"코스피","desc":"ESG 경영 성과를 담은 지속가능경영보고서를 발간하며 GRI 기준과 유엔글로벌콤팩트 원칙, K-ESG 가이드라인, TCFD 등 국내외 지침을 반영했다. 건설 현장의 저탄소화와 기후변화 대응 사업 다각화, 탄소중립 경영체계 강화를 친환경 전략으로 삼고 있다. 환경 관리 수준을 인정받는 국제표준인 ISO 14001 환경경영시스템 인증도 취득했다.","tags":["지속가능경영보고서","환경안전(EHS)","공급망 ESG","온실가스 감축","ESG 경영체계"],"conf":"확인","global":false,"url":"https://www.krcon.co.kr","ext":[],"grounded":true,"src":["https://www.ccsidae.com/news/21092","https://www.mediapen.com/news/view/1043248"]},{"id":"c395","name":"롯데건설","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":1959,"hq":"서울","listed":"비상장","desc":"롯데그룹의 건설 계열사로 2013년부터 매년 지속가능경영보고서를 발간해 환경·사회·지배구조(ESG) 성과를 공개한다. 국제 보고 표준인 GRI와 IFRS 지속가능성 공시기준을 따르고, 기후·자연 관련 재무정보 공개 권고안(TCFD·TNFD)을 반영해 기후변화가 재무에 미치는 영향을 분석한다. 안전보건, 기후변화 대응, 품질경영, 협력사 동반성장을 핵심 과제로 관리한다.","tags":["지속가능경영보고서","ESG 공시","기후리스크","탄소중립","환경안전(EHS)"],"conf":"확인","global":false,"url":"https://www.lottecon.co.kr/sustainability/sustainability","ext":[],"grounded":true,"src":["https://www.businesspost.co.kr/BP?command=article_view&num=442792","https://www.kcenews.kr/8896","https://biz.heraldcorp.com/article/10814405"]},{"id":"c393","name":"삼성물산","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":1938,"hq":"서울","listed":"코스피","desc":"건설·상사·패션 등의 사업을 하는 삼성그룹 계열사로, 이사회 안에 ESG위원회를 두어 지속가능경영과 사회적 책임 관련 사항을 심의한다. 건설부문은 별도의 환경·에너지 방침을 두고 지구온난화 방지, 자원순환, 생물다양성 보전을 사업 전 과정에서 고려한다. 매년 지속가능경영보고서를 발간해 부문별 친환경 사업 확대 현황을 공개한다.","tags":["ESG위원회","환경·에너지방침","탄소중립","지속가능경영보고서","환경안전(EHS)"],"conf":"확인","global":false,"url":"https://www.samsungcnt.com/esg/resource/report/sustainability.do","ext":[],"grounded":true,"src":["https://www.samsungcnt.com/governance/governCommittee.do","https://www.secc.co.kr/ko/esg/echo-energy/policy","http://www.gvalley.co.kr/news/articleView.html?idxno=606889"]},{"id":"c397","name":"포스코이앤씨","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":null,"hq":"인천","listed":"비상장","desc":"포스코그룹의 건설 계열사로 인천에 본사를 두고 있다. 기후 관련 재무정보 공개 권고안(TCFD)에 맞춰 기후변화 대응 체계와 감축 목표를 세웠고, 공급망 전반의 배출량(Scope3)까지 포함한 온실가스 감축목표를 과학기반 감축목표 이니셔티브(SBTi)로부터 2024년 승인받았다. 수소 인프라·해상풍력·소형모듈원전 등 신재생에너지 사업과 이차전지 소재 등 친환경 소재 사업도 함께 추진한다.","tags":["탄소중립","지속가능경영보고서","온실가스 감축","친환경 건축","환경안전(EHS)"],"conf":"확인","global":false,"url":"https://www.poscoenc.com/ko/special_story/environment.aspx","ext":[],"grounded":true,"src":["https://newsroom.posco.com/kr/%ED%8F%AC%EC%8A%A4%EC%BD%94%EC%9D%B4%EC%95%A4%EC%94%A8-23%EB%85%84-esg-%EA%B2%BD%EC%98%81%EC%84%B1%EA%B3%BC-%EB%8B%B4%EC%9D%80-%EC%A7%80%EC%86%8D%EA%B0%80%EB%8A%A5%EA%B2%BD%EC%98%81%EB%B3%B4/","https://www.businesspost.co.kr/BP?command=article_view&num=358849","https://www.poscoenc.com/ko/special_story/environment.aspx"]},{"id":"c400","name":"한화","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":1952,"hq":"서울","listed":"코스피","desc":"(주)한화의 건설부문이 풍력발전과 수처리를 중심으로 환경 인프라 사업을 한다. 2013년부터 풍력사업을 추진해 영양 풍력발전단지(76MW)와 제주 수망 풍력발전단지(25MW)를 준공했고, 해상풍력과 육상풍력 사업을 함께 맡고 있다. 수처리 분야에서는 사업 제안부터 시공·운영까지 담당하며, 처리시설을 지하에 넣고 지상은 공원 등으로 활용하는 지하화 방식도 적용한다.","tags":["지속가능경영보고서","풍력발전","수처리","환경안전(EHS)","탄소중립"],"conf":"확인","global":false,"url":"https://www.hanwha.co.kr","ext":[],"grounded":true,"src":["https://m.hwenc.co.kr/pr/newsroom/view.do?board_id=3484","https://m.hwenc.co.kr/business/civil/portfolio_port.do","https://www.fnnews.com/news/202303091817454308"]},{"id":"c398","name":"현대엔지니어링","sector":"대기업 환경·ESG 조직","subsector":"건설·부동산","type":"대기업 환경조직","scale":4,"founded":1974,"hq":"서울","listed":"비상장","desc":"현대자동차그룹 계열의 종합 건설·엔지니어링 회사로 2045년까지 온실가스 순배출량을 0으로 줄이는 탄소중립 로드맵을 세웠다. 사업장 운영 효율화와 연료 전환, 재생에너지 전환, 협력업체와의 감축 협력을 축으로 배출량을 줄여 나간다. 태양광·해상풍력·수소 등 차세대 에너지 사업을 확대하며 매년 지속가능경영보고서를 발간한다.","tags":["탄소중립","지속가능경영보고서","온실가스 인벤토리","환경경영시스템","친환경 플랜트"],"conf":"확인","global":false,"url":"https://www.hec.co.kr","ext":[],"grounded":true,"src":["https://www.hyundai.co.kr/news/CONT0000000000158467","https://m.kukinews.com/article/view/kuk202408080020","https://www.fnnews.com/news/202408081501596345"]},{"id":"c424","name":"IBK기업은행","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":1961,"hq":"서울","listed":"코스피","desc":"중소기업 금융을 주로 다루는 국책은행으로 2040년 탄소중립을 선언하고 녹색대출과 녹색투자를 늘리고 있다. 환경·사회 분야 사업에 쓸 자금을 조달하는 ESG 채권을 꾸준히 발행하며, 중소기업의 기후변화 대응과 ESG 경영을 지원한다. 매년 지속가능경영보고서를 발간해 녹색채권 관리 현황과 지속가능금융 성과를 공개한다.","tags":["녹색금융","ESG 채권","지속가능경영보고서","기후리스크","ESG 투자"],"conf":"확인","global":false,"url":"https://www.ibk.co.kr","ext":[],"grounded":true,"src":["https://www.greened.kr/news/articleView.html?idxno=315877","https://www.dailyenews.co.kr/news/articleView.html?idxno=44504","https://www.thefairnews.co.kr/news/articleView.html?idxno=80733"]},{"id":"c419","name":"KB금융지주","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":2008,"hq":"서울","listed":"코스피","desc":"국민은행 등을 자회사로 둔 금융지주회사로 이사회 안에 ESG위원회를 두고 있다. 2021년 제정한 환경·사회 리스크 관리 모범규준에 따라 철강·석유화학·시멘트처럼 온실가스를 많이 배출하는 산업을 기후변화 관심 영역으로 관리한다. 태양광·풍력 같은 친환경 사업뿐 아니라 고탄소 산업의 저탄소 전환을 돕는 전환금융까지 ESG사업부가 총괄한다.","tags":["녹색금융","기후리스크","TCFD 보고","ESG 투자","금융배출량"],"conf":"확인","global":false,"url":"https://www.kbfg.com/kor/esg/result/finance.htm","ext":[],"grounded":true,"src":["https://www.kbfg.com/api/download/board/10804","https://magazine.hankyung.com/business/article/202607316734b","https://www.hankyung.com/economy/article/2020071598631"]},{"id":"c426","name":"NH농협금융지주","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":2012,"hq":"서울","listed":"비상장","desc":"농협은행과 NH투자증권 등을 계열사로 둔 금융지주회사로, ESG 전략협의회를 열어 그룹 차원의 기후금융 전략을 조율한다. 태양광·풍력·히트펌프 등 재생에너지 사업에 투자와 대출을 늘리고, 농업·반도체·철강 분야 중소·중견기업의 저탄소 설비 투자를 지원한다. NH투자증권은 탄소배출권 위탁매매와 자발적 탄소크레디트 사업을 맡고 있다.","tags":["녹색금융","기후금융","탄소금융","ESG 투자","기후리스크"],"conf":"확인","global":false,"url":"https://www.nhfngroup.com/user/indexSub.do?codyMenuSeq=1076147994&siteId=nhfngroup","ext":[],"grounded":true,"src":["https://magazine.hankyung.com/business/article/202607316744b","https://www.businesspost.co.kr/BP?command=article_view&num=440347","https://www.viva100.com/article/20260618500165"]},{"id":"c425","name":"미래에셋증권","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"증권사로 2021년 RE100에 가입해 사용 전력을 재생에너지로 바꾸는 목표를 세웠다. 재생에너지 공급인증서(REC) 장기 구매계약과 전력을 직접 사오는 계약을 맺어 전력 사용량의 상당 부분을 재생에너지로 전환했다. 친환경·사회 분야에 자금을 대는 지속가능금융 목표를 세워 조달·투자 실적을 관리하고 지속가능경영 공시 채널로 공개한다.","tags":["지속가능금융","RE100","ESG 투자","녹색금융","기후리스크"],"conf":"확인","global":false,"url":"https://securities.miraeasset.com/newir/view/mobile/kr/about/sustain.jsp","ext":[],"grounded":true,"src":["https://www.dailyenews.co.kr/news/articleView.html?idxno=46292","https://www.hankyung.com/article/202504244413i","https://securities.miraeasset.com/newir/view/mobile/kr/about/sustain.jsp"]},{"id":"c423","name":"삼성화재해상보험","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":1952,"hq":"서울","listed":"코스피","desc":"손해보험사로 2020년 석탄발전에 대한 신규 투자와 보험 인수를 모두 중단하는 탈석탄 금융을 선언했다. 2021년 기후 관련 재무정보 공개 협의체(TCFD)에 가입해 권고안에 따라 기후변화가 사업에 주는 위험과 기회를 공시한다. 투자 대상도 신재생에너지에서 전기·수소 선박, 에너지를 거의 쓰지 않는 제로에너지 건물, 그린 리모델링 등으로 넓히고 있다.","tags":["TCFD 보고","기후리스크","ESG 투자","지속가능경영보고서","녹색금융"],"conf":"확인","global":false,"url":"https://www.samsungfire.com/m/company/M_U03_02_04_001.html","ext":[],"grounded":true,"src":["https://www.samsungfire.com/m/company/M_U03_02_04_001.html","https://www.sedaily.com/NewsVIew/22OZJCLIR3","https://www.inthenews.co.kr/news/article.html?no=48192"]},{"id":"c420","name":"신한금융지주회사","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":2001,"hq":"서울","listed":"코스피","desc":"신한은행 등 금융 계열사를 둔 금융지주회사로, 그룹 ESG 보고서를 통해 기후 대응 성과를 공시한다. 정부가 만든 한국형 녹색분류체계(K-택소노미)를 적용한 녹색채권을 발행해 태양광·바이오매스 발전 같은 신재생에너지 사업과 무공해차 전환에 자금을 공급하고, 한국형 녹색채권 발행 이차보전 지원 시범사업에도 참여했다.","tags":["녹색금융","전환금융","TCFD 보고","기후리스크","금융배출량"],"conf":"확인","global":false,"url":"http://www.shinhangroup.com","ext":[],"grounded":true,"src":["https://kind.krx.co.kr/external/2024/06/28/000651/20240628001541/%EC%8B%A0%ED%95%9C%EA%B8%88%EC%9C%B5%EA%B7%B8%EB%A3%B9_2023%20ESG%EB%B3%B4%EA%B3%A0%EC%84%9C.pdf","https://m.shinhangroup.com/mobileWeb/shinhan_social_responsibility.jsp"]},{"id":"c422","name":"우리금융지주","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":2019,"hq":"서울","listed":"코스피","desc":"우리은행 등을 계열사로 둔 금융지주회사로, 그룹 ESG 보고서를 정기 발간한다. 2050년까지 탄소중립을 달성한다는 목표 아래 탄소배출이 많은 산업에는 '그룹 환경·사회적 리스크관리 기준'을 적용해 자산을 관리하고, 녹색금융과 지속가능채권 발행은 늘려가고 있다. 투자 결정 때 기후리스크 관리체계 등 ESG 요소를 비재무 지표로 함께 검토한다.","tags":["녹색금융","기후리스크","지속가능채권","ESG 공시","ESG 투자"],"conf":"확인","global":false,"url":"https://www.woorifg.com/kor/social-contribution/continuous/list.do","ext":[],"grounded":true,"src":["https://www.woorifg.com/kor/social-contribution/esg-finance-principle/contentsid/457/index.do","https://www.greened.kr/news/articleView.html?idxno=306181","https://www.nspna.com/news/?mode=view&newsid=817650"]},{"id":"c421","name":"하나금융지주","sector":"대기업 환경·ESG 조직","subsector":"금융·보험","type":"대기업 환경조직","scale":4,"founded":2005,"hq":"서울","listed":"코스피","desc":"하나은행 등을 계열사로 둔 금융지주회사로, 그룹 지속가능경영보고서를 발간한다. 탄소회계금융협의체(PCAF) 기준에 따라 기업대출·프로젝트금융·주택담보대출 등 7개 자산군의 금융배출량, 즉 돈을 빌려준 기업이 배출하는 온실가스를 산정해 산업별·관계사별로 분석한다. 기후리스크는 전환 리스크와 물리적 리스크로 나눠 재무 영향을 산출한다.","tags":["녹색금융","기후리스크","지속가능경영보고서","금융배출량","ESG 투자"],"conf":"확인","global":false,"url":"https://www.hanafn.com/esg/reporting/reprt.do","ext":[],"grounded":true,"src":["https://www.hanafn.com/esg/reporting/reprt.do","https://www.bloter.net/news/articleView.html?idxno=667654","https://www.getnews.co.kr/news/articleView.html?idxno=873757"]},{"id":"c411","name":"BGF리테일","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"편의점 CU를 운영하는 유통기업으로, 2018년부터 국제 공시 표준에 맞춘 지속가능경영보고서를 매년 발간해 온실가스 배출량과 자원순환 성과를 공개한다. 기후변화 대응과 자원순환을 환경경영의 핵심 과제로 삼아, 폐전자제품 재활용 협약 등 전국 점포망을 활용한 자원 회수 활동을 추진한다.","tags":["지속가능경영보고서","온실가스 인벤토리","순환경제","물류 탄소감축","ESG 공시"],"conf":"확인","global":false,"url":"https://www.bgfretail.com/esg/esg-report/report/","ext":[],"grounded":true,"src":["https://www.bgfretail.com/esg/esg-report/report/","https://www.bgfretail.com/assets/file/bgf-retail/2024-2025_BGF-Retail-Sustainability-Report_kor.pdf","https://www.bgf.co.kr/esg/environmentMng/activity/"]},{"id":"c403","name":"CJ제일제당","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"식품과 바이오 소재를 만드는 CJ그룹 계열사로, '2050 탄소중립'과 폐기물 제로를 목표로 내걸고 전 사업장 온실가스 배출량을 2030년까지 2020년 대비 25% 줄이겠다는 계획을 세웠다. 바이오사업에서는 자연에서 썩어 없어지는 생분해 소재 PHA를 상용화해 'PHACT' 브랜드로 공급하며, 매년 지속가능경영보고서를 발간한다.","tags":["지속가능경영 추진조직","기후변화 대응","온실가스 인벤토리","지속가능경영보고서","친환경 소재"],"conf":"확인","global":false,"url":"https://www.cj.co.kr/kr/aboutus/sustainability/strategy","ext":[],"grounded":true,"src":["https://www.cj.co.kr/kr/aboutus/sustainability/strategy","https://m.cj.co.kr/cj_files/2024_sustainability_report_ko.pdf","https://cjnews.cj.net/cj%EC%A0%9C%EC%9D%BC%EC%A0%9C%EB%8B%B9-2050%EB%85%84%EA%B9%8C%EC%A7%80-%ED%83%84%EC%86%8C%EC%A4%91%EB%A6%BD-%EC%8B%A4%ED%98%84-%EC%84%A0%EC%96%B8-esg%EA%B2%BD%EC%98%81-%EB%B0%95/"]},{"id":"c405","name":"LG생활건강","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":2001,"hq":"서울","listed":"코스피","desc":"화장품·생활용품·음료를 만드는 기업으로, ESG 보고서와 TCFD 보고서를 발간하며 2050년 탄소중립 달성을 목표로 감축 과제를 단계적으로 도입하고 있다. 직접 배출부터 공급망·제품 사용 단계까지(Scope 1·2·3) 온실가스를 정량 산정해 관리하고, 용기 경량화와 재생 원료 사용 등 포장재 개선을 통해 플라스틱 사용량을 2030년까지 약 20% 줄이는 목표를 두고 있다.","tags":["온실가스 감축","재생 플라스틱","순환경제","지속가능경영보고서","친환경 포장재"],"conf":"확인","global":false,"url":"https://www.lghnh.com/manage/index.jsp","ext":[],"grounded":true,"src":["https://www.lghnh.com/manage/index.jsp","https://www.lghnh.com/file/24_LGHH_ESG_REPORT_SR_KOR.pdf","https://www.lghnh.com/file/21_LGHG_TCFD_REPORT_KOR.pdf","https://www.lghnh.com/manage/product/product4.jsp"]},{"id":"c407","name":"농심","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":1965,"hq":"서울","listed":"코스피","desc":"라면·스낵을 만드는 식품 기업으로, 홈페이지에 환경(Planet) 섹션을 두고 지속가능 포장재 정책을 공개한다. 포장재를 줄이고(Reduce) 바꾸고(Replace) 재활용(Recycle)하는 3R 전략에 따라, 여러 소재가 섞여 재활용이 어려운 필름 포장재를 한 가지 재질로 바꾸는 단일재질화와 페트병 경량화, 무라벨 생수를 추진한다. 공장 설비 교체로 온실가스 배출량도 줄이고 있다.","tags":["친환경 포장재","순환경제","온실가스 감축","지속가능경영보고서","ESG 경영체계"],"conf":"확인","global":false,"url":"https://www.nongshim.com/management/planet/sustainable_packaging","ext":[],"grounded":true,"src":["https://www.nongshim.com/management/planet/sustainable_packaging","https://www.kca.go.kr/webzine/board/view?menuId=MENU00306&linkId=485&div=kca_2212"]},{"id":"c402","name":"롯데쇼핑","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":1970,"hq":"서울","listed":"코스피","desc":"백화점·마트 등 유통 사업을 운영하는 기업으로, 2040년 탄소중립을 목표로 중장기 로드맵을 세우고 매년 지속가능경영보고서를 발간한다. 과학기반 감축목표 이니셔티브(SBTi)로부터 감축목표를 승인받아 2031년까지 온실가스 배출량을 2021년 대비 46.2% 줄이기로 했다. 점포 태양광 설비와 전기차 충전소를 늘리고 재생에너지 전력구매계약(PPA) 도입도 추진한다.","tags":["탄소중립","에너지 효율","지속가능경영보고서","순환경제","온실가스 감축"],"conf":"확인","global":false,"url":"https://www.lotteshopping.com","ext":[],"grounded":true,"src":["https://www.dailyenews.co.kr/news/articleView.html?idxno=51684","https://www.fetv.co.kr/news/article.html?no=195534","https://www.meconomynews.com/news/articleView.html?idxno=115546"]},{"id":"c404","name":"아모레퍼시픽","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":null,"hq":"서울","listed":"코스피","desc":"화장품을 만드는 기업으로, 그룹 차원의 지속가능성 보고서를 꾸준히 발간해 환경 성과를 공개한다. 2030년까지 제품 포장재의 플라스틱 사용량을 줄이고 플라스틱 포장재는 100% 재활용·재사용 또는 퇴비화가 가능하도록 설계하겠다는 목표를 세웠다. 내용물만 갈아 끼우는 리필 제품을 늘려 본품 대비 플라스틱 사용량을 절반가량 줄이는 등 석유에서 뽑아낸 새 플라스틱 사용을 줄이고 있다.","tags":["플라스틱 저감","순환경제","온실가스 감축","지속가능경영보고서","친환경 포장재"],"conf":"확인","global":false,"url":"https://www.apgroup.com/int/ko/commitments/sustainability/sustainability.html","ext":[],"grounded":true,"src":["https://www.apgroup.com/int/ko/commitments/sustainability/sustainability.html","https://sr.apgroup.com/","https://www.mirae-biz.com/news/articleView.html?idxno=71292","https://stories.amorepacific.com/%EC%95%84%EB%AA%A8%EB%A0%88%ED%8D%BC%EC%8B%9C%ED%94%BD-%EA%B0%80%EC%84%B1%EB%B9%84-%EC%8B%9C%EC%84%B1%EB%B9%84%EB%A5%BC-%EA%B0%96%EC%B6%98-%EC%95%84%EB%AA%A8%EB%A0%88%ED%8D%BC%EC%8B%9C%ED%94%BD/"]},{"id":"c408","name":"에스씨케이컴퍼니","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":1997,"hq":"서울","listed":"비상장","desc":"스타벅스 브랜드의 국내 매장을 운영하는 회사로, 1999년 국내 진출 때부터 개인 컵을 가져온 고객에게 음료 할인을 제공해 왔고 2022년 할인액을 400원으로 올렸다. 2018년에는 환경부·자원순환사회연대와 종이 빨대 자율협약을 맺고 빨대 없이 마실 수 있는 컵 뚜껑을 도입했으며, 환경부·LG전자·자원순환사회연대와 다회용컵 사용 확산 업무협약도 체결했다.","tags":["일회용품 저감","다회용컵","순환경제","친환경 매장","ESG 캠페인"],"conf":"확인","global":false,"url":"https://www.starbucks.co.kr/responsibility/no_disposable_cup.do","ext":[],"grounded":true,"src":["https://www.starbucks.co.kr/responsibility/no_disposable_cup.do","https://www.2050cnc.go.kr/base/board/read?boardManagementNo=43&boardNo=3358&menuLevel=2&menuNo=92","https://news.sbs.co.kr/news/endPage.do?news_id=N1007695215"]},{"id":"c406","name":"오뚜기","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":1969,"hq":"서울","listed":"코스피","desc":"라면·소스 등 가공식품을 만드는 식품기업으로, 매년 지속가능경영보고서를 발간하며 2050년 탄소중립 달성을 비전으로 내걸었다. 생산사업장의 탄소 배출을 없애고 사용 전력을 모두 재생에너지로 바꾸는 것, 배출량 모니터링 시스템을 갖추는 것을 3대 목표로 삼았다. ESG 데이터를 한곳에 모아 관리하는 플랫폼을 구축해 공시 데이터의 투명성을 높이고, 기후변화 리스크가 재무에 미치는 영향도 시나리오별로 분석한다.","tags":["탄소중립","지속가능경영보고서","ESG 데이터 공시","온실가스 인벤토리","친환경 설비"],"conf":"확인","global":false,"url":"https://www.otoki.com/esg/management-report","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/202606305691g","https://www.otoki.com/esg/management-report","https://www.otoki.com/esg/esg-data","https://weekly.hankooki.com/news/articleView.html?idxno=7172231"]},{"id":"c409","name":"우아한형제들","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":2011,"hq":"서울","listed":"비상장","desc":"배달앱 '배달의민족'을 운영하는 회사로, 2022년 서울시와 업무협약을 맺고 다회용기 배달 주문 서비스를 시작해 경기·인천 등 여러 지자체로 지역을 넓혔다. 앱에서 다회용기를 고르면 음식이 스테인리스 용기에 담겨 오고, 다 먹은 뒤 QR코드로 신청하면 회수업체가 용기를 가져간다. 일회용 수저·포크를 받지 않는 설정을 기본값으로 적용하는 등 '배민그린' 이름의 친환경 배달 캠페인을 이어가고 있다.","tags":["다회용기","일회용품 저감","순환경제","친환경 배달","ESG 캠페인"],"conf":"확인","global":false,"url":"https://www.woowahan.com","ext":[],"grounded":true,"src":["https://www.cbci.co.kr/news/articleView.html?idxno=530357","https://www.hankyung.com/article/202505191554i","https://www.bizwnews.com/news/articleView.html?idxno=104561","https://weekly.hankooki.com/news/articleView.html?idxno=7114634"]},{"id":"c401","name":"이마트","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":2011,"hq":"서울","listed":"코스피","desc":"전국에 점포를 운영하는 대형마트 기업으로, 2050년까지 온실가스 순배출량을 0으로 만드는 넷제로를 선언하고 이행 성과를 담은 '넷제로 보고서'를 발간한다. 2018년 대비 2030년까지 배출량을 32.8% 줄이는 중간 목표를 세우고 운영 효율 개선, 설비 교체, 탄소상쇄사업, 신재생에너지 투자 네 갈래로 감축을 추진한다. 협력사·물류·상품 등 공급망 전반에서 나오는 간접 배출량(Scope 3)까지 산정해 공개하고 있다.","tags":["넷제로","온실가스 인벤토리","순환경제","지속가능경영보고서","ESG 공시"],"conf":"확인","global":false,"url":"https://company.emart.com/ko/ethic/sustainability_report.do","ext":[],"grounded":true,"src":["https://zdnet.co.kr/view/?no=20231203012158","https://www.shinsegaegroupnewsroom.com/118166/","https://www.shinsegaegroupnewsroom.com/158130","https://www.emetro.co.kr/article/20231203500080"]},{"id":"c410","name":"풀무원","sector":"대기업 환경·ESG 조직","subsector":"유통·소비재·식음료","type":"대기업 환경조직","scale":4,"founded":1984,"hq":"서울","listed":"코스피","desc":"두부·나물 등 신선식품을 만드는 식품기업으로, 경영 성과와 ESG 활동을 함께 담은 통합보고서를 매년 발간한다. 회사가 사회·환경에 주는 영향과 사회·환경이 회사에 주는 영향을 양방향으로 따지는 '이중 중대성 평가'를 매년 시행해 중점 관리 과제를 추린다. 기온이 1~2도만 변해도 농산물 원산지와 공급망이 흔들린다는 점에서 기후변화 대응을 핵심 현안으로 두고, 공급망 ESG 얼라이언스를 이끌고 있다.","tags":["이중 중대성 평가","기후변화 대응","공급망 ESG","지속가능경영보고서","온실가스 감축"],"conf":"확인","global":false,"url":"https://www.pulmuone.co.kr","ext":[],"grounded":true,"src":["https://www.pulmuone.co.kr/pulmuone/sustainability/listreport.do","https://news.pulmuone.co.kr/pulmuone/data/%ED%92%80%EB%AC%B4%EC%9B%90%ED%86%B5%ED%95%A9%EB%B3%B4%EA%B3%A0%EC%84%9C2024.pdf","https://www.hankyung.com/article/202503219006i"]},{"id":"c365","name":"HL만도","sector":"대기업 환경·ESG 조직","subsector":"자동차·모빌리티","type":"대기업 환경조직","scale":4,"founded":null,"hq":"경기","listed":"코스피","desc":"자동차 부품을 만드는 HL그룹 계열사로, 환경·사회·지배구조 성과를 담은 지속가능경영보고서를 자율공시 형태로 발간한다. 2050년 탄소중립을 선언했고, 감축 목표가 과학적 근거에 맞는지 검증하는 국제 이니셔티브 SBTi로부터 2035년 단기 온실가스 감축 목표를 승인받았다. 기후변화와 관련한 지배구조·전략·위험관리 방식과 온실가스 감축 목표를 함께 공시하고 있다.","tags":["온실가스 감축","환경경영","공급망 ESG","지속가능경영보고서"],"conf":"확인","global":false,"url":"https://w
