:root{
  --ink:#0d2740; --ink2:#3d5a77; --muted:#7b93ab; --line:rgba(120,155,190,.30);
  --accent:#1470e0;
  --topbar-h:52px; --left-w:274px; --right-w:308px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  color:var(--ink); font-size:13px; overflow:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(1100px 700px at 12% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
    radial-gradient(900px 600px at 92% 8%, #dcebff 0%, rgba(220,235,255,0) 62%),
    linear-gradient(168deg,#eef4fb 0%,#e2ecf8 46%,#d6e4f4 100%);
}
button{font:inherit; color:var(--ink2); background:rgba(255,255,255,.55); border:1px solid var(--line);
  border-radius:9px; padding:4px 9px; cursor:pointer; transition:.16s;}
button:hover{background:#fff; border-color:rgba(20,112,224,.45); color:var(--ink);}
button.active{border-color:var(--accent); color:var(--accent); background:rgba(20,112,224,.09);
  box-shadow:0 0 0 3px rgba(20,112,224,.09);}

const DATA = {"meta":{"generated":"2026-08-01","version":"2.0","title":"국내 환경산업 비즈니스 생태계","note":"웹 조사 기반. conf=추정은 근거 제한적. scale은 type에서 파생한 규모 등급(1~5)."},"sectors":[{"id":"s01","name":"물·수자원","subsectors":["수처리 플랜트·EPC","상하수도 운영·관리","생활 물케어","막·필터 소재","관로·기자재","초순수·산업용수","수처리 약품","해수담수화·물 재이용"],"about":"빗물과 강물, 지하수를 마실 수 있는 물로 바꾸고, 한 번 쓰고 버린 물을 다시 쓰거나 자연으로 안전하게 돌려보내는 일을 한다. 집 수도꼭지에서 나오는 수돗물과 정수기 물, 공장이 끌어 쓰는 공업용수와 그 공장이 내보내는 폐수까지 모두 이 분야가 만든 시설·소재·약품을 거쳐 간다. 물이 부족해지거나 더러워지면 생활과 산업이 함께 멈추기 때문에, 도로나 전기와 같은 기초 인프라로 관리된다.","subAbout":{"수처리 플랜트·EPC":"정수장, 하수·폐수처리장처럼 물을 처리하는 시설을 설계하고 설비를 사들여 현장에 지어 올린다. EPC는 설계(Engineering)·조달(Procurement)·시공(Construction)의 앞글자로, 한 회사가 이 세 단계를 묶어 책임지고 완성해 넘기는 방식을 뜻한다.","상하수도 운영·관리":"이미 지어진 정수장과 하수처리장을 매일 가동하고, 물이 오가는 관로를 점검해 누수나 수질 이상을 찾아낸다. 시설을 짓고 끝나는 일이 아니라 수십 년에 걸쳐 계속 돌봐야 하는 운영 업무가 중심이다.","생활 물케어":"가정과 사무실에서 쓰는 정수기처럼 개인이 직접 마시는 물을 한 번 더 걸러 주는 제품을 만들고, 빌려주고 필터를 갈아 주는 렌털·관리 서비스로 제공한다. 수돗물이 집 안까지 들어온 뒤 마지막 한 단계를 맡는 자리다.","막·필터 소재":"물속의 이물질과 오염물질을 걸러내는 얇은 막(멤브레인)과 필터를 만든다. 정수기 카트리지부터 하수 처리, 바닷물 담수화 설비까지 물을 거르는 공정 대부분에 공통으로 들어가는 핵심 부품이다.","관로·기자재":"물을 실어 나르는 수도관과 밸브, 펌프, 계량기 같은 부품을 만들고 공급한다. 아무리 깨끗하게 처리한 물이라도 새거나 삭은 관을 지나면 소용이 없어서, 땅속에 묻혀 눈에 보이지 않는 이 설비가 물 공급의 성패를 가른다.","초순수·산업용수":"공장이 생산 공정에 쓰는 물을 용도에 맞는 수준으로 만들어 공급한다. 그중 초순수는 미네랄과 미세 입자, 미생물까지 걷어낸 매우 깨끗한 물로 반도체 웨이퍼를 씻어내는 공정 등에 쓰이며, 수돗물과는 요구되는 깨끗함의 기준 자체가 다르다.","수처리 약품":"물을 처리하는 과정에 넣는 화학약품을 만들어 정수장과 공장에 공급한다. 미세한 흙 알갱이를 뭉쳐 가라앉히는 응집제, 세균을 없애는 소독제, 배관 안쪽에 물때가 끼는 것을 막는 스케일 방지제처럼 설비만으로는 해결되지 않는 부분을 약품이 맡는다.","해수담수화·물 재이용":"바닷물에서 소금기를 빼내 쓸 수 있는 물로 바꾸거나, 하수·폐수를 처리한 물을 공업용수나 청소·조경용으로 다시 쓰게 만든다. 강물과 지하수만으로 수요를 채우기 어려운 가뭄 지역이나 물을 많이 쓰는 산업단지에서 새로운 물 공급원을 확보하는 방법이다."}},{"id":"s02","name":"대기·공기질","subsectors":["집진·여과","VOCs·악취 저감","탈황·탈질·촉매","실내공기질·공기청정"],"about":"공장 굴뚝과 소각로, 자동차, 건물에서 나오는 먼지와 가스를 밖으로 내보내기 전에 걸러내거나 분해하는 분야다. 발전소·제철소·석유화학 같은 산업 현장의 배출 설비부터 지하철역·학교·집 안의 공기까지 대상이 넓다. 미세먼지 농도나 주변 공장에서 나는 냄새처럼 사람들이 매일 체감하는 문제와 바로 닿아 있다.","subAbout":{"집진·여과":"배출가스에 섞인 먼지 알갱이를 굴뚝으로 나가기 전에 붙잡아 모으는 설비를 만들고 운영한다. 천으로 된 여과포에 걸러내는 방식(여과집진)이나 먼지에 전기를 띠게 해 금속판에 달라붙게 하는 방식(전기집진)이 대표적이며, 걸러낸 먼지는 따로 모아 처리한다.","VOCs·악취 저감":"페인트·인쇄·도장·석유화학 공정에서 나오는 VOCs(휘발성유기화합물, 쉽게 증발해 공기 중에 떠다니는 탄소 화합물)와 냄새 물질을 없앤다. 활성탄 같은 소재에 달라붙게 해 모으거나 고온에서 태워 물과 이산화탄소로 분해하는 설비가 쓰이며, 공장 주변 악취 민원과 직접 연결된 영역이다.","탈황·탈질·촉매":"발전소나 소각로의 배기가스에서 황산화물(산성비를 만드는 물질)과 질소산화물(미세먼지와 오존을 만드는 원인 물질)을 줄인다. 석회 같은 약품으로 황을 붙잡는 탈황, 암모니아와 촉매(스스로는 소모되지 않으면서 화학반응을 일으켜 주는 물질)를 써서 질소산화물을 해롭지 않은 질소와 물로 바꾸는 탈질 설비, 그리고 여기 들어가는 촉매 소재를 만든다.","실내공기질·공기청정":"지하역사·학교·병원처럼 사람이 많이 모이는 실내와 가정의 공기를 측정하고 오염물질을 걸러낸다. 공기청정기와 환기설비, 필터, 미세먼지·폼알데하이드 같은 항목을 재는 측정 기기가 여기에 속하며, 실내공기질 관리 기준을 지켜야 하는 시설들이 주된 수요처다."}},{"id":"s03","name":"폐기물 처리","subsectors":["소각·에너지화","매립","산업·지정폐기물","수집·운반","의료폐기물","건설폐기물","폐기물 관리 플랫폼"],"about":"쓰고 버린 것을 모아 태우거나 땅에 묻어, 남은 쓰레기가 사람과 주변 환경에 해를 끼치지 않도록 마무리하는 분야다. 가정에서 내놓는 종량제봉투부터 공장에서 나오는 폐유, 병원의 주사바늘, 건물을 헐 때 나오는 콘크리트 덩어리까지가 모두 이 분야의 손을 거친다. 태울 때 나오는 열을 전기나 난방으로 되돌려 쓰고, 어떤 폐기물이 어디서 나와 어디로 갔는지를 기록으로 남기는 일까지 함께 이뤄진다.","subAbout":{"소각·에너지화":"탈 수 있는 쓰레기를 태워 부피를 크게 줄이고, 그때 나오는 열을 증기나 전기로 바꿔 쓰는 일을 한다. 탈 것만 골라내 석탄 대신 쓰는 고형연료(SRF)로 가공하는 일도 여기에 들어가며, 태울 때 생기는 매연과 유해가스를 걸러내는 설비가 함께 따라붙는다.","매립":"더 이상 태우거나 재활용할 수 없는 것을 땅에 묻는 마지막 단계다. 바닥에 물이 새지 않는 막을 깔아 쓰레기에서 흘러나온 오염된 물(침출수)이 지하수로 스미지 않게 막고, 썩으면서 나오는 가스를 뽑아내며, 다 채운 뒤에도 오랫동안 상태를 지켜보는 사후관리를 한다.","산업·지정폐기물":"공장과 사업장에서 나오는 폐기물, 그중에서도 폐유·폐산처럼 주변을 오염시키거나 사람에게 해로울 수 있는 것을 따로 모아 처리한다. 이런 것은 법이 '지정폐기물'로 묶어 일반 쓰레기와 섞지 못하게 하기 때문에, 별도 허가와 전용 시설을 갖춘 업체만 손댈 수 있다.","수집·운반":"쓰레기가 나온 자리에서 소각장이나 매립장 같은 처리시설까지 실어 나르는 일을 맡는다. 폐기물 종류에 맞는 전용 차량과 허가가 필요하고 어디서 받아 어디에 넘겼는지를 기록으로 남겨야 해서, 배출과 처리를 잇는 연결고리 역할을 한다.","의료폐기물":"병원과 동물병원, 검사기관에서 나오는 주사바늘이나 수술 후 적출물처럼 감염 위험이 있는 폐기물을 다룬다. 새지 않는 전용 용기에 담아 정해진 보관 기간 안에 전용 소각시설로 옮겨야 하고, 용기마다 전자태그를 붙여 이동 경로를 추적한다.","건설폐기물":"건물을 짓거나 헐 때 쏟아지는 콘크리트, 벽돌, 폐목재 같은 것을 처리한다. 부수고 골라내는 과정을 거쳐 다시 쓸 수 있는 골재(순환골재)로 만들어 도로 기초를 다지는 등에 되돌려 쓰는 것이 핵심이다.","폐기물 관리 플랫폼":"폐기물이 어디서 나와 누구를 거쳐 어디서 처리됐는지를 전산으로 기록하고 확인하는 시스템과 서비스다. 국내에서는 배출자·운반자·처리업체가 온라인으로 인계서를 주고받는 공공 시스템(올바로)이 축을 이루고, 배출량 집계나 처리업체 연결을 돕는 민간 서비스가 그 위에 붙는다."}},{"id":"s04","name":"재활용·순환경제","subsectors":["배터리·도시광산","업사이클·새활용","플라스틱 재활용","다회용기·리필","섬유·기타 재활용","유기성 자원·바이오가스","금속·전자폐기물","AI 분류·회수 로봇"],"about":"쓰고 버린 물건을 다시 원료나 제품으로 되돌려, 새로 캐내고 새로 만들어야 할 자원의 양을 줄이는 분야다. 페트병과 폐가전, 음식물 쓰레기, 수명이 다한 배터리처럼 집과 공장에서 매일 나오는 것들이 선별·세척·분해를 거쳐 플라스틱 원료와 금속, 연료로 다시 쓰인다. 원료를 수입에 기대는 제조업과 도시의 쓰레기 처리 문제가 동시에 걸려 있는 자리다.","subAbout":{"배터리·도시광산":"전기차와 휴대폰에서 수명이 다한 배터리를 모아 아직 쓸 만한 것은 다른 용도로 다시 쓰고, 나머지는 잘게 부숴 리튬·니켈·코발트 같은 금속을 뽑아낸다. 도시에 쌓인 폐제품을 광산에 빗대 '도시광산'이라 부르며, 광석을 캐지 않고도 산업 원료를 확보하는 통로가 된다.","업사이클·새활용":"버려진 현수막이나 폐자재, 안 입는 옷을 원래 쓰임과 다른 제품으로 다시 만들어 판다. 잘게 부숴 원료로 되돌리는 일반 재활용과 달리 소재의 형태를 살린 채 디자인을 더해 값을 올리는 방식이라 우리말로 '새활용'이라 부른다.","플라스틱 재활용":"버려진 플라스틱을 종류별로 골라내고 씻어 다시 알갱이 원료로 만들거나, 열을 가해 분해해 기름·화학원료 단계까지 되돌린다. 새 제품에 재생 원료를 섞어 쓰도록 요구하는 규제가 늘면서 포장재와 자동차 부품 업계가 주요 수요처가 되고 있다.","다회용기·리필":"한 번 쓰고 버리는 컵과 배달 용기를 여러 번 쓰는 용기로 바꾸고, 사용한 그릇을 회수해 전문 세척한 뒤 다시 공급하는 서비스를 운영한다. 내용물만 덜어 담아 파는 리필 매장과 함께, 쓰레기를 처리하기 전에 애초에 덜 만드는 쪽을 맡는다.","섬유·기타 재활용":"버려진 옷과 공장에서 나온 자투리 원단을 다시 실과 원단으로 되돌리거나, 폐페트병에서 뽑은 실로 옷과 가방을 만든다. 유리병·폐타이어·폐목재처럼 품목별 분류에 따로 묶이지 않는 재활용도 여기에 들어간다.","유기성 자원·바이오가스":"음식물 쓰레기와 가축 분뇨, 하수 찌꺼기처럼 썩는 폐기물을 공기가 없는 탱크에 넣어 미생물로 분해하고, 이때 나오는 메탄 가스를 도시가스나 발전 연료로 쓴다(혐기성 소화). 분해하고 남은 찌꺼기는 퇴비나 액체 비료로 돌려보내, 처리 비용만 들던 폐기물을 에너지와 비료로 바꾼다.","금속·전자폐기물":"폐가전과 폐전선, 공장에서 나온 금속 부스러기를 모아 철·구리·알루미늄처럼 다시 녹여 쓸 수 있는 상태로 되돌린다. 전자제품 안에 든 납·수은 같은 유해물질을 분리해 안전하게 처리하는 일도 함께 맡는다.","AI 분류·회수 로봇":"선별장 컨베이어 위를 지나가는 폐기물을 카메라와 인공지능이 종류별로 알아보고, 로봇 팔이 집어내 골라낸다. 사람 손에 기대던 선별 작업의 속도와 정확도를 높이는 일로, 뒤이은 재활용 원료의 품질이 여기서 갈린다."}},{"id":"s05","name":"토양·지하수","subsectors":["토양·지하수 정화","오염 조사·컨설팅"],"about":"땅속의 흙과 그 아래를 흐르는 지하수가 오염됐는지 확인하고, 오염된 곳을 원래 상태에 가깝게 되돌리는 일을 한다. 주유소 저장탱크에서 새어 나온 기름이나 공장·폐광산에서 나온 중금속은 흙에 스며든 뒤 지하수로 번지는데, 지하수는 농업용수나 일부 지역의 식수로 쓰여 그대로 두면 결국 사람에게 돌아온다. 오염을 일으킨 자와 그 땅의 소유자에게 정화 책임을 지우는 토양환경보전법이 있어, 공장 부지를 사고팔거나 개발할 때 이 분야의 조사와 공사가 뒤따른다.","subAbout":{"토양·지하수 정화":"흙과 지하수에 이미 스며든 오염물질을 실제로 걷어내는 공사를 맡는다. 오염된 흙을 파내 씻어 내거나 열을 가해 오염물질을 떼어내고, 미생물로 분해하거나 지하수를 퍼 올려 걸러내는 등 오염물질 종류에 맞는 방법을 골라 법이 정한 기준 아래로 낮추며, 이 일을 하려면 토양정화업 등록을 해야 한다.","오염 조사·컨설팅":"정화 공사에 앞서 어디가 어떤 물질로 얼마나 오염됐는지 확인하고, 어떤 방법으로 정화할지 계획을 짜 주는 쪽이다. 땅에 구멍을 뚫어 흙과 지하수를 채취해 성분을 분석하며, 공장 부지 등을 사고팔 때 미리 오염 여부를 확인해 정화 비용을 누가 부담할지 분명히 해 두는 토양환경평가도 여기에 해당한다."}},{"id":"s06","name":"측정·분석·모니터링","subsectors":["환경 계측기 제조","위성·드론·원격 모니터링","환경 측정대행·분석","환경 IoT·센서"],"about":"공장 굴뚝에서 나오는 연기, 하천으로 흘러드는 물, 우리가 마시는 실내 공기에 오염물질이 얼마나 섞여 있는지 숫자로 재고 기록한다. 배출 기준을 지켰는지 따지거나 정화 설비를 언제 손봐야 할지 판단하려면 먼저 믿을 만한 수치가 있어야 하기 때문에, 다른 환경산업이 움직이는 출발점이 되는 영역이다. 스마트폰으로 확인하는 미세먼지 농도부터 사업장 배출량 단속 자료까지 모두 여기서 나온 측정값이다.","subAbout":{"환경 계측기 제조":"오염물질 농도를 재는 기계를 직접 설계하고 만든다. 굴뚝에 부착해 배출가스를 24시간 자동으로 재는 굴뚝 자동측정기기(TMS), 하천과 폐수의 수질을 상시 측정하는 장비, 실험실에서 쓰는 분석기 등이 여기 속한다.","위성·드론·원격 모니터링":"사람이 접근하기 어렵거나 너무 넓어서 일일이 돌아볼 수 없는 지역을 위성과 드론으로 멀리서 살핀다. 상공에서 오염물질 농도를 측정하고 배출 현장을 촬영해, 땅 위의 측정만으로는 잡아내기 어려운 오염원의 위치나 오염이 퍼져 나가는 방향을 확인하는 데 쓰인다.","환경 측정대행·분석":"사업장이 직접 하기 어려운 오염도 측정을 대신 맡아, 현장에서 시료를 채취하고 실험실에서 분석한 뒤 그 결과를 공식 기록으로 남긴다. 대기·수질·소음진동·악취·실내공기질처럼 분야별로 등록된 업체와 시험인증기관이 이 일을 하며, 그 수치가 규제를 지켰는지 판단하는 근거가 된다.","환경 IoT·센서":"작고 값싼 센서를 여러 곳에 설치하고 인터넷으로 연결해(사물인터넷, IoT) 공기질 같은 수치를 실시간으로 모아 보낸다. 큰 측정 장비를 두기 어려운 지하주차장, 학교, 가정집, 도심 골목까지 측정 지점을 촘촘하게 늘려 지금 상태가 어떤지 바로 확인할 수 있게 한다."}},{"id":"s07","name":"기후·에너지","subsectors":["에너지 IT·VPP·DR","수소·연료전지","태양광","풍력","CCUS","친환경 모빌리티·충전","ESS·배터리"],"about":"전기를 만드는 방식과 쓰는 방식을 함께 바꿔 온실가스 배출을 줄이는 산업이 모여 있다. 태양광·풍력처럼 탄소를 내지 않는 발전, 그렇게 만든 전기를 저장하고 배분하는 배터리와 소프트웨어, 이미 나온 이산화탄소를 붙잡아 처리하는 기술까지 포함한다. 지붕 위 태양광 패널, 전기차 충전기, 여름철 전력수급 대책처럼 일상에서 마주치는 것들이 대부분 여기서 나온다.","subAbout":{"에너지 IT·VPP·DR":"여기저기 흩어져 있는 태양광 설비와 배터리, 건물·공장의 전기 사용량을 소프트웨어로 묶어 하나의 발전소처럼 운영한다. 이를 가상발전소(VPP)라 하고, 전기가 모자랄 때 소비자가 사용을 줄이고 그 대가를 받는 수요반응(DR) 거래도 이 영역에서 이뤄진다.","수소·연료전지":"물이나 천연가스에서 수소를 뽑아내고, 이를 저장·운반하는 설비를 공급한다. 연료전지는 수소를 태우지 않고 산소와 반응시켜 전기를 만드는 장치로, 건물·발전소용부터 차량·선박용까지 쓰인다.","태양광":"햇빛을 전기로 바꾸는 태양광 패널과 그 원재료·부품을 만들고, 지붕이나 유휴 부지에 발전소를 지어 운영한다. 연료비가 들지 않는 대신 날씨에 따라 발전량이 달라져, 저장장치나 관리 소프트웨어와 함께 묶여 쓰이는 경우가 많다.","풍력":"바람의 힘으로 날개를 돌려 전기를 만드는 설비를 제작하고 발전단지를 개발한다. 특히 바다에 기둥을 세우는 해상풍력에서는 발전기(터빈) 외에 타워와 하부 구조물, 해상 설치 공사까지 필요해 관련 기업의 범위가 넓다.","CCUS":"공장이나 발전소에서 나오는 이산화탄소를 대기로 빠져나가기 전에 붙잡아, 땅속 깊은 곳에 가둬 두거나(저장) 화학제품·건설자재의 원료로 바꿔 쓴다(활용). 제철·시멘트처럼 생산 과정 자체에서 이산화탄소가 발생해 연료만 바꿔서는 배출을 없애기 어려운 산업에 필요한 방법이다.","친환경 모빌리티·충전":"배기가스를 내지 않는 전기차·수소차와, 그 차가 전기를 채울 수 있게 해 주는 충전기 제조 및 충전소 운영을 맡는다. 충전기 위치와 요금을 알려주는 앱, 전력 사정에 맞춰 충전 시점을 조절하는 서비스도 여기에 들어간다.","ESS·배터리":"ESS는 에너지저장장치(Energy Storage System)의 줄임말로, 전기를 배터리에 담아 뒀다가 필요할 때 꺼내 쓰게 하는 설비다. 햇빛과 바람은 원하는 시간에 맞춰 나오지 않기 때문에, 남을 때 저장하고 모자랄 때 내보내는 이 장치가 있어야 재생에너지를 안정적으로 쓸 수 있다."}},{"id":"s08","name":"탄소·ESG","subsectors":["탄소회계·관리 SaaS","배출권·탄소크레딧","ESG 평가·데이터","ESG·기후 컨설팅"],"about":"기업이 온실가스를 얼마나 내보내는지 숫자로 세고, 줄일 방법을 찾고, 그 결과를 바깥에 증명하도록 돕는 분야다. 여기서 ESG는 기업을 매출과 이익만이 아니라 환경(Environment)·사회(Social)·지배구조(Governance) 측면에서도 함께 따져 보자는 관점을 뜻한다. 설비가 아니라 데이터와 규칙을 다루기 때문에 소프트웨어와 거래 시장, 평가·자문 서비스의 모습으로 나타나며, 투자와 대출 심사, 수출품에 요구되는 탄소 정보, 대기업이 협력사에 요청하는 배출량 자료 같은 길목에 닿아 있다.","subAbout":{"탄소회계·관리 SaaS":"공장에서 태운 연료, 사업장에서 쓴 전기, 협력사가 보내온 자료처럼 여기저기 흩어진 기록을 모아 온실가스 배출량을 계산해 주는 구독형 소프트웨어(SaaS, 설치 없이 웹으로 빌려 쓰는 프로그램)를 제공한다. 어느 활동에서 배출이 얼마나 났는지 항목별로 보여 주고, 감축 목표 관리와 공시용 보고서 작성까지 이어 주는 것이 이 영역의 역할이다.","배출권·탄소크레딧":"온실가스를 줄인 몫이나 배출할 수 있는 몫을 사고파는 대상으로 바꿔 거래되게 하는 영역이다. 정부가 배출 한도를 정해 두고 남거나 모자란 양을 기업끼리 주고받는 배출권거래제와, 규제와 별개로 감축 사업의 성과를 인증받아 거래하는 자발적 탄소크레딧이 있으며, 이곳 기업들은 감축 사업 발굴과 인증 절차, 거래 플랫폼 운영을 맡는다.","ESG 평가·데이터":"기업이 환경·사회·지배구조 측면에서 어떻게 하고 있는지를 공시자료와 뉴스 등에서 모아 점수나 등급 같은 비교 가능한 형태로 정리한다. 투자기관이 어느 기업에 돈을 넣을지 판단할 때, 또 기업이 자기 위치와 부족한 항목을 확인할 때 기준 자료가 된다.","ESG·기후 컨설팅":"탄소중립 목표를 어떤 수준으로 잡을지, 무엇부터 줄일지, 새로 생긴 규제에 어떤 자료를 갖춰야 할지를 기업이나 기관을 대신해 설계해 주는 자문 서비스다. 배출 진단과 감축 계획 수립, 지속가능경영보고서 작성 지원처럼 사람이 직접 붙어 판단하고 문서로 만들어야 하는 일을 담당한다."}},{"id":"s09","name":"환경 엔지니어링·컨설팅","subsectors":["종합 환경 엔지니어링","EHS·화학물질 관리","환경영향평가","환경 인허가·컨설팅"],"about":"공장, 도로, 산업단지, 하수처리장 같은 시설을 짓고 운영할 때 환경에 어떤 영향을 줄지 미리 따져보고, 법이 요구하는 기준을 지키도록 설계하고 검토하고 자문하는 일을 한다. 오염을 직접 처리하는 설비를 만드는 쪽보다는, 어디에 무엇을 어떻게 지을지와 어떤 허가·서류가 필요한지를 정리해 주는 쪽에 가깝다. 겉으로 잘 드러나지 않지만 개발 사업이 첫 삽을 뜨기 전 단계부터 관여한다.","subAbout":{"종합 환경 엔지니어링":"상하수도, 폐기물 시설, 하천 정비 같은 환경 시설을 어떤 규모와 방식으로 지을지 도면과 계획서로 설계하고, 공사가 계획대로 진행되는지 확인하는 감리까지 맡는다. 토목·건설 설계를 함께 수행하는 회사가 많아 사업 초기 구상부터 준공까지 폭넓게 관여한다.","EHS·화학물질 관리":"EHS는 환경(Environment)·보건(Health)·안전(Safety)의 앞 글자로, 사업장에서 일하는 사람과 주변 환경이 피해를 입지 않도록 관리하는 체계를 뜻한다. 화학물질을 만들거나 수입하는 기업이 화평법(화학물질의 등록 및 평가 등에 관한 법률)에 따라 물질을 등록하고 유해성 정보를 갖추도록 돕는 일이 대표적이다.","환경영향평가":"댐, 도로, 산업단지처럼 규모가 큰 개발 사업을 시작하기 전에 대기·수질·소음·생태계가 어떻게 달라질지 조사하고 예측해 보고서로 정리한다. 피해를 줄일 방법까지 함께 제시해, 사업을 그대로 진행할지 계획을 고칠지 판단하는 근거가 된다.","환경 인허가·컨설팅":"공장이 오염물질을 배출하려면 정부의 허가를 받아야 하는데, 그 신청 서류를 준비하고 시설이 기준에 맞는지 점검해 주는 일을 한다. 대기·수질 등을 따로 받던 허가를 사업장 단위로 묶은 통합환경허가처럼 절차가 복잡해지면서, 기업이 외부 전문가에게 맡기는 경우가 많다."}},{"id":"s10","name":"생태·해양·기타","subsectors":["해양환경","생태 복원·조사","환경 서비스·교육","소음·진동"],"about":"바다와 갯벌, 하천과 숲처럼 사람이 만들지 않은 자연 그 자체를 조사하고, 망가진 곳을 되살리는 일을 한다. 오염물질을 배출구에서 붙잡는 다른 분야와 달리 자연 공간 전체의 상태를 살피며, 여기에 소음·진동처럼 생활환경을 해치는 문제와 환경 측정·교육 서비스가 함께 묶인다. 바다에 기름이 유출됐을 때의 수습, 도로 공사로 깎여나간 산비탈의 복원, 공사장 소음 민원 대책이 모두 이 분야가 맡는 일이다.","subAbout":{"해양환경":"바다에 흘러든 기름이 퍼지지 않게 막고 걷어내는 방제, 해양쓰레기 수거, 바닷물 수질과 해저 지형·생물의 조사를 맡는다. 항만 공사나 해상풍력 발전처럼 바다에서 벌어지는 사업은 주변 바다에 미칠 영향을 미리 따져야 하는데, 그 판단의 근거가 되는 자료를 만드는 것도 이곳의 일이다.","생태 복원·조사":"어떤 동식물이 어디에 얼마나 사는지 현장을 돌며 확인하는 자연환경조사를 하고, 그 결과를 바탕으로 도로·택지 공사나 하천 정비로 훼손된 땅에 흙과 식생을 되돌려 생물이 다시 살 수 있게 만든다. 습지를 새로 조성하거나 도로에 가로막힌 야생동물의 이동 통로를 잇는 일도 여기에 들어간다.","환경 서비스·교육":"기업이나 지자체를 대신해 대기·수질·악취의 오염도를 재주는 측정대행, 그리고 학교와 시민을 상대로 한 환경교육 교재·프로그램처럼 설비가 아니라 사람의 손과 지식으로 제공되는 일이 묶인다. 배출 기준을 지키고 있는지 확인해줄 사람과, 왜 지켜야 하는지 알려줄 사람이 따로 필요하기 때문이다.","소음·진동":"공장 기계, 공사장 장비, 도로·철도에서 나오는 소리와 떨림을 측정하고 방음벽·방진 장치로 줄이는 일을 한다. 소음과 진동은 법으로 허용 기준이 정해져 있어 이를 넘으면 작업 시간을 조정하거나 방음·방진 시설을 설치해야 하는데, 그 대책을 설계하고 시공하는 곳들이다."}},{"id":"s11","name":"공공·연구","subsectors":["연구기관","공공기관","협회·단체"],"about":"환경 문제를 기업의 사업이 아니라 나라 차원의 과제로 맡아 처리하는 조직들이다. 물·공기·폐기물을 어디까지 허용할지 기준을 연구해 정하고, 그 기준이 현장에서 지켜지도록 관리하며, 아직 돈이 되지 않아 기업이 뛰어들기 어려운 기술에 미리 연구비를 댄다. 수돗물 수질 기준이나 미세먼지 예보처럼 생활에서 마주치는 숫자, 그리고 환경 기업들이 따라야 할 규제와 인증이 대부분 여기서 나온다.","subAbout":{"연구기관":"오염물질이 사람과 생태계에 어떤 영향을 주는지, 그리고 이를 어떻게 측정하고 처리해야 하는지를 실험과 현장 조사로 확인하는 곳이다. 여기서 나온 데이터가 대기·수질 기준 같은 규제의 근거가 되기 때문에, 규제가 만들어지기 전 단계를 담당한다.","공공기관":"환경부·해양수산부 같은 정부 부처가 정한 정책을 현장에서 실제로 집행하는 조직이다. 국립공원을 관리하고, 바다에 기름이 유출되면 이를 수습하고, 환경기술 개발에 연구비를 지원하는 등 정부가 직접 다 하기 어려운 실무를 나눠 맡는다.","협회·단체":"같은 분야의 기업이나 전문가가 회원으로 모여 만든 민간 조직이다. 흩어져 있는 업계의 의견을 모아 정부에 제도 개선을 건의하고, 회원사에 기술 정보와 교육, 해외 진출 기회를 연결해 주는 창구 역할을 한다."}},{"id":"s12","name":"대기업 환경·ESG 조직","subsectors":["화학·정유·소재","전자·반도체","유통·소비재·식음료","자동차·모빌리티","건설·부동산","금융·보험","철강·중공업·조선","통신·IT·플랫폼"],"about":"환경 전문 기업이 아니라, 여러 산업의 대기업이 회사 안에 두고 운영하는 환경·ESG 담당 조직을 모은 분야다. ESG는 환경(Environment)·사회(Social)·지배구조(Governance, 회사를 어떻게 운영하고 감독하는지)의 앞글자를 딴 말로, 이들 조직은 공장과 사업장에서 나오는 온실가스·폐수·폐기물을 관리하고 감축 목표를 세운 뒤 그 결과를 지속가능경영보고서로 공개한다. 환경 기술과 서비스를 실제로 사들이고 발주하는 쪽이어서, 환경산업의 수요가 어디에서 생기는지 보여주는 자리이기도 하다.","subAbout":{"화학·정유·소재":"석유·화학 공장과 배터리 소재 공장은 만드는 과정에서 에너지를 많이 쓰고 온실가스와 화학물질이 함께 나오기 때문에, 이 분야 환경 조직은 공정에서 발생하는 배출을 줄이는 일을 맡는다. 공장 전기를 재생에너지로 바꾸고, 폐플라스틱을 다시 원료로 되돌리거나 배출된 이산화탄소를 붙잡아 활용하는 기술(CCUS)을 사업으로 키우는 일도 이곳에서 추진한다.","전자·반도체":"반도체와 디스플레이를 만들려면 많은 전기와 아주 깨끗한 물이 필요하고 공정에 쓰는 가스도 온실효과가 크기 때문에, 이 분야 환경 조직은 쓴 물을 다시 쓰는 재이용, 공정 가스 감축, 재생에너지 전환을 관리한다. 소재·부품·장비를 만드는 계열사와 협력사까지 같은 기준으로 묶어 사업장의 환경·안전을 함께 점검한다.","유통·소비재·식음료":"마트·편의점·식품·화장품처럼 소비자가 매일 만나는 제품과 매장을 운영하는 곳이라, 포장재를 줄이고 재활용 소재로 바꾸는 일과 점포·물류센터의 전기 사용을 줄이는 일이 주된 과제다. 일회용컵 대신 다회용기를 쓰게 하는 것처럼 소비 습관과 바로 맞닿은 활동도 이 조직이 기획하고 운영한다.","자동차·모빌리티":"완성차와 부품·타이어 회사의 환경 조직으로, 차를 만드는 공장의 온실가스뿐 아니라 차가 굴러다니고 폐차되기까지 생기는 환경 영향을 함께 관리한다. 수출 비중이 큰 산업이어서 해외의 환경 규제에 맞춰 부품과 소재를 미리 바꾸는 일도 이곳에서 챙긴다.","건설·부동산":"건설사의 환경 조직은 공사 현장에서 나오는 건설폐기물과 먼지·소음을 관리하고, 다 지은 뒤 건물이 쓰게 될 에너지를 줄이는 설계를 챙긴다. 하수처리 시설이나 풍력 발전소처럼 환경 관련 시설을 직접 짓는 일을 새로운 사업 영역으로 키우는 경우도 많다.","금융·보험":"은행·증권·보험은 공장이 없어 스스로 내뿜는 배출은 적지만, 어디에 돈을 빌려주고 투자하느냐에 따라 다른 산업의 배출에 영향을 준다. 그래서 이 분야 조직은 친환경 사업에 자금을 대는 녹색금융을 늘리고, 기후변화가 대출·투자 자산에 손실을 줄 가능성을 미리 따져보는 일을 한다.","철강·중공업·조선":"쇳물을 만들고 거대한 설비를 다루려면 높은 열과 많은 연료가 필요해, 이 분야 환경 조직은 제철·제강 공정 자체를 배출이 적은 방식으로 바꾸는 과제를 맡는다. 조선사에서는 기름 대신 다른 연료를 쓰는 선박과 엔진을 개발하는 일이 환경 과제와 그대로 이어진다.","통신·IT·플랫폼":"통신망과 데이터센터는 24시간 켜져 있어 전기를 많이 쓰고 서버에서 나오는 열을 식히는 데도 전력이 들기 때문에, 이 분야 환경 조직은 냉방 방식 개선과 전력 효율화를 핵심 과제로 삼는다. 쓰는 전기를 재생에너지로 바꾸고 그 실적을 수치로 공개하는 일도 함께 맡는다."}},{"id":"s13","name":"ESG 공시·검증·자문","subsectors":["인증·검증기관","법무법인 환경·ESG","신용평가·ESG평가","회계법인","공시·데이터 인프라"],"about":"기업이 발표하는 온실가스 배출량이나 환경·사회 활동 성과는 결국 그 회사가 스스로 집계한 숫자여서, 바깥에서 따로 확인해 주지 않으면 투자자와 거래처가 그대로 믿기 어렵다. 이 분야는 그 숫자를 제3자가 확인하고(검증), 정해진 형식에 맞춰 공개하도록 돕고(공시), 등급을 매기거나 법률·회계 관점에서 조언하는 일을 맡는다. 국내에서도 지속가능성 공시 기준이 만들어지고 적용 대상이 단계적으로 넓어지면서, 상장사와 그 협력업체가 실제로 거쳐야 하는 관문이 되고 있다.","subAbout":{"인증·검증기관":"기업이 계산한 온실가스 배출량과 지속가능경영보고서 내용을 제3자 입장에서 다시 따져, 근거 자료와 계산 방식이 기준에 맞는지 확인하고 검증 의견을 붙인다. 환경경영 체계를 제대로 갖췄는지 현장 심사로 확인해 인증서를 내주는 일도 함께 맡는다.","법무법인 환경·ESG":"대기·수질·폐기물, 화학물질, 배출권처럼 기업이 지켜야 할 환경 법령을 어디까지 어떻게 적용해야 하는지 해석해 주고, 오염 사고나 행정처분·소송이 생기면 대응을 맡는다. 공시 내용을 잘못 적었을 때 따라오는 책임까지 포함해, ESG 요구가 법적 의무로 바뀌는 지점을 짚어 준다.","신용평가·ESG평가":"기업의 환경·사회·지배구조 활동을 정해진 방법론으로 점수화해 등급을 매기고, 투자자가 여러 회사를 같은 잣대로 비교할 수 있게 만든다. 환경 목적을 내걸고 발행하는 채권이 실제로 그 용도에 쓰이는지 인증하고 나중에 다시 확인해, 말만 친환경인 경우를 걸러내는 역할도 한다.","회계법인":"재무제표를 감사하던 절차와 방식을 온실가스·ESG 정보에 적용해, 어떤 자료를 어떻게 모아 공시해야 하는지와 그에 필요한 내부 관리 체계를 자문한다. 이렇게 작성된 지속가능경영보고서에 인증·검증 의견을 내는 일도 함께 수행한다.","공시·데이터 인프라":"기업들이 낸 ESG 정보를 한곳에 모아 공개하는 포털을 운영하거나, 무엇을 어떤 형식으로 공시해야 하는지 기준 자체를 정한다. 회사마다 제각각인 자료를 비교할 수 있는 형태로 정리해, 평가기관과 투자자, 대응 여력이 부족한 중소기업이 같은 자료를 놓고 볼 수 있게 하는 바탕이 된다."}}],"companies":[{"id":"c001","name":"뉴보텍","sector":"물·수자원","subsector":"관로·기자재","type":"중소기업","scale":2,"founded":null,"hq":"강원","listed":"코스닥","desc":"플라스틱 상하수도 배관자재를 만드는 강원 원주 소재 코스닥 상장사다. 고강성 PVC 이중벽 하수관이 대표 제품으로 도심 배수시설과 택지개발 지역의 배수망 구축에 쓰인다. 빗물을 모아두는 저류시설과, 땅을 파지 않고 기존 관 안쪽을 보강해 되살리는 비굴착 갱생공법(NPR)도 함께 다루며 제설제와 재활용 사업을 병행한다.","tags":["상하수도관","PVC","관로"],"conf":"확인","global":false,"url":"https://www.nuvotec.co.kr","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2020112661811","https://www.widedaily.com/news/articleView.html?idxno=272768","http://comp.wisereport.co.kr/company/c1010001.aspx?cmp_cd=060260"]},{"id":"c002","name":"스톰테크","sector":"물·수자원","subsector":"관로·기자재","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"코스닥","desc":"정수기 등 물을 다루는 가전에 들어가는 피팅·밸브·파우셋을 개발하고 생산하는 코스닥 상장사다. 피팅은 관과 관을 잇는 연결 부품이고 파우셋은 물이 나오는 꼭지를 말한다. 1999년 설립돼 정수기 부품 제조를 기반으로 성장했고 2023년 코스닥 시장에 상장했다.","tags":["피팅","밸브","부품"],"conf":"확인","global":false,"url":"https://www.stormtec.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%EC%8A%A4%ED%86%B0%ED%85%8C%ED%81%AC","https://www.asiae.co.kr/article/2023093012072016044","https://ceoscoredaily.com/page/view/2023102615010348381","https://dealsite.co.kr/articles/112681"]},{"id":"c003","name":"자일럼","sector":"물·수자원","subsector":"관로·기자재","type":"해외 대표","scale":4,"founded":null,"hq":"미국","listed":null,"desc":"2011년 미국 ITT에서 분사해 독립한 물 전문 기업으로 본사는 워싱턴 D.C.에 있다. 상하수도용 펌프와 처리 설비, 수질 분석 장비, 물 사용량을 원격으로 읽는 스마트미터까지 물을 옮기고 처리하고 계측하는 전 과정의 제품을 공급한다. 2023년에는 수처리 기업 에보쿠아(Evoqua)를 인수해 사업 범위를 넓혔다.","tags":["글로벌","펌프","계측","스마트워터"],"conf":"확인","global":true,"url":"https://www.xylem.com","ext":[],"grounded":true,"src":["https://www.wwdmag.com/home/news/10920356/itt-corp-spinoff-xylem-launches-as-global-water-technology-company","https://www.businesswire.com/news/home/20230524005445/en/Xylem-Completes-Acquisition-of-Evoqua","https://www.sec.gov/Archives/edgar/data/1524472/000152447224000006/xyl-20231231.htm","https://www.xylem.com/en-us/about-xylem/newsroom/press-releases/xylem-announces-reportable-segment-change-to-scale-global-services-offering/"]},{"id":"c004","name":"프럼파스트","sector":"물·수자원","subsector":"관로·기자재","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"코스닥","desc":"건물 안에 들어가는 플라스틱 배관재를 만드는 코스닥 상장사다. 폴리부틸렌(PB) 파이프를 비롯해 이음관, 분배기, 이중관 부속 등을 생산하며 아파트와 주택의 수도·온수 배관과 바닥난방 배관에 쓰인다. 1992년 동양프라스틱이라는 이름으로 출발해 2001년 지금의 상호로 바꿨고 2002년 코스닥에 상장했다.","tags":["배관재","플라스틱관"],"conf":"확인","global":false,"url":"https://www.plumbfast.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%ED%94%84%EB%9F%BC%ED%8C%8C%EC%8A%A4%ED%8A%B8","https://www.hankyung.com/article/2021031137971","http://www.plumbfast.co.kr/html/sub1_1.html"]},{"id":"c005","name":"한국주철관","sector":"물·수자원","subsector":"관로·기자재","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"코스피","desc":"1953년 설립돼 상하수도용 덕타일 주철관을 만드는 코스피 상장사다. 덕타일 주철관은 잘 깨지지 않도록 성질을 개량한 주철 수도관으로 도시의 상수도·하수도 간선에 주로 쓰인다. 부산 공장에서 주철관 직관과 이형관을, 포항 공장에서 수도용 도복장강관과 말뚝강관을 생산하며 1969년 증권거래소에 주식을 상장했다.","tags":["수도관","주철관","관로"],"conf":"확인","global":false,"url":"https://www.kcip.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%ED%95%9C%EA%B5%AD%EC%A3%BC%EC%B2%A0%EA%B4%80%EA%B3%B5%EC%97%85","https://www.kcip.co.kr/","https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno=20250814002100"]},{"id":"c006","name":"마이크로필터","sector":"물·수자원","subsector":"막·필터 소재","type":"중소기업","scale":2,"founded":null,"hq":"충북","listed":"비상장","desc":"정수기와 생활가전에 들어가는 물 필터를 만드는 충북 진천 소재 제조기업이다. 정수기·공기청정기 브랜드로 알려진 청호나이스의 계열사로, 물속 이물질과 냄새·유해물질을 걸러내는 수처리용 필터를 생산해 공급한다. 중국에도 현지 필터 제조법인을 두고 있다.","tags":["정수기필터","필터제조"],"conf":"확인","global":false,"url":"https://www.filtercompany.co.kr","ext":[],"grounded":true,"src":["https://www.chungho.co.kr/company/subsidiary_microfilter","https://v.daum.net/v/ZVZ9GMcpRs","https://www.saramin.co.kr/zf_user/company-info/view/csn/ZEs4eU1hTmNld2hqL3MwaXhNV3VnQT09"]},{"id":"c007","name":"시노펙스","sector":"물·수자원","subsector":"막·필터 소재","type":"중견기업","scale":3,"founded":null,"hq":"경기","listed":"코스닥","desc":"물속 미세 오염물질을 걸러내는 멤브레인(분리막) 필터와 전자기기용 연성회로기판(FPCB)을 함께 생산하는 경기 소재 코스닥 상장사다. PVDF 등 다양한 막 소재를 다뤄 정수장과 하폐수 재이용, 해수담수화는 물론 반도체 공정용 초순수까지 필터를 공급한다. 혈액투석기 등 의료기기로도 응용을 넓히고 있으며, 2026년 자회사 시노펙스멤브레인을 흡수합병해 소재·부품 사업을 본사로 통합했다.","tags":["멤브레인","필터","해수담수화","소부장"],"conf":"확인","global":false,"url":"https://www.synopex.com","ext":[],"grounded":true,"src":["https://www.mt.co.kr/stock/2026/04/23/2026042318252439707","https://www.mt.co.kr/stock/2025/04/18/2025041807539671808","https://www.synopex.com/main/index.php","https://comp.wisereport.co.kr/company/c1010001.aspx?cmp_cd=025320"]},{"id":"c008","name":"에코니티","sector":"물·수자원","subsector":"막·필터 소재","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"1998년 설립돼 수처리용 중공사막을 직접 만드는 분리막 전문기업이다. 중공사막은 가운데가 빈 국수 가닥 모양의 막으로, 물을 통과시키면서 오염물질을 걸러낸다. 미생물 처리와 막 여과를 결합한 하수처리 방식인 MBR이 주력이며 막 공급에 그치지 않고 시공과 유지관리까지 맡는다. 말레이시아 쿠알라룸푸르의 하수처리장 사업에 분리막을 납품하는 등 해외 시장에도 진출했다.","tags":["중공사막","분리막","MBR"],"conf":"확인","global":false,"url":"https://www.econity.com","ext":[],"grounded":true,"src":["https://www.waterjournal.co.kr/news/articleView.html?idxno=32778","http://www.ikld.kr/news/articleView.html?idxno=205052","https://www.gwisc.or.kr/?bid=100&idx=171&menucode=40200&mode=view&tmenu=information&type=2","http://www.ehnews.net/news/articleView.html?idxno=13928"]},{"id":"c009","name":"엔바이오니아","sector":"물·수자원","subsector":"막·필터 소재","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"코스닥","desc":"습식(wet-laid) 부직포 제조공정을 기반으로 고기능 복합소재를 만드는 코스닥 상장사다. 주력은 정수기용 양전하 필터 소재로, 물속에서 음전하를 띠는 바이러스·박테리아·중금속 등을 전기적으로 끌어당겨 걸러내며 직수형 정수기에 쓰인다. 최근에는 전기차·ESS 배터리의 열 확산을 막는 세라믹페이퍼와 메타아라미드페이퍼 등으로 소재 사업을 넓히고 있다.","tags":["필터소재","복합소재","정수"],"conf":"확인","global":false,"url":"https://www.envioneer.com","ext":[],"grounded":true,"src":["https://kind.krx.co.kr/external/2025/03/20/000847/20250320003742/11011.htm","https://www.asiae.co.kr/article/2019100814505381090","http://www.hanbando.biz/news/articleView.html?idxno=9639","https://www.bloter.net/news/articleView.html?idxno=627846"]},{"id":"c010","name":"코레드","sector":"물·수자원","subsector":"막·필터 소재","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"물속 오염물질을 걸러내는 분리막(멤브레인)을 직접 만드는 수처리 소재 기업이다. 가는 실 모양의 중공사막과 판 모양의 평막, 관 모양의 정밀여과막을 함께 생산하며, 산·알칼리에 잘 견디는 PVDF 소재를 열유도 상분리(TIPS) 공정으로 가공해 내구성을 높였다. 이 분리막을 활용해 하·폐수 고도처리와 재이용, 순수·초순수 제조 설비 등의 엔지니어링 사업도 함께 수행한다.","tags":["중공사막","멤브레인","분리막"],"conf":"추정","global":false,"url":"https://www.ekored.com","ext":[],"grounded":true,"src":["http://www.ekored.com/product/product-2/","http://www.ekored.com/product2.php","https://www.hankyung.com/article/2004062468641","https://www.etnews.com/20160202000234"]},{"id":"c011","name":"퓨어엔비텍","sector":"물·수자원","subsector":"막·필터 소재","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"하수와 폐수를 처리하는 데 쓰이는 분리막(멤브레인)을 만드는 경기도 소재 기업이다. 가는 실 모양의 중공사막과 판 모양의 평막을 함께 생산하고, 이를 미생물 처리조와 결합해 오염물질을 분해·여과하는 MBR(분리막 생물반응조) 방식의 하·폐수 처리 시스템을 공급한다. 에너지 사용을 줄인 분리막 모듈을 자체 개발해 건설사의 하수처리 공법에 적용된 이력이 있다.","tags":["분리막","MBR","수처리시스템"],"conf":"확인","global":false,"url":"https://www.pure-envitech.co.kr","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2008072129711","http://www.pure-envitech.co.kr/","https://www.gwisc.or.kr/?idx=53&menucode=30200&mode=view&tmenu=wdbinfo","https://app.rndcircle.io/company/86b37588-5ed8-573d-a651-e0e2107586e4"]},{"id":"c012","name":"피코그램","sector":"물·수자원","subsector":"막·필터 소재","type":"중소기업","scale":2,"founded":2001,"hq":null,"listed":"코스닥","desc":"정수기 필터와 필터 소재를 개발·제조하는 코스닥 상장사로 인천 부평에 본사를 두고 있다. 손쉽게 갈아 끼우는 원터치 체결 방식 필터와 활성탄을 굳혀 만든 카본블록 등 정수 소재를 직접 생산해, 소재부터 완제품까지 이어지는 구조를 갖췄다. 2016년 선보인 자체 직수형 정수기 브랜드 '퓨리얼'을 운영하며 2021년 11월 코스닥에 상장했다.","tags":["정수기필터","퓨리얼","소재"],"conf":"확인","global":false,"url":"https://www.picogram.co.kr","ext":[],"grounded":true,"src":["https://kind.krx.co.kr/external/2022/03/23/000004/20220323000045/11011.htm","https://www.the-stock.kr/news/articleView.html?idxno=15020","http://www.newsway.co.kr/news/view?ud=2021101911424435283","https://ko.wikipedia.org/wiki/피코그램"]},{"id":"c013","name":"더웨이브톡","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"스타트업","scale":1,"founded":2016,"hq":"대전","listed":"비상장","desc":"레이저를 쏘아 물속에서 흩어지는 빛의 변화를 이미지센서로 읽어내 탁도와 세균 오염도를 측정하는 수질 센서를 개발한 대전 기반 스타트업이다. 휴대용 수질측정기, 정수기에 넣는 초소형 내장 센서, 수도계량기와 결합해 수돗물 상태를 실시간으로 감시하는 센서 등으로 제품군을 넓혔다. 2016년 설립됐으며 SK로부터 전략투자를 유치했다.","tags":["수질센서","IoT","스타트업투자"],"conf":"확인","global":false,"url":"https://www.thewavetalk.com","ext":[],"grounded":true,"src":["https://platum.kr/archives/162039","https://www.venturesquare.net/828118","https://m.ekn.kr/view.php?key=20240530001302532","https://www.itbiznews.com/news/articleView.html?idxno=35932"]},{"id":"c014","name":"리뉴어스","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"전국 지자체와 산업단지의 하수·폐수 처리시설을 위탁받아 운영·관리하는 환경기초시설 운영 기업이다. 공공 폐수처리시설 운영 대행에서 출발해 폐수 재이용, 하수처리시설 개량·고도화로 사업을 넓혔고, 수처리와 함께 소각·매립 등 폐기물 처리 사업도 수행한다. 2020년 SK에코플랜트에 인수됐으며 2024년 옛 사명인 환경시설관리(EMC)에서 리뉴어스로 이름을 바꿨다.","tags":["하수처리운영","O&M","EMC","수처리","수처리O&M","산업폐수"],"conf":"확인","global":false,"url":"https://www.renewus.co.kr","ext":[],"grounded":true,"src":["https://news.skecoplant.com/sk-ecoplant/15949/","http://www.energydaily.co.kr/news/articleView.html?idxno=145239","https://m.sedaily.com/article/13883729","https://www.renewus.co.kr/index.do"]},{"id":"c015","name":"수자원기술","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"광역상수도와 댐 등 물 관련 시설을 점검·정비하고 유지보수하는 기업이다. 수돗물이 안정적으로 공급되도록 취수장·정수장·관로 같은 설비의 상태를 진단하고 고치는 일이 주력이며, 노후 상수도관 교체와 관로 이설 등 상수도 분야 전문 시공 사업도 함께 수행한다.","tags":["시설진단","유지관리","상수도"],"conf":"확인","global":false,"url":"https://www.wareco.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/수자원기술","https://wareco.co.kr/건설사업/","https://namu.wiki/w/케이워터기술"]},{"id":"c016","name":"에코비트워터","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"하수·폐수 처리시설 등 환경기초시설을 지자체와 산업단지로부터 위탁받아 운영·관리하는 수처리 기업이다. 운영 대행뿐 아니라 처리시설을 직접 짓고 일정 기간 운영을 맡는 민간투자사업, 설계·시공(EPC)까지 함께 수행한다. 옛 TSK워터로 2018년 물적분할을 거쳐 설립됐으며, 종합 환경기업 에코비트의 수처리 부문을 담당한다.","tags":["하수처리운영","O&M","민간위탁"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["http://www.ecorbit.com/kr/business/sewage-wastewater-treatment","http://www.ecorbit.com/kr/about/history","http://www.ecorbit.com/kr/about/subsidiary","https://www.thebell.co.kr/free/content/ArticleView.asp?key=202507210014159030105428"]},{"id":"c017","name":"위플랫","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"스타트업","scale":1,"founded":null,"hq":null,"listed":"비상장","desc":"AI와 사물인터넷 센서로 상수도 배관의 누수 지점을 찾아내는 대전 소재 물관리 스타트업이다. 주력 제품인 지능형 누수관리 시스템 'NELOW'는 관로에 붙인 센서가 모은 누수음·수압·유량 데이터를 AI가 분석해 누수 의심 구간을 지도 위에 표시해 준다. 한국수자원공사와 전국 지자체 수도사업소 등 공공 수도사업자를 주 고객으로 하며, 해외 수도기관과도 협력하고 있다.","tags":["누수탐지","AI","스마트물관리"],"conf":"확인","global":false,"url":"https://www.wiplat.com","ext":[],"grounded":true,"src":["https://www.venturesquare.net/819029","https://www.nextunicorn.kr/company/f28147f4c499e109","https://www.nextround.kr/startup/detail/2151","https://plus.hankyung.com/apps/newsinside.view?aid=202501022903d"]},{"id":"c018","name":"케이워터기술","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"공공·연구","scale":3,"founded":null,"hq":"대전","listed":null,"desc":"한국수자원공사가 전액 출자한 자회사로, 광역상수도와 다목적댐·수력발전 설비의 점검·정비와 유지보수를 맡는다. 정수장과 관로의 상태점검, 경상·계획정비, 기술진단 등 시설이 제 성능을 내도록 관리하는 업무가 중심이다. 과거 민간에 넘어갔던 점검정비 업무를 다시 공공이 수행하기 위해 2021년 설립돼 2022년 10월부터 사업을 시작했다.","tags":["시설운영","유지관리","K-water계열"],"conf":"확인","global":false,"url":"https://www.k-watertech.co.kr","ext":[],"grounded":true,"src":["https://k-watertech.co.kr/sub/sub01_04.php","https://namu.wiki/w/%EC%BC%80%EC%9D%B4%EC%9B%8C%ED%84%B0%EA%B8%B0%EC%88%A0","https://www.jobplanet.co.kr/companies/399143/landing/%EC%BC%80%EC%9D%B4%EC%9B%8C%ED%84%B0%EA%B8%B0%EC%88%A0","http://www.envtimes.co.kr/news/articleView.html?idxno=19141"]},{"id":"c019","name":"하이엔텍","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"지자체가 맡긴 공공하수처리시설을 위탁받아 운영·관리(O&M)하는 환경 엔지니어링 회사로, 시설 운영과 시운전은 물론 상하수도·산업폐수 처리설비의 설계·시공까지 수행해 왔다. 1999년 설립 이후 금호환경기술과 대우엔텍을 거쳐 2011년 LG전자가 인수하면서 하이엔텍이 됐고, 2019년 테크로스에 매각된 뒤 사명이 테크로스환경서비스로 바뀌었다.","tags":["수처리운영","O&M"],"conf":"추정","global":false,"url":"https://www.techcross-es.com","ext":[],"grounded":true,"src":["https://www.waterjournal.co.kr/news/articleView.html?idxno=20164","https://www.hankyung.com/article/2019072348641","https://www.sportsseoul.com/news/read/826126","https://ko.wikipedia.org/wiki/%ED%85%8C%ED%81%AC%EB%A1%9C%EC%8A%A4%ED%99%98%EA%B2%BD%EC%84%9C%EB%B9%84%EC%8A%A4"]},{"id":"c020","name":"한국수자원공사","sector":"물·수자원","subsector":"상하수도 운영·관리","type":"공공·연구","scale":3,"founded":1967,"hq":"대전","listed":null,"desc":"1967년 한국수자원개발공사로 출범한 물 전문 공기업(K-water)으로, 다목적댐과 광역상수도를 지어 운영하며 전국에 생활용수·공업용수를 공급한다. 댐 운영과 홍수 관리, 수질 개선, 수력발전까지 물 순환 전반을 관장한다. 반도체 공정에 쓰이는 초고순도 물 '초순수'의 국산화 실증사업을 이끌고, 물산업 스타트업을 발굴·육성하는 협력 프로그램도 운영한다.","tags":["K-water","광역상수도","댐","물산업육성"],"conf":"확인","global":false,"url":"https://www.kwater.or.kr","ext":[],"grounded":true,"src":["https://www.kwater.or.kr/water/sub01/sub02/purpPage.do?s_mid=237","https://www.kwater.or.kr/water/sub01/sub03/founPage.do?s_mid=1992","https://www.fnnews.com/news/202401161258405420","https://www.newspim.com/news/view/20250204000931"]},{"id":"c021","name":"LG전자","sector":"물·수자원","subsector":"생활 물케어","type":"대기업","scale":4,"founded":1958,"hq":"서울","listed":"코스피","desc":"코스피 상장 전자 대기업으로, 정수기·공기청정기 등 물·공기 관련 가전을 매달 요금을 내고 쓰는 구독(렌털) 방식으로 공급하는 사업을 운영한다. 대표 제품인 퓨리케어 정수기는 물을 미리 받아두는 저수조 없이 바로 걸러 내보내는 직수 방식과, 물이 나오는 코크를 자동으로 UV-LED 살균하는 기능을 적용했다. 케어 매니저가 정기적으로 방문해 필터와 직수관을 교체하고 내부를 살균하는 관리 서비스도 함께 제공한다.","tags":["정수기","퓨리케어","구독가전"],"conf":"확인","global":false,"url":"https://www.lge.co.kr","ext":[],"grounded":true,"src":["https://www.lge.co.kr/category/care-solutions/water-purifiers","https://www.lge.co.kr/care-solutions/rentalService-aboutcare","https://lg.co.kr/media/release/7009","https://www.lg.co.kr/media/release/21017"]},{"id":"c022","name":"SK매직","sector":"물·수자원","subsector":"생활 물케어","type":"중견기업","scale":3,"founded":1985,"hq":"서울","listed":"비상장","desc":"정수기·공기청정기·비데·매트리스 등 환경가전을 매달 요금을 받고 빌려주고 관리해 주는 렌털 사업을 하는 SK네트웍스 자회사다. 1985년 동양매직으로 출발했고, 2016년 SK네트웍스가 인수하면서 지금의 이름이 됐다. 2024년에는 가스레인지·전기레인지 등 주방가전 영업권을 경동나비엔에 넘기고 정수기를 비롯한 렌털 사업에 집중하는 쪽으로 사업을 재편했다.","tags":["정수기","렌털","SK네트웍스"],"conf":"확인","global":false,"url":"https://www.skmagic.com","ext":[],"grounded":true,"src":["https://namu.wiki/w/SK%EB%A7%A4%EC%A7%81","https://www.asiae.co.kr/article/2024010317182228470","https://news.mt.co.kr/mtview.php?no=2024050818212822879","https://www.asiatoday.co.kr/kn/view.php?key=20260701010000276"]},{"id":"c023","name":"교원웰스","sector":"물·수자원","subsector":"생활 물케어","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"학습지 사업으로 출발한 교원그룹의 환경가전 렌털 계열사로, 2002년 교원L&C라는 이름으로 설립돼 정수기 렌털 사업을 시작했다. '웰스(Wells)' 브랜드로 정수기와 공기청정기, 비데, 가정에서 채소를 길러 먹는 식물재배기 등을 매달 요금을 받고 빌려주며 방문 관리 서비스를 함께 제공한다. 저수조 없이 바로 걸러 쓰는 직수형 정수기가 주력 제품군이다.","tags":["정수기","렌털","웰스"],"conf":"확인","global":false,"url":"https://www.kyowonwells.com","ext":[],"grounded":true,"src":["http://www.kyowon.co.kr/brand/wells","https://weekly.hankooki.com/news/articleView.html?idxno=7133360","https://www.kyowonwells.com/","https://m.thebell.co.kr/m/newsview.asp?svccode=&newskey=202511191528187280105818"]},{"id":"c024","name":"알트웰텍","sector":"물·수자원","subsector":"생활 물케어","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"자체 브랜드 대신 다른 업체의 주문을 받아 정수기를 설계·생산해 주는 OEM·ODM 전문 제조기업이다. 정수기 완제품과 함께 물을 걸러 내는 핵심 부품인 필터를 만들며, 활성탄을 눌러 굳힌 카본블록 필터를 자체 기술로 개발해 양산하고 있다. 일부 카본블록 제품은 미국 위생안전 인증기관 NSF의 정수 성능 기준 인증을 받았고, 국내외 정수기·가전 업체에 필터를 공급한다.","tags":["정수기","OEM","ODM"],"conf":"추정","global":false,"url":"https://www.altwelltech.com","ext":[],"grounded":true,"src":["http://www.altwelltech.com/ko/","https://www.mknews.kr/view?no=2037","https://www.sisamagazine.co.kr/news/articleView.html?idxno=432702","https://www.jobkorea.co.kr/recruit/co_read/c/altwell09"]},{"id":"c025","name":"청호나이스","sector":"물·수자원","subsector":"생활 물케어","type":"중견기업","scale":3,"founded":1993,"hq":"서울","listed":"비상장","desc":"1993년 설립돼 역삼투압 멤브레인 방식 정수기를 국내에 보급한 생활환경 가전 렌털 기업이다. 2004년 얼음정수기 '아이스콤보'를 출시했고, 증발기 하나로 얼음과 냉수를 함께 만드는 특허 기술을 갖고 있다. 정수기·얼음정수기 외에 공기청정기, 비데, 연수기를 렌털로 공급하며 필터를 정수 반대 방향으로 씻어내는 역세척 살균 등 위생 기술을 적용한다.","tags":["정수기","렌털","얼음정수기"],"conf":"확인","global":false,"url":"https://www.chungho.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%EC%B2%AD%ED%98%B8%EB%82%98%EC%9D%B4%EC%8A%A4","https://www.chungho.co.kr/brandstory/why_chungho","https://m.sedaily.com/amparticle/13469978","https://namu.wiki/w/%EC%B2%AD%ED%98%B8%EB%82%98%EC%9D%B4%EC%8A%A4"]},{"id":"c026","name":"코웨이","sector":"물·수자원","subsector":"생활 물케어","type":"대기업","scale":4,"founded":1989,"hq":"서울","listed":"코스피","desc":"1989년 설립된 환경가전 기업으로, 1998년 렌털 방식을 도입한 뒤 정수기·공기청정기·비데·연수기에 이어 매트리스와 안마의자까지 제품군을 넓혔다. 기기를 빌려주고 필터 교체 등 정기 관리를 함께 제공하는 방식이 사업의 축이며 말레이시아·미국 등에 해외 법인을 두고 있다. 2019년 말 넷마블이 최대주주가 됐고, 산업 플랜트 수처리와 하수 재이용을 맡는 자회사 코웨이엔텍이 있다.","tags":["정수기","렌털","환경가전","공기청정기"],"conf":"확인","global":false,"url":"https://www.coway.com","ext":[],"grounded":true,"src":["https://ko.m.wikipedia.org/wiki/%EC%BD%94%EC%9B%A8%EC%9D%B4","https://www.evolog.in/coway-history","https://www.hankyung.com/article/2026021353331","https://biz.newdaily.co.kr/site/data/html/2021/09/17/2021091700056.html"]},{"id":"c027","name":"쿠쿠홈시스","sector":"물·수자원","subsector":"생활 물케어","type":"중견기업","scale":3,"founded":null,"hq":"경남","listed":"코스피","desc":"쿠쿠홀딩스에서 인적분할해 2017년 12월 출범한 렌털 전문 기업으로, 이듬해 유가증권시장에 재상장했고 본사는 경남 양산에 있다. 정수기와 공기청정기, 비데를 중심으로 안마의자·매트리스 같은 설치형 제품까지 렌털 품목을 넓히고 있다. 말레이시아를 발판으로 해외 사업을 키워 2025년 6월 현지 법인 쿠쿠인터내셔널이 말레이시아 증권거래소 메인마켓에 상장했다.","tags":["정수기","렌털","쿠쿠"],"conf":"확인","global":false,"url":"https://www.cuckoo.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/%EC%BF%A0%EC%BF%A0%ED%99%88%EC%8B%9C%EC%8A%A4","https://m.irgo.co.kr/IR-COMP/284740/%EC%BF%A0%EC%BF%A0%ED%99%88%EC%8B%9C%EC%8A%A4-IR-PAGE","https://www.hankyung.com/article/202506259554i","https://dealsite.co.kr/articles/135706"]},{"id":"c028","name":"현대렌탈케어","sector":"물·수자원","subsector":"생활 물케어","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"비상장","desc":"2015년 4월 현대홈쇼핑 자회사로 출범한 생활가전 렌털 기업으로 '현대큐밍' 브랜드를 쓴다. 정수기를 비롯해 공기청정기, 비데, 매트리스, 의류청정기 등을 렌털 방식으로 공급한다. 2022년 말 현대홈쇼핑이 지분 80%를 사모펀드 운용사 시에라인베스트먼트에 매각하면서 경영권이 넘어갔고, 현대홈쇼핑은 남은 지분 20%를 보유한 관계기업으로 남았다.","tags":["정수기","렌털","큐밍"],"conf":"추정","global":false,"url":"https://www.hyundairentalcare.co.kr","ext":[],"grounded":true,"src":["https://namu.wiki/w/%ED%98%84%EB%8C%80%EB%A0%8C%ED%83%88%EC%BC%80%EC%96%B4","https://www.hankyung.com/article/202212261626Y","https://www.khan.co.kr/article/202212261645001","http://www.hyundairentalcare.co.kr/aboutus/intro/company"]},{"id":"c029","name":"KG케미칼","sector":"물·수자원","subsector":"수처리 약품","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"코스피","desc":"1954년 경기화학공업으로 출발한 화학소재 기업으로, 2003년 KG그룹에 인수되며 지금의 사명이 됐고 그룹 지배구조의 중심에 있는 코스피 상장사다. 정수장과 하수·폐수 처리장에서 물속 오염물질을 뭉쳐 가라앉히는 응집제를 만들고 조류 제거제, 고효율 폐수처리제도 공급한다. 비료와 콘크리트 혼화제, 차량용 요소수(녹스케이) 등 다른 화학제품 사업도 함께 운영한다.","tags":["응집제","수처리약품","화학"],"conf":"확인","global":false,"url":"https://www.kgchem.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/KG%EC%BC%80%EB%AF%B8%EC%B9%BC","http://www.kgchem.co.kr/company/company.php","http://www.kgchem.co.kr/business/business.php","https://m.ceoscoredaily.com/page/view/2026040315335881943"]},{"id":"c030","name":"에코랩","sector":"물·수자원","subsector":"수처리 약품","type":"해외 대표","scale":4,"founded":null,"hq":"미국","listed":null,"desc":"1923년 미국에서 창업해 미네소타주 세인트폴에 본사를 둔 물·위생·감염 예방 솔루션 기업으로 뉴욕증권거래소에 상장돼 있다. 산업 현장의 냉각수와 보일러수, 공정용수, 폐수를 다루는 화학제품에 설비와 원격 모니터링 서비스를 묶어 공급한다. 수처리 사업은 1928년 세워진 날코를 인수해 만든 '날코 워터' 브랜드가 맡고 있으며, 식품·음료 공장과 병원·제약 시설처럼 물을 많이 쓰는 곳이 주 고객이다.","tags":["글로벌","산업용수","수처리약품"],"conf":"확인","global":true,"url":"https://www.ecolab.com","ext":[],"grounded":true,"src":["https://en.wikipedia.org/wiki/Ecolab","https://en.wikipedia.org/wiki/Nalco_Water","https://www.ecolab.com/about/our-businesses/nalco-water-and-process-services","https://www.ecolab.com/nalco-water/about"]},{"id":"c031","name":"코오롱생명과학","sector":"물·수자원","subsector":"수처리 약품","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"코스닥","desc":"2000년 설립돼 2009년 코스닥에 상장한 코오롱그룹 계열사로, 의약품 원료·중간체 같은 화학 사업과 바이오 사업을 함께 운영한다. 수처리 분야에서는 1990년부터 만들어 온 고분자 응집제 '베스플록(BESFLOC)'이 주력으로, 산업폐수와 도시하수 속 오염물질을 덩어리로 뭉쳐 걸러내는 데 쓰인다. 염색 폐수용 탈색제와 하수처리장의 미생물 활동을 돕는 종균제도 함께 공급한다.","tags":["수처리제","베스플록","화학"],"conf":"확인","global":false,"url":"https://www.kolonls.co.kr","ext":[],"grounded":true,"src":["https://www.kolonls.co.kr/chemical/business?b=3","https://www.kolonls.co.kr/intro/outline","https://namu.wiki/w/%EC%BD%94%EC%98%A4%EB%A1%B1%EC%83%9D%EB%AA%85%EA%B3%BC%ED%95%99","https://comp.fnguide.com/SVO2/ASP/SVD_Main.asp?gicode=A102940"]},{"id":"c032","name":"GS건설","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"대기업","scale":4,"founded":1969,"hq":"서울","listed":"코스피","desc":"1969년 설립된 GS그룹 계열 건설사로 주택·인프라·플랜트와 함께 수처리 분야 사업을 해왔다. 충남 대산임해산업지역에 하루 최대 10만 톤 규모의 해수담수화 시설을 지으며 바닷물을 공업용수로 바꾸는 역삼투압(RO) 설비와 에너지회수장치를 적용했고, 바레인 폐수처리시설과 쿠웨이트 송수시설 등 해외 사업도 수행했다. 수처리 자회사 GS이니마는 UAE 국영 에너지기업 타카에 지분 전량을 넘기는 계약이 체결돼 매각 절차가 진행 중이다.","tags":["EPC","하수처리","건설"],"conf":"확인","global":false,"url":"https://www.gsenc.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/GS%EA%B1%B4%EC%84%A4","https://biz.heraldcorp.com/article/10639359","https://www.getnews.co.kr/news/articleView.html?idxno=837164","https://www.bloter.net/news/articleView.html?idxno=659796"]},{"id":"c033","name":"금호건설","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"코스피","desc":"막여과(멤브레인으로 물속 이물질을 걸러내는 방식) 고도정수처리와 하수고도처리·하수재이용 등 물 관련 시공에 강점을 둔 건설사다. 1995년부터 막여과 기술 개발에 나서 국내 첫 막여과 정수장인 충남 공주정수장을 비롯해 여러 지자체 정수장을 시공했고, 제주 애월정수장 고도정수처리 사업도 맡았다. 2026년에는 한국환경공단이 발주한 과천 공공하수처리시설 현대화사업(약 2,249억 원)을 컨소시엄 대표사로 수주했다.","tags":["하수처리장","막여과","정수처리","시공"],"conf":"확인","global":false,"url":"https://www.kumhoenc.com","ext":[],"grounded":true,"src":["https://www.waterjournal.co.kr/news/articleView.html?idxno=21656","https://www.hankyung.com/article/202207110850Y","https://www.m-i.kr/news/articleView.html?idxno=933335","https://www.ebn.co.kr/news/articleView.html?idxno=1714598"]},{"id":"c034","name":"대우건설","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"대기업","scale":4,"founded":1973,"hq":"서울","listed":"코스피","desc":"1973년 설립된 종합건설사로 주택·토목·플랜트와 함께 환경사업을 수행한다. 하수처리장과 정수장, 하수관거 등 물 관련 기초시설의 설계·시공 실적을 쌓아 왔고, 고도정수처리는 물론 소각시설과 하수슬러지 처리시설 등 폐기물 분야까지 환경사업 범위를 넓혀 왔다. 자체 기술연구원을 두고 관련 공법을 개발한다.","tags":["EPC","하수처리장","건설"],"conf":"확인","global":false,"url":"https://www.daewooenc.com","ext":[],"grounded":true,"src":["https://m.daewooenc.com/business/plant","http://m.ecomedia.co.kr/news/newsview.php?ncode=179507062616234","https://www.evolog.in/daewoo-enc-history","https://www.daewooenc.com/company/rnd"]},{"id":"c035","name":"부강테크","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"중소기업","scale":2,"founded":1998,"hq":null,"listed":"비상장","desc":"1998년 설립된 하수·폐수 처리 기술 기업이다. 물리적 여과와 미생물 처리를 결합해 부유물질과 질소를 걸러내는 BBF 생물여과, 적은 부지와 에너지로 질소를 제거하는 아나목스(AMX) 공법 등 자체 공정을 보유했고, 하수 슬러지 감량과 바이오가스 생산까지 다룬다. 2008년 미국 법인 투모로우워터(Tomorrow Water)를 세워 현지 하수처리 시장에 진출했다.","tags":["하수고도처리","물재이용","기술수출","BKT"],"conf":"확인","global":false,"url":"https://www.bkt21.co.kr","ext":[],"grounded":true,"src":["https://www.bkt21.co.kr/about","https://www.bkt21.co.kr/technologies-bbf","https://www.bkt21.co.kr/technologies-amx","https://news.nate.com/view/20250406n13926"]},{"id":"c036","name":"삼성E&A","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"대기업","scale":4,"founded":1970,"hq":"서울","listed":"코스피","desc":"플랜트의 설계·조달·시공(EPC)을 주력으로 하는 삼성그룹 계열 엔지니어링 기업이다. 하·폐수 처리와 물 재이용, 반도체 등 첨단 공정에 쓰이는 초순수 생산시설처럼 난도가 높은 수처리 분야의 기술을 갖추고 용인과 바레인 등 국내외에서 관련 프로젝트를 수행해 왔다. 2024년 주주총회에서 삼성엔지니어링이라는 이름을 지금의 사명으로 바꿨고, 2026년 한국수자원공사와 해외 물 시장 공동 진출 협약을 맺었다.","tags":["EPC","산업용수","해수담수화","플랜트"],"conf":"확인","global":false,"url":"https://www.samsungena.com","ext":[],"grounded":true,"src":["https://www.samsungena.com/kr/newsroom/news/view?idx=15554","https://www.mt.co.kr/estate/2024/03/21/2024032116350250247","https://www.sedaily.com/article/20045677","https://www.gukjenews.com/news/articleView.html?idxno=3586867"]},{"id":"c037","name":"신성플랜트","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"산업 현장에서 나오는 오염물질을 처리하는 환경설비를 설계·제작·설치하는 기업이다. 수질오염방지시설과 하수슬러지 처리시설을 다루고, 먼지를 걸러내는 집진기와 백필터, 배기가스를 씻어내는 스크러버·흡착탑 등 대기오염 방지설비도 함께 공급한다. 고객사의 생산공정과 오염물질 특성, 배출 기준을 분석해 설계부터 시운전까지 일괄 수행한다.","tags":["수질오염방지시설","환경설비"],"conf":"추정","global":false,"url":"https://www.sinsungplant.co.kr","ext":[],"grounded":true,"src":["https://www.sinsungplant.co.kr/product/water.php","https://www.sinsungplant.co.kr/product/industry04.php","https://www.komachine.com/ko/companies/shinsungplant"]},{"id":"c038","name":"아쿠아웍스","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"중소기업","scale":2,"founded":null,"hq":"대구","listed":"비상장","desc":"2019년 대구 국가물산업클러스터에서 창업한 수처리 벤처기업이다. 주력 제품은 에너지 절감형 고효율 산기관으로, 하수·폐수를 미생물로 처리할 때 물속에 공기를 불어넣는 장치의 효율을 높여 처리장의 전력 사용을 줄이는 설비다. 관련 특허와 신기술인증(NET)을 보유했고, 클러스터 부지에 자체 제조공장 건립을 추진했다.","tags":["물산업클러스터","수처리"],"conf":"추정","global":false,"url":"https://www.aquaworks.kr","ext":[],"grounded":true,"src":["https://thevc.kr/aquaworks","https://www.ajunews.com/view/20230306172553250","https://www.koit.co.kr/news/articleView.html?idxno=110423","https://news.nate.com/view/20230306n21638"]},{"id":"c039","name":"코오롱글로벌","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"대기업","scale":4,"founded":null,"hq":"경기","listed":"코스피","desc":"코오롱건설과 코오롱아이넷 등이 2011년 합쳐져 출범한 코오롱그룹 계열사로, 건설과 무역·자동차 유통 사업을 함께 한다. 건설부문에서 하수·폐수 처리시설을 짓고 기존 시설을 고도처리 공정으로 개선하는 환경사업을 맡는다. 송풍기를 쓰지 않아 전력을 아끼는 저에너지 분리막 수처리 기술로 환경신기술과 녹색기술 인증을 받았고, 이 기술이 국내 하수·폐수처리장 70여 곳에 적용됐다.","tags":["하수처리","환경시공","코오롱그룹"],"conf":"확인","global":false,"url":"https://www.kolonglobal.com","ext":[],"grounded":true,"src":["https://www.kolonglobal.com/sub/environment04.php","http://www.conslove.co.kr/news/articleView.html?idxno=29362","https://ko.wikipedia.org/wiki/%EC%BD%94%EC%98%A4%EB%A1%B1%EA%B8%80%EB%A1%9C%EB%B2%8C","https://www.kolon.com/kr/media/newsDtl?detailsKey=8329"]},{"id":"c040","name":"태영건설","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"코스피","desc":"하수처리장과 정수장 등 물 관련 기초시설의 설계·시공을 주력 사업 가운데 하나로 삼아 온 건설사다. 국내 첫 민간투자 하수처리장과, 음식물 발효액을 활용한 생물학적 고도처리를 적용한 수원 하수처리장 등을 시공했다. 시설을 지은 뒤 위탁받아 운영하는 통합 운영관리(O&M) 사업도 함께 하며, 2026년에는 과천 공공하수처리시설 현대화사업 컨소시엄에 참여했다.","tags":["하수처리","시공","건설"],"conf":"확인","global":false,"url":"https://www.taeyoung.com","ext":[],"grounded":true,"src":["https://www.waterjournal.co.kr/news/articleView.html?idxno=12794","http://www.taeyoung.com/Business/business.asp?busidx=7","http://www.ecorbit.com/kr/media/press_view?idx=7&page=1","https://www.ebn.co.kr/news/articleView.html?idxno=1714598"]},{"id":"c041","name":"한맥기술","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"도로·터널·항만·수자원 등 토목 전 분야를 다루는 종합 엔지니어링 회사로, 그중 상하수도 부문에서 물 공급과 하수 처리 시설의 설계를 맡는다. 공공하수처리시설 증설 같은 사업의 기본설계와 실시설계 용역을 수행하는데, 이는 시설을 실제로 지을 수 있도록 도면과 시공 계획을 구체화하는 일이다. 공공 상하수도뿐 아니라 민간 사업도 대상으로 한다.","tags":["설계","상하수도","엔지니어링"],"conf":"확인","global":false,"url":"https://www.hanmaceng.co.kr","ext":[],"grounded":true,"src":["http://hanmaceng.co.kr/hanmaceng23/hm_renewal/business_waterSS.html","http://hanmaceng.co.kr/board/bbs/board.php?bo_table=water&wr_id=9","https://www.jobplanet.co.kr/companies/92588"]},{"id":"c042","name":"효림산업","sector":"물·수자원","subsector":"수처리 플랜트·EPC","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"정수장·하수처리장·폐수처리장과 발전소 취수 설비 등에 들어가는 수처리 기자재를 제작하고 플랜트를 설계·시공하는 환경설비 전문 기업이다. 바닷물에서 소금기를 빼 쓸 수 있는 물로 만드는 해수담수화와 폐수 재이용까지 물과 관련한 전 공정을 다룬다. 정삼투와 역삼투 방식을 결합해 에너지 사용을 줄인 담수화 기술을 개발했으며, 제약사 국제약품의 계열사다.","tags":["수처리설비","탈수기","플랜트"],"conf":"추정","global":false,"url":"https://www.hyorim.co.kr","ext":[],"grounded":true,"src":["http://www.hyorim.co.kr/pages/plant?sub=plant2","https://www.khan.co.kr/article/201911072005001","https://www.sisajournal-e.com/news/articleView.html?idxno=208804"]},{"id":"c043","name":"알앤이","sector":"물·수자원","subsector":"초순수·산업용수","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"프랑스 환경기업 베올리아 그룹의 계열사로, 버려진 인조대리석과 아크릴 폐자재에서 원료를 되뽑아내는 화학적 재활용 기업이다. 폐자재를 열분해해 아크릴의 원료인 MMA(메타크릴산메틸)를 분리·정제해 회수하고, 남는 물질은 세라믹 등에 쓰이는 알루미나로 만든다. 회수한 재활용 MMA는 투명 아크릴 수지, 자동차 후미등, 방음자재 같은 제품의 원료로 다시 쓰인다.","tags":["산업폐수","재이용","외국계"],"conf":"확인","global":false,"url":"https://rne.kr","ext":[],"grounded":true,"src":["https://www.khan.co.kr/article/202108301048001","https://www.hankyung.com/news/article/2014070818751","http://www.mtnews.net/news/view.php?idx=11612","https://www.newswire.co.kr/newsRead.php?no=929453"]},{"id":"c044","name":"이엔코퍼레이션","sector":"물·수자원","subsector":"초순수·산업용수","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"코스닥","desc":"초순수와 산업용 수처리를 다루는 코스닥 상장사다. 2021년 수처리 EPC 기업 한성크린텍의 지분 100%를 인수했고, 2023년 10월 흡수합병 절차를 마쳐 수처리 사업을 본체로 들여왔다. 반도체·전자 공정에 쓰이는 초순수 설비와 공업용수·오폐수 처리 설비를 설계부터 자재 조달, 시공까지 한 번에 맡는다.","tags":["초순수","지주","수처리"],"conf":"확인","global":false,"url":"https://hscleantech.com","ext":[],"grounded":true,"src":["https://www.asiae.co.kr/article/2021030510135126988","https://www.hankyung.com/article/2023080727465","https://www.fnnews.com/news/202310121006110233"]},{"id":"c045","name":"코웨이엔텍","sector":"물·수자원","subsector":"초순수·산업용수","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"코웨이 계열의 환경 엔지니어링 기업으로 산업플랜트 수처리와 도시 하수 재이용, 정수·폐수 처리 설비를 다룬다. 오염물질을 막으로 걸러내는 분리막 공법을 주력 기술로 철강·석유화학 등 산업플랜트에 수처리 설비를 공급한다. 하수처리장에서 나온 방류수를 정화해 공업용수로 되살리는 재이용 사업도 함께 한다.","tags":["산업용수","초순수","하수재이용"],"conf":"확인","global":false,"url":"https://www.cowayentech.com","ext":[],"grounded":true,"src":["http://m.ecomedia.co.kr/news/newsview.php?ncode=1065609183781830","https://www.etnews.com/20221206000109","https://company.coway.com/newsroom/press/392"]},{"id":"c046","name":"한성크린텍","sector":"물·수자원","subsector":"초순수·산업용수","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"코스닥","desc":"1990년 설립된 초순수·산업용 수처리 전문기업이다. 반도체와 전자 공정에 쓰이는 초순수(불순물을 극도로 걸러낸 물)와 공업용수·오폐수 처리 설비를 설계, 자재 조달, 시공까지 일괄 수행한다. 2026년에는 삼성전자 평택 P5 공사와 DB하이텍 음성 상우공장의 초순수 설비 공사를 수주했다.","tags":["초순수","반도체","국산화","수처리"],"conf":"확인","global":false,"url":"https://hscleantech.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2023080727465","https://www.mt.co.kr/stock/2026/05/19/2026051910389677060","https://www.etoday.co.kr/news/view/2585738"]},{"id":"c047","name":"한양이엔지","sector":"물·수자원","subsector":"초순수·산업용수","type":"중견기업","scale":3,"founded":null,"hq":"경기","listed":"코스닥","desc":"반도체·디스플레이 공장에 초고순도(UHP) 가스 배관과 화학물질 중앙공급장치, 클린룸 설비를 설계·시공하는 코스닥 상장사다. 1980년대 후반 초고순도 배관 전 공정을, 1990년에는 화학물질 중앙공급장치를 국산화했고 2000년 코스닥에 상장했다. 반도체 외에 산업플랜트와 환경·그린에너지, 우주항공 분야 사업도 하고 있다.","tags":["초순수배관","반도체설비","시공"],"conf":"확인","global":false,"url":"https://www.hanyangeng.co.kr","ext":[],"grounded":true,"src":["https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=431943","https://www.valueline.co.kr/finance/summary/045100","https://ssl.pstatic.net/imgstock/upload/research/company/1679007801286.pdf"]},{"id":"c048","name":"GS이니마","sector":"물·수자원","subsector":"해수담수화·물 재이용","type":"중견기업","scale":3,"founded":null,"hq":"스페인","listed":"비상장","desc":"스페인에 본사를 둔 수처리 전문기업으로 2011년 GS건설이 인수해 자회사로 편입했다. 바닷물에서 소금기를 걸러 쓸 수 있는 물로 만드는 해수담수화 플랜트를 설계·시공하고, 완공 후 운영·관리(O&M)까지 맡는다. 오만·아랍에미리트·브라질 등에서 담수화와 상하수도 사업을 수행해 왔으며, GS건설은 2025년 보유 지분 매각을 결정해 최대주주 변경이 예정돼 있다.","tags":["해수담수화","글로벌수처리","O&M"],"conf":"확인","global":false,"url":"https://www.gsinima.com","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/202508225834i","https://www.insightkorea.co.kr/news/articleView.html?idxno=219173","https://www.hankyung.com/article/2022062786186"]},{"id":"c049","name":"웰크론한텍","sector":"물·수자원","subsector":"해수담수화·물 재이용","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"코스닥","desc":"웰크론그룹 계열의 코스닥 상장사로 산업용 수처리 설비와 에너지 플랜트를 설계·시공한다. 주력은 공장 폐수를 끓여 증발·농축시킨 뒤 깨끗한 물만 되돌려 쓰고 남은 찌꺼기만 버리는 무방류(ZLD) 폐수처리 설비로, 처리한 물은 공업용수·조경용수·공정수로 재이용된다. 발전소용 수·폐수 처리설비와 증발·농축·건조 플랜트도 공급한다.","tags":["폐수재이용","무방류","플랜트"],"conf":"확인","global":false,"url":"https://www.welcronhantec.co.kr","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2021041881821","https://www.welcronhantec.co.kr/dh/water01","https://www.hantec.co.kr/dh/plant02"]},{"id":"c050","name":"GST","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"중견기업","scale":3,"founded":2001,"hq":"경기","listed":"코스닥","desc":"2001년 설립된 코스닥 상장사로 정식 사명은 글로벌스탠다드테크놀로지다. 반도체·디스플레이 생산라인에서 나오는 유해가스를 정화하는 스크러버와, 공정 장비의 챔버 온도를 정밀하게 조절하는 칠러를 만든다. 지구온난화 영향이 적은 이산화탄소 냉매 칠러를 개발해 해외 반도체 기업과 공급 계약을 맺는 등 대만·미국·중국 등지로 수출한다.","tags":["스크러버","칠러","반도체","공정가스"],"conf":"확인","global":false,"url":"https://www.gst-in.com","ext":[],"grounded":true,"src":["https://www.kbanker.co.kr/news/articleView.html?idxno=221383","https://www.sisajournal-e.com/news/articleView.html?idxno=307443","https://www.gst-in.com/"]},{"id":"c051","name":"뒤르","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"해외 대표","scale":4,"founded":null,"hq":"독일","listed":null,"desc":"독일 뒤르 그룹의 배기정화 사업부였던 클린 테크놀로지 시스템즈가 2025년 11월 독립 법인 뒤르 CTS로 출범했다. 지분은 스텔렉스 캐피털이 75%, 뒤르 AG가 25%를 보유한다. 공장 배기가스에 섞인 용제와 악취 물질을 고온으로 태워 없애는 축열식 열산화 설비(RTO)가 주력이며, 대기오염 방지와 소음 저감, 분산형 발전 설비를 다룬다. 최근에는 가스 대신 전기로 가열하는 전기식 RTO를 산업 규모로 확대하고 있다.","tags":["RTO","VOCs","배기정화","글로벌"],"conf":"확인","global":true,"url":"https://www.durr.com","ext":[],"grounded":true,"src":["https://www.cts-durr.com/en/media/news/news-detail/view/duerr-cts-launches-as-standalone-environmental-technology-company-effective-new69045fafd84fe286598338","https://www.pfonline.com/news/durr-cts-launches-as-standalone-environmental-tech-company-","https://www.cts-durr.com/en"]},{"id":"c052","name":"삼도환경","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"플라즈마로 오존을 만들어 냄새와 세균을 잡는 장치를 제조하는 악취방지 전문 중소기업이다. 플라즈마 악취제거기와 탈취살균기, 플라즈마 발생장치, 농산물 신선도 유지기 등을 만든다. 특히 습기와 열이 많아 장비가 견디기 힘든 축사 환경에서도 오존을 안정적으로 발생시키는 데 초점을 맞춰, 축산 분뇨에서 나오는 암모니아·황화수소 같은 악취 물질을 분해하는 축산용 제품을 주력으로 삼고 있다.","tags":["악취제거","플라즈마","탈취"],"conf":"확인","global":false,"url":"https://www.plalus.kr","ext":[],"grounded":true,"src":["https://www.plalus.kr/index.php","https://www.plalus.kr/index.php?cate=004001","https://www.plalus.kr/index.php?cate=004003","https://www.chuksannews.co.kr/mobile/article.html?no=110904"]},{"id":"c053","name":"에코프로에이치엔","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"중견기업","scale":3,"founded":2021,"hq":"충북","listed":"코스닥","desc":"에코프로그룹의 환경사업 부문이 2021년 분리돼 설립된 코스닥 상장사다. 반도체·디스플레이 클린룸의 공기 중 오염물질을 걸러내는 케미컬 필터, 도료·접착제·유기용매를 쓰는 공정에서 나오는 휘발성유기화합물(VOCs)을 흡착 제거하는 시스템, 반도체 공정 온실가스를 분해하는 저감장치를 공급한다. 특수 활성탄 기반 흡착 소재와 촉매를 직접 개발해 쓴다.","tags":["VOCs저감","온실가스","케미컬필터","촉매소재"],"conf":"확인","global":false,"url":"https://www.ecoprohn.com","ext":[{"n":"에코프로","rel":"계열"}],"grounded":true,"src":["https://ecoprohn.co.kr/sub020101","https://ecoprohn.co.kr/sub020103","https://www.electimes.com/news/articleView.html?idxno=320576"]},{"id":"c054","name":"엔바이온","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"공장에서 나오는 휘발성유기화합물(VOCs)과 악취를 태워 없애는 대기오염방지설비 전문 기업이다. 주력인 축열식 연소산화장치(RTO)는 오염된 가스를 800도 안팎에서 연소시켜 물과 이산화탄소로 분해하고, 축열재로 배기가스의 열을 회수해 연료 사용을 줄인다. 촉매를 함께 쓰는 축열식 촉매 연소 시스템과, 묽은 오염가스를 미리 모아 농도를 높여 처리 효율을 올리는 농축 설비도 다룬다.","tags":["RTO","VOCs","악취저감"],"conf":"확인","global":false,"url":"https://www.enbion.com","ext":[],"grounded":true,"src":["https://renewableenergyfollowers.org/4569","https://www.enerto.co.kr/rto-principle","https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002863728"]},{"id":"c055","name":"유니셈","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"중견기업","scale":3,"founded":1988,"hq":"경기","listed":"코스닥","desc":"1988년 설립돼 1999년 코스닥에 상장한 반도체 공정장비 기업이다. 반도체·디스플레이 제조 과정에서 발생하는 유해가스를 정화하는 스크러버와 공정 온도를 일정하게 유지하는 칠러가 양대 주력 사업으로, 국내 주요 반도체·디스플레이 업체에 공급한다. 최근에는 극저온 칠러와 이산화탄소 냉매를 쓰는 친환경 칠러를 새로 선보였다.","tags":["반도체스크러버","공정가스","칠러","유해가스처리"],"conf":"확인","global":false,"url":"https://unisem.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/유니셈","https://www.insightkorea.co.kr/news/articleView.html?idxno=203458","https://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202508130720"]},{"id":"c056","name":"지앤비에스에코","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"코스닥","desc":"반도체·디스플레이·태양광 공정에서 나오는 유해가스를 정화하는 스크러버(배기가스 처리장치)를 만드는 기업이다. 기존 스크러버가 물을 많이 쓰고 폐수를 남기던 문제를 없앤 무폐수 플라즈마 스크러버를 2014년 개발해 주력 제품으로 삼고 있고, 2018년부터 국내 반도체 대기업에 납품해 왔다. 2005년 설립돼 지앤비에스엔지니어링이라는 이름으로 2021년 코스닥에 상장했다.","tags":["무폐수스크러버","플라즈마","반도체","태양광"],"conf":"확인","global":false,"url":"https://www.gnbseco.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/지앤비에스에코","https://www.the-stock.kr/news/articleView.html?idxno=15131","https://www.fnnews.com/news/202405090934071616","https://www.sentv.co.kr/article/view/sentv202406250008"]},{"id":"c057","name":"피에스엠","sector":"대기·공기질","subsector":"VOCs·악취 저감","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"상온·상압에서 만든 이온화 가스인 '대기압 플라즈마'를 다루는 장비 전문 기업이다. 이차전지·반도체·디스플레이·자동차·PCB 공정에서 표면을 세정하거나 성질을 바꾸는 데 쓰이는 제트형·로터리형 플라즈마 장비를 공급한다. 유해가스와 악취를 없애는 박막형 플라즈마 공기정화 모듈 개발 과제도 수행했다.","tags":["플라즈마","악취저감","유해가스"],"conf":"확인","global":false,"url":"https://www.psm.co.kr","ext":[],"grounded":true,"src":["http://www.psm.co.kr/"]},{"id":"c058","name":"어썸레이","sector":"대기·공기질","subsector":"실내공기질·공기청정","type":"스타트업","scale":1,"founded":2018,"hq":"서울","listed":"비상장","desc":"탄소나노튜브를 섬유와 필름 형태로 만드는 소재 기술을 바탕으로 차세대 X-선 발생장치를 개발한 스타트업이다. 이 X-선을 이용해 필터 없이 미세먼지와 세균·바이러스를 제거하는 공기 살균·정화 모듈을 만들며, 제품 '에어썸'은 기존 공조기나 환기장치에 붙여 쓰는 방식이라 필터 교체가 필요 없다. 나노 소재 전공 박사들과 X-선 장비 제조 경력자들이 모여 2018년 설립했다.","tags":["탄소나노튜브","X선","공기정화","초미세먼지"],"conf":"확인","global":false,"url":"https://awexomeray.com","ext":[{"n":"카카오벤처스","rel":"투자"}],"grounded":true,"src":["https://www.sedaily.com/NewsVIew/1Z1HXJ3AQ8","https://magazine.hankyung.com/job-joy/article/202312223958d","https://m.etnews.com/20200818000042"]},{"id":"c059","name":"하츠","sector":"대기·공기질","subsector":"실내공기질·공기청정","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"코스닥","desc":"벽산그룹 계열의 코스닥 상장사로 실내 공기질과 관련된 설비를 만든다. 조리할 때 나는 연기와 냄새를 빨아들이는 주방 레인지후드가 대표 제품이며, 주택용 환기시스템과 공기청정 기기, 소형 빌트인 주방기기도 함께 공급한다. 일반 소비자 판매와 더불어 아파트를 분양하는 건설사에 납품하는 기업 간 거래 비중이 크다.","tags":["환기시스템","레인지후드","실내공기질"],"conf":"확인","global":false,"url":"https://www.haatz.com","ext":[],"grounded":true,"src":["https://www.thebell.co.kr/free/content/ArticleView.asp?key=202006011442561960105725","https://www.haatzmall.com/","http://www.hanuribiz.com/news/articleView.html?idxno=59397"]},{"id":"c060","name":"힘펠","sector":"대기·공기질","subsector":"실내공기질·공기청정","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"욕실 환풍기와 주택용 환기 장비를 만드는 환기가전 기업이다. 대표 제품인 '휴젠뜨'는 환기에 온풍·제습 기능을 더한 욕실 복합 환풍기이며, 실내 공기를 바꾸면서 빠져나가는 열을 회수해 냉난방 손실을 줄이는 전열교환 방식 환기청정기도 함께 공급한다. 공기질 센서로 자동 운전하거나 앱으로 조작하는 제품군도 갖췄다.","tags":["환기가전","전열교환기","환기청정기"],"conf":"확인","global":false,"url":"https://himpel.com","ext":[],"grounded":true,"src":["https://himpel.com/kr","https://himpelshop.com/"]},{"id":"c061","name":"KC그린홀딩스","sector":"대기·공기질","subsector":"집진·여과","type":"중견기업","scale":3,"founded":2010,"hq":"서울","listed":"코스피","desc":"1973년 한국코트렐공업으로 출발한 환경설비 사업이 2010년 지주회사와 사업회사로 나뉘면서 설립된 코스피 상장 지주회사다. 대기오염방지설비를 만드는 KC코트렐, 폐기물 소각·매립·재활용을 맡는 KC환경서비스 등을 자회사로 둔다. 사업은 환경엔지니어링, 환경서비스, 친환경제조, 신재생에너지 네 부문으로 나뉜다.","tags":["지주회사","대기오염방지","환경설비"],"conf":"확인","global":false,"url":"https://www.kcgreenholdings.com","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/KC그린홀딩스","https://www.thebell.co.kr/free/content/ArticleView.asp?key=202002271451091680106475&lcode=00","http://www.kcgreenholdings.com/html/dh/intro1"]},{"id":"c062","name":"KC코트렐","sector":"대기·공기질","subsector":"집진·여과","type":"중견기업","scale":3,"founded":null,"hq":"서울","listed":"코스피","desc":"1973년 설립된 대기오염방지설비 전문 기업으로 1994년 환경 분야 회사로는 처음 증권거래소에 상장했다. 발전소·제철소 등에서 나오는 먼지를 전기의 힘으로 끌어모아 걸러내는 전기집진기와 여과포를 쓰는 백필터, 배기가스 속 황산화물을 없애는 탈황설비를 설계·시공한다. 터널·지하공간용 집진설비와 태양광 발전 사업도 하며, KC그린홀딩스의 핵심 계열사다.","tags":["전기집진기","백필터","탈황설비","EPC"],"conf":"확인","global":false,"url":"https://www.kc-cottrell.com","ext":[],"grounded":true,"src":["https://www.etnews.com/20151016000214","http://www.kc-cottrell.com/kc/mob/kor/biz/biz010105.html","https://www.hankyung.com/article/202402017380L"]},{"id":"c063","name":"삼화이엔지","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"공장에서 발생하는 먼지를 빨아들여 걸러내는 집진기를 전문 제조하는 기업이다. 자루 모양 필터로 분진을 거르는 백필터형과 압축공기를 쏘아 필터에 쌓인 먼지를 털어내는 에어펄스형을 중심으로, 원심력을 쓰는 사이클론형과 미스트·그라인더용, 휴대용 흄 집진기까지 용도별 제품을 갖췄다.","tags":["집진기","에어펄스","백필터"],"conf":"확인","global":false,"url":"https://www.isamhwaeng.com","ext":[],"grounded":true,"src":["http://www.isamhwaeng.com","https://www.isamhwaeng.com/ko/product/view?ca_id=10&id=21","https://www.isamhwaeng.com/ko/product/view?ca_id=10&id=22","https://www.isamhwaeng.com/ko/product/view?id=46"]},{"id":"c064","name":"서진필터","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"산업용 집진기에 들어가는 필터백(여과포)을 직접 만드는 제조 기업이다. 펄스제트·쉐이커·역기류 등 집진기 탈진 방식에 맞춰 PE·PP·PTFE·PPS·노멕스 같은 원단을 골라 재단과 봉제, 부자재 부착까지 자체 공정으로 생산한다. 현장의 분진 종류와 운전 온도, 처리 풍량을 따져 규격을 정하고 납품 후 사후관리까지 맡는다.","tags":["백필터","여과포","필터제조"],"conf":"확인","global":false,"url":"https://seojinfilter.co.kr","ext":[],"grounded":true,"src":["https://seojinfilter.co.kr/"]},{"id":"c065","name":"에어릭스","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"제철소·발전소 같은 대형 산업설비에서 나오는 먼지를 걸러내는 집진설비를 설계·제작하는 기업이다. 압축공기로 필터를 털어내는 백필터 집진기(M.P.B)와 주름형 필터백 등 소모품을 함께 공급하고, 설치한 대기방지시설의 경상정비(O&M)까지 맡는다. 집진기에 사물인터넷(IoT)과 데이터 분석을 접목해 설비 운전 상태를 관리하는 기술도 적용하고 있다.","tags":["집진기","백필터","O&M","미세먼지"],"conf":"확인","global":false,"url":"https://www.aerix.co.kr","ext":[],"grounded":true,"src":["https://www.aerix.co.kr/대기방지시설/미세먼지-저감설비/백필터-집진기/m-p-b-micro-pulse-air-bag-filter/","https://www.aerix.co.kr/환경-소모품/주름형-필터백/","https://www.etnews.com/20161027000220"]},{"id":"c066","name":"에어보스","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"산업 현장의 분진을 빨아들여 거르는 집진설비를 만드는 기업이다. 자루형 필터를 쓰는 백필터 집진기와 카트리지형, 원심력으로 입자를 떨어뜨리는 사이클론형, 물로 가스를 씻어내는 스크러버형까지 방식별 제품을 갖췄다. 공장 전체를 묶는 대형 중앙집진 설비부터 중소형 이동식 집진기까지 작업 환경에 맞춰 설계·제작하며 인허가와 측정도 지원한다.","tags":["집진기","백필터"],"conf":"확인","global":false,"url":"https://air-boss.co.kr","ext":[],"grounded":true,"src":["https://air-boss.co.kr/plant","http://air-boss.co.kr/bagfilter","http://air-boss.co.kr/cyclone","http://air-boss.co.kr/scrubber"]},{"id":"c067","name":"이큐브","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"산업 현장에서 발생하는 분진을 걸러내는 집진기를 제조·판매하는 기업이다. 여과면적을 넓힌 사각 평면형 백필터 집진기와 카트리지 필터를 쓰는 분진집진기, 분진회수기 등을 갖췄고 전기·전자·반도체·자동차·의료·제약·바이오 공정에 공급한다. 집진설비 설계와 제조, 설치부터 부속품 판매와 유지보수까지 함께 맡는다.","tags":["집진기","백필터"],"conf":"추정","global":false,"url":"http://www.eqube.co.kr","ext":[],"grounded":true,"src":["http://www.eqube.co.kr/","http://www.eqube.co.kr/?mod=pro_bagfilter","http://eqube.co.kr/?mod=pro_dust","http://www.eqube.co.kr/?mod=maintenance_etc"]},{"id":"c068","name":"청우씨엔티","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"산업 현장의 분진과 연기를 제거하는 집진기를 공급하는 경기 안산 소재 기업이다. 연마 분진이나 분말 같은 건식 분진을 섬유 필터백으로 포집하는 백필터형 집진기를 비롯해 이동식·고정식 구조와 헤파필터·카트리지 필터 등 현장 조건에 맞춘 제품군을 갖췄다. 용접용 국소배기장치도 다루며 조달청 등록을 통해 공공기관에도 납품한다.","tags":["집진기","백필터","분진제거"],"conf":"확인","global":false,"url":"https://cwcnt.com","ext":[],"grounded":true,"src":["https://cwcnt.com/product/alb-백필터형-집진기/282/","https://cwcnt.com/category/집진기/43/","https://cwcnt.com/category/집진기-조달청/25/","https://cwcnt.com/category/대형-이동식-집진기/104/"]},{"id":"c069","name":"캠필","sector":"대기·공기질","subsector":"집진·여과","type":"해외 대표","scale":4,"founded":1963,"hq":"스웨덴","listed":null,"desc":"1963년 스웨덴 트로사에서 미국 케임브리지 필터와의 합작으로 설립된 공기 여과 기업이다. 스웨덴이 원자력발전소에 쓸 고성능 공기 필터를 필요로 한 것이 출발점이었다. 지금은 공기 여과 솔루션과 산업용 대기오염 방지, 발전 설비용 필터, 반도체 공정 등에서 미세한 오염 기체를 걸러내는 분자 오염 제어 등 네 개 사업 영역을 두고, 아메리카·유럽·아시아태평양에 생산 거점과 연구소를 운영한다.","tags":["에어필터","HEPA","클린에어","글로벌"],"conf":"확인","global":true,"url":"https://www.camfil.com","ext":[],"grounded":true,"src":["https://www.camfil.com/en/about-us/we-are-camfil","https://www.camfil.com/en-us/about-us/we-are-camfil/our-history","https://en.wikipedia.org/wiki/Camfil"]},{"id":"c070","name":"크린앤사이언스","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":1973,"hq":null,"listed":"코스닥","desc":"자동차용·산업용·공조용 필터에 들어가는 여과지와 부직포 여재를 전문 생산하는 기업이다. 1973년 전일공업사로 출발해 전일여지를 거쳐 2000년 지금의 이름으로 바꿨고, 같은 해 코스닥에 상장했다. 미세한 섬유를 뿜어 만드는 멜트블로운(MB) 부직포 미디어 같은 필터 소재와 함께 마스크 등 완제품도 만든다.","tags":["필터여재","부직포","공기청정기필터","자동차필터"],"conf":"확인","global":false,"url":"https://www.cands.co.kr","ext":[],"grounded":true,"src":["https://ko.wikipedia.org/wiki/크린앤사이언스","http://www.cands.co.kr/wp-content/uploads/2023/01/크린앤사이언스사업보고서2021.03.11.pdf"]},{"id":"c071","name":"크린에어테크","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"공장에서 나오는 먼지를 걸러내는 집진기를 만드는 대기오염방지시설 전문 제조사다. 천으로 된 여과포로 먼지를 거르는 백필터 집진기를 비롯해 카트리지형 여과집진기, 이동식·진공 집진기 등 다양한 형태의 집진설비를 생산한다. 설비 제조와 함께 대기배출시설 인허가, 대기 자가측정 등 관련 업무도 함께 수행한다.","tags":["집진기","백필터","여과포"],"conf":"확인","global":false,"url":"https://cleanat.com","ext":[],"grounded":true,"src":["https://cleanat.com/m3sub0","https://cleanat.com/m3sub0/3253","https://cleanat.com/m4sub0/5758","https://www.komachine.com/ko/companies/clean-airtech/products/18020-filtered-dust-collector-bag-filter-cdc-series"]},{"id":"c072","name":"한국캠브리지필터","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"1985년 일본 캠브리지필터의 기술을 도입해 출발한 공기필터 제조사로 충북 오창과학산업단지에 생산 거점을 두고 있다. 미세입자를 걸러내는 헤파(HEPA) 필터와 그보다 걸러내는 성능이 높은 울파(ULPA) 필터, 유해가스를 흡착하는 케미컬 필터, PTFE 필터 등을 만든다. 반도체·디스플레이 공장의 클린룸과 제약·병원 시설, 건물 공조 설비에 쓰인다.","tags":["HEPA필터","클린룸","공기필터"],"conf":"확인","global":false,"url":"https://www.cambridgefilter.co.kr","ext":[],"grounded":true,"src":["https://www.cbinews.co.kr/news/articleView.html?idxno=17623","https://v.daum.net/v/AVp1pzJhSa","https://news.nate.com/view/20221215n20929"]},{"id":"c073","name":"한빛이엔에스","sector":"대기·공기질","subsector":"집진·여과","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"경기 포천에 본사와 공장을 두고 전기집진기를 중심으로 대기오염방지설비를 만드는 기업이다. 전기의 힘으로 매연 입자를 붙잡는 전기집진기와 물로 오염물질을 씻어내는 스크러버, 회전 기류로 먼지를 분리하는 사이클론, 여과포식 백필터와 카트리지 집진기 등을 공급한다. 공장 배출가스뿐 아니라 음식점 조리 매연과 냄새 처리에도 쓰인다.","tags":["전기집진기","산업용집진기"],"conf":"확인","global":false,"url":"https://www.hanbitens.com","ext":[],"grounded":true,"src":["https://www.hanbitens.com/","https://hanbitens.com/sub/pollution/pollution.php","https://blog.daara.co.kr/hanbitens"]},{"id":"c074","name":"나노","sector":"대기·공기질","subsector":"탈황·탈질·촉매","type":"중견기업","scale":3,"founded":1999,"hq":"경북","listed":"코스닥","desc":"1999년 설립돼 경북 상주에 본사를 둔 코스닥 상장사로, 질소산화물을 줄이는 SCR 탈질촉매를 만든다. 이 촉매는 암모니아와 반응해 미세먼지와 대기오염을 일으키는 질소산화물을 질소와 수증기로 바꿔준다. 촉매의 뼈대가 되는 나노 크기 이산화티타늄(TiO2) 분말 제조부터 촉매 설계·생산·재생과 유지보수까지 직접 수행하는 것이 특징이다.","tags":["SCR촉매","탈질","질소산화물","TiO2"],"conf":"확인","global":false,"url":"https://www.nanoin.com","ext":[],"grounded":true,"src":["https://v.daum.net/v/yWXXcXLx0m?f=m","https://www.nanoin.com/","https://www.businesspost.co.kr/BP?command=article_view&num=424699"]},{"id":"c075","name":"두산에너빌리티","sector":"대기·공기질","subsector":"탈황·탈질·촉매","type":"대기업","scale":4,"founded":1962,"hq":"경남","listed":"코스피","desc":"발전소용 보일러와 터빈을 만드는 발전설비 기업으로, 원자력·화력 발전설비와 해수담수화 플랜트를 함께 공급한다. 환경설비 부문에서는 발전소 굴뚝으로 나가는 황산화물을 걸러내는 배연탈황설비 등 대형 대기오염 방지설비를 만든다. 최근에는 가스·재생에너지·수소·소형모듈원자로(SMR)를 새 성장 사업으로 삼고 있다.","tags":["탈황설비","탈질설비","발전설비","EPC","해수담수화","플랜트"],"conf":"확인","global":false,"url":"https://www.doosanenerbility.com","ext":[{"n":"두산","rel":"계열"}],"grounded":true,"src":["https://ko.wikipedia.org/wiki/두산에너빌리티","https://www.doosanenerbility.com/en/business/fire_power","https://www.doosanenerbility.com/en"]},{"id":"c076","name":"세라컴","sector":"대기·공기질","subsector":"탈황·탈질·촉매","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"배기가스 속 오염물질을 분해하는 촉매와, 그 촉매를 입히는 벌집 모양 세라믹 담체를 함께 만드는 기업이다. 질소산화물을 줄이는 SCR 탈질촉매를 비롯해 악취를 없애는 탈취 촉매, 휘발성유기화합물(VOC) 제거 촉매, 자동차용 DOC·DPF 촉매를 생산한다. 코디어라이트 압출설비를 갖춰 발전소와 산업 현장, 디젤 엔진 등 배출원별로 소재와 촉매를 맞춰 개발한다.","tags":["SCR촉매","세라믹","탈질"],"conf":"확인","global":false,"url":"https://ceracomb.co.kr","ext":[],"grounded":true,"src":["http://ceracomb.co.kr/pr3/scr/","http://amenews.kr/skin/news/basic/view_pop.php?v_idx=42014"]},{"id":"c077","name":"코캣","sector":"대기·공기질","subsector":"탈황·탈질·촉매","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"배기가스 속 질소산화물을 줄이는 탈질(De-NOx) 설비와 여기에 쓰이는 촉매·흡착제를 공급하는 촉매 전문 기업이다. 암모니아나 탄화수소 같은 환원제와 촉매를 함께 써서 질소산화물을 무해한 질소로 바꾸는 방식이다. 반도체·디스플레이 공정에서 나오는 유해가스와 소각시설 배출가스를 처리하는 설비도 다룬다.","tags":["촉매재생","탈질촉매","대기환경"],"conf":"확인","global":false,"url":"http://www.kocat.co.kr","ext":[],"grounded":true,"src":["http://www.kocat.co.kr/common/eco/eco02.asp","http://kocat.co.kr/common/equipment/equipment01.asp","https://www.kidd.co.kr/news/169981"]},{"id":"c078","name":"파나시아","sector":"대기·공기질","subsector":"탈황·탈질·촉매","type":"중견기업","scale":3,"founded":null,"hq":"부산","listed":"비상장","desc":"부산에 본사를 둔 친환경 선박기자재 기업이다. 선박 배기가스에서 황산화물(SOx)을 씻어내는 선박용 스크러버와, 배의 균형을 잡기 위해 싣는 바닷물 속 외래 생물을 처리해 해양 생태계 교란을 막는 선박평형수처리장치(BWMS)가 주력이다. 선박용 탄소포집장치와 정박한 배에 육상 전기를 공급하는 설비 등으로 사업을 넓히고 있으며, 부산 강서구에 제2공장을 지었다.","tags":["선박스크러버","탈황","SOx","친환경선박"],"conf":"확인","global":false,"url":"https://www.worldpanasia.com","ext":[],"grounded":true,"src":["https://www.worldpanasia.com/media/press_release/board_view.php?num=351","https://www.busan.go.kr/nbtnewsBU/1393787","https://www.etnews.com/20250917000164"]},{"id":"c079","name":"대원하이테크","sector":"폐기물 처리","subsector":"건설폐기물","type":"중소기업","scale":2,"founded":null,"hq":"충남","listed":"비상장","desc":"대원그린에너지(현 리뉴원 체제)의 100% 자회사인 충남 천안 소재 건설폐기물 중간처분 기업이다.","tags":["건설폐기물","중간처분","천안"],"conf":"확인","global":false,"url":null,"ext":[]},{"id":"c080","name":"아이에스동서","sector":"폐기물 처리","subsector":"건설폐기물","type":"대기업","scale":4,"founded":null,"hq":null,"listed":"코스피","desc":"건설·요업을 해오던 상장사로, 폐기물 처리 기업을 잇달아 인수하며 환경사업을 키웠다. 건설폐기물 처리업체 인선이엔티, 소각시설과 매립시설을 함께 갖춘 코엔텍, 영흥산업환경·파주비앤알 등을 사들였다. 폐기물 수집·운반과 중간처리, 순환골재 생산, 소각 및 스팀 판매, 최종 처분까지 이어지는 수직계열화를 구축했다.","tags":["환경지주","M&A","수직계열화"],"conf":"확인","global":false,"url":"https://www.isdongseo.co.kr","ext":[],"grounded":true,"src":["https://m.businesspost.co.kr/BP?command=mobile_view&num=196812","https://www.ceoscoredaily.com/page/view/2021061614320489810","https://news.mt.co.kr/mtview.php?no=2020042820125861749"]},{"id":"c081","name":"인선이엔티","sector":"폐기물 처리","subsector":"건설폐기물","type":"중견기업","scale":3,"founded":null,"hq":"경기","listed":"코스닥","desc":"건물을 헐 때 나오는 폐콘크리트 등 건설폐기물을 파쇄·선별해 순환골재로 되살리고, 남는 잔재물은 소각하거나 매립하는 코스닥 상장사다. 아이에스동서가 최대주주이며 건설폐기물 중간처리(인선기업·파주비앤알), 소각(영흥산업환경), 폐차 해체·파쇄(인선모터스)를 자회사로 두고 있다. 최근에는 전기차 폐배터리를 포함한 자동차 재활용으로 사업을 넓히고 있다.","tags":["건설폐기물","순환골재","코스닥","자동차재활용","폐차"],"conf":"확인","global":false,"url":"https://www.insun.co.kr","ext":[],"grounded":true,"src":["https://www.pinpointnews.co.kr/news/articleView.html?idxno=403694","https://www.asiae.co.kr/article/2020122111195184899","https://www.smartfn.co.kr/article/view/sfn202311030028","https://www.ceoscoredaily.com/page/view/2021061614320489810"]},{"id":"c082","name":"파주비앤알","sector":"폐기물 처리","subsector":"건설폐기물","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"건설 현장에서 나오는 폐콘크리트 등 건설폐기물을 부수고 골라내 재활용 골재 등으로 되살리는 중간처리 기업이다. 경기 파주에 처리시설을 두고 있으며, 상장 폐기물 처리기업 인선이엔티가 지분 100%를 약 230억원에 사들여 계열사로 편입했다. 인선이엔티는 이 인수로 수도권 건설폐기물 처리 능력을 늘렸다.","tags":["건설폐기물","중간처리","파주"],"conf":"추정","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.ferrotimes.com/news/articleView.html?idxno=7982","http://www.ferrotimes.com/news/articleView.html?idxno=7634","https://www.edaily.co.kr/news/read?newsId=01466166625968344&mediaCodeNo=257"]},{"id":"c083","name":"Republic Services","sector":"폐기물 처리","subsector":"매립","type":"해외 대표","scale":4,"founded":null,"hq":"미국","listed":null,"desc":"미국 전역에서 가정·상업·산업 폐기물의 수집과 처리를 담당하는 기업이다. 수거 사업, 폐기물을 모아 옮기는 중간 적환장, 재활용 선별시설, 매립지를 함께 운영하며 지정폐기물·방사성폐기물 매립 서비스도 제공한다. 매립지에서 발생하는 가스를 모아 재생에너지로 바꾸는 사업도 함께 벌인다.","tags":["글로벌","매립","수집운반"],"conf":"확인","global":true,"url":"https://www.republicservices.com","ext":[],"grounded":true,"src":["https://www.republicservices.com/","https://www.republicservices.com/environmental-solutions/treatment-disposal/landfill-services","https://www.republicservices.com/businesses/recycling-and-solid-waste"]},{"id":"c084","name":"더랜드필","sector":"폐기물 처리","subsector":"매립","type":"중소기업","scale":2,"founded":null,"hq":"경기","listed":"비상장","desc":"경기 안산에서 매립장을 운영하며 사업장에서 나온 폐기물을 땅에 묻어 처리하는 기업이다. 폐기물 처리기업 EMK가 사업을 키우는 과정에서 인수한 계열사로, 화성 케이디환경 등과 함께 EMK 매립 부문을 이룬다. EMK는 2022년 싱가포르 케펠인프라스트럭처트러스트에 약 7700억원에 매각됐다.","tags":["매립","안산","EMK계열"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.ajunews.com/view/20220419141947398","https://www.fnnews.com/news/202208080943148717","https://www.sedaily.com/NewsVIew/22RG7DJOD0"]},{"id":"c085","name":"수도권매립지관리공사","sector":"폐기물 처리","subsector":"매립","type":"공공·연구","scale":3,"founded":2000,"hq":"인천","listed":null,"desc":"2000년 설립된 환경부 산하 공공기관으로 서울·인천·경기 3개 시도에서 나온 폐기물을 묻어 처리하는 수도권매립지를 운영한다. 쓰레기가 썩으면서 나오는 매립가스를 모아 50MW 규모 발전설비에서 태워 전기를 생산하고 이를 판매한다. 반입된 폐기물 가운데 상당량은 매립하지 않고 자원으로 회수해 재생에너지 생산에 쓰는 사업도 함께 수행한다.","tags":["매립","공공기관","매립가스","수도권"],"conf":"확인","global":false,"url":"https://www.slc.or.kr","ext":[],"grounded":true,"src":["https://www.slc.or.kr/slc/mb/sl/ecoLandfill.do?tabNo=3","https://www.hankyung.com/article/2019042519591","https://www.ngonews.kr/news/articleView.html?idxno=209165"]},{"id":"c086","name":"에코비트","sector":"폐기물 처리","subsector":"매립","type":"대기업","scale":4,"founded":2004,"hq":"경기","listed":"비상장","desc":"폐기물 매립과 소각, 의료폐기물 처리, 수처리시설 운영을 함께 하는 종합 환경기업이다. 사업은 매립(Green), 소각·스팀 생산(Energy), 수처리 운영(Water), 폐배터리 처리(Future) 부문으로 나뉜다. 태영그룹 지주사 TY홀딩스와 KKR이 보유 지분 전량을 2024년 IMM컨소시엄에 약 2조700억원에 매각했다.","tags":["매립","의료폐기물","소각","IMM","M&A"],"conf":"확인","global":false,"url":"https://www.ecorbit.com","ext":[],"grounded":true,"src":["https://www.investchosun.com/site/data/html_dir/2024/12/13/2024121380032.html","https://www.hankyung.com/article/2024082667941","https://www.topdaily.kr/articles/98830"]},{"id":"c087","name":"에코솔루션","sector":"폐기물 처리","subsector":"매립","type":"중소기업","scale":2,"founded":null,"hq":"충남","listed":"비상장","desc":"충남 서산 지곡오토밸리산업단지 안에서 사업장폐기물 매립장을 운영하는 기업이다. 매립지 위를 공기막으로 덮은 에어돔 방식 시설로 총 매립 용량은 약 130만㎥이며, 아직 용량의 대부분이 남아 있다. 2022년 8월 영업을 시작했고 2024년 다시 매각이 추진돼 사모펀드 운용사들이 인수를 검토했다.","tags":["매립","서산","M&A"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.thebell.co.kr/free/content/ArticleView.asp?key=202409250945389040108932","https://plus.hankyung.com/apps/newsinside.view?aid=202405135763r","https://www.news1.kr/local/daejeon-chungnam/5718512"]},{"id":"c088","name":"제이엔텍","sector":"폐기물 처리","subsector":"매립","type":"중소기업","scale":2,"founded":null,"hq":"충남","listed":"비상장","desc":"충남 당진에서 지정폐기물 최종 매립장을 운영하는 회사로 2021년 설립됐다. 지정폐기물은 폐산·폐유처럼 유해성이 있어 별도 관리가 필요한 산업폐기물을 뜻하는데, 이 회사는 매립 면적 약 17만㎡, 매립 용량 약 634만㎥로 국내 최대 규모급 매립장을 갖췄다. 2024년 9월 사모펀드 어펄마캐피탈과 더함파트너스 컨소시엄이 1차로 지분 51%를 인수했다.","tags":["매립","당진","어펄마캐피탈","M&A"],"conf":"확인","global":false,"url":"https://www.jentec.kr","ext":[],"grounded":true,"src":["https://www.hankyung.com/article/2024051761341","https://news.nate.com/view/20240930n29876","https://news.nate.com/view/20240930n24147?mid=n1101","https://dealsite.co.kr/articles/125379"]},{"id":"c089","name":"케이에코","sector":"폐기물 처리","subsector":"매립","type":"중소기업","scale":2,"founded":null,"hq":"충북","listed":"비상장","desc":"충북 음성 금왕테크노밸리 산업단지에 조성된 폐기물 매립장을 운영하는 기업이다. 총 매립 용량은 약 150만㎥로, 일반 사업장폐기물과 유해성이 있어 따로 관리해야 하는 지정폐기물을 각각 약 75만㎥씩 받을 수 있다. 사모펀드 운용사 VL인베스트먼트가 인수해 보유해 왔고, 이후 국내 최대 폐기물 처리기업 에코비트가 인수를 추진했다.","tags":["매립","음성","신생"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://plus.hankyung.com/apps/newsinside.view?aid=202405135763r","https://plus.hankyung.com/apps/newsinside.view?aid=202405238848r","https://v.daum.net/v/20251218094906636"]},{"id":"c090","name":"다나에너지솔루션","sector":"폐기물 처리","subsector":"산업·지정폐기물","type":"중소기업","scale":2,"founded":null,"hq":null,"listed":"비상장","desc":"폐수·폐유처럼 액체 상태로 나오는 폐기물을 처리하는 기업으로 충북 청원(현 청주) 지역에 사업장을 두고 있다. 2011년 폐기물 처리 그룹 EMK에 인수돼 계열사로 편입됐다. EMK는 액상폐기물 처리와 매립을 축으로 여러 폐기물 처리 업체를 사들여 전국 단위 처리망을 갖춘 곳이다.","tags":["액상폐기물","폐수","EMK계열"],"conf":"추정","global":false,"url":"http://www.danaenergy.co.kr","ext":[],"grounded":true,"src":["https://www.thebell.co.kr/free/content/ArticleView.asp?key=202002191643544040107970&lcode=00","https://www.thebell.co.kr/free/content/ArticleView.asp?key=202002191729539600107544&lcode=00","https://www.sedaily.com/NewsVIew/1Z2WFCCOM5"]},{"id":"c091","name":"동아유화","sector":"폐기물 처리","subsector":"산업·지정폐기물","type":"중소기업","scale":2,"founded":null,"hq":"부산","listed":"비상장","desc":"부산 소재 폐유·폐유기용제 등 액상 지정폐기물 처리 업체다.","tags":["폐유","지정폐기물","부산"],"conf":"확인","global":false,"url":null,"ext":[]},{"id":"c092","name":"매일환경","sector":"폐기물 처리","subsector":"산업·지정폐기물","type":"중소기업","scale":2,"founded":null,"hq":"부산","listed":"비상장","desc":"부산 소재 폐유·PCB함유폐기물 등 지정폐기물 처리 업체다.","tags":["폐유","지정폐기물","부산"],"conf":"확인","global":false,"url":null,"ext":[]},{"id":"c093","name":"에코매니지먼트코리아","sector":"폐기물 처리","subsector":"산업·지정폐기물","type":"중견기업","scale":3,"founded":2010,"hq":null,"listed":"비상장","desc":"공장에서 나오는 액체 상태의 폐기물(액상폐기물)을 처리하고 폐기물을 소각·매립하는 환경기업으로 EMK로 불린다. 한국환경개발·비노텍·EMK울산·다나에너지솔루션 등 여러 처리 회사를 거느린 지주 구조다. 2022년 사모펀드 IMM인베스트먼트가 싱가포르 인프라 펀드 케펠인프라스트럭처트러스트에 약 7700억원을 받고 매각했다.","tags":["액상폐기물","소각","케펠","M&A"],"conf":"확인","global":false,"url":"https://eco-management.co.kr","ext":[],"grounded":true,"src":["https://www.fnnews.com/news/202208080943148717","https://www.sedaily.com/NewsView/268I7L8552","https://www.sedaily.com/NewsVIew/1Z2WFCCOM5","https://www.sedaily.com/NewsView/26EQEFG6L8"]},{"id":"c094","name":"와이엔텍","sector":"폐기물 처리","subsector":"산업·지정폐기물","type":"중견기업","scale":3,"founded":null,"hq":"전남","listed":"코스닥","desc":"전남 여수 석유화학 산업단지를 배후로 일반폐기물과 지정폐기물(유해성이 있어 따로 관리하는 폐기물)을 함께 받아 소각하고 매립까지 처리하는 코스닥 상장사다. 2005년 12월 코스닥에 상장했다. 석유화학제품을 동남아·중국으로 실어 나르는 해상운송이 두 번째 축이고, 골프장과 레미콘 사업도 함께 운영한다.","tags":["지정폐기물","소각","매립","여수"],"conf":"확인","global":false,"url":"https://www.y-entec.co.kr","ext":[],"grounded":true,"src":["https://www.thebell.co.kr/free/content/ArticleView.asp?key=202001221704357200107123&lcode=00","https://www.thescoop.co.kr/news/articleView.html?idxno=34609","https://www.hankyung.com/article/202208164298i","https://ssl.pstatic.net/imgstock/upload/research/company/1702335780565.pdf"]},{"id":"c095","name":"코엔텍","sector":"폐기물 처리","subsector":"산업·지정폐기물","type":"중견기업","scale":3,"founded":null,"hq":"울산","listed":"코스닥","desc":"울산 남구에 자리한 산업폐기물 처리 기업으로 소각장 두 곳과 매립장을 운영한다. 폐기물을 태울 때 나오는 열을 스팀으로 만들어 인근 공장에 파는 사업이 매출의 큰 축을 차지하는 것이 특징이다. 2020년 아이에스동서·E&F PE 컨소시엄이 인수했고, 이후 공개매수와 주식교환으로 지분 100%를 확보하면서 상장폐지됐다.","tags":["산업폐기물","소각","매립","울산"],"conf":"확인","global":false,"url":"https://www.koentec.co.kr","ext":[],"grounded":true,"src":["https://www.fnnews.com/news/202006041444382672","https://news.mt.co.kr/mtview.php?no=2020060418461722497","https://www.sedaily.com/NewsView/2H0LCBW710","https://marketin.edaily.co.kr/News/Read?newsId=04132806642367360"]},{"id":"c096","name":"SK에코플랜트","sector":"폐기물 처리","subsector":"소각·에너지화","type":"대기업","scale":4,"founded":1962,"hq":"서울","listed":"비상장","desc":"옛 SK건설로, 수처리 기업 리뉴어스와 폐기물 처리 기업 리뉴원 등을 인수해 환경사업을 키우면서 지금의 이름으로 바꿨다. 2025년 8월 리뉴어스·리뉴원·리뉴에너지충북 지분 100%를 글로벌 투자회사 KKR에 넘기는 주식매매계약을 맺었고, 세 회사의 기업가치는 1조7800억원으로 매겨졌다. 이후에는 반도체·인공지능 등 첨단산업 중심으로 사업을 재편한다는 계획이다.","tags":["소각","환경플랫폼","M&A","KKR","환경사업","수처리운영"],"conf":"확인","global":false,"url":"https://www.skecoplant.com","ext":[],"grounded":true,"src":["https://www.investchosun.com/site/data/html_dir/2025/08/20/2025082080037.html","https://www.asiae.co.kr/article/2025082010133408228","https://news.bizwatch.co.kr/article/real_estate/2025/08/20/0012"]},{"id":"c097","name":"리뉴에너지충북","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중소기업","scale":2,"founded":null,"hq":"충북","listed":"비상장","desc":"충북 청주시 청원구 북이면에서 폐기물 소각시설을 운영하는 기업이다. 하루 최대 352.8t을 태워 처리할 수 있는 충북 최대 규모 소각장이다. SK에코플랜트의 환경 자회사였으나, 2025년 8월 리뉴어스·리뉴원과 함께 총 1조7800억원 규모로 글로벌 투자회사 KKR에 지분 100%를 매각하는 계약이 체결됐다.","tags":["소각","스팀","충북"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.dominilbo.com/news/articleView.html?idxno=237629","https://www.etoday.co.kr/news/view/2498472","https://news.bizwatch.co.kr/article/real_estate/2025/08/20/0012"]},{"id":"c098","name":"리뉴원","sector":"폐기물 처리","subsector":"소각·에너지화","type":"중견기업","scale":3,"founded":null,"hq":null,"listed":"비상장","desc":"SK에코플랜트가 사들인 소각 전문 회사들을 하나로 합쳐 만든 기업으로, 사업장에서 나오는 산업폐기물과 병원에서 나오는 의료폐기물을 태워 처리한다. 소각 과정에서 생긴 열은 스팀으로 만들어 인근 사업장에 공급한다. SK에코플랜트가 지분 100%를 보유했으며, 수처리 계열사 리뉴어스와 함께 매각 절차가 진행돼 KKR에 넘기는 거래가 추진됐다.","tags":["소각","의료폐기물","스팀","통합법인"],"conf":"확인","global":false,"url":null,"ext":[],"grounded":true,"src":["https://www.startuptoday.co.kr/news/articleView.html?idxno=430123","https://mbiz.heraldcorp.com/article/10556461","https://www.getnews.co.kr/news/articleView.html?idxno=542983","https://www.newsis.com/view/NISX20250710_0003246492"]},{"id":"c099","name":"베올리아","sector":"폐기물 처리","subsector":"소각·에너지화","type":"해외 대표","scale":4,"founded":null,"hq":"프랑스","listed":null,"desc":"물·폐기물·에너지 관리를 함께 다루는 프랑스계 종합 환경기업이다. 한국에서는 1999년 법인을 세워 산업체 공업용수·폐수 처리시설과 지자체 하수처리시설을 위탁 운영해 왔다. 2017년에는 온산·용잠에서 고상·액상 폐기물 처리시설을 운영하던 유니큰을 인수해 소각·매립·고형연료 생산 사업까지 맡고 있다.","tags":["글로벌","종합환경","소각","한국진출","물운영","산업용수"],"conf":"확인","global":true,"url":"https://www.veolia.com","ext":[],"g
